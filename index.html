etInterval(()=>{if(idx>=F.length-1){stop();return}go(idx+1)},1700-$('spd').value)}\nfunction load(){\n  stop();\n  const m=A[cur].max,r=$('inp').value.split(/[\\s,;]+/).filter(Boolean).map(Number);\n  if(r.length<2||r.length>12||r.some(x=>!Number.isInteger(x)||x<0||x>m)){$('msg').textContent=`Digite de 2 a 12 números inteiros entre 0 e ${m}, separados por vírgula.`;return}\n  A[cur].val=r.join(', ');F=A[cur].fn(r);go(0);\n}\nfunction pick(k){\n  cur=k;stop();\n  $('desc').textContent=A[k].d;$('inp').value=A[k].val;load();\n}\n$('apply').onclick=load;\n$('inp').onkeydown=e=>{if(e.key==='Enter')load()};\n$('rnd').onclick=()=>{const m=A[cur].max;$('inp').value=Array.from({length:8},()=>Math.floor(Math.random()*(m+1))).join(', ');load()};\n$('prev').onclick=()=>{stop();go(idx-1)};\n$('next').onclick=()=>{stop();go(idx+1)};\n$('play').onclick=()=>{if(timer){stop();return}if(idx>=F.length-1)go(0);start()};\n$('spd').oninput=()=>{if(timer)start()};\npick('counting');\n<\/script>\n<\/body>\n<\/html>\n"},{"tipo":"file","nome":"Guia completo: Counting Sort","arq":"guia_completo_counting_sort.md","path":"Ordenacoes/Counting/guia_completo_counting_sort.md","ext":"md","kind":"guia","tamanho":7625,"conteudo":"# Guia Completo: Algoritmo Counting Sort (Ordenação por Contagem)\n\nO **Counting Sort** (ou Ordenação por Contagem) é um algoritmo de ordenação **que não compara elementos entre si**. Em vez disso, ele *conta* quantas vezes cada valor aparece e usa essas contagens para calcular diretamente a posição final de cada elemento.\n\nPor fugir da comparação, ele consegue quebrar o limite teórico de $\\mathcal{O}(n \\log n)$ dos algoritmos baseados em comparação (como Quick Sort e Merge Sort), mas com uma condição: os valores precisam ser **inteiros dentro de um intervalo pequeno e conhecido**.\n\n---\n\n## 🗳️ Como Funciona? (A Analogia da Urna de Votação)\n\nImagine uma eleição com candidatos numerados de 0 a 8. Em vez de comparar votos entre si, você faz o seguinte:\n1. Cria uma folha de apuração com uma linha para cada candidato e vai marcando um traço a cada voto lido (**contagem**).\n2. Soma os totais de cima para baixo: assim, cada linha passa a dizer \"até aqui já foram contados X votos\" (**soma acumulada**). Esse número indica **onde termina o bloco** daquele candidato na lista final.\n3. Percorre os votos e coloca cada um exatamente na posição indicada pela folha, diminuindo o contador a cada uso (**posicionamento**).\n\nEm termos de algoritmo, são três fases:\n\n1. **Contar:** percorre o array e incrementa `count[valor]` para cada elemento.\n2. **Acumular:** transforma `count` em uma soma de prefixos, de modo que `count[v]` indique quantos elementos são menores ou iguais a `v`.\n3. **Posicionar:** percorre o array original **de trás para frente**, e para cada elemento `v` faz `output[--count[v]] = v`.\n\n### Exemplo passo a passo\n\nArray inicial: `[4, 2, 2, 8, 3, 3, 1]`\n\n**Fase 1: contagem** (índice = valor)\n\n| Valor | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n|---|---|---|---|---|---|---|---|---|---|\n| `count` | 0 | 1 | 2 | 2 | 1 | 0 | 0 | 0 | 1 |\n\n**Fase 2: soma acumulada**\n\n| Valor | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n|---|---|---|---|---|---|---|---|---|---|\n| `count` | 0 | 1 | 3 | 5 | 6 | 6 | 6 | 6 | 7 |\n\n**Fase 3: posicionamento** (de trás para frente)\n\n| Lê | `count[v]` depois de diminuir | Grava em `output[...]` |\n|---|---|---|\n| 1 | 0 | `output[0] = 1` |\n| 3 | 4 | `output[4] = 3` |\n| 3 | 3 | `output[3] = 3` |\n| 8 | 6 | `output[6] = 8` |\n| 2 | 2 | `output[2] = 2` |\n| 2 | 1 | `output[1] = 2` |\n| 4 | 5 | `output[5] = 4` |\n\nResultado final: `[1, 2, 2, 3, 3, 4, 8]`\n\n---\n\n## ⚙️ Características Mais Importantes\n\n### 1. Complexidade de Tempo (Velocidade)\nSeja $n$ o número de elementos e $k$ o maior valor do array (o tamanho do intervalo).\n*   **Melhor Caso:** $\\mathcal{O}(n + k)$\n*   **Pior Caso:** $\\mathcal{O}(n + k)$\n*   **Caso Médio:** $\\mathcal{O}(n + k)$\n    *   O custo não depende da ordem dos dados: o algoritmo sempre faz uma passada para contar, uma passada de tamanho $k$ para acumular e uma passada para posicionar.\n\n> **Detalhe importante:** quando $k$ é da ordem de $n$, o Counting Sort é **linear**. Mas se $k$ for muito maior que $n$ (por exemplo, ordenar 10 números entre 0 e 1.000.000), o custo $\\mathcal{O}(k)$ domina e o algoritmo vira um péssimo negócio.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(n + k)$\n    *   **Não é in-place.** Precisa do array de contagem (tamanho $k+1$) e do array de saída (tamanho $n$).\n\n### 3. Estabilidade\n*   **É Estável?** Sim (se o posicionamento for feito de trás para frente).\n    *   Percorrer a entrada do fim para o começo garante que, entre valores iguais, o que apareceu por último na entrada fique na última posição do bloco. Isso preserva a ordem original dos iguais.\n    *   Essa propriedade é **essencial** para o Radix Sort, que usa o Counting Sort como sub-rotina.\n\n### 4. Baseado em Comparação?\n*   **Não.** Ele usa os valores como **índices** do array de contagem. Por isso não está sujeito ao limite inferior de $\\Omega(n \\log n)$.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não.\n    *   Dados já ordenados não deixam o algoritmo mais rápido.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   Para acumular as contagens, é preciso conhecer todos os dados (ou pelo menos o intervalo) de antemão.\n\n---\n\n## 🧭 Limitações e Adaptações\n\n*   **Só funciona com inteiros** (ou com dados que possam ser mapeados para inteiros, como caracteres ou chaves numéricas).\n*   **Números negativos:** subtraia o menor valor (`min`) de todos antes de contar e use `count[v - min]`. O tamanho do array de contagem passa a ser `max - min + 1`.\n*   **Ordenar objetos por chave:** a versão estável permite ordenar registros (por exemplo, alunos por nota) sem perder a ordem original dos empates.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Velocidade linear:** $\\mathcal{O}(n + k)$ é imbatível quando $k$ é pequeno.\n*   **Estável:** preserva a ordem de elementos iguais.\n*   **Desempenho previsível:** o tempo não varia com a disposição dos dados.\n*   **Excelente como sub-rotina:** é a base do Radix Sort.\n\n**Desvantagens:**\n*   **Depende do intervalo:** se $k$ é enorme, desperdiça tempo e memória.\n*   **Usa memória extra:** $\\mathcal{O}(n + k)$, não é in-place.\n*   **Limitado a inteiros:** não ordena números reais, strings longas ou tipos arbitrários diretamente.\n*   **Não é adaptável nem online.**\n\n---\n\n## 💻 Exemplo Clássico em C\n\n```c\n#include <stdlib.h>\n\nvoid countingSort(int arr[], int n) {\n    int i, max = arr[0];\n\n    // Descobre o maior valor para definir o tamanho do array de contagem\n    for (i = 1; i < n; i++)\n        if (arr[i] > max) max = arr[i];\n\n    int *count  = calloc(max + 1, sizeof(int)); // zerado\n    int *output = malloc(n * sizeof(int));\n\n    // Fase 1: conta quantas vezes cada valor aparece\n    for (i = 0; i < n; i++)\n        count[arr[i]]++;\n\n    // Fase 2: soma acumulada (count[v] = quantos elementos são <= v)\n    for (i = 1; i <= max; i++)\n        count[i] += count[i - 1];\n\n    // Fase 3: posiciona de trás para frente (garante a estabilidade)\n    for (i = n - 1; i >= 0; i--) {\n        output[--count[arr[i]]] = arr[i];\n    }\n\n    // Copia o resultado de volta\n    for (i = 0; i < n; i++)\n        arr[i] = output[i];\n\n    free(count);\n    free(output);\n}\n```\n\n**Pontos de atenção no código:**\n*   `calloc` já inicializa o array de contagem com zeros.\n*   O loop da Fase 3 vai de `n - 1` até `0`. Se fosse de `0` até `n - 1`, o algoritmo continuaria ordenando, mas **perderia a estabilidade**.\n*   Este código assume valores **não negativos**.\n\n---\n\n## 🎯 Quando devo usar o Counting Sort?\n\n*   **Inteiros em intervalo pequeno:** notas de 0 a 100, idades, dias do mês, valores de pixels (0 a 255), letras do alfabeto.\n*   **Quando $k = \\mathcal{O}(n)$:** o algoritmo é linear e costuma vencer qualquer ordenação por comparação.\n*   **Como sub-rotina do Radix Sort:** ordenar por um dígito de cada vez, com estabilidade.\n*   **Contagem de frequências:** a própria fase 1 já resolve problemas como histogramas.\n\nEvite quando o intervalo de valores for muito maior que a quantidade de elementos, ou quando os dados não forem inteiros.\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** conte as ocorrências, acumule as contagens e use-as como posições finais.\n*   **Tempo:** $\\mathcal{O}(n + k)$ em todos os casos.\n*   **Espaço:** $\\mathcal{O}(n + k)$, **não** é in-place.\n*   **Estável:** sim (posicionando de trás para frente). **Adaptável:** não. **Online:** não.\n*   **Não compara elementos:** usa valores como índices.\n*   **Destaque:** ordenação linear para inteiros em um intervalo pequeno.\n"}]},{"tipo":"dir","nome":"Radix Sort","arq":"Radix","path":"Ordenacoes/Radix","children":[{"tipo":"file","nome":"Demonstração: Radix Sort","arq":"Demo_ Radix Sort.html","path":"Ordenacoes/Radix/Demo_ Radix Sort.html","ext":"html","kind":"demo","tamanho":7713,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Demo: Radix Sort<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#eef3f5;--panel:#fff;--ink:#14232e;--mute:#5d707c;--line:#cfdbe1;--acc:#0f7c8a;--hot:#e0a100;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}}\n:root[data-theme=\"dark\"]{--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:1.6rem;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:.85rem;font-weight:600;color:var(--mute);margin:18px 0 8px}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\nbutton,input{font:inherit;color:inherit}\nbutton{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}\nbutton:hover{border-color:var(--acc)}\n.tabs button[aria-selected=\"true\"]{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .tabs button[aria-selected=\"true\"]{color:#06222a}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n#desc{margin:0 0 14px;max-width:70ch}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}\n.ctl label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);flex:1;min-width:220px}\ninput[type=text]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}\n.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 16px 18px;margin-top:10px}\n.row,.cols{display:flex;flex-wrap:wrap;gap:6px}\n.cols{gap:8px;align-items:flex-start}\n.w{display:flex;flex-direction:column;align-items:center;gap:2px}\n.i{font-size:.7rem;color:var(--mute)}\n.c{min-width:44px;height:44px;padding:0 8px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-weight:800;font-variant-numeric:tabular-nums;transition:background .25s,border-color .25s}\n.c.hot{background:var(--hot);border-color:var(--hot);color:#14232e}\n.c.on{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .c.on{color:#06222a}\n.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}\n.dg{border-bottom:3px solid var(--acc)}\n.z{opacity:.35}\n.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}\n.ch{font-size:.8rem;font-weight:600;color:var(--mute)}\n.stack{min-height:52px;width:100%;box-sizing:border-box;border:1.5px dashed var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}\n#msg{min-height:3em;margin:14px 0 4px;font-weight:600}\n#pos{font-size:.85rem;color:var(--mute)}\n.spd{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);margin-top:6px}\n@media (prefers-reduced-motion:reduce){.c{transition:none}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Radix Sort: demonstração interativa<\/h1>\n<p id=\"desc\"><\/p>\n<div class=\"ctl\">\n  <label>Números (separados por vírgula)<input type=\"text\" id=\"inp\"><\/label>\n  <button id=\"apply\">Aplicar<\/button>\n  <button id=\"rnd\">Sortear<\/button>\n<\/div>\n<div class=\"ctl\">\n  <button id=\"prev\">Voltar<\/button>\n  <button id=\"next\">Próximo passo<\/button>\n  <button id=\"play\">Reproduzir<\/button>\n  <span id=\"pos\"><\/span>\n<\/div>\n<div class=\"spd\"><label for=\"spd\">Velocidade<\/label><input type=\"range\" id=\"spd\" min=\"200\" max=\"1500\" step=\"50\" value=\"1000\"><\/div>\n<div class=\"stage\" id=\"stage\"><\/div>\n<div id=\"msg\" aria-live=\"polite\"><\/div>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nconst cell=(t,i,k,h)=>({t:t===null?'':t,i:i===undefined?'':i,k:k||'',h});\nconst row=(label,cells)=>({type:'row',label,cells});\n\nfunction radix(a){\n  const F=[],W=String(Math.max(...a)).length,nm=['unidades','dezenas','centenas'];\n  let cur=a.slice();\n  const dg=(v,p)=>Math.floor(v/10**p)%10;\n  const rc=(v,i,p,k)=>{const s=String(v);const h=s.padStart(W,'0').split('').map((ch,j)=>`<span class=\"${j===W-1-p?'dg':j<W-s.length?'z':''}\">${ch}<\/span>`).join('');return cell(v,i,k,h)};\n  for(let p=0;p<W;p++){\n    const B=Array.from({length:10},()=>[]);\n    const S=(msg,ai=-1)=>F.push({msg,blocks:[\n      row('Lista',cur.map((v,i)=>rc(v,i,p,i==ai?'hot':''))),\n      {type:'cols',label:'Baldes por dígito',cols:B.map((b,d)=>({h:d,cells:b.map(v=>rc(v,'',p,''))}))}]});\n    S(`Passada ${p+1} de ${W}: olhamos o dígito das ${nm[p]} (sublinhado).`);\n    cur.forEach((v,i)=>{const d=dg(v,p);B[d].push(v);S(`${v} tem ${d} nas ${nm[p]}: vai para o balde ${d}.`,i)});\n    cur=[].concat(...B);\n    S(`Juntamos os baldes de 0 a 9, na ordem. A lista agora está ordenada pelas ${nm[p]}.`);\n  }\n  F.push({msg:'Pronto! Depois de uma passada por dígito, a lista está ordenada.',blocks:[row('Lista ordenada',cur.map((v,i)=>rc(v,i,-1,'ok')))]});\n  return F;\n}\n\nconst A={\n  radix:{name:'Radix Sort',fn:radix,max:999,val:'170, 45, 75, 90, 802, 24, 2, 66',d:'Ordena dígito por dígito, das unidades para as centenas, sempre de forma estável. Tempo O(d · (n + b)), onde d é o número de dígitos.'}\n};\nlet cur='radix',F=[],idx=0,timer=null;\n\nconst cellH=c=>`<div class=\"w\"><div class=\"c ${c.k}\">${c.h!==undefined?c.h:c.t}<\/div>${c.i!==''?`<span class=\"i\">${c.i}<\/span>`:''}<\/div>`;\nfunction draw(f){\n  $('stage').innerHTML=f.blocks.map(b=>b.type==='row'\n    ?`<h3>${b.label}<\/h3><div class=\"row\">${b.cells.map(cellH).join('')}<\/div>`\n    :`<h3>${b.label}<\/h3><div class=\"cols\">${b.cols.map(c=>`<div class=\"col\"><span class=\"ch\">${c.h}<\/span><div class=\"stack\">${c.cells.map(cellH).join('')}<\/div><\/div>`).join('')}<\/div>`).join('');\n  $('msg').textContent=f.msg;\n  $('pos').textContent=`Passo ${idx+1} de ${F.length}`;\n  $('prev').disabled=idx===0;$('next').disabled=idx===F.length-1;\n}\nfunction go(n){idx=Math.max(0,Math.min(F.length-1,n));draw(F[idx])}\nfunction stop(){clearInterval(timer);timer=null;$('play').textContent='Reproduzir'}\nfunction start(){clearInterval(timer);$('play').textContent='Pausar';timer=setInterval(()=>{if(idx>=F.length-1){stop();return}go(idx+1)},1700-$('spd').value)}\nfunction load(){\n  stop();\n  const m=A[cur].max,r=$('inp').value.split(/[\\s,;]+/).filter(Boolean).map(Number);\n  if(r.length<2||r.length>12||r.some(x=>!Number.isInteger(x)||x<0||x>m)){$('msg').textContent=`Digite de 2 a 12 números inteiros entre 0 e ${m}, separados por vírgula.`;return}\n  A[cur].val=r.join(', ');F=A[cur].fn(r);go(0);\n}\nfunction pick(k){\n  cur=k;stop();\n  $('desc').textContent=A[k].d;$('inp').value=A[k].val;load();\n}\n$('apply').onclick=load;\n$('inp').onkeydown=e=>{if(e.key==='Enter')load()};\n$('rnd').onclick=()=>{const m=A[cur].max;$('inp').value=Array.from({length:8},()=>Math.floor(Math.random()*(m+1))).join(', ');load()};\n$('prev').onclick=()=>{stop();go(idx-1)};\n$('next').onclick=()=>{stop();go(idx+1)};\n$('play').onclick=()=>{if(timer){stop();return}if(idx>=F.length-1)go(0);start()};\n$('spd').oninput=()=>{if(timer)start()};\npick('radix');\n<\/script>\n<\/body>\n<\/html>\n"},{"tipo":"file","nome":"Guia completo: Radix Sort","arq":"guia_completo_radix_sort.md","path":"Ordenacoes/Radix/guia_completo_radix_sort.md","ext":"md","kind":"guia","tamanho":8104,"conteudo":"# Guia Completo: Algoritmo Radix Sort (Ordenação por Raiz)\n\nO **Radix Sort** (ou Ordenação por Raiz) é um algoritmo de ordenação **que não compara elementos entre si**. Ele ordena os números **dígito por dígito**, começando pelo dígito menos significativo (as unidades) e indo até o mais significativo, usando a cada passada um algoritmo **estável** (normalmente o Counting Sort).\n\nÉ a versão digital de uma ideia antiga: as máquinas de cartões perfurados e as antigas classificadoras de correspondência já ordenavam documentos exatamente assim, uma coluna de cada vez.\n\n---\n\n## 🔢 Como Funciona? (A Analogia da Triagem de Cartas)\n\nImagine um funcionário dos Correios com uma pilha de cartas numeradas e dez caixas rotuladas de 0 a 9:\n1. **Primeira rodada:** ele olha só o **último dígito** de cada carta (unidades) e joga a carta na caixa correspondente. Depois recolhe as caixas na ordem de 0 a 9, sem embaralhar o conteúdo de cada uma.\n2. **Segunda rodada:** repete o processo, agora olhando o **penúltimo dígito** (dezenas).\n3. **Terceira rodada:** repete com as **centenas**, e assim por diante, até o dígito mais significativo.\n\nParece que cada rodada \"bagunça\" o trabalho da anterior, mas não bagunça: como cada rodada é **estável**, empates no dígito atual mantêm a ordem que já foi conquistada nos dígitos menos significativos. Ao final, a lista está totalmente ordenada.\n\n### Exemplo passo a passo\n\nArray inicial: `[170, 45, 75, 90, 802, 24, 2, 66]`\n\n**Passada 1: dígito das unidades**\n\n| Balde | 0 | 2 | 4 | 5 | 6 |\n|---|---|---|---|---|---|\n| Conteúdo | 170, 90 | 802, 2 | 24 | 45, 75 | 66 |\n\nResultado: `[170, 90, 802, 2, 24, 45, 75, 66]`\n\n**Passada 2: dígito das dezenas**\n\n| Balde | 0 | 2 | 4 | 6 | 7 | 9 |\n|---|---|---|---|---|---|---|\n| Conteúdo | 802, 2 | 24 | 45 | 66 | 170, 75 | 90 |\n\nResultado: `[802, 2, 24, 45, 66, 170, 75, 90]`\n\n**Passada 3: dígito das centenas**\n\n| Balde | 0 | 1 | 8 |\n|---|---|---|---|\n| Conteúdo | 2, 24, 45, 66, 75, 90 | 170 | 802 |\n\nResultado final: `[2, 24, 45, 66, 75, 90, 170, 802]`\n\n> Repare como a estabilidade trabalha: na passada 3, os números `2, 24, 45, 66, 75, 90` caem todos no balde 0 e **saem na mesma ordem em que entraram**, que já era a ordem correta graças às passadas anteriores. Sem estabilidade, essa ordem se perderia.\n\n---\n\n## ⚙️ Características Mais Importantes\n\n### 1. Complexidade de Tempo (Velocidade)\nSeja $n$ o número de elementos, $d$ o número de dígitos do maior valor e $b$ a base numérica (10 no exemplo).\n*   **Melhor Caso:** $\\mathcal{O}(d \\cdot (n + b))$\n*   **Pior Caso:** $\\mathcal{O}(d \\cdot (n + b))$\n*   **Caso Médio:** $\\mathcal{O}(d \\cdot (n + b))$\n    *   São $d$ passadas, e cada uma custa $\\mathcal{O}(n + b)$ (é um Counting Sort sobre um dígito). Se $d$ e $b$ são constantes, o algoritmo é **linear**: $\\mathcal{O}(n)$.\n\n> **Detalhe importante:** o tempo depende da **quantidade de dígitos**, não do valor numérico em si. Ordenar um milhão de números de até 6 dígitos exige apenas 6 passadas.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(n + b)$\n    *   A versão clássica **não é in-place**: precisa de um array de saída e de $b$ contadores/baldes.\n\n### 3. Estabilidade\n*   **É Estável?** Sim, desde que a sub-rotina de cada passada seja estável.\n    *   Esta é a condição de correção do algoritmo. Se a ordenação por dígito não fosse estável, as passadas anteriores seriam desfeitas.\n\n### 4. Baseado em Comparação?\n*   **Não.** Ele usa o valor de cada dígito como índice de um balde. Por isso não está sujeito ao limite $\\Omega(n \\log n)$.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não.\n    *   Dados já ordenados não reduzem o número de passadas.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   Todos os elementos precisam estar presentes para cada passada.\n\n---\n\n## 🔀 Variações: LSD e MSD\n\n| Variação | Direção | Características |\n|---|---|---|\n| **LSD** (*Least Significant Digit*) | Do dígito menos significativo para o mais significativo | A mais comum e simples. Funciona bem para inteiros e chaves de tamanho fixo. |\n| **MSD** (*Most Significant Digit*) | Do dígito mais significativo para o menos significativo | Divide em grupos e ordena cada grupo recursivamente. Pode parar cedo e funciona bem com strings de tamanhos diferentes. |\n\nEste guia usa a versão **LSD**.\n\n**Escolha da base:** usar base 10 é didático, mas na prática costuma-se usar bases potência de 2 (como 256), que permitem extrair dígitos com operações de bits e reduzem o número de passadas.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Velocidade linear:** $\\mathcal{O}(d \\cdot (n + b))$ é muito rápido para inteiros com poucos dígitos.\n*   **Estável:** preserva a ordem de elementos iguais.\n*   **Desempenho previsível:** não tem pior caso quadrático.\n*   **Ótimo para chaves de tamanho fixo:** CEPs, CPFs, datas, IPs, números de telefone.\n\n**Desvantagens:**\n*   **Usa memória extra:** $\\mathcal{O}(n + b)$, não é in-place.\n*   **Limitado a dados \"digitáveis\":** inteiros, strings, ou tipos que possam ser decompostos em dígitos/caracteres.\n*   **Pode perder para algoritmos por comparação** quando $d$ é grande (chaves muito longas) em relação a $\\log n$.\n*   **Não é adaptável nem online.**\n\n---\n\n## 💻 Exemplo Clássico em C\n\n```c\n#include <stdlib.h>\n\n// Counting Sort estável aplicado a UM dígito (definido por exp = 1, 10, 100...)\nstatic void countingSortByDigit(int arr[], int n, int exp) {\n    int *output = malloc(n * sizeof(int));\n    int count[10] = {0};\n    int i;\n\n    // Conta as ocorrências de cada dígito (0 a 9)\n    for (i = 0; i < n; i++)\n        count[(arr[i] / exp) % 10]++;\n\n    // Soma acumulada: posição final de cada bloco de dígito\n    for (i = 1; i < 10; i++)\n        count[i] += count[i - 1];\n\n    // De trás para frente, para manter a estabilidade\n    for (i = n - 1; i >= 0; i--) {\n        int d = (arr[i] / exp) % 10;\n        output[--count[d]] = arr[i];\n    }\n\n    for (i = 0; i < n; i++)\n        arr[i] = output[i];\n\n    free(output);\n}\n\nvoid radixSort(int arr[], int n) {\n    int i, max = arr[0];\n    for (i = 1; i < n; i++)\n        if (arr[i] > max) max = arr[i];\n\n    // Uma passada para cada dígito do maior valor\n    for (int exp = 1; max / exp > 0; exp *= 10)\n        countingSortByDigit(arr, n, exp);\n}\n```\n\n**Pontos de atenção no código:**\n*   `exp` vale 1, 10, 100... e `(arr[i] / exp) % 10` extrai o dígito da vez.\n*   O número de passadas é definido pelo **maior valor**: o laço para quando `max / exp` chega a zero.\n*   A sub-rotina precisa ser **estável**, por isso o posicionamento é feito de trás para frente.\n*   Este código assume valores **não negativos**. Para negativos, separe os grupos ou some um deslocamento a todos os valores.\n\n---\n\n## 🎯 Quando devo usar o Radix Sort?\n\n*   **Muitos inteiros com poucos dígitos:** identificadores, códigos, timestamps, endereços IPv4.\n*   **Chaves de tamanho fixo:** CEPs, CPFs, placas, datas no formato AAAAMMDD.\n*   **Strings de mesmo comprimento:** ordenação lexicográfica por caractere, usando a variação LSD.\n*   **Grandes volumes de dados** em que $d$ é pequeno: é um dos poucos casos em que se ganha de $\\mathcal{O}(n \\log n)$ na prática.\n\nEvite quando as chaves tiverem muitos dígitos em relação a $\\log n$, quando os dados não puderem ser decompostos em dígitos, ou quando a memória extra for um problema.\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** ordene dígito por dígito, do menos significativo para o mais significativo, sempre com uma ordenação estável.\n*   **Tempo:** $\\mathcal{O}(d \\cdot (n + b))$ em todos os casos, linear quando $d$ e $b$ são constantes.\n*   **Espaço:** $\\mathcal{O}(n + b)$, **não** é in-place.\n*   **Estável:** sim (se a sub-rotina for estável). **Adaptável:** não. **Online:** não.\n*   **Não compara elementos:** usa dígitos como índices de baldes.\n*   **Destaque:** ordenação linear para inteiros e chaves de tamanho fixo.\n"},{"tipo":"file","nome":"Radix Sort","arq":"Radixsort.c","path":"Ordenacoes/Radix/Radixsort.c","ext":"c","kind":"codigo","tamanho":2056,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n// Função auxiliar para encontrar o maior número do array\nint getMax(int arr[], int n) {\n    int max = arr[0];\n    for (int i = 1; i < n; i++) {\n        if (arr[i] > max) {\n            max = arr[i];\n        }\n    }\n    return max;\n}\n// Counting Sort modificado para ordenar de acordo com a casa decimal (exp)\nvoid countingSortForRadix(int arr[], int n, int exp) {\n    int* output = (int*)malloc(n * sizeof(int));\n    int count[10] = {0}; // O array de contagem sempre terá tamanho 10 (dígitos 0 a 9)\n    // Conta a ocorrência dos dígitos na casa decimal atual\n    // (arr[i] / exp) % 10 isola o dígito. Ex: (123 / 10) % 10 = 2\n    for (int i = 0; i < n; i++) {\n        int digit = (arr[i] / exp) % 10;\n        count[digit]++;\n    }\n    // Acumula a contagem para definir as posições\n    for (int i = 1; i < 10; i++) {\n        count[i] += count[i - 1];\n    }\n    // Constrói o array de saída (de trás para frente garante a estabilidade)\n    for (int i = n - 1; i >= 0; i--) {\n        int digit = (arr[i] / exp) % 10;\n        output[count[digit] - 1] = arr[i];\n        count[digit]--;\n    }\n    // Copia os números (agora ordenados pela casa decimal atual) de volta\n    for (int i = 0; i < n; i++) {\n        arr[i] = output[i];\n    }\n    free(output);\n}\n// Função principal do Radix Sort\nvoid radixSort(int arr[], int n) {\n    if (n <= 1) return;\n    int max = getMax(arr, n);\n    // Chama o Counting Sort para cada dígito\n    // O 'exp' representa a potência de 10: 1 (unidade), 10 (dezena), 100 (centena)...\n    for (int exp = 1; max / exp > 0; exp *= 10) {\n        countingSortForRadix(arr, n, exp);\n    }\n}\nint main() {\n    int arr[] = {170, 45, 75, 90, 802, 24, 2, 66};\n    int n = sizeof(arr) / sizeof(arr[0]);\n    printf(\"Array original: \\n\");\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", arr[i]);\n    }\n    printf(\"\\n\");\n    radixSort(arr, n);\n    printf(\"Array ordenado: \\n\");\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", arr[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}"}]},{"tipo":"dir","nome":"Bucket Sort","arq":"Bucket","path":"Ordenacoes/Bucket","children":[{"tipo":"file","nome":"Bucket Sort","arq":"Bucketsort.c","path":"Ordenacoes/Bucket/Bucketsort.c","ext":"c","kind":"codigo","tamanho":5367,"conteudo":"#include <stdio.h>   // printf, fprintf, perror: entrada e saída\n#include <stdlib.h>  // realloc, free, exit: memória dinâmica e encerramento\n\n#define NUM_BUCKETS 5  // quantidade de baldes (faixas) em que os valores serão divididos\n\n// Balde dinâmico: um \"array que cresce sozinho\"\ntypedef struct {\n    int *data;     // ponteiro para os elementos guardados neste balde\n    int size;      // quantos elementos o balde tem agora\n    int capacity;  // quantos elementos cabem antes de precisar crescer\n} Bucket;\n\n// Adiciona um valor ao final do balde\nvoid bucketPush(Bucket *b, int value) {\n    if (b->size == b->capacity) {  // o balde está cheio?\n        // se a capacidade é 0 (balde novo), começa com 4; senão, dobra a capacidade\n        b->capacity = (b->capacity == 0) ? 4 : b->capacity * 2;\n        // realloc aumenta o bloco de memória (e funciona com data == NULL no primeiro uso)\n        b->data = (int *)realloc(b->data, b->capacity * sizeof(int));\n        if (b->data == NULL) {  // realloc devolve NULL se faltar memória\n            fprintf(stderr, \"Erro de alocação de memória\\n\");  // avisa o erro\n            exit(1);                                           // encerra o programa\n        }\n    }\n    b->data[b->size] = value;  // grava o valor na primeira posição livre\n    b->size++;                 // agora o balde tem um elemento a mais\n}\n\n// Insertion Sort: ordena um array pequeno (usado dentro de cada balde)\nvoid insertionSort(int arr[], int n) {\n    for (int i = 1; i < n; i++) {   // começa no 2º elemento; o 1º já é uma parte ordenada\n        int key = arr[i];           // guarda o elemento atual (a \"carta\" a inserir)\n        int j = i - 1;              // começa a olhar o elemento imediatamente à esquerda\n        while (j >= 0 && arr[j] > key) {  // enquanto houver elemento maior que a chave...\n            arr[j + 1] = arr[j];          // ...empurra esse elemento uma posição para a direita\n            j--;                          // e olha o próximo à esquerda\n        }\n        arr[j + 1] = key;           // coloca a chave no espaço aberto (posição correta)\n    }\n}\n\n// Bucket Sort para inteiros (aceita qualquer intervalo, inclusive negativos)\nvoid bucketSort(int arr[], int n) {\n    if (n <= 1) return;  // 0 ou 1 elemento já está ordenado: nada a fazer\n\n    // --- Passo 1: descobrir o menor e o maior valor ---\n    int min = arr[0], max = arr[0];       // começa assumindo que o 1º elemento é ambos\n    for (int i = 1; i < n; i++) {         // percorre o restante do array\n        if (arr[i] < min) min = arr[i];   // achou um valor menor: atualiza o mínimo\n        if (arr[i] > max) max = arr[i];   // achou um valor maior: atualiza o máximo\n    }\n    if (min == max) return;  // todos os valores são iguais: já está ordenado\n\n    // --- Passo 2: preparar os baldes ---\n    Bucket buckets[NUM_BUCKETS] = {0};  // cria os baldes, todos zerados (data = NULL, size = 0, capacity = 0)\n    long long range = (long long)max - min + 1;  // tamanho do intervalo de valores (long long evita overflow)\n\n    // --- Passo 3: distribuir cada elemento no balde da sua faixa ---\n    for (int i = 0; i < n; i++) {  // para cada elemento do array\n        // (valor - min) varia de 0 até range - 1; multiplicar por NUM_BUCKETS e dividir\n        // por range converte isso em um índice de balde entre 0 e NUM_BUCKETS - 1\n        int idx = (int)(((long long)arr[i] - min) * NUM_BUCKETS / range);\n        bucketPush(&buckets[idx], arr[i]);  // coloca o valor no balde calculado\n    }\n\n    // --- Passo 4: ordenar cada balde e juntar tudo de volta no array ---\n    int pos = 0;                           // próxima posição livre do array original\n    for (int b = 0; b < NUM_BUCKETS; b++) {  // percorre os baldes do primeiro ao último\n        // ordena só os elementos deste balde (poucos, então o Insertion Sort resolve bem)\n        insertionSort(buckets[b].data, buckets[b].size);\n        for (int i = 0; i < buckets[b].size; i++) {  // para cada elemento já ordenado do balde\n            arr[pos] = buckets[b].data[i];           // copia para o array original\n            pos++;                                   // avança a posição de escrita\n        }\n        free(buckets[b].data);  // libera a memória do balde (free(NULL) é seguro para baldes vazios)\n    }\n    // Como os baldes representam faixas em ordem crescente, ao despejá-los em sequência\n    // o array inteiro fica ordenado.\n}\n\n// Imprime um título e depois todos os elementos do array\nvoid printArray(const char *titulo, int arr[], int n) {\n    printf(\"%s\\n\", titulo);          // escreve o título em uma linha\n    for (int i = 0; i < n; i++) {    // percorre o array\n        printf(\"%d \", arr[i]);       // imprime cada número seguido de espaço\n    }\n    printf(\"\\n\");                    // quebra de linha no final\n}\n\nint main() {\n    int arr[] = {78, 17, 39, 26, 72, 94, 21, 12, 23, 68};  // array de exemplo\n    int n = sizeof(arr) / sizeof(arr[0]);  // número de elementos = tamanho total / tamanho de um elemento\n\n    printArray(\"Array original:\", arr, n);  // mostra o array antes de ordenar\n    bucketSort(arr, n);                     // ordena com Bucket Sort\n    printArray(\"Array ordenado:\", arr, n);  // mostra o array depois de ordenar\n\n    return 0;  // 0 indica que o programa terminou sem erros\n}\n"},{"tipo":"file","nome":"Demonstração: Bucket Sort","arq":"Demo_ Bucket Sort.html","path":"Ordenacoes/Bucket/Demo_ Bucket Sort.html","ext":"html","kind":"demo","tamanho":7611,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Demo: Bucket Sort<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#eef3f5;--panel:#fff;--ink:#14232e;--mute:#5d707c;--line:#cfdbe1;--acc:#0f7c8a;--hot:#e0a100;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}}\n:root[data-theme=\"dark\"]{--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:1.6rem;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:.85rem;font-weight:600;color:var(--mute);margin:18px 0 8px}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\nbutton,input{font:inherit;color:inherit}\nbutton{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}\nbutton:hover{border-color:var(--acc)}\n.tabs button[aria-selected=\"true\"]{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .tabs button[aria-selected=\"true\"]{color:#06222a}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n#desc{margin:0 0 14px;max-width:70ch}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}\n.ctl label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);flex:1;min-width:220px}\ninput[type=text]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}\n.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 16px 18px;margin-top:10px}\n.row,.cols{display:flex;flex-wrap:wrap;gap:6px}\n.cols{gap:8px;align-items:flex-start}\n.w{display:flex;flex-direction:column;align-items:center;gap:2px}\n.i{font-size:.7rem;color:var(--mute)}\n.c{min-width:44px;height:44px;padding:0 8px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-weight:800;font-variant-numeric:tabular-nums;transition:background .25s,border-color .25s}\n.c.hot{background:var(--hot);border-color:var(--hot);color:#14232e}\n.c.on{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .c.on{color:#06222a}\n.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}\n.dg{border-bottom:3px solid var(--acc)}\n.z{opacity:.35}\n.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}\n.ch{font-size:.8rem;font-weight:600;color:var(--mute)}\n.stack{min-height:52px;width:100%;box-sizing:border-box;border:1.5px dashed var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}\n#msg{min-height:3em;margin:14px 0 4px;font-weight:600}\n#pos{font-size:.85rem;color:var(--mute)}\n.spd{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);margin-top:6px}\n@media (prefers-reduced-motion:reduce){.c{transition:none}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Bucket Sort: demonstração interativa<\/h1>\n<p id=\"desc\"><\/p>\n<div class=\"ctl\">\n  <label>Números (separados por vírgula)<input type=\"text\" id=\"inp\"><\/label>\n  <button id=\"apply\">Aplicar<\/button>\n  <button id=\"rnd\">Sortear<\/button>\n<\/div>\n<div class=\"ctl\">\n  <button id=\"prev\">Voltar<\/button>\n  <button id=\"next\">Próximo passo<\/button>\n  <button id=\"play\">Reproduzir<\/button>\n  <span id=\"pos\"><\/span>\n<\/div>\n<div class=\"spd\"><label for=\"spd\">Velocidade<\/label><input type=\"range\" id=\"spd\" min=\"200\" max=\"1500\" step=\"50\" value=\"1000\"><\/div>\n<div class=\"stage\" id=\"stage\"><\/div>\n<div id=\"msg\" aria-live=\"polite\"><\/div>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nconst cell=(t,i,k,h)=>({t:t===null?'':t,i:i===undefined?'':i,k:k||'',h});\nconst row=(label,cells)=>({type:'row',label,cells});\n\nfunction bucket(a){\n  const F=[],K=5,B=Array.from({length:K},()=>[]),out=[];\n  const rg=j=>`${j*20}–${j*20+19}`;\n  const S=(msg,ai=-1,bi=-1,done)=>F.push({msg,blocks:[\n    row('Entrada',a.map((t,i)=>cell(t,i,i==ai?'hot':''))),\n    {type:'cols',label:'Baldes (faixas de 20)',cols:B.map((b,j)=>({h:rg(j),cells:b.map(t=>cell(t,'',j==bi?'on':''))}))},\n    ...(out.length?[row('Saída',out.map((t,i)=>cell(t,i,done?'ok':'')))]:[])]});\n  S('Dividimos 0–99 em 5 faixas de tamanho 20. Cada valor vai para o balde da sua faixa.');\n  a.forEach((v,i)=>{const j=Math.floor(v*K/100);B[j].push(v);S(`${v} está na faixa ${rg(j)}: vai para o balde ${j}.`,i,j)});\n  B.forEach((b,j)=>{if(b.length>1){b.sort((x,y)=>x-y);S(`Ordenamos o balde ${j}. Com poucos elementos, uma inserção simples resolve.`,-1,j)}});\n  B.forEach((b,j)=>{if(b.length){out.push(...b);S(`Despejamos o balde ${j} na saída.`,-1,j)}});\n  S('Pronto! Os baldes já estavam em ordem de faixa, então a saída está ordenada.',-1,-1,true);\n  return F;\n}\n\nconst A={\n  bucket:{name:'Bucket Sort',fn:bucket,max:99,val:'78, 17, 39, 26, 72, 94, 21, 12, 23, 68',d:'Espalha os valores em faixas (baldes), ordena cada balde e junta tudo. Tempo médio O(n + k) quando os dados são bem distribuídos.'}\n};\nlet cur='bucket',F=[],idx=0,timer=null;\n\nconst cellH=c=>`<div class=\"w\"><div class=\"c ${c.k}\">${c.h!==undefined?c.h:c.t}<\/div>${c.i!==''?`<span class=\"i\">${c.i}<\/span>`:''}<\/div>`;\nfunction draw(f){\n  $('stage').innerHTML=f.blocks.map(b=>b.type==='row'\n    ?`<h3>${b.label}<\/h3><div class=\"row\">${b.cells.map(cellH).join('')}<\/div>`\n    :`<h3>${b.label}<\/h3><div class=\"cols\">${b.cols.map(c=>`<div class=\"col\"><span class=\"ch\">${c.h}<\/span><div class=\"stack\">${c.cells.map(cellH).join('')}<\/div><\/div>`).join('')}<\/div>`).join('');\n  $('msg').textContent=f.msg;\n  $('pos').textContent=`Passo ${idx+1} de ${F.length}`;\n  $('prev').disabled=idx===0;$('next').disabled=idx===F.length-1;\n}\nfunction go(n){idx=Math.max(0,Math.min(F.length-1,n));draw(F[idx])}\nfunction stop(){clearInterval(timer);timer=null;$('play').textContent='Reproduzir'}\nfunction start(){clearInterval(timer);$('play').textContent='Pausar';timer=setInterval(()=>{if(idx>=F.length-1){stop();return}go(idx+1)},1700-$('spd').value)}\nfunction load(){\n  stop();\n  const m=A[cur].max,r=$('inp').value.split(/[\\s,;]+/).filter(Boolean).map(Number);\n  if(r.length<2||r.length>12||r.some(x=>!Number.isInteger(x)||x<0||x>m)){$('msg').textContent=`Digite de 2 a 12 números inteiros entre 0 e ${m}, separados por vírgula.`;return}\n  A[cur].val=r.join(', ');F=A[cur].fn(r);go(0);\n}\nfunction pick(k){\n  cur=k;stop();\n  $('desc').textContent=A[k].d;$('inp').value=A[k].val;load();\n}\n$('apply').onclick=load;\n$('inp').onkeydown=e=>{if(e.key==='Enter')load()};\n$('rnd').onclick=()=>{const m=A[cur].max;$('inp').value=Array.from({length:8},()=>Math.floor(Math.random()*(m+1))).join(', ');load()};\n$('prev').onclick=()=>{stop();go(idx-1)};\n$('next').onclick=()=>{stop();go(idx+1)};\n$('play').onclick=()=>{if(timer){stop();return}if(idx>=F.length-1)go(0);start()};\n$('spd').oninput=()=>{if(timer)start()};\npick('bucket');\n<\/script>\n<\/body>\n<\/html>\n"},{"tipo":"file","nome":"Guia completo: Bucket Sort","arq":"guia_completo_bucket_sort.md","path":"Ordenacoes/Bucket/guia_completo_bucket_sort.md","ext":"md","kind":"guia","tamanho":8898,"conteudo":"# Guia Completo: Algoritmo Bucket Sort (Ordenação por Baldes)\n\nO **Bucket Sort** (ou Ordenação por Baldes) é um algoritmo de ordenação que **distribui os elementos em vários \"baldes\"** (faixas de valores), ordena cada balde separadamente e depois junta tudo na ordem. A distribuição não usa comparações entre elementos: ela usa uma **fórmula** que diz em qual balde cada valor deve cair.\n\nEle brilha quando os dados estão **distribuídos de forma mais ou menos uniforme** em um intervalo conhecido, porque cada balde acaba com poucos elementos e a ordenação interna fica barata.\n\n---\n\n## 🪣 Como Funciona? (A Analogia da Biblioteca)\n\nImagine que você precisa organizar 1.000 livros pelo ano de publicação, entre 1900 e 1999:\n1. Você coloca 10 caixas na sala, uma para cada década: 1900–1909, 1910–1919, e assim por diante (**distribuição**).\n2. Joga cada livro na caixa da sua década, sem se preocupar com a ordem dentro da caixa.\n3. Depois ordena **cada caixa separadamente**, o que é rápido porque cada uma tem poucos livros (**ordenação dos baldes**).\n4. Por fim, esvazia as caixas na estante, da primeira à última (**concatenação**).\n\nEm termos de algoritmo, são quatro etapas:\n\n1. **Criar os baldes:** divide o intervalo de valores em $k$ faixas de mesmo tamanho.\n2. **Distribuir:** cada elemento `v` vai para o balde de índice $\\lfloor v \\cdot k / (\\text{max} + 1) \\rfloor$.\n3. **Ordenar cada balde:** geralmente com Insertion Sort, já que os baldes costumam ser pequenos.\n4. **Concatenar:** junta os baldes, do primeiro ao último.\n\n### Exemplo passo a passo\n\nArray inicial: `[78, 17, 39, 26, 72, 94, 21, 12, 23, 68]` (valores de 0 a 99, com 5 baldes de tamanho 20)\n\n**Fase 1: distribuição** (índice do balde = $\\lfloor v \\cdot 5 / 100 \\rfloor$)\n\n| Balde | Faixa | Conteúdo (na ordem de chegada) |\n|---|---|---|\n| 0 | 0–19 | 17, 12 |\n| 1 | 20–39 | 39, 26, 21, 23 |\n| 2 | 40–59 | (vazio) |\n| 3 | 60–79 | 78, 72, 68 |\n| 4 | 80–99 | 94 |\n\n**Fase 2: ordenação de cada balde**\n\n| Balde | Antes | Depois |\n|---|---|---|\n| 0 | 17, 12 | 12, 17 |\n| 1 | 39, 26, 21, 23 | 21, 23, 26, 39 |\n| 2 | (vazio) | (vazio) |\n| 3 | 78, 72, 68 | 68, 72, 78 |\n| 4 | 94 | 94 |\n\n**Fase 3: concatenação**\n\nResultado final: `[12, 17, 21, 23, 26, 39, 68, 72, 78, 94]`\n\n> Para números reais no intervalo $[0, 1)$, a fórmula fica ainda mais simples: o balde de `x` é $\\lfloor k \\cdot x \\rfloor$.\n\n---\n\n## ⚙️ Características Mais Importantes\n\n### 1. Complexidade de Tempo (Velocidade)\nSeja $n$ o número de elementos e $k$ o número de baldes.\n*   **Melhor Caso:** $\\mathcal{O}(n + k)$\n    *   Ocorre quando os elementos se espalham uniformemente: cada balde fica com cerca de $n/k$ elementos e a ordenação interna é quase de graça.\n*   **Caso Médio:** $\\mathcal{O}(n + k)$\n    *   Com dados uniformemente distribuídos e $k$ proporcional a $n$, o algoritmo é **linear**.\n*   **Pior Caso:** $\\mathcal{O}(n^2)$\n    *   Ocorre quando quase todos os elementos caem no **mesmo balde**. Aí o algoritmo se reduz à ordenação interna: $\\mathcal{O}(n^2)$ com Insertion Sort, ou $\\mathcal{O}(n \\log n)$ se usar um algoritmo melhor dentro dos baldes.\n\n> **Detalhe importante:** o desempenho depende da **distribuição dos dados**. Se os valores estiverem concentrados em uma faixa estreita, os baldes ficam desequilibrados e a vantagem some.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(n + k)$\n    *   **Não é in-place.** Os baldes guardam, no total, cópias dos $n$ elementos, além da estrutura dos $k$ baldes.\n\n### 3. Estabilidade\n*   **É Estável?** Depende da ordenação interna.\n    *   Se os elementos entrarem nos baldes na ordem original e o algoritmo usado dentro dos baldes for estável (como o Insertion Sort), o Bucket Sort é estável.\n\n### 4. Baseado em Comparação?\n*   **Parcialmente.** A distribuição usa uma fórmula, sem comparar elementos entre si. Mas a ordenação *dentro* de cada balde normalmente usa comparações.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não no sentido clássico.\n    *   Dados já ordenados não deixam a distribuição mais rápida. Por outro lado, o Insertion Sort usado nos baldes aproveita dados quase ordenados.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   É preciso conhecer o intervalo dos valores (mínimo e máximo) antes de definir as faixas dos baldes.\n\n---\n\n## 🔍 Escolhendo o Número de Baldes\n\n*   **Poucos baldes:** cada balde fica cheio e a ordenação interna pesa (tende a $\\mathcal{O}(n^2)$ com Insertion Sort).\n*   **Muitos baldes:** gasta-se memória e tempo percorrendo baldes vazios.\n*   **Regra prática:** usar $k \\approx n$ (ou $\\sqrt{n}$ em alguns cenários), de modo que cada balde receba poucos elementos em média.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Velocidade linear em média:** $\\mathcal{O}(n + k)$ para dados uniformes.\n*   **Paralelizável:** cada balde pode ser ordenado de forma independente, inclusive em threads ou máquinas diferentes.\n*   **Funciona com números reais:** diferente do Counting Sort, aceita valores fracionários em um intervalo conhecido.\n*   **Flexível:** o algoritmo usado dentro dos baldes pode ser trocado conforme a necessidade.\n\n**Desvantagens:**\n*   **Depende da distribuição:** dados concentrados degradam o desempenho para $\\mathcal{O}(n^2)$.\n*   **Usa memória extra:** $\\mathcal{O}(n + k)$, não é in-place.\n*   **Exige conhecer o intervalo:** é preciso saber (ou calcular) mínimo e máximo.\n*   **Não é adaptável nem online.**\n\n---\n\n## 💻 Exemplo Clássico em C\n\n```c\n#include <stdlib.h>\n\n#define K 5   // número de baldes\n\n// Ordena valores inteiros de 0 a 99 usando K baldes de mesmo tamanho\nvoid bucketSort(int arr[], int n) {\n    int *bucket[K];\n    int size[K] = {0};\n    int i, b;\n\n    // Cria os baldes (por simplicidade, cada um com capacidade n)\n    for (b = 0; b < K; b++)\n        bucket[b] = malloc(n * sizeof(int));\n\n    // Fase 1: distribui cada elemento no balde da sua faixa\n    for (i = 0; i < n; i++) {\n        b = arr[i] * K / 100;          // índice do balde\n        bucket[b][size[b]++] = arr[i];\n    }\n\n    int pos = 0;\n    for (b = 0; b < K; b++) {\n        // Fase 2: Insertion Sort dentro do balde (estável)\n        for (i = 1; i < size[b]; i++) {\n            int key = bucket[b][i];\n            int j = i - 1;\n            while (j >= 0 && bucket[b][j] > key) {\n                bucket[b][j + 1] = bucket[b][j];\n                j--;\n            }\n            bucket[b][j + 1] = key;\n        }\n\n        // Fase 3: concatena o balde de volta no array original\n        for (i = 0; i < size[b]; i++)\n            arr[pos++] = bucket[b][i];\n\n        free(bucket[b]);\n    }\n}\n```\n\n**Pontos de atenção no código:**\n*   A fórmula `arr[i] * K / 100` assume valores de **0 a 99**. Para outro intervalo, use `(v - min) * K / (max - min + 1)`.\n*   Reservar capacidade `n` para cada balde é simples, mas gasta memória. Em código real, use listas encadeadas ou arrays dinâmicos.\n*   O Insertion Sort dentro do balde é o que garante a estabilidade, desde que a distribuição preserve a ordem de chegada.\n\n---\n\n## 🎯 Quando devo usar o Bucket Sort?\n\n*   **Dados com distribuição aproximadamente uniforme:** notas, percentuais, coordenadas, valores sorteados aleatoriamente.\n*   **Números reais em um intervalo conhecido**, como valores em $[0, 1)$.\n*   **Grandes volumes de dados** que podem ser divididos e processados em paralelo ou em disco (ordenação externa).\n*   **Quando se quer um algoritmo linear** e a distribuição dos dados é conhecida.\n\nEvite quando os dados forem muito concentrados em poucas faixas, quando o intervalo for desconhecido, ou quando a memória extra for um problema.\n\n---\n\n## 📊 Counting Sort vs. Radix Sort vs. Bucket Sort\n\n| Característica | Counting Sort | Radix Sort (LSD) | Bucket Sort |\n|---|---|---|---|\n| Tempo médio | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(d \\cdot (n + b))$ | $\\mathcal{O}(n + k)$ |\n| Pior caso | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(d \\cdot (n + b))$ | $\\mathcal{O}(n^2)$ |\n| Espaço extra | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(n + b)$ | $\\mathcal{O}(n + k)$ |\n| Estável | Sim | Sim | Depende do algoritmo interno |\n| Aceita números reais | Não | Não | **Sim** |\n| Depende da distribuição | Não | Não | **Sim** |\n| Ideia central | Contar ocorrências | Ordenar dígito a dígito | Espalhar em faixas |\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** espalhe os elementos em faixas (baldes), ordene cada balde e junte.\n*   **Tempo:** $\\mathcal{O}(n + k)$ em média, $\\mathcal{O}(n^2)$ no pior caso.\n*   **Espaço:** $\\mathcal{O}(n + k)$, **não** é in-place.\n*   **Estável:** depende da ordenação interna. **Adaptável:** não. **Online:** não.\n*   **Destaque:** excelente para dados uniformemente distribuídos, inclusive números reais.\n"}]},{"tipo":"dir","nome":"Merge Sort","arq":"Merge","path":"Ordenacoes/Merge","children":[{"tipo":"file","nome":"Guia completo: Merge Sort","arq":"guia_completo_merge_sort.md","path":"Ordenacoes/Merge/guia_completo_merge_sort.md","ext":"md","kind":"guia","tamanho":10009,"conteudo":"# Guia Completo: Algoritmo Merge Sort (Ordenação por Intercalação)\n\nO **Merge Sort** (ou Ordenação por Intercalação) é um algoritmo de ordenação baseado na estratégia **dividir para conquistar**. Ele divide o array ao meio repetidamente até sobrarem pedaços de um único elemento (que já estão ordenados por definição) e depois **intercala** (faz o *merge* de) esses pedaços, sempre produzindo listas ordenadas maiores.\n\nDiferente dos algoritmos simples de $\\mathcal{O}(n^2)$ (como Insertion Sort e Selection Sort), o Merge Sort garante $\\mathcal{O}(n \\log n)$ em **todos os casos**, o que o torna uma das escolhas mais confiáveis para grandes volumes de dados.\n\n---\n\n## 🧩 Como Funciona? (A Analogia das Duas Pilhas de Cartas)\n\nImagine que você tem duas pilhas de cartas, e cada uma **já está ordenada** com a menor carta por cima. Para juntá-las em uma única pilha ordenada, basta repetir:\n1. Olhar a carta do topo de cada pilha.\n2. Pegar a **menor** das duas e colocá-la na pilha final.\n3. Repetir até uma das pilhas acabar, e então despejar o que sobrou da outra.\n\nEsse processo (a **intercalação**) é rápido, porque você nunca precisa olhar além do topo de cada pilha. O Merge Sort apenas aplica essa ideia de forma recursiva:\n\n1. **Dividir:** parte o array ao meio.\n2. **Conquistar:** ordena cada metade recursivamente (um array de 0 ou 1 elemento já está ordenado).\n3. **Combinar:** intercala as duas metades ordenadas em um único array ordenado.\n\n### Exemplo passo a passo\n\nArray inicial: `[38, 27, 43, 3, 9, 82, 10]`\n\n**Fase 1: divisão**\n\n```\n                [38, 27, 43, 3, 9, 82, 10]\n               /                          \\\n      [38, 27, 43, 3]                [9, 82, 10]\n       /           \\                  /        \\\n  [38, 27]      [43, 3]            [9]       [82, 10]\n   /    \\        /    \\                       /     \\\n [38]  [27]    [43]   [3]                  [82]    [10]\n```\n\n**Fase 2: intercalação** (de baixo para cima)\n\n| Intercala | Resultado |\n|---|---|\n| `[38]` + `[27]` | `[27, 38]` |\n| `[43]` + `[3]` | `[3, 43]` |\n| `[82]` + `[10]` | `[10, 82]` |\n| `[27, 38]` + `[3, 43]` | `[3, 27, 38, 43]` |\n| `[9]` + `[10, 82]` | `[9, 10, 82]` |\n| `[3, 27, 38, 43]` + `[9, 10, 82]` | `[3, 9, 10, 27, 38, 43, 82]` |\n\nResultado final: `[3, 9, 10, 27, 38, 43, 82]`\n\n**Detalhe da última intercalação** (`[3, 27, 38, 43]` + `[9, 10, 82]`):\n\n| Topo esquerdo | Topo direito | Menor | Saída até agora |\n|---|---|---|---|\n| 3 | 9 | 3 | `[3]` |\n| 27 | 9 | 9 | `[3, 9]` |\n| 27 | 10 | 10 | `[3, 9, 10]` |\n| 27 | 82 | 27 | `[3, 9, 10, 27]` |\n| 38 | 82 | 38 | `[3, 9, 10, 27, 38]` |\n| 43 | 82 | 43 | `[3, 9, 10, 27, 38, 43]` |\n| (acabou) | 82 | 82 | `[3, 9, 10, 27, 38, 43, 82]` |\n\n---\n\n## ⚙️ Características Mais Importantes\n\n### 1. Complexidade de Tempo (Velocidade)\n*   **Melhor Caso:** $\\mathcal{O}(n \\log n)$\n*   **Pior Caso:** $\\mathcal{O}(n \\log n)$\n*   **Caso Médio:** $\\mathcal{O}(n \\log n)$\n    *   O array é dividido ao meio $\\log_2 n$ vezes (a **altura** da recursão), e em cada nível a intercalação percorre os $n$ elementos uma vez. Logo, o custo é $n \\cdot \\log n$, independentemente da disposição dos dados.\n\n> **Detalhe importante:** a recorrência do algoritmo é $T(n) = 2T(n/2) + \\mathcal{O}(n)$, cuja solução é $\\mathcal{O}(n \\log n)$. Para 1 milhão de elementos, são cerca de 20 níveis de recursão, contra um número da ordem de $10^{12}$ operações de um algoritmo $\\mathcal{O}(n^2)$.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(n)$\n    *   **Não é in-place** na versão clássica para arrays. A intercalação precisa de um array auxiliar do tamanho do trecho sendo combinado. Existem versões in-place, mas são bem mais complexas e lentas.\n    *   Para **listas encadeadas**, a intercalação pode ser feita apenas religando ponteiros, e o espaço extra cai para $\\mathcal{O}(\\log n)$ (a pilha da recursão).\n\n### 3. Estabilidade\n*   **É Estável?** Sim.\n    *   Na intercalação, quando os dois topos são **iguais**, o elemento da metade **esquerda** é escolhido primeiro (`<=` em vez de `<`). Assim, elementos iguais mantêm a ordem relativa original.\n\n### 4. Baseado em Comparação?\n*   **Sim.** E atinge o limite inferior teórico de $\\Omega(n \\log n)$ para algoritmos desse tipo, ou seja, é **assintoticamente ótimo** entre os algoritmos por comparação.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não (na versão clássica).\n    *   Ele sempre divide e intercala, mesmo que o array já esteja ordenado. Variações como o *Natural Merge Sort* e o **Timsort** aproveitam trechos já ordenados.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   Precisa de todos os dados antes de começar a dividir.\n\n---\n\n## 📊 Comparação com Outros Algoritmos\n\n| Característica | Insertion Sort | Selection Sort | **Merge Sort** |\n|---|---|---|---|\n| Melhor caso | $\\mathcal{O}(n)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n \\log n)$ |\n| Pior caso | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ | **$\\mathcal{O}(n \\log n)$** |\n| Espaço extra | $\\mathcal{O}(1)$ | $\\mathcal{O}(1)$ | $\\mathcal{O}(n)$ |\n| Estável | Sim | Não | **Sim** |\n| Adaptável | Sim | Não | Não |\n| Estratégia | Inserção | Seleção | Dividir para conquistar |\n\n---\n\n## 🔀 Variações\n\n*   **Top-down (recursivo):** a versão clássica, apresentada neste guia.\n*   **Bottom-up (iterativo):** começa intercalando pares de elementos, depois pares de pares, e assim por diante, sem recursão.\n*   **Natural Merge Sort:** detecta trechos já ordenados (*runs*) e os intercala diretamente. É a ideia por trás do Timsort.\n*   **Merge Sort em listas encadeadas:** muito eficiente, pois não precisa de acesso aleatório nem de array auxiliar.\n*   **Merge Sort externo:** ordena arquivos maiores que a memória, intercalando blocos ordenados gravados em disco.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Desempenho garantido:** $\\mathcal{O}(n \\log n)$ em qualquer caso, sem pior caso quadrático.\n*   **Estável:** preserva a ordem de elementos iguais.\n*   **Previsível:** o tempo varia pouco conforme a entrada.\n*   **Ótimo para listas encadeadas e dados externos:** acessa os dados de forma sequencial.\n*   **Paralelizável:** as duas metades podem ser ordenadas ao mesmo tempo.\n\n**Desvantagens:**\n*   **Usa memória extra:** $\\mathcal{O}(n)$ para o array auxiliar (versão clássica).\n*   **Mais lento em arrays pequenos:** o overhead da recursão e das cópias pesa. Por isso, implementações práticas trocam para Insertion Sort em pedaços pequenos.\n*   **Não é adaptável:** não aproveita dados já ordenados (na versão clássica).\n*   **Não é online.**\n\n---\n\n## 💻 Exemplo Clássico em C\n\n```c\n#include <stdlib.h>\n\n// Intercala arr[l..m] e arr[m+1..r], que já estão ordenados\nstatic void merge(int arr[], int tmp[], int l, int m, int r) {\n    int i = l;       // início da metade esquerda\n    int j = m + 1;   // início da metade direita\n    int k = l;       // posição no array auxiliar\n\n    while (i <= m && j <= r) {\n        // \"<=\" garante a estabilidade: em empate, sai o da esquerda\n        if (arr[i] <= arr[j])\n            tmp[k++] = arr[i++];\n        else\n            tmp[k++] = arr[j++];\n    }\n\n    // Despeja o que sobrou de qualquer uma das metades\n    while (i <= m) tmp[k++] = arr[i++];\n    while (j <= r) tmp[k++] = arr[j++];\n\n    // Copia o trecho intercalado de volta para o array original\n    for (k = l; k <= r; k++)\n        arr[k] = tmp[k];\n}\n\nstatic void mergeSortRec(int arr[], int tmp[], int l, int r) {\n    if (l >= r) return;              // 0 ou 1 elemento: já está ordenado\n\n    int m = l + (r - l) / 2;         // evita overflow de (l + r) / 2\n    mergeSortRec(arr, tmp, l, m);    // ordena a metade esquerda\n    mergeSortRec(arr, tmp, m + 1, r);// ordena a metade direita\n    merge(arr, tmp, l, m, r);        // intercala as duas\n}\n\nvoid mergeSort(int arr[], int n) {\n    int *tmp = malloc(n * sizeof(int));  // um único array auxiliar\n    mergeSortRec(arr, tmp, 0, n - 1);\n    free(tmp);\n}\n```\n\n**Pontos de atenção no código:**\n*   O array auxiliar é alocado **uma única vez** e reaproveitado em todas as intercalações, evitando `malloc` dentro da recursão.\n*   O caso base `l >= r` interrompe a recursão quando o trecho tem 0 ou 1 elemento.\n*   `m = l + (r - l) / 2` é mais seguro do que `(l + r) / 2`, que pode estourar o limite de `int` com índices muito grandes.\n*   O `<=` na comparação é o que mantém o algoritmo **estável**. Trocando por `<`, ele continua ordenando, mas perde a estabilidade.\n\n---\n\n## 🎯 Quando devo usar o Merge Sort?\n\n*   **Quando é preciso garantia de desempenho:** sem risco de pior caso quadrático.\n*   **Quando a estabilidade importa:** por exemplo, ordenar registros por mais de um critério em etapas.\n*   **Listas encadeadas:** é considerado o melhor algoritmo de ordenação para esse tipo de estrutura.\n*   **Dados maiores que a memória (ordenação externa):** blocos são ordenados e depois intercalados a partir do disco.\n*   **Ordenação paralela ou distribuída:** a divisão em metades se encaixa naturalmente em vários processadores.\n\nNa prática, bibliotecas padrão usam variações do Merge Sort. O `sort()` do **Python** e o `Arrays.sort()` para objetos no **Java** usam o **Timsort**, um híbrido de Merge Sort com Insertion Sort que aproveita trechos já ordenados. Evite a versão clássica quando a memória extra for um problema sério.\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** divida o array ao meio, ordene cada metade e intercale as metades ordenadas.\n*   **Tempo:** $\\mathcal{O}(n \\log n)$ em todos os casos.\n*   **Espaço:** $\\mathcal{O}(n)$, **não** é in-place (versão clássica).\n*   **Estável:** sim. **Adaptável:** não. **Online:** não.\n*   **Estratégia:** dividir para conquistar.\n*   **Destaque:** desempenho garantido e estabilidade, ideal para grandes volumes, listas encadeadas e ordenação externa.\n"},{"tipo":"file","nome":"Merge Sort","arq":"mergesort.c","path":"Ordenacoes/Merge/mergesort.c","ext":"c","kind":"codigo","tamanho":2364,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n// Função responsável por intercalar (mesclar) dois sub-arrays ordenados\nvoid merge(int arr[], int left, int mid, int right) {\n    int n1 = mid - left + 1; // Tamanho do sub-array esquerdo\n    int n2 = right - mid;    // Tamanho do sub-array direito\n    // Aloca memória para arrays temporários\n    int* L = (int*)malloc(n1 * sizeof(int));\n    int* R = (int*)malloc(n2 * sizeof(int));\n    // Copia os dados para os arrays temporários L e R\n    for (int i = 0; i < n1; i++) {\n        L[i] = arr[left + i];\n    }\n    for (int j = 0; j < n2; j++) {\n        R[j] = arr[mid + 1 + j];\n    }\n    // Índices iniciais dos sub-arrays e do array principal\n    int i = 0; // Índice de L\n    int j = 0; // Índice de R\n    int k = left; // Índice de arr\n    // Mescla os arrays de volta no array original respeitando a ordem\n    while (i < n1 && j < n2) {\n        if (L[i] <= R[j]) { // O sinal de <= garante a estabilidade do algoritmo\n            arr[k] = L[i];\n            i++;\n        } else {\n            arr[k] = R[j];\n            j++;\n        }\n        k++;\n    }\n    // Copia os elementos restantes de L[], se houver\n    while (i < n1) {\n        arr[k] = L[i];\n        i++;\n        k++;\n    }\n    // Copia os elementos restantes de R[], se houver\n    while (j < n2) {\n        arr[k] = R[j];\n        j++;\n        k++;\n    }\n    // Libera a memória alocada\n    free(L);\n    free(R);\n}\n// Função recursiva principal do Merge Sort\nvoid mergeSort(int arr[], int left, int right) {\n    if (left < right) {\n        // Encontra o meio (escrito assim para evitar overflow em arrays gigantes)\n        int mid = left + (right - left) / 2;\n\n        // Ordena a primeira e a segunda metade recursivamente\n        mergeSort(arr, left, mid);\n        mergeSort(arr, mid + 1, right);\n\n        // Mescla as metades ordenadas\n        merge(arr, left, mid, right);\n    }\n}\nint main() {\n    int arr[] = {38, 27, 43, 3, 9, 82, 10};\n    int n = sizeof(arr) / sizeof(arr[0]);\n\n    printf(\"Array original: \\n\");\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", arr[i]);\n    }\n    printf(\"\\n\");\n    // Chama o mergeSort passando o índice inicial (0) e o final (n-1)\n    mergeSort(arr, 0, n - 1);\n\n    printf(\"Array ordenado: \\n\");\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", arr[i]);\n    }\n    printf(\"\\n\");\n\n    return 0;\n}"},{"tipo":"file","nome":"Visualizador: Merge Sort","arq":"visualizador_interativo_do_merge_sort.html","path":"Ordenacoes/Merge/visualizador_interativo_do_merge_sort.html","ext":"html","kind":"demo","tamanho":62492,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Explicação Interativa do Merge Sort<\/title>\n    <\u0021-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <\u0021-- Google Fonts -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700; ub-vetores que já foram previamente ordenados.\n                        Sua missão é construir o vetor resultante **ordenado**, selecionando em ordem correta qual elemento deve ser inserido em seguida.\n                    <\/p>\n                <\/div>\n\n                <\u0021-- Practice Container -->\n                <div class=\"max-w-2xl mx-auto bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-6\">\n                    \n                    <\u0021-- Score Header -->\n                    <div class=\"flex items-center justify-between border-b border-slate-800 pb-4\">\n                        <div>\n                            <span class=\"text-xs text-slate-500 uppercase tracking-wider block\">Progresso<\/span>\n                            <span id=\"quiz-score\" class=\"text-lg font-mono font-bold text-indigo-400\">0 / 0 inseridos<\/span>\n                        <\/div>\n                        <button onclick=\"initQuizGame()\" class=\"bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition\">\n                            <i class=\"fa-solid fa-rotate-right mr-1.5\"><\/i> Novo Desafio\n                        <\/button>\n                    <\/div>\n\n                    <\u0021-- Subarray Left & Right Displays -->\n                    <div class=\"grid grid-cols-2 gap-4\">\n                        <div class=\"bg-slate-900 p-4 rounded-xl border border-indigo-500/30\">\n                            <h4 class=\"text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3 flex items-center justify-between\">\n                                Sub-vetor Esquerdo\n                                <span class=\"text-[10px] font-normal text-slate-500\">(Ordenado)<\/span>\n                            <\/h4>\n                            <div id=\"quiz-left-container\" class=\"flex flex-wrap gap-2 justify-center min-h-[50px] items-center\">\n                                <\u0021-- Dynamic left choices -->\n                            <\/div>\n                        <\/div>\n\n                        <div class=\"bg-slate-900 p-4 rounded-xl border border-purple-500/30\">\n                            <h4 class=\"text-xs font-bold text-purple-400 uppercase tracking-wider mb-3 flex items-center justify-between\">\n                                Sub-vetor Direito\n                                <span class=\"text-[10px] font-normal text-slate-500\">(Ordenado)<\/span>\n                            <\/h4>\n                            <div id=\"quiz-right-container\" class=\"flex flex-wrap gap-2 justify-center min-h-[50px] items-center\">\n                                <\u0021-- Dynamic right choices -->\n                            <\/div>\n                        <\/div>\n                    <\/div>\n\n                    <\u0021-- Result Array Target -->\n                    <div class=\"bg-slate-900 p-4 rounded-xl border border-emerald-500/30\">\n                        <h4 class=\"text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3\">\n                            Vetor Resultante Intercalado\n                        <\/h4>\n                        <div id=\"quiz-target-container\" class=\"flex flex-wrap gap-2 justify-start min-h-[56px] items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800\">\n                            <span class=\"text-xs text-slate-600 italic mx-auto\">Clique em um elemento válido acima para adicioná-lo aqui...<\/span>\n                        <\/div>\n                    <\/div>\n\n                    <\u0021-- Feedback Message -->\n                    <div id=\"quiz-feedback\" class=\"p-3 rounded-xl text-center text-sm font-medium hidden\">\n                    <\/div>\n\n                <\/div>\n            <\/div>\n        <\/section>\n\n\n        <\u0021-- TAB 3: THEORY & CONCEPTUAL EXPLANATION -->\n        <section id=\"view-theory\" class=\"hidden flex-col gap-6\">\n            \n            <div class=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n                <\u0021-- Concept 1: Divisão e Conquista -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg\">\n                    <div class=\"w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mb-3\">\n                        <i class=\"fa-solid fa-sitemap text-lg\"><\/i>\n                    <\/div>\n                    <h3 class=\"text-base font-bold text-white mb-2\">1. Divisão e Conquista<\/h3>\n                    <p class=\"text-xs text-slate-400 leading-relaxed\">\n                        O Merge Sort faz parte da classe de algoritmos que resolvem problemas dividindo o vetor de entrada continuamente ao meio até alcançar sub-vetores de tamanho 1 (caso base), que já estão naturalmente ordenados.\n                    <\/p>\n                <\/div>\n\n                <\u0021-- Concept 2: Intercalação (Merge) -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg\">\n                    <div class=\"w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mb-3\">\n                        <i class=\"fa-solid fa-code-merge text-lg\"><\/i>\n                    <\/div>\n                    <h3 class=\"text-base font-bold text-white mb-2\">2. A Magia da Intercalação<\/h3>\n                    <p class=\"text-xs text-slate-400 leading-relaxed\">\n                        A verdadeira força do algoritmo está na etapa de intercalação. Combinar dois vetores menores que <strong>já estão ordenados<\/strong> exige apenas passar um ponteiro por cada sub-vetor, resultando em um tempo linear $O(N)$ para unir cada nível.\n                    <\/p>\n                <\/div>\n\n                <\u0021-- Concept 3: Estabilidade -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg\">\n                    <div class=\"w-10 h-10 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mb-3\">\n                        <i class=\"fa-solid fa-shield-halved text-lg\"><\/i>\n                    <\/div>\n                    <h3 class=\"text-base font-bold text-white mb-2\">3. Algoritmo Estável<\/h3>\n                    <p class=\"text-xs text-slate-400 leading-relaxed\">\n                        O Merge Sort é <strong>estável<\/strong>. Isso significa que, se houver elementos com valores idênticos no vetor, a sua ordem relativa original será preservada após a ordenação.\n                    <\/p>\n                <\/div>\n            <\/div>\n\n            <\u0021-- Deep Dive Complexity Section -->\n            <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6\">\n                <h3 class=\"text-lg font-bold text-white flex items-center gap-2\">\n                    <i class=\"fa-solid fa-chart-line text-indigo-400\"><\/i> Análise de Complexidade de Tempo e Espaço\n                <\/h3>\n\n                <div class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                    <\u0021-- Complexidade de Tempo -->\n                    <div class=\"bg-slate-950 p-4 rounded-xl border border-slate-800\">\n                        <h4 class=\"text-sm font-bold text-indigo-300 mb-2\">Complexidade de Tempo: <span class=\"font-mono text-emerald-400\">O(n log n)<\/span><\/h4>\n                        <p class=\"text-xs text-slate-400 leading-relaxed mb-3\">\n                            Independentemente de o vetor estar totalmente desordenado, invertido ou pré-ordenado, o Merge Sort sempre realiza a mesma quantidade de divisões e comparações.\n                        <\/p>\n                        <ul class=\"text-xs text-slate-300 space-y-1.5 list-disc list-inside font-mono\">\n                            <li>Pior Caso: <span class=\"text-emerald-400 font-bold\">O(n log n)<\/span><\/li>\n                            <li>Caso Médio: <span class=\"text-emerald-400 font-bold\">O(n log n)<\/span><\/li>\n                            <li>Melhor Caso: <span class=\"text-emerald-400 font-bold\">O(n log n)<\/span><\/li>\n                        <\/ul>\n                    <\/div>\n\n                    <\u0021-- Complexidade de Espaço -->\n                    <div class=\"bg-slate-950 p-4 rounded-xl border border-slate-800\">\n                        <h4 class=\"text-sm font-bold text-indigo-300 mb-2\">Complexidade de Espaço: <span class=\"font-mono text-amber-400\">O(n)<\/span><\/h4>\n                        <p class=\"text-xs text-slate-400 leading-relaxed mb-3\">\n                            A principal desvantagem do Merge Sort tradicional é que ele exige espaço em memória auxiliar proporcional ao número de elementos ($O(n)$) para criar os sub-vetores temporários durante a intercalação.\n                        <\/p>\n                        <p class=\"text-xs text-slate-500\">\n                            * Nota: Além do vetor auxiliar, há $O(\\log n)$ de espaço ocupado pela pilha de chamadas da recursão.\n                        <\/p>\n                    <\/div>\n                <\/div>\n\n                <\u0021-- Comparison Table -->\n                <div class=\"overflow-x-auto pt-2\">\n                    <h4 class=\"text-sm font-bold text-slate-200 mb-3\">Comparação de Algoritmos de Ordenação<\/h4>\n                    <table class=\"w-full text-xs text-left text-slate-300 border-collapse\">\n                        <thead>\n                            <tr class=\"bg-slate-950 text-slate-400 font-mono border-b border-slate-800\">\n                                <th class=\"p-3\">Algoritmo<\/th>\n                                <th class=\"p-3\">Tempo (Melhor)<\/th>\n                                <th class=\"p-3\">Tempo (Médio)<\/th>\n                                <th class=\"p-3\">Tempo (Pior)<\/th>\n                                <th class=\"p-3\">Espaço Auxiliar<\/th>\n                                <th class=\"p-3\">Estável?<\/th>\n                            <\/tr>\n                        <\/thead>\n                        <tbody class=\"divide-y divide-slate-800 font-mono\">\n                            <tr class=\"bg-indigo-950/30 font-semibold text-white\">\n                                <td class=\"p-3 flex items-center gap-1.5\">\n                                    <span class=\"w-2 h-2 rounded-full bg-indigo-400\"><\/span> Merge Sort\n                                <\/td>\n                                <td class=\"p-3 text-emerald-400\">O(n log n)<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(n log n)<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(n log n)<\/td>\n                                <td class=\"p-3 text-amber-400\">O(n)<\/td>\n                                <td class=\"p-3 text-emerald-400\">Sim<\/td>\n                            <\/tr>\n                            <tr>\n                                <td class=\"p-3\">Quick Sort<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(n log n)<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(n log n)<\/td>\n                                <td class=\"p-3 text-rose-400\">O(n²)<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(log n)<\/td>\n                                <td class=\"p-3 text-rose-400\">Não<\/td>\n                            <\/tr>\n                            <tr>\n                                <td class=\"p-3\">Bubble Sort<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(n)<\/td>\n                                <td class=\"p-3 text-rose-400\">O(n²)<\/td>\n                                <td class=\"p-3 text-rose-400\">O(n²)<\/td>\n                                <td class=\"p-3 text-emerald-400\">O(1)<\/td>\n                                <td class=\"p-3 text-emerald-400\">Sim<\/td>\n                            <\/tr>\n                        <\/tbody>\n                    <\/table>\n                <\/div>\n\n            <\/div>\n\n        <\/section>\n\n    <\/main>\n\n    <\u0021-- Modal Custom Array Input -->\n    <div id=\"modal-custom-input\" class=\"fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden\">\n        <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4\">\n            <h3 class=\"text-base font-bold text-white flex items-center gap-2\">\n                <i class=\"fa-solid fa-list-ol text-indigo-400\"><\/i> Definir Vetor Personalizado\n            <\/h3>\n            <p class=\"text-xs text-slate-400\">\n                Digite de 4 a 20 números separados por vírgula (ex: <code class=\"text-indigo-300 font-mono\">42, 15, 88, 7, 23, 61<\/code>).\n            <\/p>\n            <input type=\"text\" id=\"custom-array-input\" placeholder=\"Ex: 25, 10, 80, 45, 5, 60\" class=\"w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-indigo-500\">\n            <div id=\"modal-error\" class=\"text-xs text-rose-400 hidden\">\n                Insira valores válidos (números entre 1 e 100).\n            <\/div>\n            <div class=\"flex justify-end gap-2 pt-2\">\n                <button onclick=\"closeCustomInputModal()\" class=\"px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition\">\n                    Cancelar\n                <\/button>\n                <button onclick=\"applyCustomArray()\" class=\"px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition\">\n                    Aplicar Vetor\n                <\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n        // State variables\n        let array = [];\n        let steps = [];\n        let currentStepIndex = 0;\n        let isPlaying = false;\n        let playInterval = null;\n        let animationSpeed = 400;\n        let soundEnabled = false;\n        let audioCtx = null;\n\n        // Statistics counters\n        let stats = {\n            comparisons: 0,\n            writes: 0,\n            splits: 0\n        };\n\n        // DOM elements cache\n        const barsContainer = document.getElementById('bars-container');\n        const auxBarsContainer = document.getElementById('aux-bars-container');\n        const stepPhase = document.getElementById('step-phase');\n        const stepDescription = document.getElementById('step-description');\n        const stepCounter = document.getElementById('step-counter');\n        const currentDepthEl = document.getElementById('current-depth');\n        const callStackContainer = document.getElementById('call-stack-container');\n\n        function playTone(val) {\n            if (!soundEnabled) return;\n            try {\n                if (!audioCtx) {\n                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n                }\n                if (audioCtx.state === 'suspended') {\n                    audioCtx.resume();\n                }\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                // Map values 5..100 to frequencies 150Hz..700Hz\n                const freq = 150 + (val * 5.5);\n                osc.type = 'sine';\n                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);\n                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);\n                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);\n                \n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                osc.start();\n                osc.stop(audioCtx.currentTime + 0.12);\n            } catch (e) {\n
