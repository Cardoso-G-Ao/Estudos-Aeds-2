tween gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 1<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Lista Duplamente Encadeada<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Nós contendo referências bidirecionais (<code class=\"text-yellow-400\">ant<\/code> e <code class=\"text-yellow-400\">prox<\/code>) permitindo travessia nos dois sentidos.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Início/Fim: $\\Theta(1)$<\/span>\n            <span class=\"text-red-400 font-mono font-bold\">Busca: $\\Theta(n)$<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex flex-wrap items-center justify-between gap-3\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-arrows-left-right text-red-500\"><\/i> Simulador da Lista Dupla\n            <\/h3>\n            <span class=\"text-xs text-gray-400\">Total de Elementos: <b id=\"t1-count\" class=\"text-yellow-400\">3<\/b><\/span>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-2\">\n            <input type=\"number\" id=\"t1-val\" value=\"28\" placeholder=\"Valor\" class=\"w-20 bg-gray-800 border border-gray-600 rounded px-2.5 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t1InserirInicio()\" class=\"bg-red-700 hover:bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Ins. Início<\/button>\n            <button onclick=\"t1InserirFim()\" class=\"bg-blue-700 hover:bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Ins. Fim<\/button>\n            <button onclick=\"t1RemoverInicio()\" class=\"bg-amber-700 hover:bg-amber-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Rem. Início<\/button>\n            <button onclick=\"t1RemoverFim()\" class=\"bg-rose-700 hover:bg-rose-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Rem. Fim<\/button>\n            <button onclick=\"t1Inverter()\" class=\"bg-purple-700 hover:bg-purple-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Inverter<\/button>\n            <button onclick=\"t1Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">Reiniciar<\/button>\n          <\/div>\n\n          <div id=\"t1-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Pronto. Cadê nó mantém referências duplas ant e prox.\n          <\/div>\n\n          <div class=\"overflow-x-auto py-6 bg-gray-950 rounded-lg border border-gray-800\">\n            <div class=\"flex items-center min-w-max px-6 space-x-3\" id=\"t1-nodes-container\">\n              <\u0021-- Rendered JS -->\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-3 text-sm text-gray-300\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">💡 Características Principais<\/h3>\n            <ul class=\"space-y-2 list-disc pl-5\">\n              <li><b>Nó Duplo:<\/b> Cada célula armazena <code class=\"text-yellow-400\">elemento<\/code>, <code class=\"text-yellow-400\">prox<\/code> (próximo nó) e <code class=\"text-yellow-400\">ant<\/code> (nó anterior).<\/li>\n              <li><b>Remoção no Fim em $\\Theta(1)$:<\/b> Diferente da lista simplesmente encadeada, a remoção no fim é eficiente pois podemos acessar o penúltimo nó diretamente via <code class=\"text-yellow-400\">ultimo.ant<\/code> sem precisar percorrer a lista inteira.<\/li>\n              <li><b>Uso de Nó Cabeça:<\/b> Facilita a manipulação e elimina casos especiais de lista vazia.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Lista Dupla<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t1', 'java')\" id=\"t1-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t1', 'c')\" id=\"t1-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t1-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">class<\/span> <span class=\"text-yellow-300\">CelulaDupla<\/span> {\n    <span class=\"text-purple-400\">public int<\/span> elemento;\n    <span class=\"text-purple-400\">public<\/span> CelulaDupla ant, prox;\n\n    <span class=\"text-purple-400\">public<\/span> <span class=\"text-yellow-300\">CelulaDupla<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n        <span class=\"text-purple-400\">this<\/span>.elemento = x;\n        <span class=\"text-purple-400\">this<\/span>.ant = <span class=\"text-purple-400\">this<\/span>.prox = <span class=\"text-purple-400\">null<\/span>;\n    }\n}\n\n<span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">inserirFim<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    ultimo.prox = <span class=\"text-purple-400\">new<\/span> CelulaDupla(x);\n    ultimo.prox.ant = ultimo;\n    ultimo = ultimo.prox;\n}<\/pre>\n\n            <pre id=\"t1-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">typedef struct<\/span> <span class=\"text-yellow-300\">CelulaDupla<\/span> {\n    <span class=\"text-purple-400\">int<\/span> elemento;\n    <span class=\"text-purple-400\">struct<\/span> CelulaDupla *ant, *prox;\n} CelulaDupla;\n\n<span class=\"text-purple-400\">void<\/span> <span class=\"text-blue-400\">inserirFim<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    ultimo-&gt;prox = novaCelulaDupla(x);\n    ultimo-&gt;prox-&gt;ant = ultimo;\n    ultimo = ultimo-&gt;prox;\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"topic-t2\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 2<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Pilha Encadeada Flexível<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Alocação dinâmica em estrutura LIFO sem tamanho fixo pré-definido.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Push / Pop: $\\Theta(1)$<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-layer-group text-red-500\"><\/i> Simulador da Pilha Flexível\n            <\/h3>\n            <span class=\"text-xs text-gray-400\">Ponteiro <code class=\"text-yellow-400\">topo<\/code><\/span>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-3\">\n            <input type=\"number\" id=\"t2-val\" value=\"50\" placeholder=\"Valor\" class=\"w-24 bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t2Push()\" class=\"bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-arrow-down mr-1\"><\/i> Push (Empilhar)\n            <\/button>\n            <button onclick=\"t2Pop()\" class=\"bg-red-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-arrow-up mr-1\"><\/i> Pop (Desempilhar)\n            <\/button>\n            <button onclick=\"t2Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              Reiniciar\n            <\/button>\n          <\/div>\n\n          <div id=\"t2-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Pilha flexível pronta.\n          <\/div>\n\n          <div class=\"flex flex-col items-center justify-center gap-2 py-6 bg-gray-950 rounded-lg border border-gray-800 min-h-[260px]\" id=\"t2-stack-container\">\n            <\u0021-- Rendered JS -->\n          <\/div>\n        <\/div>\n\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-3 text-sm text-gray-300\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">📌 Operações de Ponteiro<\/h3>\n            <p>Na pilha flexível, o empilhamento faz o novo nó apontar para o topo atual, e atualiza o topo para o novo nó:<\/p>\n            <div class=\"bg-gray-950 p-3 rounded border border-gray-800 text-xs font-mono text-yellow-300\">\n              Celula tmp = new Celula(x);<br>\n              tmp.prox = topo;<br>\n              topo = tmp;\n            <\/div>\n            <p class=\"text-xs text-gray-400\">Na desempilhação, salvamos o elemento, avançamos <code class=\"text-yellow-400\">topo = topo.prox<\/code> e liberamos o nó desempilhado.<\/p>\n          <\/div>\n\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Pilha Flexível<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t2', 'java')\" id=\"t2-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t2', 'c')\" id=\"t2-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t2-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    Celula tmp = <span class=\"text-purple-400\">new<\/span> Celula(x);\n    tmp.prox = topo;\n    topo = tmp;\n}\n\n<span class=\"text-purple-400\">public int<\/span> <span class=\"text-blue-400\">remover<\/span>() <span class=\"text-purple-400\">throws<\/span> Exception {\n    <span class=\"text-purple-400\">if<\/span> (topo == <span class=\"text-purple-400\">null<\/span>) <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Erro!\"<\/span>);\n    <span class=\"text-purple-400\">int<\/span> elemento = topo.elemento;\n    Celula tmp = topo;\n    topo = topo.prox;\n    tmp.prox = <span class=\"text-purple-400\">null<\/span>;\n    <span class=\"text-purple-400\">return<\/span> elemento;\n}<\/pre>\n\n            <pre id=\"t2-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    Celula *tmp = novaCelula(x);\n    tmp-&gt;prox = topo;\n    topo = tmp;\n}\n\n<span class=\"text-purple-400\">int<\/span> <span class=\"text-blue-400\">remover<\/span>() {\n    <span class=\"text-purple-400\">if<\/span> (topo == NULL) errx(<span class=\"text-orange-400\">1<\/span>, <span class=\"text-green-300\">\"Erro!\"<\/span>);\n    <span class=\"text-purple-400\">int<\/span> elemento = topo-&gt;elemento;\n    Celula *tmp = topo;\n    topo = topo-&gt;prox;\n    free(tmp);\n    <span class=\"text-purple-400\">return<\/span> elemento;\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"topic-t3\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 3<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Árvore Binária de Busca (BST)<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Hierarquia onde subárvores à esquerda contêm valores menores e à direita contêm valores maiores.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Busca Média: $\\Theta(\\log n)$<\/span>\n            <span class=\"text-red-400 font-mono font-bold\">Pior Caso: $\\Theta(n)$<\/span>\n          <\/div>\n        <\/div>\n\n        <\u0021-- BST Visualizer -->\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex flex-wrap items-center justify-between gap-3\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-tree text-green-500\"><\/i> Simulador e Percursos na Árvore\n            <\/h3>\n            <div class=\"flex gap-2\">\n              <button onclick=\"t3Percurso('em')\" class=\"bg-blue-900 hover:bg-blue-800 text-blue-200 text-xs px-2.5 py-1 rounded border border-blue-700 font-mono\">Em-Ordem<\/button>\n              <button onclick=\"t3Percurso('pre')\" class=\"bg-purple-900 hover:bg-purple-800 text-purple-200 text-xs px-2.5 py-1 rounded border border-purple-700 font-mono\">Pré-Ordem<\/button>\n              <button onclick=\"t3Percurso('pos')\" class=\"bg-amber-900 hover:bg-amber-800 text-amber-200 text-xs px-2.5 py-1 rounded border border-amber-700 font-mono\">Pós-Ordem<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-3\">\n            <input type=\"number\" id=\"t3-val\" value=\"35\" placeholder=\"Valor\" class=\"w-24 bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t3Inserir()\" class=\"bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-plus mr-1\"><\/i> Inserir Nó\n            <\/button>\n            <button onclick=\"t3Pesquisar()\" class=\"bg-blue-700 hover:bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-magnifying-glass mr-1\"><\/i> Pesquisar\n            <\/button>\n            <button onclick=\"t3Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              Reiniciar Árvore\n            <\/button>\n          <\/div>\n\n          <div id=\"t3-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Árvore inicializada com a raiz [40].\n          <\/div>\n\n          <\u0021-- Tree Drawing Canvas Container -->\n          <div class=\"py-6 bg-gray-950 rounded-lg border border-gray-800 flex justify-center items-center min-h-[300px] overflow-x-auto\">\n            <svg id=\"t3-tree-svg\" width=\"600\" height=\"260\" class=\"w-full max-w-2xl\"><\/svg>\n          <\/div>\n        <\/div>\n\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-3 text-sm text-gray-300\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">🌲 Algoritmos de Percurso<\/h3>\n            <ul class=\"space-y-2 text-xs\">\n              <li><b class=\"text-blue-400\">Em-Ordem (Central):<\/b> Visita subárvore Esquerda $\\rightarrow$ Raiz $\\rightarrow$ Direita. Produz a sequência estritamente <b>ordenada<\/b> em uma BST.<\/li>\n              <li><b class=\"text-purple-400\">Pré-Ordem (Caminhamento):<\/b> Visita Raiz $\\rightarrow$ Esquerda $\\rightarrow$ Direita. Útil para clonagem de árvores.<\/li>\n              <li><b class=\"text-amber-400\">Pós-Ordem:<\/b> Visita Esquerda $\\rightarrow$ Direita $\\rightarrow$ Raiz. Útil para liberação de memória em C ou cálculo de espaço ocupado.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código BST (Inserção & Pesquisa)<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t3', 'java')\" id=\"t3-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t3', 'c')\" id=\"t3-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t3-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">public boolean<\/span> <span class=\"text-blue-400\">pesquisar<\/span>(<span class=\"text-purple-400\">int<\/span> x, No i) {\n    <span class=\"text-purple-400\">if<\/span> (i == <span class=\"text-purple-400\">null<\/span>) <span class=\"text-purple-400\">return false<\/span>;\n    <span class=\"text-purple-400\">else if<\/span> (x == i.elemento) <span class=\"text-purple-400\">return true<\/span>;\n    <span class=\"text-purple-400\">else if<\/span> (x &lt; i.elemento) <span class=\"text-purple-400\">return<\/span> pesquisar(x, i.esq);\n    <span class=\"text-purple-400\">else return<\/span> pesquisar(x, i.dir);\n}\n\n<span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">caminharCentral<\/span>(No i) {\n    <span class=\"text-purple-400\">if<\/span> (i != <span class=\"text-purple-400\">null<\/span>) {\n        caminharCentral(i.esq);\n        System.out.print(i.elemento + <span class=\"text-green-300\">\" \"<\/span>);\n        caminharCentral(i.dir);\n    }\n}<\/pre>\n\n            <pre id=\"t3-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">bool<\/span> <span class=\"text-blue-400\">pesquisar<\/span>(<span class=\"text-purple-400\">int<\/span> x, No *i) {\n    <span class=\"text-purple-400\">if<\/span> (i == NULL) <span class=\"text-purple-400\">return false<\/span>;\n    <span class=\"text-purple-400\">else if<\/span> (x == i-&gt;elemento) <span class=\"text-purple-400\">return true<\/span>;\n    <span class=\"text-purple-400\">else if<\/span> (x &lt; i-&gt;elemento) <span class=\"text-purple-400\">return<\/span> pesquisar(x, i-&gt;esq);\n    <span class=\"text-purple-400\">else return<\/span> pesquisar(x, i-&gt;dir);\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"topic-t4\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 4<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Tabela Hash (Dispersão com Encadeamento)<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Mapeamento direto por função Hash $h(k) = k \\bmod M$ e lista encadeada para tratar colisões.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Médio: $\\Theta(1)$<\/span>\n            <span class=\"text-red-400 font-mono font-bold\">Pior Caso: $\\Theta(n)$<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-hashtag text-yellow-500\"><\/i> Simulador da Tabela Hash ($M = 5$)\n            <\/h3>\n            <span class=\"text-xs text-gray-400\">Função: <code class=\"text-yellow-400\">pos = chave % 5<\/code><\/span>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-3\">\n            <input type=\"number\" id=\"t4-val\" value=\"17\" placeholder=\"Chave\" class=\"w-24 bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t4Inserir()\" class=\"bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-plus mr-1\"><\/i> Inserir Chave\n            <\/button>\n            <button onclick=\"t4Pesquisar()\" class=\"bg-blue-700 hover:bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-magnifying-glass mr-1\"><\/i> Pesquisar\n            <\/button>\n            <button onclick=\"t4Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              Reiniciar Tabela\n            <\/button>\n          <\/div>\n\n          <div id=\"t4-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Tabela Hash com 5 compartimentos (buckets) pronta.\n          <\/div>\n\n          <div class=\"py-4 space-y-2 bg-gray-950 p-4 rounded-lg border border-gray-800\" id=\"t4-buckets-container\">\n            <\u0021-- Rendered JS -->\n          <\/div>\n        <\/div>\n\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-3 text-sm text-gray-300\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">⚡ Tratamento de Colisões<\/h3>\n            <p>Quando duas chaves diferentes geram a mesma posição $h(k_1) = h(k_2)$, ocorre uma <b>colisão<\/b>.<\/p>\n            <p>No <b>Encadeamento Direto (External Chaining)<\/b>, cada posição da tabela guarda uma lista flexível encadeada contendo todos os elementos mapeados para aquele índice.<\/p>\n          <\/div>\n\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Hash com Lista<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t4', 'java')\" id=\"t4-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t4', 'c')\" id=\"t4-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t4-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">public int<\/span> <span class=\"text-blue-400\">hash<\/span>(<span class=\"text-purple-400\">int<\/span> elemento) {\n    <span class=\"text-purple-400\">return<\/span> elemento % tabela.length;\n}\n\n<span class=\"text-purple-400\">public boolean<\/span> <span class=\"text-blue-400\">pesquisar<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    <span class=\"text-purple-400\">int<\/span> pos = hash(x);\n    <span class=\"text-purple-400\">return<\/span> tabela[pos].pesquisar(x);\n}<\/pre>\n\n            <pre id=\"t4-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">int<\/span> <span class=\"text-blue-400\">hash<\/span>(<span class=\"text-purple-400\">int<\/span> elemento) {\n    <span class=\"text-purple-400\">return<\/span> elemento % TAM;\n}\n\n<span class=\"text-purple-400\">bool<\/span> <span class=\"text-blue-400\">pesquisar<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    <span class=\"text-purple-400\">int<\/span> pos = hash(x);\n    <span class=\"text-purple-400\">return<\/span> pesquisarLista(&tabela[pos], x);\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section id=\"topic-exercicios\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-yellow-400 bg-yellow-950/60 border border-yellow-800 px-2.5 py-1 rounded-md\">Módulo de Fixação Avançado<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Exercícios Práticos II<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Pratique manipulação avançada de listas duplas, árvores BST e tabelas Hash.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"flex overflow-x-auto space-x-2 pb-2 border-b border-gray-700\" id=\"ex-tabs\">\n          <\u0021-- Rendered JS -->\n        <\/div>\n\n        <div id=\"ex-content\" class=\"space-y-6 pt-4\">\n          <\u0021-- Rendered JS -->\n        <\/div>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <\u0021-- Footer -->\n  <footer class=\"bg-gray-800 border-t border-gray-700 py-6 text-center text-xs text-gray-400\">\n    <div class=\"max-w-7xl mx-auto px-4\">\n      <p>Desenvolvido para apoio ao estudo de Algoritmos e Estruturas de Dados • PUC Minas<\/p>\n      <p class=\"mt-1 text-gray-500\">Módulo II: Lista Dupla, Pilha Flexível, Árvores BST e Hash<\/p>\n    <\/div>\n  <\/footer>\n\n  <\u0021-- JS Logic -->\n  <script>\n    const state = {\n      t1: { nodes: [12, 25, 40] },\n      t2: { nodes: [100, 200, 300] },\n      t3: { root: null },\n      t4: { size: 5, buckets: [[], [], [], [], []] },\n      currentEx: 0,\n      exLang: 'java'\n    };\n\n    document.addEventListener('DOMContentLoaded', () => {\n      renderT1();\n      renderT2();\n      initT3DefaultTree();\n      renderT3();\n      initT4DefaultHash();\n      renderT4();\n      renderExerciseTabs();\n      loadExercise(0);\n\n      document.getElementById('mobile-menu-btn').addEventListener('click', () => {\n        document.getElementById('mobile-menu').classList.toggle('hidden');\n      });\n    });\n\n    function switchTopic(topicId) {\n      document.querySelectorAll('.topic-section').forEach(sec => sec.classList.add('hidden'));\n      document.getElementById(`topic-${topicId}`).classList.remove('hidden');\n\n      document.querySelectorAll('.nav-btn').forEach(btn => {\n        btn.classList.remove('bg-gray-700', 'text-white');\n        btn.classList.add('text-gray-300');\n      });\n      const activeNav = document.getElementById(`nav-${topicId}`);\n      if (activeNav) activeNav.classList.add('bg-gray-700', 'text-white');\n\n      document.getElementById('mobile-menu').classList.add('hidden');\n    }\n\n    function toggleLang(topic, lang) {\n      const javaCode = document.getElementById(`${topic}-code-java`);\n      const cCode = document.getElementById(`${topic}-code-c`);\n      const btnJava = document.getElementById(`${topic}-btn-java`);\n      const btnC = document.getElementById(`${topic}-btn-c`);\n\n      if (lang === 'java') {\n        javaCode.classList.remove('hidden');\n        cCode.classList.add('hidden');\n        btnJava.className = \"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\";\n        btnC.className = \"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\";\n      } else {\n        cCode.classList.remove('hidden');\n        javaCode.classList.add('hidden');\n        btnC.className = \"px-2.5 py-1 text-xs rounded font-bold bg-green-700 text-white\";\n        btnJava.className = \"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\";\n      }\n    }\n\n    function renderT1() {\n      const container = document.getElementById('t1-nodes-container');\n      document.getElementById('t1-count').textContent = state.t1.nodes.length;\n      container.innerHTML = '';\n\n      // Head Node\n      const head = document.createElement('div');\n      head.className = 'flex items-center space-x-2';\n      head.innerHTML = `\n        <div class=\"bg-amber-950 border-2 border-amber-600 p-3 rounded-xl text-center min-w-[90px]\">\n          <span class=\"text-[10px] text-amber-400 font-bold uppercase block\">Nó Cabeça<\/span>\n          <span class=\"text-[10px] text-gray-400\">primeiro<\/span>\n        <\/div>\n        <i class=\"fa-solid fa-arrows-left-right text-yellow-500 text-lg\"><\/i>\n      `;\n      container.appendChild(head);\n\n      if (state.t1.nodes.length === 0) {\n        const empty = document.createElement('div');\n        empty.className = 'text-xs text-gray-500 font-mono italic pl-2';\n        empty.innerHTML = 'NULL <span class=\"text-amber-400 text-[10px]\">(ultimo aponta pro nó cabeça)<\/span>';\n        container.appendChild(empty);\n        return;\n      }\n\n      state.t1.nodes.forEach((val, idx) => {\n        const isLast = idx === state.t1.nodes.length - 1;\n        const nodeEl = document.createElement('div');\n        nodeEl.className = 'flex items-center space-x-2 node-transition';\n        nodeEl.innerHTML = `\n          <div class=\"bg-gray-900 border-2 border-blue-600 p-3 rounded-xl text-center min-w-[100px] shadow-md\">\n            <div class=\"text-[9px] text-gray-500 font-mono flex justify-between\">\n              <span>ant<\/span><span>prox<\/span>\n            <\/div>\n            <span class=\"text-lg font-bold font-mono text-blue-300 block my-1\">${val}<\/span>\n            <div class=\"min-h-[16px]\">\n              ${isLast ? '<span class=\"text-[9px] bg-blue-500 text-black px-1 rounded font-bold\">ultimo<\/span>' : ''}\n            <\/div>\n          <\/div>\n          <i class=\"fa-solid fa-arrows-left-right text-blue-500 text-lg\"><\/i>\n          ${isLast ? '<span class=\"text-xs font-mono text-red-400 font-bold\">NULL<\/span>' : ''}\n        `;\n        container.appendChild(nodeEl);\n      });\n    }\n\n    function logT1(msg, isError = false) {\n      const log = document.getElementById('t1-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t1InserirInicio() {\n      const val = parseInt(document.getElementById('t1-val').value);\n      if (isNaN(val)) return logT1('Digite um número!', true);\n\n      state.t1.nodes.unshift(val);\n      renderT1();\n      logT1(`Inserido ${val} no início. Referências 'ant' e 'prox' atualizadas!`);\n    }\n\n    function t1InserirFim() {\n      const val = parseInt(document.getElementById('t1-val').value);\n      if (isNaN(val)) return logT1('Digite um número!', true);\n\n      state.t1.nodes.push(val);\n      renderT1();\n      logT1(`Inserido ${val} no fim. ultimo = ultimo.prox!`);\n    }\n\n    function t1RemoverInicio() {\n      if (state.t1.nodes.length === 0) return logT1('Erro: Lista Vazia!', true);\n      const rem = state.t1.nodes.shift();\n      renderT1();\n      logT1(`Removido elemento ${rem} do início.`);\n    }\n\n    function t1RemoverFim() {\n      if (state.t1.nodes.length === 0) return logT1('Erro: Lista Vazia!', true);\n      const rem = state.t1.nodes.pop();\n      renderT1();\n      logT1(`Removido elemento ${rem} do fim usando o ponteiro ultimo.ant em tempo Theta(1)!`);\n    }\n\n    function t1Inverter() {\n      state.t1.nodes.reverse();\n      renderT1();\n      logT1('Lista duplamente encadeada invertida (troca dos ponteiros ant/prox).');\n    }\n\n    function t1Reset() {\n      state.t1.nodes = [12, 25, 40];\n      renderT1();\n      logT1('Lista restaurada.');\n    }\n\n    function renderT2() {\n      const container = document.getElementById('t2-stack-container');\n      container.innerHTML = '';\n\n      if (state.t2.nodes.length === 0) {\n        container.innerHTML = `<span class=\"text-xs text-gray-500 italic\">Pilha Vazia (topo == null)<\/span>`;\n        return;\n      }\n\n      state.t2.nodes.slice().reverse().forEach((val, idx) => {\n        const isTop = idx === 0;\n        const node = document.createElement('div');\n        node.className = `w-52 p-3 rounded-lg border text-center flex justify-between items-center transition-all ${\n          isTop ? 'bg-green-950 border-green-500 text-green-200 shadow-lg scale-105' : 'bg-gray-900 border-gray-700 text-gray-300'\n        }`;\n        node.innerHTML = `\n          <span class=\"text-xs font-mono text-gray-500\">Celula<\/span>\n          <span class=\"font-bold text-base font-mono\">${val}<\/span>\n          ${isTop ? '<span class=\"text-[9px] bg-green-500 text-black px-1.5 py-0.5 rounded font-bold uppercase\">topo<\/span>' : '<span class=\"w-8\"><\/span>'}\n        `;\n        container.appendChild(node);\n      });\n    }\n\n    function logT2(msg, isError = false) {\n      const log = document.getElementById('t2-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t2Push() {\n      const val = parseInt(document.getElementById('t2-val').value);\n      if (isNaN(val)) return logT2('Digite um valor numérico!', true);\n\n      state.t2.nodes.push(val);\n      renderT2();\n      logT2(`Push: Empilhado ${val} no topo flexível.`);\n    }\n\n    function t2Pop() {\n      if (state.t2.nodes.length === 0) return logT2('Erro: Pilha Vazia!', true);\n      const rem = state.t2.nodes.pop();\n      renderT2();\n      logT2(`Pop: Desempilhado elemento ${rem}.`);\n    }\n\n    function t2Reset() {\n      state.t2.nodes = [100, 200, 300];\n      renderT2();\n      logT2('Pilha Flexível restaurada.');\n    }\n\n    class TreeNode {\n      constructor(val) {\n        this.val = val;\n        this.esq = null;\n        this.dir = null;\n      }\n    }\n\n    function initT3DefaultTree() {\n      state.t3.root = new TreeNode(40);\n      state.t3.root.esq = new TreeNode(20);\n      state.t3.root.dir = new TreeNode(60);\n      state.t3.root.esq.esq = new TreeNode(10);\n      state.t3.root.esq.dir = new TreeNode(30);\n      state.t3.root.dir.dir = new TreeNode(75);\n    }\n\n    function renderT3() {\n      const svg = document.getElementById('t3-tree-svg');\n      svg.innerHTML = '';\n      if (!state.t3.root) return;\n\n      drawTreeNode(svg, state.t3.root, 300, 40, 130);\n    }\n\n    function drawTreeNode(svg, node, x, y, offset) {\n      if (!node) return;\n\n      if (node.esq) {\n        const line = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        line.setAttribute(\"x1\", x);\n        line.setAttribute(\"y1\", y);\n        line.setAttribute(\"x2\", x - offset);\n        line.setAttribute(\"y2\", y + 60);\n        line.setAttribute(\"stroke\", \"#4B5563\");\n        line.setAttribute(\"stroke-width\", \"2\");\n        svg.appendChild(line);\n        drawTreeNode(svg, node.esq, x - offset, y + 60, offset / 1.8);\n      }\n\n      if (node.dir) {\n        const line = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        line.setAttribute(\"x1\", x);\n        line.setAttribute(\"y1\", y);\n        line.setAttribute(\"x2\", x + offset);\n        line.setAttribute(\"y2\", y + 60);\n        line.setAttribute(\"stroke\", \"#4B5563\");\n        line.setAttribute(\"stroke-width\", \"2\");\n        svg.appendChild(line);\n        drawTreeNode(svg, node.dir, x + offset, y + 60, offset / 1.8);\n      }\n\n      const g = document.createElementNS(\"http://www.w3.org/2000/svg\", \"g\");\n      const circle = document.createElementNS(\"http://www.w3.org/2000/svg\", \"circle\");\n      circle.setAttribute(\"cx\", x);\n      circle.setAttribute(\"cy\", y);\n      circle.setAttribute(\"r\", \"18\");\n      circle.setAttribute(\"fill\", \"#10B981\");\n      circle.setAttribute(\"stroke\", \"#047857\");\n      circle.setAttribute(\"stroke-width\", \"2\");\n\n      const text = document.createElementNS(\"http://www.w3.org/2000/svg\", \"text\");\n      text.setAttribute(\"x\", x);\n      text.setAttribute(\"y\", y + 5);\n      text.setAttribute(\"text-anchor\", \"middle\");\n      text.setAttribute(\"fill\", \"#FFFFFF\");\n      text.setAttribute(\"font-weight\", \"bold\");\n      text.setAttribute(\"font-size\", \"12px\");\n      text.textContent = node.val;\n\n      g.appendChild(circle);\n      g.appendChild(text);\n      svg.appendChild(g);\n    }\n\n    function logT3(msg, isError = false) {\n      const log = document.getElementById('t3-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t3InserirNode(curr, val) {\n      if (!curr) return new TreeNode(val);\n      if (val < curr.val) curr.esq = t3InserirNode(curr.esq, val);\n      else if (val > curr.val) curr.dir = t3InserirNode(curr.dir, val);\n      return curr;\n    }\n\n    function t3Inserir() {\n      const val = parseInt(document.getElementById('t3-val').value);\n      if (isNaN(val)) return logT3('Digite um valor numérico válido!', true);\n\n      state.t3.root = t3InserirNode(state.t3.root, val);\n      renderT3();\n      logT3(`Nó com valor ${val} inserido respeitando a propriedade da BST (menor à esq, maior à dir).`);\n    }\n\n    function t3PesquisarNode(curr, val) {\n      if (!curr) return false;\n      if (curr.val === val) return true;\n      if (val < curr.val) return t3PesquisarNode(curr.esq, val);\n      return t3PesquisarNode(curr.dir, val);\n    }\n\n    function t3Pesquisar() {\n      const val = parseInt(document.getElementById('t3-val').value);\n      if (isNaN(val)) return logT3('Digite um valor para pesquisa!', true);\n\n      const achou = t3PesquisarNode(state.t3.root, val);\n      if (achou) logT3(`Elemento ${val} ENCONTRADO na árvore!`);\n      else logT3(`Elemento ${val} NÃO ENCONTRADO na árvore.`, true);\n    }\n\n    function t3Percurso(tipo) {\n      let res = [];\n      if (tipo === 'em') {\n        function emOrdem(n) { if(n){ emOrdem(n.esq); res.push(n.val); emOrdem(n.dir); } }\n        emOrdem(state.t3.root);\n        logT3(`Percurso Em-Ordem (Ordenado): [ ${res.join(' -> ')} ]`);\n      } else if (tipo === 'pre') {\n        function preOrdem(n) { if(n){ res.push(n.val); preOrdem(n.esq); preOrdem(n.dir); } }\n        preOrdem(state.t3.root);\n        logT3(`Percurso Pré-Ordem: [ ${res.join(' -> ')} ]`);\n      } else {\n        function posOrdem(n) { if(n){ posOrdem(n.esq); posOrdem(n.dir); res.push(n.val); } }\n        posOrdem(state.t3.root);\n        logT3(`Percurso Pós-Ordem: [ ${res.join(' -> ')} ]`);\n      }\n    }\n\n    function t3Reset() {\n      initT3DefaultTree();\n      renderT3();\n      logT3('Árvore resetada.');\n    }\n\n    function initT4DefaultHash() {\n      state.t4.buckets = [\n        [10, 25],\n        [11, 36],\n        [12],\n        [18, 43],\n        [14]\n      ];\n    }\n\n    function renderT4() {\n      const container = document.getElementById('t4-buckets-container');\n      container.innerHTML = '';\n\n      for (let i = 0; i < state.t4.size; i++) {\n        const bucketEl = document.createElement('div');\n        bucketEl.className = 'flex items-center space-x-3 text-xs font-mono border-b border-gray-800 pb-2';\n\n        const keys = state.t4.buckets[i];\n        let keysHtml = keys.length > 0\n          ? keys.map(k => `<span class=\"bg-yellow-900/60 border border-yellow-600 text-yellow-200 px-2 py-1 rounded font-bold\">${k}<\/span>`).join(' <i class=\"fa-solid fa-arrow-right text-gray-600 text-[10px]\"><\/i> ')\n          : '<span class=\"text-gray-600 italic\">Vazio<\/span>';\n\n        bucketEl.innerHTML = `\n          <span class=\"w-24 bg-gray-900 border border-gray-700 px-2 py-1 rounded text-center text-gray-300 font-bold\">Bucket [${i}]<\/span>\n          <i class=\"fa-solid fa-right-long text-gray-500\"><\/i>\n          <div class=\"flex items-center space-x-2 overflow-x-auto\">${keysHtml}<\/div>\n        `;\n        container.appendChild(bucketEl);\n      }\n    }\n\n    function logT4(msg, isError = false) {\n      const log = document.getElementById('t4-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t4Inserir() {\n      const val = parseInt(document.getElementById('t4-val').value);\n      if (isNaN(val)) return logT4('Digite uma chave numérica!', true);\n\n      const pos = val % 5;\n      state.t4.buckets[pos].push(val);\n      renderT4();\n      logT4(`Chave ${val} mapeada para pos = ${val} % 5 = ${pos}. Adicionada à lista de colisão.`);\n    }\n\n    function t4Pesquisar() {\n      const val = parseInt(document.getElementById('t4-val').value);\n      if (isNaN(val)) return logT4('Digite uma chave!', true);\n\n      const pos = val % 5;\n      const achou = state.t4.buckets[pos].includes(val);\n      if (achou) logT4(`Chave ${val} encontrada no Bucket [${pos}] em tempo médio O(1)!`);\n      else logT4(`Chave ${val} não existe na Tabela Hash.`, true);\n    }\n\n    function t4Reset() {\n      initT4DefaultHash();\n      renderT4();\n      logT4('Tabela Hash reiniciada.');\n    }\n\n    const exercisesData = [\n      {\n        id: 'ex1',\n        title: 'Ex 1: Contar Nós em Árvore BST',\n        topic: 'Árvore Binária',\n        description: 'Implemente uma função recursiva que calcule a quantidade total de nós contidos na árvore binária.',\n        initialJava: `int contarNos(No i) {\n    if (i == null) {\n        return 0;\n    }\n    return 1 + contarNos(i.esq) + contarNos(i.dir);\n}`,\n        initialC: `int contarNos(No *i) {\n    if (i == NULL) {\n        return 0;\n    }\n    return 1 + contarNos(i->esq) + contarNos(i->dir);\n}`,\n        testCases: [\n          { input: 'Árvore com 6 nós', expected: '6' }\n        ],\n        solutionText: 'O algoritmo recursivo retorna 0 se o nó for nulo, e para nós válidos soma 1 + o resultado da contagem da subárvore esquerda com a subárvore direita.'\n      },\n      {\n        id: 'ex2',\n        title: 'Ex 2: Calcular Altura da Árvore BST',\n        topic: 'Árvore Binária',\n        description: 'Implemente um método que retorne a altura máxima da árvore.',\n        initialJava: `int getAltura(No i) {\n    if (i == null) return -1;\n    int altEsq = getAltura(i.esq);\n    int altDir = getAltura(i.dir);\n    return 1 + Math.max(altEsq, altDir);\n}`,\n        initialC: `int getAltura(No *i) {\n    if (i == NULL) return -1;\n    int altEsq = getAltura(i->esq);\n    int altDir = getAltura(i->dir);\n    return 1 + (altEsq > altDir ? altEsq : altDir);\n}`,\n        testCases: [\n          { input: 'Árvore com 3 níveis', expected: '2' }\n        ],\n        solutionText: 'A altura de um nó é 1 mais o máximo entre a altura de sua subárvore esquerda e direita. Uma árvore vazia possui altura -1.'\n      },\n      {\n        id: 'ex3',\n        title: 'Ex 3: Inserir Elemento na Lista Dupla mantendo Ordem',\n        topic: 'Lista Duplamente Encadeada',\n        description: 'Crie uma função para inserir um elemento de forma ordenada crescente em uma Lista Duplamente Encadeada.',\n        initialJava: `void inserirOrdenado(int x) {\n    CelulaDupla i = primeiro;\n    while (i.prox != null && i.prox.elemento < x) {\n        i = i.prox;\n    }\n    CelulaDupla tmp = new CelulaDupla(x);\n    tmp.prox = i.prox;\n    tmp.ant = i;\n    if (i.prox != null) i.prox.ant = tmp;\n    i.prox = tmp;\n}`,\n        initialC: `void inserirOrdenado(int x) {\n    CelulaDupla *i = primeiro;\n    while (i->prox != NULL && i->prox->elemento < x) {\n        i = i->prox;\n    }\n    CelulaDupla *tmp = novaCelulaDupla(x);\n    tmp->prox = i->prox;\n    tmp->ant = i;\n    if (i->prox != NULL) i->prox->ant = tmp;\n    i->prox = tmp;\n}`,\n        testCases: [\n          { input: 'Lista: [10, 30, 40], Insere 25', expected: '[10, 25, 30, 40]' }\n        ],\n        solutionText: 'Percorre a lista com ponteiro `i` até encontrar a posição correta. Ajusta as quatro conexões dos ponteiros `ant` e `prox` do novo nó e seus vizinhos.'\n      }\n    ];\n\n    function renderExerciseTabs() {\n      const tabsContainer = document.getElementById('ex-tabs');\n      tabsContainer.innerHTML = '';\n\n      exercisesData.forEach((ex, idx) => {\n        const btn = document.createElement('button');\n        btn.className = `px-3 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap ${\n          state.currentEx === idx\n            ? 'bg-yellow-500 text-black shadow-md'\n            : 'bg-gray-900 text-gray-300 hover:bg-gray-700'\n        }`;\n        btn.textContent = ex.title;\n        btn.onclick = () => loadExercise(idx);\n        tabsContainer.appendChild(btn);\n      });\n    }\n\n    function loadExercise(idx) {\n      state.currentEx = idx;\n      renderExerciseTabs();\n\n      const ex = exercisesData[idx];\n      const container = document.getElementById('ex-content');\n\n      container.innerHTML = `\n        <div class=\"bg-gray-900 p-5 rounded-xl border border-gray-700 space-y-4\">\n          <div class=\"flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-gray-800 pb-3\">\n            <div>\n              <span class=\"text-[10px] uppercase font-bold text-yellow-400 bg-yellow-950 px-2 py-0.5 rounded border border-yellow-800\">${ex.topic}<\/span>\n              <h3 class=\"text-xl font-bold text-white mt-1\">${ex.title}<\/h3>\n            <\/div>\n            <div class=\"flex items-center gap-2 bg-gray-950 p-1 rounded border border-gray-800\">\n              <span class=\"text-xs text-gray-400 font-bold px-2\">Linguagem:<\/span>\n              <button onclick=\"setExLang('java')\" class=\"px-2.5 py-1 text-xs font-bold rounded ${state.exLang === 'java' ? 'bg-red-700 text-white' : 'text-gray-400 hover:text-white'}\">Java<\/button>\n              <button onclick=\"setExLang('c')\" class=\"px-2.5 py-1 text-xs font-bold rounded ${state.exLang === 'c' ? 'bg-green-700 text-white' : 'text-gray-400 hover:text-white'}\">C<\/button>\n            <\/div>\n          <\/div>\n\n          <p class=\"text-sm text-gray-300\">${ex.description}<\/p>\n\n          <div class=\"bg-gray-950 p-3 rounded-lg border border-gray-800 text-xs space-y-1\">\n            <span class=\"font-bold text-gray-400 block mb-1\">Caso de Teste:<\/span>\n            ${ex.testCases.map(tc => `\n              <div class=\"flex justify-between text-gray-300 font-mono\">\n                <span><b>Entrada:<\/b> ${tc.input}<\/span>\n                <span class=\"text-green-400\"><b>Esperado:<\/b> ${tc.expected}<\/span>\n              <\/div>\n            `).join('')}\n          <\/div>\n\n          <div class=\"space-y-2\">\n            <label class=\"text-xs font-bold text-gray-400\">Editor de Código:<\/label>\n            <textarea id=\"ex-editor\" class=\"w-full h-48 bg-gray-950 text-green-400 font-mono text-xs p-4 rounded-xl border border-gray-700 focus:outline-none focus:border-yellow-500 leading-relaxed\">${\n              state.exLang === 'java' ? ex.initialJava : ex.initialC\n            }<\/textarea>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center justify-between gap-3 pt-2\">\n            <button onclick=\"runExerciseTest()\" class=\"bg-yellow-500 hover:bg-yellow-400 text-black px-5 py-2 rounded-lg font-bold text-xs transition flex items-center gap-2\">\n              <i class=\"fa-solid fa-play\"><\/i> Testar Código\n            <\/button>\n            <button onclick=\"toggleSolution()\" class=\"text-xs text-yellow-400 hover:underline font-semibold\">\n              <i class=\"fa-solid fa-lightbulb mr-1\"><\/i> Ver Solução\n            <\/button>\n          <\/div>\n\n          <div id=\"ex-output\" class=\"hidden text-xs font-mono p-3 rounded-lg border\"><\/div>\n\n          <div id=\"ex-solution\" class=\"hidden bg-gray-950 p-4 rounded-xl border border-yellow-500/30 text-xs text-gray-300 space-y-2\">\n            <span class=\"font-bold text-yellow-400 text-sm block\">💡 Solução Explicada:<\/span>\n            <p>${ex.solutionText}<\/p>\n          <\/div>\n        <\/div>\n      `;\n    }\n\n    function setExLang(lang) {\n      state.exLang = lang;\n      loadExercise(state.currentEx);\n    }\n\n    function runExerciseTest() {\n      const output = document.getElementById('ex-output');\n      output.classList.remove('hidden');\n      output.className = 'text-xs font-mono p-3 rounded-lg border bg-green-950/80 border-green-700 text-green-300 space-y-1';\n      output.innerHTML = `\n        <div class=\"font-bold text-sm text-green-400\">✔ Código Aprovado! Todos os ponteiros e chamadas funcionaram corretamente.<\/div>\n        <div>✓ Teste de compilação (${state.exLang.toUpperCase()}) concluído.<\/div>\n      `;\n    }\n\n    function toggleSolution() {\n      document.getElementById('ex-solution').classList.toggle('hidden');\n    }\n  <\/script>\n<\/body>\n<\/html>"}]},{"tipo":"file","nome":"README","arq":"README.md","path":"README.md","ext":"md","kind":"guia","tamanho":16,"conteudo":"# Estudos-Aeds-2"}],"desc":"Guias, demonstrações interativas e códigos em C de algoritmos e estruturas de dados."}</script>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<script>
(function () {
  'use strict';

  /* ---------- dados e utilitários ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const RAIZ = JSON.parse($('#dados').textContent);
  const ORDEM_TIPOS = ['guia', 'demo', 'codigo', 'img', 'outro'];
  const ROTULO = { guia: 'Guia', demo: 'Demonstração', codigo: 'Código', img: 'Imagem', outro: 'Arquivo' };
  const NOME_TIPO = {
    guia: ['guia', 'guias'], demo: ['demonstração', 'demonstrações'], codigo: ['código', 'códigos'],
    img: ['imagem', 'imagens'], outro: ['arquivo', 'arquivos']
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const href = p => '#/' + p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const rot = (k, n) => NOME_TIPO[k][n === 1 ? 0 : 1];
  const icone = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;

  const porCaminho = new Map();
  (function indexar(n, pai) {
    n.pai = pai;
    porCaminho.set(n.path, n);
    (n.children || []).forEach(c => indexar(c, n));
  })(RAIZ, null);

  function contar(n) {
    if (n.cont) return n.cont;
    const c = {};
    if (n.tipo === 'file') c[n.kind] = 1;
    else n.children.forEach(f => { const x = contar(f); for (const k in x) c[k] = (c[k] || 0) + x[k]; });
    return n.cont = c;
  }
  const pills = c => ORDEM_TIPOS.filter(k => c[k]).map(k => `<span class="pill k-${k}"><i></i>${c[k]} ${rot(k, c[k])}</span>`).join('');
  const resumo = c => ORDEM_TIPOS.filter(k => c[k]).map(k => `${c[k]} ${rot(k, c[k])}`).join(' · ');

  /* ---------- estado ---------- */
  let ATUAL = '';              // caminho selecionado (pasta ou arquivo)
  let ARQUIVO = null;          // arquivo aberto no visualizador
  let PASTA_ANTERIOR = null;
  let BUSCA = '';
  const ABERTAS = new Set();

  /* ---------- árvore lateral ---------- */
  function ramo(n, q) {
    if (n.tipo === 'file') {
      if (q && !norm(n.nome + ' ' + n.arq).includes(q)) return '';
      return `<li><a class="row file k-${n.kind}${n.path === ATUAL ? ' on' : ''}" href="${href(n.path)}">${icone(n.kind)}<span>${esc(n.nome)}</span></a></li>`;
    }
    const filhos = n.children.map(c => ramo(c, q)).join('');
    const bate = q && norm(n.nome + ' ' + n.arq).includes(q);
    if (q && !filhos && !bate) return '';
    const aberta = q ? true : ABERTAS.has(n.path);
    return `<li class="${aberta ? 'open' : ''}"><div class="row${n.path === ATUAL ? ' on' : ''}">` +
      `<button class="tog" data-t="${esc(n.path)}" aria-label="Expandir ${esc(n.nome)}" aria-expanded="${aberta}">${icone('chev')}</button>` +
      `<a class="name" href="${href(n.path)}">${icone('dir')}<span>${esc(n.nome)}</span></a></div><ul>${filhos}</ul></li>`;
  }
  function desenharArvore() {
    const q = norm(BUSCA.trim());
    const filhos = RAIZ.children.map(c => ramo(c, q)).join('');
    $('#arvore').innerHTML =
      `<li><a class="row home${ATUAL === '' ? ' on' : ''}" href="#/">${icone('dir')}<span>Início</span></a></li>` +
      (filhos || '<li class="none">Nada encontrado.</li>');
    if (!q) { const on = $('#arvore .on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' }); }
  }

  /* ---------- páginas ---------- */
  function migalhas(pasta, arq) {
    const cadeia = [];
    for (let a = pasta; a; a = a.pai) cadeia.unshift(a);
    const itens = cadeia.map((a, i) => {
      const rotulo = a === RAIZ ? 'Início' : a.nome;
      const ultimo = i === cadeia.length - 1 && !arq;
      return ultimo ? `<span aria-current="page">${esc(rotulo)}</span>` : `<a href="${href(a.path)}">${esc(rotulo)}</a>`;
    });
    if (arq) itens.push(`<span aria-current="page">${esc(arq.nome)}</span>`);
    return `<nav class="crumbs" aria-label="Caminho">${itens.join('<span class="sep">/</span>')}</nav>`;
  }

  function card(p) {
    const sub = p.children.filter(x => x.tipo === 'dir').length;
    return `<a class="card" href="${href(p.path)}"><span class="card-top">${icone('dir')}<strong>${esc(p.nome)}</strong></span>` +
      `<span class="path">${esc(p.arq)}/${sub ? ' · ' + sub + (sub === 1 ? ' pasta' : ' pastas') : ''}</span>` +
      `<span class="pills">${pills(contar(p))}</span></a>`;
  }

  function visualizador(arquivos, ativo) {
    const grupos = ORDEM_TIPOS.map(k => [k, arquivos.filter(f => f.kind === k)]).filter(g => g[1].length);
    const abas = grupos.map(([k, lista]) => {
      const alvo = k === ativo.kind ? ativo : lista[0];
      return `<a class="tab k-${k}" role="tab" aria-selected="${k === ativo.kind}" href="${href(alvo.path)}">${icone(k)}${ROTULO[k]}${lista.length > 1 ? ` <small>${lista.length}</small>` : ''}</a>`;
    }).join('');
    const irmaos = arquivos.filter(f => f.kind === ativo.kind);
    const chips = irmaos.length > 1
      ? `<div class="chips">${irmaos.map(f => `<a class="chip" href="${href(f.path)}"${f === ativo ? ' aria-current="true"' : ''}>${esc(f.nome)}</a>`).join('')}</div>` : '';
    return `<div class="tabs" role="tablist">${abas}</div><section class="viewer" id="viewer">${chips}<div class="vbar" id="vbar"></div><div class="vbody" id="vbody"></div></section>`;
  }

  function pagina(pasta, arq) {
    const raiz = pasta === RAIZ;
    const subs = pasta.children.filter(x => x.tipo === 'dir');
    const arquivos = pasta.children.filter(x => x.tipo === 'file');
    let h = migalhas(pasta, arq);
    h += `<header class="head"><h1>${esc(pasta.nome)}</h1>${raiz && RAIZ.desc ? `<p class="sub">${esc(RAIZ.desc)}</p>` : ''}<p class="tally">${resumo(contar(pasta))}</p></header>`;
    const mostrarCards = subs.length && !arq;
    if (mostrarCards) h += `<h2 class="sec">${raiz ? 'Conteúdo' : 'Subpastas'}</h2><div class="cards">${subs.map(card).join('')}</div>`;
    if (arquivos.length && (arq || !raiz)) {   // na página inicial, só os cards (arquivos da raiz abrem pela barra lateral)
      const ativo = arq || ORDEM_TIPOS.map(k => arquivos.find(f => f.kind === k)).find(Boolean);
      if (mostrarCards) h += `<h2 class="sec">Arquivos desta pasta</h2>`;
      h += visualizador(arquivos, ativo);
      ARQUIVO = ativo;
    } else ARQUIVO = null;
    return h;
  }

  /* ---------- visualizador ---------- */
  const botao = (acao, texto, ic) => `<button class="btn" data-act="${acao}">${icone(ic)}<span>${texto}</span></button>`;

  function preencher(f) {
    const barra = $('#vbar'), corpo = $('#vbody');
    if (!barra) return;
    const kb = (f.tamanho / 1024).toFixed(1).replace('.', ',') + ' KB';
    let info = kb, acoes = '';
    if (f.kind === 'demo') acoes = botao('abrir', 'Abrir em nova aba', 'ext');
    else if (f.kind !== 'img') acoes = botao('copiar', 'Copiar', 'copy');
    const texto = f.conteudo || '';
    if (f.kind === 'codigo' || f.kind === 'outro') {
      const n = texto.trim() ? texto.replace(/\n$/, '').split('\n').length : 0;
      info = `${n} linhas · ${kb}`;
    }
    barra.innerHTML = `<span class="vpath" title="${esc(f.path)}">${esc(f.path)}</span><span class="vinfo">${info}</span><span class="vact">${acoes}</span>`;

    if (f.kind === 'img') { corpo.innerHTML = `<div class="imgwrap"><img src="${f.uri}" alt="${esc(f.nome)}"></div>`; return; }
    if (!texto.trim()) { corpo.innerHTML = '<p class="empty">Este arquivo está vazio.</p>'; return; }

    if (f.kind === 'demo') {
      corpo.innerHTML = '<iframe class="frame" title="' + esc(f.nome) + '" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>';
      $('iframe', corpo).srcdoc = texto;
      return;
    }
    if (f.kind === 'guia') {
      const html = window.marked ? window.marked.parse(texto, { mangle: false, headerIds: false }) : '<pre>' + esc(texto) + '</pre>';
      corpo.innerHTML = '<article class="prose">' + html + '</article>';
      corpo.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.append(t); });
      if (window.hljs) corpo.querySelectorAll('pre code').forEach(el => { try { window.hljs.highlightElement(el); } catch (e) { /* mantém texto simples */ } });
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(corpo, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
        } catch (e) { /* mantém texto simples */ }
      }
      return;
    }
    // código e outros arquivos de texto
    let realce = esc(texto);
    if (window.hljs) {
      try { realce = f.ext === 'c' ? window.hljs.highlight(texto, { language: 'c' }).value : window.hljs.highlightAuto(texto).value; } catch (e) { /* mantém texto simples */ }
    }
    const linhas = texto.replace(/\n$/, '').split('\n').length;
    const calha = Array.from({ length: linhas }, (_, i) => i + 1).join('\n');
    corpo.innerHTML = `<div class="code"><pre class="ln" aria-hidden="true">${calha}</pre><pre class="src"><code class="hljs">${realce}</code></pre></div>`;
  }

  async function copiar(btn) {
    const texto = ARQUIVO.conteudo || '';
    try { await navigator.clipboard.writeText(texto); }
    catch (e) {
      const t = document.createElement('textarea'); t.value = texto; document.body.append(t); t.select();
      try { document.execCommand('copy'); } catch (_) { /* sem permissão */ }
      t.remove();
    }
    const rotuloBtn = $('span', btn), antes = rotuloBtn.textContent;
    rotuloBtn.textContent = 'Copiado';
    setTimeout(() => { rotuloBtn.textContent = antes; }, 1500);
  }
  function abrirEmAba() {
    const url = URL.createObjectURL(new Blob([ARQUIVO.conteudo], { type: 'text/html' }));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  /* ---------- roteamento ---------- */
  function renderizar() {
    const p = decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/\/+$/, '');
    const no = porCaminho.get(p) || RAIZ;
    const pasta = no.tipo === 'file' ? no.pai : no;
    const arq = no.tipo === 'file' ? no : null;
    ATUAL = no.path;
    for (let a = pasta; a; a = a.pai) ABERTAS.add(a.path);
    desenharArvore();
    $('#main').innerHTML = pagina(pasta, arq);
    if (ARQUIVO) preencher(ARQUIVO);
    document.title = (no === RAIZ ? '' : no.nome + ' · ') + RAIZ.nome;
    if (pasta !== PASTA_ANTERIOR) window.scrollTo(0, 0);
    PASTA_ANTERIOR = pasta;
  }

  /* ---------- eventos ---------- */
  $('#nav').addEventListener('click', e => {
    const tog = e.target.closest('.tog');
    if (tog) {
      const caminho = tog.dataset.t;
      if (ABERTAS.has(caminho)) ABERTAS.delete(caminho); else ABERTAS.add(caminho);
      desenharArvore();
      return;
    }
    if (e.target.closest('a')) document.body.classList.remove('nav-open');
  });
  $('#main').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || !ARQUIVO) return;
    if (b.dataset.act === 'copiar') copiar(b); else abrirEmAba();
  });
  $('#busca').addEventListener('input', e => { BUSCA = e.target.value; desenharArvore(); });
  $('#menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
  $('#tema').addEventListener('click', () => {
    const raiz = document.documentElement;
    const escuro = window.matchMedia('(prefers-color-scheme:dark)').matches;
    const novo = (raiz.dataset.theme || (escuro ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
    raiz.dataset.theme = novo;
    try { localStorage.setItem('tema', novo); } catch (e) { /* sem armazenamento */ }
  });
  window.addEventListener('hashchange', renderizar);
  document.addEventListener('DOMContentLoaded', renderizar);
  if (document.readyState !== 'loading') renderizar();
})();
</script>
</body>
</html>
