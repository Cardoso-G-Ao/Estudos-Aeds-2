  console.error(e);\n            }\n        }\n\n        function toggleSound() {\n            soundEnabled = !soundEnabled;\n            const btn = document.getElementById('btn-sound');\n            const icon = document.getElementById('icon-sound');\n            if (soundEnabled) {\n                btn.classList.add('text-indigo-400', 'border', 'border-indigo-500/40');\n                icon.className = 'fa-solid fa-volume-high';\n                playTone(50);\n            } else {\n                btn.classList.remove('text-indigo-400', 'border', 'border-indigo-500/40');\n                icon.className = 'fa-solid fa-volume-xmark';\n            }\n        }\n\n        // Helper function to build steps history deterministically\n        function generateMergeSortSteps(arrInput) {\n            const arr = [...arrInput];\n            const history = [];\n            let callStack = [];\n\n            // Initial step\n            history.push({\n                type: 'INIT',\n                array: [...arr],\n                auxArray: [],\n                activeRange: [0, arr.length - 1],\n                activeLine: 1,\n                depth: 0,\n                stack: [],\n                phase: 'Início',\n                description: `Vetor inicial com ${arr.length} elementos carregado. Clique em Iniciar.`\n            });\n\n            function mergeSortRecursive(left, right, depth) {\n                const stackEntry = `mergeSort([${left}..${right}])`;\n                callStack.push(stackEntry);\n\n                // Step: Function call start\n                history.push({\n                    type: 'CALL',\n                    array: [...arr],\n                    auxArray: [],\n                    activeRange: [left, right],\n                    activeLine: 1,\n                    depth: depth,\n                    stack: [...callStack],\n                    phase: 'Recursão: Divisão',\n                    description: `Chamando mergeSort para o intervalo de índices [${left} até ${right}].`\n                });\n\n                if (left >= right) {\n                    history.push({\n                        type: 'BASE_CASE',\n                        array: [...arr],\n                        auxArray: [],\n                        activeRange: [left, right],\n                        activeLine: 2,\n                        depth: depth,\n                        stack: [...callStack],\n                        phase: 'Caso Base Alcançado',\n                        description: `Intervalo [${left}..${right}] contém apenas 1 elemento (valor: ${arr[left]}). Sub-vetor já está ordenado.`\n                    });\n                    callStack.pop();\n                    return;\n                }\n\n                const mid = Math.floor((left + right) / 2);\n\n                history.push({\n                    type: 'SPLIT',\n                    array: [...arr],\n                    auxArray: [],\n                    activeRange: [left, right],\n                    midIndex: mid,\n                    activeLine: 3,\n                    depth: depth,\n                    stack: [...callStack],\n                    phase: 'Calculando Meio',\n                    description: `Dividindo o intervalo [${left}..${right}] no meio (índice central: ${mid}). Sub-vetor esquerdo: [${left}..${mid}], direito: [${mid + 1}..${right}].`\n                });\n\n                // Left recursion\n                history.push({\n                    type: 'HIGHLIGHT_LINE',\n                    array: [...arr],\n                    auxArray: [],\n                    activeRange: [left, mid],\n                    activeLine: 5,\n                    depth: depth,\n                    stack: [...callStack],\n                    phase: 'Divisão Esquerda',\n                    description: `Executando recursivamente para a metade esquerda [${left}..${mid}].`\n                });\n                mergeSortRecursive(left, mid, depth + 1);\n\n                // Right recursion\n                history.push({\n                    type: 'HIGHLIGHT_LINE',\n                    array: [...arr],\n                    auxArray: [],\n                    activeRange: [mid + 1, right],\n                    activeLine: 6,\n                    depth: depth,\n                    stack: [...callStack],\n                    phase: 'Divisão Direita',\n                    description: `Executando recursivamente para a metade direita [${mid + 1}..${right}].`\n                });\n                mergeSortRecursive(mid + 1, right, depth + 1);\n\n                // Merge phase\n                history.push({\n                    type: 'START_MERGE',\n                    array: [...arr],\n                    auxArray: [],\n                    activeRange: [left, right],\n                    midIndex: mid,\n                    activeLine: 8,\n                    depth: depth,\n                    stack: [...callStack],\n                    phase: 'Preparando Intercalação',\n                    description: `Pronto para intercalar os sub-vetores ordenados [${left}..${mid}] e [${mid + 1}..${right}].`\n                });\n\n                // Perform actual merge\n                const leftCopy = arr.slice(left, mid + 1);\n                const rightCopy = arr.slice(mid + 1, right + 1);\n\n                let i = 0, j = 0, k = left;\n                const auxBuffer = [];\n\n                while (i < leftCopy.length && j < rightCopy.length) {\n                    const valL = leftCopy[i];\n                    const valR = rightCopy[j];\n\n                    history.push({\n                        type: 'COMPARE',\n                        array: [...arr],\n                        auxArray: [...auxBuffer],\n                        comparingIndices: [left + i, mid + 1 + j],\n                        activeRange: [left, right],\n                        activeLine: 8,\n                        depth: depth,\n                        stack: [...callStack],\n                        phase: 'Comparação',\n                        description: `Comparando o elemento da esquerda ${valL} (índice ${left + i}) com o da direita ${valR} (índice ${mid + 1 + j}).`\n                    });\n\n                    if (valL <= valR) {\n                        arr[k] = valL;\n                        auxBuffer.push(valL);\n                        history.push({\n                            type: 'WRITE',\n                            array: [...arr],\n                            auxArray: [...auxBuffer],\n                            writtenIndex: k,\n                            writtenVal: valL,\n                            activeRange: [left, right],\n                            activeLine: 8,\n                            depth: depth,\n                            stack: [...callStack],\n                            phase: 'Escrita Intercalada',\n                            description: `O elemento ${valL} é menor ou igual. Colocando ${valL} na posição ${k}.`\n                        });\n                        i++;\n                    } else {\n                        arr[k] = valR;\n                        auxBuffer.push(valR);\n                        history.push({\n                            type: 'WRITE',\n                            array: [...arr],\n                            auxArray: [...auxBuffer],\n                            writtenIndex: k,\n                            writtenVal: valR,\n                            activeRange: [left, right],\n                            activeLine: 8,\n                            depth: depth,\n                            stack: [...callStack],\n                            phase: 'Escrita Intercalada',\n                            description: `O elemento ${valR} é menor. Colocando ${valR} na posição ${k}.`\n                        });\n                        j++;\n                    }\n                    k++;\n                }\n\n                // Copy remaining from left\n                while (i < leftCopy.length) {\n                    arr[k] = leftCopy[i];\n                    auxBuffer.push(leftCopy[i]);\n                    history.push({\n                        type: 'WRITE_REMAINING',\n                        array: [...arr],\n                        auxArray: [...auxBuffer],\n                        writtenIndex: k,\n                        writtenVal: leftCopy[i],\n                        activeRange: [left, right],\n                        activeLine: 8,\n                        depth: depth,\n                        stack: [...callStack],\n                        phase: 'Cópia de Restantes',\n                        description: `Copiando elemento restante da esquerda (${leftCopy[i]}) para a posição ${k}.`\n                    });\n                    i++;\n                    k++;\n                }\n\n                // Copy remaining from right\n                while (j < rightCopy.length) {\n                    arr[k] = rightCopy[j];\n                    auxBuffer.push(rightCopy[j]);\n                    history.push({\n                        type: 'WRITE_REMAINING',\n                        array: [...arr],\n                        auxArray: [...auxBuffer],\n                        writtenIndex: k,\n                        writtenVal: rightCopy[j],\n                        activeRange: [left, right],\n                        activeLine: 8,\n                        depth: depth,\n                        stack: [...callStack],\n                        phase: 'Cópia de Restantes',\n                        description: `Copiando elemento restante da direita (${rightCopy[j]}) para a posição ${k}.`\n                    });\n                    j++;\n                    k++;\n                }\n\n                history.push({\n                    type: 'SUBARRAY_SORTED',\n                    array: [...arr],\n                    auxArray: [],\n                    activeRange: [left, right],\n                    activeLine: 8,\n                    depth: depth,\n                    stack: [...callStack],\n                    phase: 'Sub-vetor Concluído',\n                    description: `Intercalação completa! O sub-vetor no intervalo [${left}..${right}] agora está perfeitamente ordenado.`\n                });\n\n                callStack.pop();\n            }\n\n            mergeSortRecursive(0, arr.length - 1, 0);\n\n            // Final step\n            history.push({\n                type: 'FINISHED',\n                array: [...arr],\n                auxArray: [],\n                activeRange: [0, arr.length - 1],\n                activeLine: 0,\n                depth: 0,\n                stack: [],\n                phase: 'Concluído!',\n                description: `🎉 Processo finalizado! Todo o vetor foi totalmente ordenado pelo Merge Sort.`\n            });\n\n            return history;\n        }\n\n        function renderStep(stepIndex) {\n            if (stepIndex < 0 || stepIndex >= steps.length) return;\n\n            const step = steps[stepIndex];\n            currentStepIndex = stepIndex;\n\n            // Calculate metrics up to this step\n            stats.comparisons = 0;\n            stats.writes = 0;\n            stats.splits = 0;\n\n            for (let s = 0; s <= stepIndex; s++) {\n                if (steps[s].type === 'COMPARE') stats.comparisons++;\n                if (steps[s].type === 'WRITE' || steps[s].type === 'WRITE_REMAINING') stats.writes++;\n                if (steps[s].type === 'SPLIT') stats.splits++;\n            }\n\n            document.getElementById('stat-comparisons').innerText = stats.comparisons;\n            document.getElementById('stat-writes').innerText = stats.writes;\n            document.getElementById('stat-splits').innerText = stats.splits;\n\n            // Update text descriptions\n            stepPhase.innerText = step.phase;\n            stepDescription.innerHTML = step.description;\n            stepCounter.innerText = `Passo ${stepIndex + 1} / ${steps.length}`;\n            currentDepthEl.innerText = step.depth;\n\n            // Highlight Code Line\n            for (let i = 1; i <= 8; i++) {\n                const lineEl = document.getElementById(`code-line-${i}`);\n                if (lineEl) {\n                    if (i === step.activeLine) {\n                        lineEl.className = 'px-2 py-1 rounded transition-colors code-highlight font-bold text-white';\n                    } else {\n                        lineEl.className = 'px-2 py-1 rounded transition-colors text-slate-300';\n                    }\n                }\n            }\n\n            // Update Call Stack Display\n            callStackContainer.innerHTML = '';\n            if (step.stack && step.stack.length > 0) {\n                step.stack.forEach((frame, idx) => {\n                    const item = document.createElement('div');\n                    item.className = 'text-xs font-mono px-2.5 py-1 rounded-lg bg-indigo-950/60 border border-indigo-500/30 text-indigo-200 flex items-center justify-between';\n                    item.innerHTML = `<span><i class=\"fa-solid fa-turn-down-right mr-1.5 text-indigo-400\"><\/i> ${frame}<\/span> <span class=\"text-[10px] text-indigo-400 font-bold\">Nível ${idx}<\/span>`;\n                    callStackContainer.appendChild(item);\n                });\n            } else {\n                callStackContainer.innerHTML = `<div class=\"text-xs text-slate-500 italic text-center py-2\">Nenhuma chamada na pilha<\/div>`;\n            }\n\n            // Render Primary Bars\n            barsContainer.innerHTML = '';\n            const maxVal = Math.max(...array, 100);\n\n            step.array.forEach((val, idx) => {\n                const barWrapper = document.createElement('div');\n                barWrapper.className = 'flex-1 flex flex-col items-center gap-1.5 h-full justify-end max-w-[48px]';\n\n                const heightPercent = Math.max((val / maxVal) * 100, 15);\n                \n                // Color determination\n                let barColor = 'bg-slate-700 text-slate-300';\n                let isPulse = false;\n\n                const [start, end] = step.activeRange || [-1, -1];\n                const inActiveSubarray = (idx >= start && idx <= end);\n\n                if (step.type === 'FINISHED') {\n                    barColor = 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20';\n                } else if (step.comparingIndices && step.comparingIndices.includes(idx)) {\n                    barColor = 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/30 scale-105';\n                    isPulse = true;\n                } else if (step.writtenIndex === idx) {\n                    barColor = 'bg-indigo-400 text-slate-950 font-bold shadow-lg shadow-indigo-400/30';\n                } else if (inActiveSubarray) {\n                    barColor = 'bg-indigo-600 text-white';\n                }\n\n                barWrapper.innerHTML = `\n                    <span class=\"text-[11px] font-mono font-bold\">${val}<\/span>\n                    <div class=\"w-full rounded-t-lg bar-transition ${barColor} ${isPulse ? 'animate-pulse' : ''}\" style=\"height: ${heightPercent}%;\"><\/div>\n                    <span class=\"text-[9px] font-mono text-slate-500\">[${idx}]<\/span>\n                `;\n\n                barsContainer.appendChild(barWrapper);\n            });\n\n            // Render Auxiliary Buffer Area\n            auxBarsContainer.innerHTML = '';\n            if (step.auxArray && step.auxArray.length > 0) {\n                document.getElementById('aux-status').innerText = `${step.auxArray.length} elementos intercalados`;\n                step.auxArray.forEach(val => {\n                    const badge = document.createElement('span');\n                    badge.className = 'px-2.5 py-1 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-mono text-xs font-bold rounded-lg shadow-sm';\n                    badge.innerText = val;\n                    auxBarsContainer.appendChild(badge);\n                });\n            } else {\n                document.getElementById('aux-status').innerText = 'Inativo';\n                auxBarsContainer.innerHTML = `<span class=\"text-xs text-slate-600 italic\">Sub-vetor temporário vazio<\/span>`;\n            }\n\n            // Play Sound effect on compare/write\n            if (step.type === 'COMPARE') {\n                playTone(step.array[step.comparingIndices[0]] || 50);\n            } else if (step.type === 'WRITE') {\n                playTone(step.writtenVal || 70);\n            }\n\n            // Update button states\n            document.getElementById('btn-prev').disabled = (stepIndex === 0);\n            document.getElementById('btn-next').disabled = (stepIndex === steps.length - 1);\n        }\n\n        function togglePlay() {\n            if (isPlaying) {\n                pauseAnimation();\n            } else {\n                if (currentStepIndex >= steps.length - 1) {\n                    currentStepIndex = 0;\n                }\n                startAnimation();\n            }\n        }\n\n        function startAnimation() {\n            isPlaying = true;\n            document.getElementById('btn-play').className = \"bg-amber-600 hover:bg-amber-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-lg shadow-amber-600/30 transition active:scale-95\";\n            document.getElementById('icon-play').className = \"fa-solid fa-pause\";\n            document.getElementById('text-play').innerText = \"Pausar\";\n\n            playInterval = setInterval(() => {\n                if (currentStepIndex < steps.length - 1) {\n                    currentStepIndex++;\n                    renderStep(currentStepIndex);\n                } else {\n                    pauseAnimation();\n                }\n            }, animationSpeed);\n        }\n\n        function pauseAnimation() {\n            isPlaying = false;\n            if (playInterval) clearInterval(playInterval);\n            document.getElementById('btn-play').className = \"bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition active:scale-95\";\n            document.getElementById('icon-play').className = \"fa-solid fa-play\";\n            document.getElementById('text-play').innerText = \"Iniciar\";\n        }\n\n        function stepNext() {\n            pauseAnimation();\n            if (currentStepIndex < steps.length - 1) {\n                currentStepIndex++;\n                renderStep(currentStepIndex);\n            }\n        }\n\n        function stepPrev() {\n            pauseAnimation();\n            if (currentStepIndex > 0) {\n                currentStepIndex--;\n                renderStep(currentStepIndex);\n            }\n        }\n\n        function resetArray() {\n            pauseAnimation();\n            currentStepIndex = 0;\n            renderStep(0);\n        }\n\n        function generateRandomArray(size = null) {\n            pauseAnimation();\n            const n = size || parseInt(document.getElementById('size-slider').value);\n            array = [];\n            for (let i = 0; i < n; i++) {\n                array.push(Math.floor(Math.random() * 85) + 12);\n            }\n            steps = generateMergeSortSteps(array);\n            currentStepIndex = 0;\n            renderStep(0);\n        }\n\n        function changeArraySize(val) {\n            document.getElementById('size-label').innerText = val;\n            generateRandomArray(parseInt(val));\n        }\n\n        function updateSpeed() {\n            const val = parseInt(document.getElementById('speed-slider').value);\n            animationSpeed = 1050 - val; // invert so higher slider = faster\n            document.getElementById('speed-label').innerText = `${animationSpeed}ms`;\n            if (isPlaying) {\n                pauseAnimation();\n                startAnimation();\n            }\n        }\n\n        // Custom Modal handlers\n        function openCustomInputModal() {\n            pauseAnimation();\n            document.getElementById('modal-custom-input').classList.remove('hidden');\n            document.getElementById('modal-error').classList.add('hidden');\n        }\n\n        function closeCustomInputModal() {\n            document.getElementById('modal-custom-input').classList.add('hidden');\n        }\n\n        function applyCustomArray() {\n            const raw = document.getElementById('custom-array-input').value;\n            const parsed = raw.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));\n\n            if (parsed.length < 4 || parsed.length > 20) {\n                document.getElementById('modal-error').innerText = \"Por favor, digite entre 4 e 20 números.\";\n                document.getElementById('modal-error').classList.remove('hidden');\n                return;\n            }\n\n            array = parsed;\n            document.getElementById('size-slider').value = array.length;\n            document.getElementById('size-label').innerText = array.length;\n            steps = generateMergeSortSteps(array);\n            currentStepIndex = 0;\n            renderStep(0);\n            closeCustomInputModal();\n        }\n\n        // QUIZ GAME LOGIC\n        let quizLeft = [];\n        let quizRight = [];\n        let quizTarget = [];\n        let quizSolution = [];\n\n        function initQuizGame() {\n            // Generate two small sorted arrays\n            const len1 = 4;\n            const len2 = 4;\n            \n            let arr1 = [], arr2 = [];\n            for (let i = 0; i < len1; i++) arr1.push(Math.floor(Math.random() * 45) + 5);\n            for (let i = 0; i < len2; i++) arr2.push(Math.floor(Math.random() * 45) + 50);\n\n            arr1.sort((a, b) => a - b);\n            arr2.sort((a, b) => a - b);\n\n            quizLeft = [...arr1];\n            quizRight = [...arr2];\n            quizTarget = [];\n            quizSolution = [...arr1, ...arr2].sort((a, b) => a - b);\n\n            renderQuiz();\n        }\n\n        function renderQuiz() {\n            const leftContainer = document.getElementById('quiz-left-container');\n            const rightContainer = document.getElementById('quiz-right-container');\n            const targetContainer = document.getElementById('quiz-target-container');\n            const feedback = document.getElementById('quiz-feedback');\n\n            leftContainer.innerHTML = '';\n            rightContainer.innerHTML = '';\n            targetContainer.innerHTML = '';\n            feedback.className = 'p-3 rounded-xl text-center text-sm font-medium hidden';\n\n            // Render Left choices (only first element active)\n            quizLeft.forEach((val, idx) => {\n                const btn = document.createElement('button');\n                btn.className = `px-3.5 py-2 font-mono font-bold rounded-xl text-sm transition ${idx === 0 ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 active:scale-95 cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed opacity-60'}`;\n                btn.innerText = val;\n                if (idx === 0) {\n                    btn.onclick = () => selectQuizElement('left');\n                }\n                leftContainer.appendChild(btn);\n            });\n\n            if (quizLeft.length === 0) {\n                leftContainer.innerHTML = `<span class=\"text-xs text-slate-500 italic\">Vazio<\/span>`;\n            }\n\n            // Render Right choices\n            quizRight.forEach((val, idx) => {\n                const btn = document.createElement('button');\n                btn.className = `px-3.5 py-2 font-mono font-bold rounded-xl text-sm transition ${idx === 0 ? 'bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-600/30 active:scale-95 cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed opacity-60'}`;\n                btn.innerText = val;\n                if (idx === 0) {\n                    btn.onclick = () => selectQuizElement('right');\n                }\n                rightContainer.appendChild(btn);\n            });\n\n            if (quizRight.length === 0) {\n                rightContainer.innerHTML = `<span class=\"text-xs text-slate-500 italic\">Vazio<\/span>`;\n            }\n\n            // Render Target\n            if (quizTarget.length === 0) {\n                targetContainer.innerHTML = `<span class=\"text-xs text-slate-600 italic mx-auto\">Clique em um elemento válido acima para adicioná-lo aqui...<\/span>`;\n            } else {\n                quizTarget.forEach(val => {\n                    const span = document.createElement('span');\n                    span.className = 'px-3 py-1.5 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-mono font-bold text-sm rounded-xl';\n                    span.innerText = val;\n                    targetContainer.appendChild(span);\n                });\n            }\n\n            // Score counter\n            document.getElementById('quiz-score').innerText = `${quizTarget.length} / ${quizSolution.length} inseridos`;\n\n            // Check if finished\n            if (quizTarget.length === quizSolution.length) {\n                feedback.innerText = \"🎉 Excelente! Você completou a intercalação com sucesso sem violar a ordem!\";\n                feedback.className = \"p-3 rounded-xl text-center text-sm font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 block\";\n            }\n        }\n\n        function selectQuizElement(side) {\n            const feedback = document.getElementById('quiz-feedback');\n            const expectedVal = quizSolution[quizTarget.length];\n\n            let selectedVal = null;\n            if (side === 'left' && quizLeft.length > 0) selectedVal = quizLeft[0];\n            if (side === 'right' && quizRight.length > 0) selectedVal = quizRight[0];\n\n            if (selectedVal === expectedVal) {\n                if (side === 'left') quizLeft.shift();\n                if (side === 'right') quizRight.shift();\n                quizTarget.push(selectedVal);\n                playTone(selectedVal);\n                renderQuiz();\n            } else {\n                feedback.innerText = `⚠️ Incorreto! O elemento ${selectedVal} não é o menor entre as opções disponíveis (${expectedVal} é menor).`;\n                feedback.className = \"p-3 rounded-xl text-center text-sm font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30 block\";\n            }\n        }\n\n        // Navigation Tabs Switcher\n        function switchTab(tabId) {\n            document.getElementById('view-visualizer').classList.add('hidden');\n            document.getElementById('view-quiz').classList.add('hidden');\n            document.getElementById('view-theory').classList.add('hidden');\n\n            document.getElementById('tab-visualizer').className = \"px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white transition-all\";\n            document.getElementById('tab-quiz').className = \"px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white transition-all\";\n            document.getElementById('tab-theory').className = \"px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium text-slate-400 hover:text-white transition-all\";\n\n            document.getElementById(`view-${tabId}`).classList.remove('hidden');\n            document.getElementById(`view-${tabId}`).classList.add('flex');\n            \n            const activeTabBtn = document.getElementById(`tab-${tabId}`);\n            activeTabBtn.className = \"px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all bg-indigo-600 text-white shadow\";\n\n            if (tabId === 'quiz') {\n                initQuizGame();\n            }\n        }\n\n        // On initial page load\n        window.onload = function() {\n            generateRandomArray(10);\n        };\n    <\/script>\n<\/body>\n<\/html>"}]},{"tipo":"dir","nome":"Quick Sort","arq":"Quick","path":"Ordenacoes/Quick","children":[{"tipo":"file","nome":"Demonstração: Quick Sort","arq":"Demo_ Quick Sort.html","path":"Ordenacoes/Quick/Demo_ Quick Sort.html","ext":"html","kind":"demo","tamanho":8249,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Demo: Quick Sort<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#eef3f5;--panel:#fff;--ink:#14232e;--mute:#5d707c;--line:#cfdbe1;--acc:#0f7c8a;--hot:#e0a100;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}}\n:root[data-theme=\"dark\"]{--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:1.6rem;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:.85rem;font-weight:600;color:var(--mute);margin:18px 0 8px}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\nbutton,input{font:inherit;color:inherit}\nbutton{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}\nbutton:hover{border-color:var(--acc)}\n.tabs button[aria-selected=\"true\"]{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .tabs button[aria-selected=\"true\"]{color:#06222a}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n#desc{margin:0 0 14px;max-width:70ch}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}\n.ctl label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);flex:1;min-width:220px}\ninput[type=text]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}\n.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 16px 18px;margin-top:10px}\n.row,.cols{display:flex;flex-wrap:wrap;gap:6px}\n.cols{gap:8px;align-items:flex-start}\n.w{display:flex;flex-direction:column;align-items:center;gap:2px}\n.i{font-size:.7rem;color:var(--mute)}\n.c{min-width:44px;height:44px;padding:0 8px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-weight:800;font-variant-numeric:tabular-nums;transition:background .25s,border-color .25s}\n.c.hot{background:var(--hot);border-color:var(--hot);color:#14232e}\n.c.on{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .c.on{color:#06222a}\n.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}\n.dg{border-bottom:3px solid var(--acc)}\n.z{opacity:.35}\n.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}\n.ch{font-size:.8rem;font-weight:600;color:var(--mute)}\n.stack{min-height:52px;width:100%;box-sizing:border-box;border:1.5px dashed var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}\n#msg{min-height:3em;margin:14px 0 4px;font-weight:600}\n#pos{font-size:.85rem;color:var(--mute)}\n.spd{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);margin-top:6px}\n@media (prefers-reduced-motion:reduce){.c{transition:none}}\n.c.dim{opacity:.35}.c.lo{border-color:var(--acc);border-width:2.5px}.leg{font-size:.85rem;color:var(--mute);margin:10px 0 0;max-width:70ch}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Quick Sort: demonstração interativa<\/h1>\n<p id=\"desc\"><\/p>\n<div class=\"ctl\">\n  <label>Números (separados por vírgula)<input type=\"text\" id=\"inp\"><\/label>\n  <button id=\"apply\">Aplicar<\/button>\n  <button id=\"rnd\">Sortear<\/button>\n<\/div>\n<div class=\"ctl\">\n  <button id=\"prev\">Voltar<\/button>\n  <button id=\"next\">Próximo passo<\/button>\n  <button id=\"play\">Reproduzir<\/button>\n  <span id=\"pos\"><\/span>\n<\/div>\n<div class=\"spd\"><label for=\"spd\">Velocidade<\/label><input type=\"range\" id=\"spd\" min=\"200\" max=\"1500\" step=\"50\" value=\"1000\"><\/div>\n<div class=\"stage\" id=\"stage\"><\/div>\n<p class=\"leg\">Azul-petróleo: pivô. Âmbar: elemento sendo comparado. Contorno grosso: zona dos menores (≤ pivô). Verde: já na posição final. Esmaecido: fora do trecho atual.<\/p>\n<div id=\"msg\" aria-live=\"polite\"><\/div>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nconst cell=(t,i,k,h)=>({t:t===null?'':t,i:i===undefined?'':i,k:k||'',h});\nconst row=(label,cells)=>({type:'row',label,cells});\n\nfunction quick(a){\n  const F=[],n=a.length,arr=a.slice(),fin=Array(n).fill(false);\n  const S=(msg,lo,hi,p=-1,i=-1,j=-1)=>F.push({msg,blocks:[row('Array',arr.map((t,x)=>cell(t,x,fin[x]?'ok':(x<lo||x>hi)?'dim':x===p?'on':x===j?'hot':(x<=i&&x>=lo)?'lo':'')))]});\n  function qs(lo,hi){\n    if(lo>hi)return;\n    if(lo===hi){fin[lo]=true;S(`Trecho com 1 elemento: ${arr[lo]} já está no lugar certo (posição ${lo}).`,lo,hi);return}\n    const pv=arr[hi];let i=lo-1;\n    S(`Trecho ${lo}–${hi}. O pivô é o último elemento: ${pv}. Vamos separar os menores dos maiores.`,lo,hi,hi,i);\n    for(let j=lo;j<hi;j++){\n      if(arr[j]<=pv){\n        i++;\n        if(i!==j){[arr[i],arr[j]]=[arr[j],arr[i]];S(`${arr[i]} ≤ ${pv}: entra na zona dos menores (troca as posições ${i} e ${j}).`,lo,hi,hi,i,j)}\n        else S(`${arr[j]} ≤ ${pv}: já está na zona dos menores.`,lo,hi,hi,i,j);\n      }else S(`${arr[j]} > ${pv}: fica na zona dos maiores.`,lo,hi,hi,i,j);\n    }\n    i++;[arr[i],arr[hi]]=[arr[hi],arr[i]];fin[i]=true;\n    S(`O pivô ${pv} vai para a posição ${i}. À esquerda só há valores ≤ ${pv}, à direita só valores > ${pv}. Esse pivô já está no lugar final.`,lo,hi);\n    qs(lo,i-1);qs(i+1,hi);\n  }\n  qs(0,n-1);\n  S('Pronto! Todos os pivôs ficaram nas posições finais e o array está ordenado.',0,n-1);\n  return F;\n}\n\nconst A={\n  quick:{name:'Quick Sort',fn:quick,max:99,val:'38, 27, 43, 3, 9, 82, 10',d:'Escolhe um pivô, separa os elementos menores e maiores que ele e repete o processo em cada lado. Tempo médio O(n log n), pior caso O(n²).'}\n};\nlet cur='quick',F=[],idx=0,timer=null;\n\nconst cellH=c=>`<div class=\"w\"><div class=\"c ${c.k}\">${c.h!==undefined?c.h:c.t}<\/div>${c.i!==''?`<span class=\"i\">${c.i}<\/span>`:''}<\/div>`;\nfunction draw(f){\n  $('stage').innerHTML=f.blocks.map(b=>b.type==='row'\n    ?`<h3>${b.label}<\/h3><div class=\"row\">${b.cells.map(cellH).join('')}<\/div>`\n    :`<h3>${b.label}<\/h3><div class=\"cols\">${b.cols.map(c=>`<div class=\"col\"><span class=\"ch\">${c.h}<\/span><div class=\"stack\">${c.cells.map(cellH).join('')}<\/div><\/div>`).join('')}<\/div>`).join('');\n  $('msg').textContent=f.msg;\n  $('pos').textContent=`Passo ${idx+1} de ${F.length}`;\n  $('prev').disabled=idx===0;$('next').disabled=idx===F.length-1;\n}\nfunction go(n){idx=Math.max(0,Math.min(F.length-1,n));draw(F[idx])}\nfunction stop(){clearInterval(timer);timer=null;$('play').textContent='Reproduzir'}\nfunction start(){clearInterval(timer);$('play').textContent='Pausar';timer=setInterval(()=>{if(idx>=F.length-1){stop();return}go(idx+1)},1700-$('spd').value)}\nfunction load(){\n  stop();\n  const m=A[cur].max,r=$('inp').value.split(/[\\s,;]+/).filter(Boolean).map(Number);\n  if(r.length<2||r.length>12||r.some(x=>!Number.isInteger(x)||x<0||x>m)){$('msg').textContent=`Digite de 2 a 12 números inteiros entre 0 e ${m}, separados por vírgula.`;return}\n  A[cur].val=r.join(', ');F=A[cur].fn(r);go(0);\n}\nfunction pick(k){\n  cur=k;stop();\n  $('desc').textContent=A[k].d;$('inp').value=A[k].val;load();\n}\n$('apply').onclick=load;\n$('inp').onkeydown=e=>{if(e.key==='Enter')load()};\n$('rnd').onclick=()=>{const m=A[cur].max;$('inp').value=Array.from({length:8},()=>Math.floor(Math.random()*(m+1))).join(', ');load()};\n$('prev').onclick=()=>{stop();go(idx-1)};\n$('next').onclick=()=>{stop();go(idx+1)};\n$('play').onclick=()=>{if(timer){stop();return}if(idx>=F.length-1)go(0);start()};\n$('spd').oninput=()=>{if(timer)start()};\npick('quick');\n<\/script>\n<\/body>\n<\/html>\n"},{"tipo":"file","nome":"Guia completo: Quick Sort","arq":"guia_completo_quick_sort.md","path":"Ordenacoes/Quick/guia_completo_quick_sort.md","ext":"md","kind":"guia","tamanho":9702,"conteudo":"# Guia Completo: Algoritmo Quick Sort (Ordenação Rápida)\n\nO **Quick Sort** (ou Ordenação Rápida) é um algoritmo de ordenação baseado na estratégia **dividir para conquistar**. Ele escolhe um elemento chamado **pivô**, reorganiza o array de modo que os elementos **menores** fiquem de um lado do pivô e os **maiores** do outro, e então repete o processo recursivamente em cada lado.\n\nCriado por Tony Hoare em 1959, é um dos algoritmos mais usados no mundo. Apesar de ter pior caso $\\mathcal{O}(n^2)$, na prática costuma ser **mais rápido que o Merge Sort e o Heap Sort**, porque trabalha *in-place*, acessa a memória de forma sequencial e tem constantes pequenas.\n\n---\n\n## 🎯 Como Funciona? (A Analogia da Fila por Altura com uma Pessoa de Referência)\n\nImagine que você precisa organizar uma multidão por altura, sem uma fita métrica:\n1. Você escolhe **uma pessoa** como referência (o **pivô**).\n2. Pede para todos os **mais baixos** irem para a esquerda dela e todos os **mais altos** para a direita.\n3. Pronto: a pessoa-referência já está **exatamente no lugar definitivo** dela na fila final.\n4. Agora você repete o processo separadamente com o grupo da esquerda e com o grupo da direita, cada um escolhendo seu próprio pivô.\n5. Quando um grupo tiver 0 ou 1 pessoa, ele já está organizado.\n\nEm termos de algoritmo, são três passos:\n\n1. **Escolher o pivô:** neste guia, o último elemento do trecho.\n2. **Particionar:** reorganizar o trecho para que todos os elementos $\\le$ pivô fiquem à esquerda e todos os $>$ pivô à direita, deixando o pivô na posição final.\n3. **Recursão:** aplicar o mesmo processo ao trecho à esquerda e ao trecho à direita do pivô.\n\nA versão usada aqui é o **particionamento de Lomuto**: um índice `i` marca o fim da \"zona dos menores\" e um índice `j` percorre o trecho. Quando `arr[j] <= pivô`, o elemento é trocado para dentro da zona dos menores.\n\n### Exemplo passo a passo\n\nArray inicial: `[38, 27, 43, 3, 9, 82, 10]` (o pivô é sempre o último elemento do trecho)\n\n**Primeiro particionamento** (trecho 0–6, pivô = 10)\n\n| `j` | `arr[j]` | Comparação | Ação | Array |\n|---|---|---|---|---|\n| 0 | 38 | 38 > 10 | fica na zona dos maiores | `[38, 27, 43, 3, 9, 82, 10]` |\n| 1 | 27 | 27 > 10 | fica na zona dos maiores | `[38, 27, 43, 3, 9, 82, 10]` |\n| 2 | 43 | 43 > 10 | fica na zona dos maiores | `[38, 27, 43, 3, 9, 82, 10]` |\n| 3 | 3 | 3 ≤ 10 | troca com a posição 0 | `[3, 27, 43, 38, 9, 82, 10]` |\n| 4 | 9 | 9 ≤ 10 | troca com a posição 1 | `[3, 9, 43, 38, 27, 82, 10]` |\n| 5 | 82 | 82 > 10 | fica na zona dos maiores | `[3, 9, 43, 38, 27, 82, 10]` |\n| fim | | | pivô vai para a posição 2 | `[3, 9, 10, 38, 27, 82, 43]` |\n\nO `10` já está na posição final. À esquerda ficou `[3, 9]` e à direita `[38, 27, 82, 43]`.\n\n**Recursão**\n\n| Trecho | Pivô | Resultado após particionar |\n|---|---|---|\n| `[3, 9]` | 9 | `[3, 9]` (o 9 fica no lugar; sobra `[3]`) |\n| `[38, 27, 82, 43]` | 43 | `[38, 27, 43, 82]` (43 na posição 5) |\n| `[38, 27]` | 27 | `[27, 38]` |\n\nResultado final: `[3, 9, 10, 27, 38, 43, 82]`\n\n---\n\n## ⚙️ Características Mais Importantes\n\n### 1. Complexidade de Tempo (Velocidade)\n*   **Melhor Caso:** $\\mathcal{O}(n \\log n)$\n    *   Ocorre quando o pivô divide o trecho em duas partes de tamanho parecido a cada particionamento.\n*   **Caso Médio:** $\\mathcal{O}(n \\log n)$\n    *   Mesmo com divisões desequilibradas (por exemplo, 90% / 10%), a profundidade da recursão continua logarítmica.\n*   **Pior Caso:** $\\mathcal{O}(n^2)$\n    *   Ocorre quando o pivô é sempre o **menor ou o maior** elemento do trecho. Com o último elemento como pivô, isso acontece justamente em arrays **já ordenados** ou em ordem inversa: cada particionamento remove apenas um elemento.\n\n> **Detalhe importante:** o pior caso depende da **estratégia de escolha do pivô**, não só dos dados. Com pivô aleatório ou \"mediana de três\", o pior caso fica extremamente improvável.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(\\log n)$ em média\n    *   É um algoritmo **in-place**: não precisa de array auxiliar. O único custo extra é a **pilha de recursão**.\n    *   No pior caso, a pilha pode chegar a $\\mathcal{O}(n)$. Uma otimização clássica é recorrer primeiro ao lado **menor** e tratar o maior com um laço, garantindo $\\mathcal{O}(\\log n)$ sempre.\n\n### 3. Estabilidade\n*   **É Estável?** Não.\n    *   As trocas do particionamento \"saltam\" por cima de outros elementos e podem inverter a ordem de valores iguais.\n    *   **Exemplo:** em `[4a, 4b, 2]`, com pivô `2`, o `4a` é trocado com o `2` ao final, gerando `[2, 4b, 4a]`. A ordem original dos dois `4` se perdeu.\n\n### 4. Baseado em Comparação?\n*   **Sim.** Atinge o limite inferior $\\Omega(n \\log n)$ no caso médio.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não (com pivô fixo). Com pivô no fim, dados já ordenados são o **pior** caso, não o melhor.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   Precisa de todos os elementos para particionar.\n\n---\n\n## 🔧 Estratégias de Escolha do Pivô\n\n| Estratégia | Como funciona | Observação |\n|---|---|---|\n| **Último elemento** | `pivô = arr[high]` | Simples, mas péssimo para dados já ordenados. |\n| **Primeiro elemento** | `pivô = arr[low]` | Mesmo problema do anterior. |\n| **Aleatório** | sorteia uma posição do trecho e troca com `arr[high]` | Torna o pior caso muito improvável. |\n| **Mediana de três** | mediana entre primeiro, meio e último | Boa proteção contra entradas ordenadas e barata de calcular. |\n\n**Outras otimizações usadas na prática:**\n*   **Particionamento de Hoare:** faz menos trocas que o de Lomuto.\n*   **Partição em três vias (*3-way*):** separa `<`, `=` e `>` do pivô, excelente quando há muitos valores repetidos.\n*   **Insertion Sort em trechos pequenos:** abaixo de uns 10 a 20 elementos, troca de algoritmo.\n*   **Introsort:** se a recursão ficar fundo demais, troca para Heap Sort, garantindo $\\mathcal{O}(n \\log n)$ no pior caso. É a base do `std::sort` do C++.\n\n---\n\n## 📊 Comparação com Outros Algoritmos\n\n| Característica | Merge Sort | Heap Sort | **Quick Sort** |\n|---|---|---|---|\n| Melhor caso | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ |\n| Pior caso | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | **$\\mathcal{O}(n^2)$** |\n| Espaço extra | $\\mathcal{O}(n)$ | $\\mathcal{O}(1)$ | $\\mathcal{O}(\\log n)$ |\n| Estável | **Sim** | Não | Não |\n| In-place | Não | **Sim** | **Sim** |\n| Velocidade prática | Boa | Mais lenta | **Geralmente a melhor** |\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Muito rápido na prática:** laços internos simples e acesso sequencial à memória (bom uso do cache).\n*   **In-place:** quase nenhuma memória extra.\n*   **Versátil:** muitas variações e otimizações conhecidas.\n*   **Paralelizável:** os dois lados do pivô podem ser ordenados ao mesmo tempo.\n\n**Desvantagens:**\n*   **Pior caso quadrático:** pivôs ruins degradam o desempenho para $\\mathcal{O}(n^2)$.\n*   **Não é estável:** pode alterar a ordem de elementos iguais.\n*   **Recursão profunda no pior caso:** risco de estouro de pilha se não for tratado.\n*   **Não é adaptável nem online.**\n\n---\n\n## 💻 Exemplo Clássico em C\n\nO código completo, com um comentário em cada linha e um `main` de exemplo, está no arquivo `quick_sort.c`. Abaixo, o essencial:\n\n```c\nvoid swap(int *a, int *b) {\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n\n// Particiona arr[low..high] usando arr[high] como pivô (Lomuto)\nint partition(int arr[], int low, int high) {\n    int pivot = arr[high];   // pivô = último elemento\n    int i = low - 1;         // fim da zona dos elementos <= pivô\n\n    for (int j = low; j < high; j++) {\n        if (arr[j] <= pivot) {\n            i++;\n            swap(&arr[i], &arr[j]);   // leva o elemento para a zona dos menores\n        }\n    }\n    swap(&arr[i + 1], &arr[high]);    // coloca o pivô na posição final\n    return i + 1;                     // devolve a posição do pivô\n}\n\nvoid quickSort(int arr[], int low, int high) {\n    if (low < high) {\n        int p = partition(arr, low, high);\n        quickSort(arr, low, p - 1);   // ordena os menores\n        quickSort(arr, p + 1, high);  // ordena os maiores\n    }\n}\n```\n\n**Pontos de atenção no código:**\n*   A chamada inicial é `quickSort(arr, 0, n - 1)`.\n*   Depois do particionamento, o pivô fica na posição `p` **definitiva**, por isso a recursão exclui `p` dos dois lados.\n*   O caso base `low < high` encerra a recursão em trechos de 0 ou 1 elemento.\n\n---\n\n## 🎯 Quando devo usar o Quick Sort?\n\n*   **Ordenação de arrays em memória:** é a escolha padrão em muitas bibliotecas (`qsort` em C, `std::sort` em C++ via Introsort).\n*   **Memória limitada:** por ser in-place.\n*   **Dados aleatórios ou sem padrão conhecido:** é aí que ele mais brilha.\n\nEvite (ou use pivô aleatório/mediana de três) quando os dados puderem vir ordenados, e prefira o **Merge Sort** quando precisar de **estabilidade** ou de desempenho garantido $\\mathcal{O}(n \\log n)$.\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** escolha um pivô, separe menores e maiores, repita nos dois lados.\n*   **Tempo:** $\\mathcal{O}(n \\log n)$ em média e no melhor caso; $\\mathcal{O}(n^2)$ no pior caso.\n*   **Espaço:** $\\mathcal{O}(\\log n)$ (pilha de recursão), in-place.\n*   **Estável:** não. **Adaptável:** não. **Online:** não.\n*   **Estratégia:** dividir para conquistar.\n*   **Destaque:** o mais rápido na prática para arrays em memória, desde que o pivô seja bem escolhido.\n"},{"tipo":"file","nome":"Quick Sort","arq":"Quicksort.c","path":"Ordenacoes/Quick/Quicksort.c","ext":"c","kind":"codigo","tamanho":2785,"conteudo":"#include <stdio.h>  // printf: entrada e saída\n\n// Troca os valores de duas variáveis (recebe os endereços delas)\nvoid swap(int *a, int *b) {\n    int temp = *a;  // guarda o valor apontado por a\n    *a = *b;        // coloca em a o valor de b\n    *b = temp;      // coloca em b o valor guardado de a\n}\n// Particiona arr[low..high] usando o último elemento como pivô (método de Lomuto)\n// Ao final: tudo à esquerda do pivô é <= pivô, tudo à direita é > pivô.\n// Devolve a posição final do pivô.\nint partition(int arr[], int low, int high) {\n    int pivot = arr[high];  // escolhe o último elemento do trecho como pivô\n    int i = low - 1;        // i marca o fim da \"zona dos menores\"; começa vazia (low - 1)\n\n    for (int j = low; j < high; j++) {  // j percorre o trecho, sem incluir o pivô\n        if (arr[j] <= pivot) {          // este elemento pertence à zona dos menores?\n            i++;                        // aumenta a zona dos menores em uma posição\n            swap(&arr[i], &arr[j]);     // traz o elemento para dentro dessa zona\n        }\n        // se arr[j] > pivot, não faz nada: ele fica na zona dos maiores\n    }\n\n    swap(&arr[i + 1], &arr[high]);  // coloca o pivô logo depois da zona dos menores\n    return i + 1;                   // essa é a posição definitiva do pivô\n}\n\n// Ordena arr[low..high] (ambos os limites incluídos)\nvoid quickSort(int arr[], int low, int high) {\n    if (low < high) {                       // caso base: com 0 ou 1 elemento, já está ordenado\n        int p = partition(arr, low, high);  // particiona e descobre onde o pivô ficou\n        quickSort(arr, low, p - 1);         // ordena os menores (à esquerda do pivô)\n        quickSort(arr, p + 1, high);        // ordena os maiores (à direita do pivô)\n        // o pivô (posição p) já está no lugar certo, por isso não entra em nenhuma chamada\n    }\n}\n\n// Imprime um título e depois todos os elementos do array\nvoid printArray(const char *titulo, int arr[], int n) {\n    printf(\"%s\\n\", titulo);        // escreve o título em uma linha\n    for (int i = 0; i < n; i++) {  // percorre o array\n        printf(\"%d \", arr[i]);     // imprime cada número seguido de espaço\n    }\n    printf(\"\\n\");                  // quebra de linha no final\n}\n\nint main() {\n    int arr[] = {38, 27, 43, 3, 9, 82, 10};  // array de exemplo\n    int n = sizeof(arr) / sizeof(arr[0]);    // número de elementos = tamanho total / tamanho de um elemento\n\n    printArray(\"Array original:\", arr, n);   // mostra o array antes de ordenar\n    quickSort(arr, 0, n - 1);                // ordena do primeiro ao último índice\n    printArray(\"Array ordenado:\", arr, n);   // mostra o array depois de ordenar\n\n    return 0;  // 0 indica que o programa terminou sem erros\n}"}]},{"tipo":"dir","nome":"Heap Sort","arq":"Heap","path":"Ordenacoes/Heap","children":[{"tipo":"file","nome":"Demonstração: Heap Sort","arq":"Demo_ Heap Sort.html","path":"Ordenacoes/Heap/Demo_ Heap Sort.html","ext":"html","kind":"demo","tamanho":9543,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Demo: Heap Sort<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#eef3f5;--panel:#fff;--ink:#14232e;--mute:#5d707c;--line:#cfdbe1;--acc:#0f7c8a;--hot:#e0a100;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}}\n:root[data-theme=\"dark\"]{--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:1.6rem;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:.85rem;font-weight:600;color:var(--mute);margin:18px 0 8px}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\nbutton,input{font:inherit;color:inherit}\nbutton{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}\nbutton:hover{border-color:var(--acc)}\n.tabs button[aria-selected=\"true\"]{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .tabs button[aria-selected=\"true\"]{color:#06222a}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n#desc{margin:0 0 14px;max-width:70ch}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}\n.ctl label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);flex:1;min-width:220px}\ninput[type=text]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}\n.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 16px 18px;margin-top:10px}\n.row,.cols{display:flex;flex-wrap:wrap;gap:6px}\n.cols{gap:8px;align-items:flex-start}\n.w{display:flex;flex-direction:column;align-items:center;gap:2px}\n.i{font-size:.7rem;color:var(--mute)}\n.c{min-width:44px;height:44px;padding:0 8px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-weight:800;font-variant-numeric:tabular-nums;transition:background .25s,border-color .25s}\n.c.hot{background:var(--hot);border-color:var(--hot);color:#14232e}\n.c.on{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .c.on{color:#06222a}\n.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}\n.dg{border-bottom:3px solid var(--acc)}\n.z{opacity:.35}\n.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}\n.ch{font-size:.8rem;font-weight:600;color:var(--mute)}\n.stack{min-height:52px;width:100%;box-sizing:border-box;border:1.5px dashed var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}\n#msg{min-height:3em;margin:14px 0 4px;font-weight:600}\n#pos{font-size:.85rem;color:var(--mute)}\n.spd{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);margin-top:6px}\n@media (prefers-reduced-motion:reduce){.c{transition:none}}\n.c.dim{opacity:.35}.leg{font-size:.85rem;color:var(--mute);margin:10px 0 0;max-width:70ch}.e{stroke:var(--line);stroke-width:2}.nd circle{fill:var(--bg);stroke:var(--line);stroke-width:1.5;transition:fill .25s}.nd text{fill:var(--ink);font-weight:800;font-size:15px;font-family:inherit}.nd.hot circle{fill:var(--hot);stroke:var(--hot)}.nd.hot text{fill:#14232e}.nd.on circle{fill:var(--acc);stroke:var(--acc)}.nd.on text{fill:#fff}:root:not([data-theme=\"light\"]) .nd.on text{fill:#06222a}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Heap Sort: demonstração interativa<\/h1>\n<p id=\"desc\"><\/p>\n<div class=\"ctl\">\n  <label>Números (separados por vírgula)<input type=\"text\" id=\"inp\"><\/label>\n  <button id=\"apply\">Aplicar<\/button>\n  <button id=\"rnd\">Sortear<\/button>\n<\/div>\n<div class=\"ctl\">\n  <button id=\"prev\">Voltar<\/button>\n  <button id=\"next\">Próximo passo<\/button>\n  <button id=\"play\">Reproduzir<\/button>\n  <span id=\"pos\"><\/span>\n<\/div>\n<div class=\"spd\"><label for=\"spd\">Velocidade<\/label><input type=\"range\" id=\"spd\" min=\"200\" max=\"1500\" step=\"50\" value=\"1000\"><\/div>\n<div class=\"stage\" id=\"stage\"><\/div>\n<p class=\"leg\">Âmbar: nó atual. Azul-petróleo: filho maior ou posição da troca. Verde: já na posição final, fora do heap.<\/p>\n<div id=\"msg\" aria-live=\"polite\"><\/div>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nconst cell=(t,i,k,h)=>({t:t===null?'':t,i:i===undefined?'':i,k:k||'',h});\nconst row=(label,cells)=>({type:'row',label,cells});\n\nfunction heap(a){\n  const F=[],n=a.length,arr=a.slice();let size=n;\n  const S=(msg,x=-1,y=-1)=>{const cs=arr.map((t,k)=>cell(t,k,k>=size?'ok':k===x?'hot':k===y?'on':''));\n    F.push({msg,blocks:[row('Array',cs),{type:'tree',label:'Heap como árvore (filhos da posição k: 2k+1 e 2k+2)',cells:cs.slice(0,size)}]})};\n  function sift(i){\n    for(;;){\n      const l=2*i+1,r=l+1;let g=i;\n      if(l<size&&arr[l]>arr[g])g=l;\n      if(r<size&&arr[r]>arr[g])g=r;\n      if(g===i){S(`${arr[i]} (posição ${i}) já é maior ou igual aos seus filhos: o nó está no lugar.`,i);return}\n      S(`${arr[i]} (posição ${i}) tem um filho maior: ${arr[g]} (posição ${g}). Vão trocar.`,i,g);\n      [arr[i],arr[g]]=[arr[g],arr[i]];\n      S(`Trocou: ${arr[i]} subiu e ${arr[g]} desceu para a posição ${g}. Continua descendo.`,g,i);\n      i=g;\n    }\n  }\n  S(`Fase 1: montar um max-heap (todo pai ≥ seus filhos). Começamos pelo último pai, na posição ${Math.floor(n/2)-1}.`);\n  for(let i=Math.floor(n/2)-1;i>=0;i--)sift(i);\n  S(`Max-heap pronto! O maior valor, ${arr[0]}, está na raiz.`,0);\n  for(let end=n-1;end>0;end--){\n    S(`Fase 2: troca a raiz (${arr[0]}) com o último elemento do heap (${arr[end]}, posição ${end}).`,0,end);\n    [arr[0],arr[end]]=[arr[end],arr[0]];size=end;\n    S(`${arr[end]} está na posição final e sai do heap, que agora tem ${size} elemento${size>1?'s':''}.`,0);\n    if(size>1)sift(0);\n  }\n  size=0;\n  S('Pronto! Todos os elementos foram extraídos na ordem certa e o array está ordenado.');\n  return F;\n}\n\nconst A={\n  heap:{name:'Heap Sort',fn:heap,max:99,val:'38, 27, 43, 3, 9, 82, 10',d:'Transforma o array em um max-heap, depois troca a raiz (o maior) com o último elemento e reorganiza o heap. Tempo O(n log n) em todos os casos.'}\n};\nlet cur='heap',F=[],idx=0,timer=null;\n\nconst cellH=c=>`<div class=\"w\"><div class=\"c ${c.k}\">${c.h!==undefined?c.h:c.t}<\/div>${c.i!==''?`<span class=\"i\">${c.i}<\/span>`:''}<\/div>`;\nfunction treeSvg(cs){\n  const m=cs.length;if(!m)return '';\n  const W=640,L=Math.floor(Math.log2(m))+1,H=L*58+8;let e='',nd='';\n  cs.forEach((c,k)=>{\n    const lv=Math.floor(Math.log2(k+1)),pos=k+1-2**lv,x=(pos+.5)/2**lv*W,y=26+lv*58;\n    if(k>0){const p=Math.floor((k-1)/2),pl=Math.floor(Math.log2(p+1)),pp=p+1-2**pl;\n      e+=`<line class=\"e\" x1=\"${(pp+.5)/2**pl*W}\" y1=\"${26+pl*58}\" x2=\"${x}\" y2=\"${y}\"/>`}\n    nd+=`<g class=\"nd ${c.k}\"><circle cx=\"${x}\" cy=\"${y}\" r=\"20\"/><text x=\"${x}\" y=\"${y}\" dy=\".35em\" text-anchor=\"middle\">${c.t}<\/text><\/g>`;\n  });\n  return `<svg viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"Heap como árvore binária\" style=\"width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto\">${e}${nd}<\/svg>`;\n}\nfunction draw(f){\n  $('stage').innerHTML=f.blocks.map(b=>b.type==='tree'?`<h3>${b.label}<\/h3>${treeSvg(b.cells)}`:b.type==='row'\n    ?`<h3>${b.label}<\/h3><div class=\"row\">${b.cells.map(cellH).join('')}<\/div>`\n    :`<h3>${b.label}<\/h3><div class=\"cols\">${b.cols.map(c=>`<div class=\"col\"><span class=\"ch\">${c.h}<\/span><div class=\"stack\">${c.cells.map(cellH).join('')}<\/div><\/div>`).join('')}<\/div>`).join('');\n  $('msg').textContent=f.msg;\n  $('pos').textContent=`Passo ${idx+1} de ${F.length}`;\n  $('prev').disabled=idx===0;$('next').disabled=idx===F.length-1;\n}\nfunction go(n){idx=Math.max(0,Math.min(F.length-1,n));draw(F[idx])}\nfunction stop(){clearInterval(timer);timer=null;$('play').textContent='Reproduzir'}\nfunction start(){clearInterval(timer);$('play').textContent='Pausar';timer=setInterval(()=>{if(idx>=F.length-1){stop();return}go(idx+1)},1700-$('spd').value)}\nfunction load(){\n  stop();\n  const m=A[cur].max,r=$('inp').value.split(/[\\s,;]+/).filter(Boolean).map(Number);\n  if(r.length<2||r.length>12||r.some(x=>!Number.isInteger(x)||x<0||x>m)){$('msg').textContent=`Digite de 2 a 12 números inteiros entre 0 e ${m}, separados por vírgula.`;return}\n  A[cur].val=r.join(', ');F=A[cur].fn(r);go(0);\n}\nfunction pick(k){\n  cur=k;stop();\n  $('desc').textContent=A[k].d;$('inp').value=A[k].val;load();\n}\n$('apply').onclick=load;\n$('inp').onkeydown=e=>{if(e.key==='Enter')load()};\n$('rnd').onclick=()=>{const m=A[cur].max;$('inp').value=Array.from({length:8},()=>Math.floor(Math.random()*(m+1))).join(', ');load()};\n$('prev').onclick=()=>{stop();go(idx-1)};\n$('next').onclick=()=>{stop();go(idx+1)};\n$('play').onclick=()=>{if(timer){stop();return}if(idx>=F.length-1)go(0);start()};\n$('spd').oninput=()=>{if(timer)start()};\npick('heap');\n<\/script>\n<\/body>\n<\/html>\n"},{"tipo":"file","nome":"Guia completo: Heap Sort","arq":"guia_completo_heap_sort.md","path":"Ordenacoes/Heap/guia_completo_heap_sort.md","ext":"md","kind":"guia","tamanho":8899,"conteudo":"# Guia Completo: Algoritmo Heap Sort (Ordenação por Heap)\n\nO **Heap Sort** (ou Ordenação por Heap) é um algoritmo de ordenação baseado em uma estrutura chamada **heap binário**: uma árvore binária quase completa em que todo **pai é maior ou igual aos seus filhos** (*max-heap*). Como a raiz de um max-heap é sempre o maior elemento, o algoritmo repete duas ideias simples: **tirar o maior da raiz** e **reorganizar o heap**.\n\nEle une o melhor de dois mundos: garante $\\mathcal{O}(n \\log n)$ em **todos os casos**, como o Merge Sort, e é **in-place**, como o Quick Sort, usando apenas $\\mathcal{O}(1)$ de memória extra.\n\n---\n\n## 🏔️ Como Funciona? (A Analogia do Campeonato)\n\nImagine um torneio em que cada jogador só precisa ser **melhor que os dois adversários logo abaixo dele** na chave. O campeão fica no topo:\n1. Você monta a chave de modo que cada jogador seja melhor que seus dois \"filhos\". O maior de todos está no topo (**construção do heap**).\n2. Você tira o campeão do topo e o coloca na **última posição** do ranking final.\n3. Pega o último jogador da chave, coloca-o no topo (onde não deveria estar) e deixa que ele **desça** trocando com o melhor dos dois filhos até ocupar um lugar justo (**sift down**, ou \"peneirar\").\n4. Repete: o novo campeão está no topo, vai para a penúltima posição, e assim por diante.\n\n### O heap dentro de um array\n\nUm heap não precisa de ponteiros: ele cabe direto em um array. Para o elemento na posição `i` (começando em 0):\n\n| Relação | Posição |\n|---|---|\n| Filho esquerdo | `2*i + 1` |\n| Filho direito | `2*i + 2` |\n| Pai | `(i - 1) / 2` |\n\nO array `[82, 27, 43, 3, 9, 38, 10]` representa esta árvore:\n\n```\n            82\n          /    \\\n       27        43\n      /  \\      /  \\\n     3    9   38    10\n```\n\n### As duas fases do algoritmo\n\n1. **Construir o max-heap:** percorre os nós que têm filhos, do **último pai até a raiz**, aplicando o *sift down* em cada um.\n2. **Extrair o máximo repetidamente:** troca a raiz (maior) com o último elemento do heap, **diminui o tamanho do heap em 1** (o maior já está na posição final) e aplica *sift down* na nova raiz.\n\n### Exemplo passo a passo\n\nArray inicial: `[38, 27, 43, 3, 9, 82, 10]`\n\n**Fase 1: construção do max-heap** (último pai = posição 2)\n\n| Nó processado | Filhos | Ação | Array |\n|---|---|---|---|\n| 43 (pos. 2) | 82, 10 | 82 é o maior: troca | `[38, 27, 82, 3, 9, 43, 10]` |\n| 27 (pos. 1) | 3, 9 | 27 já é maior: nada | `[38, 27, 82, 3, 9, 43, 10]` |\n| 38 (pos. 0) | 27, 82 | 82 é o maior: troca; depois, 43 > 38: troca | `[82, 27, 43, 3, 9, 38, 10]` |\n\n**Fase 2: extração do máximo** (a parte à direita de `|` já está ordenada)\n\n| Passo | Troca raiz com | Depois de reorganizar o heap |\n|---|---|---|\n| 1 | 10 | `[43, 27, 38, 3, 9, 10 \\| 82]` |\n| 2 | 10 | `[38, 27, 10, 3, 9 \\| 43, 82]` |\n| 3 | 9 | `[27, 9, 10, 3 \\| 38, 43, 82]` |\n| 4 | 3 | `[10, 9, 3 \\| 27, 38, 43, 82]` |\n| 5 | 3 | `[9, 3 \\| 10, 27, 38, 43, 82]` |\n| 6 | 3 | `[3 \\| 9, 10, 27, 38, 43, 82]` |\n\nResultado final: `[3, 9, 10, 27, 38, 43, 82]`\n\n---\n\n## ⚙️ Características Mais Importantes\n\n### 1. Complexidade de Tempo (Velocidade)\n*   **Melhor Caso:** $\\mathcal{O}(n \\log n)$\n*   **Pior Caso:** $\\mathcal{O}(n \\log n)$\n*   **Caso Médio:** $\\mathcal{O}(n \\log n)$\n    *   Cada *sift down* percorre no máximo a altura do heap, que é $\\log_2 n$. A extração faz $n - 1$ delas.\n\n> **Detalhe importante:** construir o heap, apesar de parecer custar $n \\log n$, custa apenas $\\mathcal{O}(n)$. A maioria dos nós está perto das folhas e desce pouquíssimo; só poucos nós, perto da raiz, descem muito. O custo total da ordenação é dominado pela fase de extração.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(1)$ (na versão iterativa)\n    *   É **in-place**: o heap vive dentro do próprio array. Com o *sift down* recursivo, a pilha usa $\\mathcal{O}(\\log n)$, mas a versão com laço usa apenas $\\mathcal{O}(1)$.\n\n### 3. Estabilidade\n*   **É Estável?** Não.\n    *   As trocas entre a raiz e o último elemento levam valores para longe de suas posições originais, quebrando a ordem de elementos iguais.\n\n### 4. Baseado em Comparação?\n*   **Sim.** Atinge o limite inferior $\\Omega(n \\log n)$ e é assintoticamente ótimo entre os algoritmos por comparação.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não.\n    *   Dados já ordenados não ajudam: o algoritmo constrói o heap e extrai todos os elementos do mesmo jeito.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   Precisa de todos os dados para construir o heap inicial. (Mas a estrutura de heap, em si, aceita inserções, e é a base das **filas de prioridade**.)\n\n---\n\n## 📊 Comparação com Outros Algoritmos\n\n| Característica | Merge Sort | Quick Sort | **Heap Sort** |\n|---|---|---|---|\n| Melhor caso | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ |\n| Pior caso | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n^2)$ | **$\\mathcal{O}(n \\log n)$** |\n| Espaço extra | $\\mathcal{O}(n)$ | $\\mathcal{O}(\\log n)$ | **$\\mathcal{O}(1)$** |\n| Estável | **Sim** | Não | Não |\n| In-place | Não | Sim | **Sim** |\n| Velocidade prática | Boa | **A melhor** | Mais lenta que as outras duas |\n\nNa prática, o Heap Sort costuma perder para o Quick Sort por ter **pior localidade de cache**: os saltos entre pai e filhos (`i`, `2i+1`, `2i+2`) pulam por regiões distantes da memória.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Desempenho garantido:** $\\mathcal{O}(n \\log n)$ no pior caso, sem surpresas.\n*   **Memória mínima:** $\\mathcal{O}(1)$ de espaço extra.\n*   **Não depende de pivôs nem da disposição dos dados.**\n*   **Reaproveita a estrutura de heap:** a mesma ideia sustenta as filas de prioridade.\n\n**Desvantagens:**\n*   **Mais lento na prática** que o Quick Sort, por causa do acesso à memória pouco amigável ao cache.\n*   **Não é estável.**\n*   **Não é adaptável:** não aproveita dados já ordenados.\n*   **Não é online.**\n\n---\n\n## 💻 Exemplo Clássico em C\n\nO código completo, com um comentário em cada linha e um `main` de exemplo, está no arquivo `heap_sort.c`. Abaixo, o essencial:\n\n```c\nvoid swap(int *a, int *b) {\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n\n// \"Peneira\" o nó i para baixo, considerando que o heap tem n elementos\nvoid heapify(int arr[], int n, int i) {\n    int largest = i;\n    int left  = 2 * i + 1;\n    int right = 2 * i + 2;\n\n    if (left < n && arr[left] > arr[largest])   largest = left;\n    if (right < n && arr[right] > arr[largest]) largest = right;\n\n    if (largest != i) {                 // algum filho é maior que o pai\n        swap(&arr[i], &arr[largest]);\n        heapify(arr, n, largest);       // continua descendo\n    }\n}\n\nvoid heapSort(int arr[], int n) {\n    // Fase 1: constrói o max-heap, do último pai até a raiz\n    for (int i = n / 2 - 1; i >= 0; i--)\n        heapify(arr, n, i);\n\n    // Fase 2: move o maior para o fim e reorganiza o heap restante\n    for (int end = n - 1; end > 0; end--) {\n        swap(&arr[0], &arr[end]);\n        heapify(arr, end, 0);\n    }\n}\n```\n\n**Pontos de atenção no código:**\n*   O último nó com filhos está na posição `n / 2 - 1`; os nós depois dele são folhas e não precisam de *sift down*.\n*   Na fase 2, `heapify(arr, end, 0)` usa `end` como novo tamanho do heap: as posições a partir de `end` já estão ordenadas e ficam de fora.\n*   Os dois `if` consecutivos escolhem o maior entre o pai e os dois filhos, comparando o filho direito com o **vencedor** da primeira comparação.\n\n---\n\n## 🎯 Quando devo usar o Heap Sort?\n\n*   **Quando é preciso garantia de $\\mathcal{O}(n \\log n)$ sem memória extra:** sistemas embarcados e de tempo real, onde o pior caso do Quick Sort e a memória do Merge Sort são problemas.\n*   **Como proteção no Introsort:** quando a recursão do Quick Sort fica profunda demais, troca-se para Heap Sort.\n*   **Quando só se precisa dos $k$ maiores (ou menores) elementos:** basta extrair $k$ vezes do heap, sem ordenar tudo.\n*   **Filas de prioridade:** a estrutura de heap é a base de agendadores de tarefas, algoritmo de Dijkstra e compressão de Huffman.\n\nEvite quando a estabilidade for necessária (prefira o **Merge Sort**) ou quando a velocidade média for o principal critério (prefira o **Quick Sort**).\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** construa um max-heap e extraia o maior elemento repetidamente, levando-o para o fim do array.\n*   **Tempo:** $\\mathcal{O}(n \\log n)$ em todos os casos (construção do heap em $\\mathcal{O}(n)$).\n*   **Espaço:** $\\mathcal{O}(1)$, in-place.\n*   **Estável:** não. **Adaptável:** não. **Online:** não.\n*   **Estrutura-chave:** heap binário armazenado em array (`2i+1`, `2i+2`, `(i-1)/2`).\n*   **Destaque:** desempenho garantido com memória mínima.\n"},{"tipo":"file","nome":"Heap Sort","arq":"Heapsort.c","path":"Ordenacoes/Heap/Heapsort.c","ext":"c","kind":"codigo","tamanho":3003,"conteudo":"#include <stdio.h>  // printf: entrada e saída\n\n// Troca os valores de duas variáveis (recebe os endereços delas)\nvoid swap(int *a, int *b) {\n    int temp = *a;  // guarda o valor apontado por a\n    *a = *b;        // coloca em a o valor de b\n    *b = temp;      // coloca em b o valor guardado de a\n}\n\n// \"Peneira\" o nó i para baixo (sift down), considerando que o heap tem n elementos.\n// Pré-condição: as duas subárvores de i já são max-heaps.\nvoid heapify(int arr[], int n, int i) {\n    int largest = i;        // assume que o maior entre pai e filhos é o próprio pai\n    int left = 2 * i + 1;   // posição do filho esquerdo\n    int right = 2 * i + 2;  // posição do filho direito\n\n    if (left < n && arr[left] > arr[largest]) {  // o filho esquerdo existe e é maior?\n        largest = left;                          // então ele é o maior até agora\n    }\n    if (right < n && arr[right] > arr[largest]) {  // o filho direito existe e é maior que o vencedor?\n        largest = right;                           // então ele é o maior\n    }\n\n    if (largest != i) {                // algum filho é maior que o pai?\n        swap(&arr[i], &arr[largest]);  // troca o pai com o maior filho\n        heapify(arr, n, largest);      // continua descendo, pois o valor trocado pode violar a regra abaixo\n    }\n    // se largest == i, o pai já é maior que os filhos: o heap está correto aqui\n}\n\n// Ordena o array com Heap Sort\nvoid heapSort(int arr[], int n) {\n    // Fase 1: construir o max-heap\n    // n / 2 - 1 é o último nó que tem filhos; os nós depois dele são folhas\n    for (int i = n / 2 - 1; i >= 0; i--) {  // do último pai até a raiz\n        heapify(arr, n, i);                 // garante que o nó i respeite a regra do max-heap\n    }\n\n    // Fase 2: extrair o maior elemento repetidamente\n    for (int end = n - 1; end > 0; end--) {  // end = última posição do heap atual\n        swap(&arr[0], &arr[end]);            // leva o maior (raiz) para a posição final\n        heapify(arr, end, 0);                // reorganiza o heap, agora com end elementos (o maior ficou de fora)\n    }\n}\n\n// Imprime um título e depois todos os elementos do array\nvoid printArray(const char *titulo, int arr[], int n) {\n    printf(\"%s\\n\", titulo);        // escreve o título em uma linha\n    for (int i = 0; i < n; i++) {  // percorre o array\n        printf(\"%d \", arr[i]);     // imprime cada número seguido de espaço\n    }\n    printf(\"\\n\");                  // quebra de linha no final\n}\n\nint main() {\n    int arr[] = {38, 27, 43, 3, 9, 82, 10};  // array de exemplo\n    int n = sizeof(arr) / sizeof(arr[0]);    // número de elementos = tamanho total / tamanho de um elemento\n\n    printArray(\"Array original:\", arr, n);   // mostra o array antes de ordenar\n    heapSort(arr, n);                        // ordena com Heap Sort\n    printArray(\"Array ordenado:\", arr, n);   // mostra o array depois de ordenar\n\n    return 0;  // 0 indica que o programa terminou sem erros\n}"}]}]},{"tipo":"dir","nome":"Listas","arq":"LIsta","path":"LIsta","children":[{"tipo":"dir","nome":"Lista dupla encadeada","arq":"ListaDuplaEncadeada","path":"LIsta/ListaDuplaEncadeada","children":[{"tipo":"file","nome":"Lista Dupla Encadeada Remover Final","arq":"ListaDuplaEncadeadaRemoverFInal.c","path":"LIsta/ListaDuplaEncadeada/ListaDuplaEncadeadaRemoverFInal.c","ext":"c","kind":"codigo","tamanho":1548,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct CelulaDupla\n{\n    int elemento;\n    struct CelulaDupla *prox, *ant;\n} CelulaDupla;\n\nCelulaDupla *novaCelula(int elemento)\n{\n    CelulaDupla *nova = (CelulaDupla *)malloc(sizeof(CelulaDupla));\n    nova->elemento = elemento;\n    nova->prox = nova->ant = NULL;\n    return nova;\n}\n\nvoid removerFinal(CelulaDupla **primeiro,CelulaDupla **ultimo){\n    if((*primeiro)==(*ultimo)){\n        printf(\"erro\");\n        return;\n    }\n    int elemento = (*ultimo)->elemento;\n    (*ultimo) = (*ultimo)->ant;\n    (*ultimo)->prox->ant =NULL;\n    free((*ultimo)->prox);\n    (*ultimo)->prox = NULL;\n}\n\nint main()\n{\n    int valor;\n    int cont = 0;\n    CelulaDupla *primeiro = NULL;\n    CelulaDupla *ultimo = NULL;\n    while (scanf(\"%d\", &valor) == 1)\n    {\n        cont++;\n        CelulaDupla *nova = novaCelula(valor);\n        if (primeiro == NULL)\n        {\n            primeiro = nova;\n            ultimo = nova;\n        }\n        else\n        {\n            ultimo->prox = nova;\n            nova->ant = ultimo;\n            ultimo = nova;\n        }\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);\n\n    removerFinal(&primeiro,&ultimo);\n\n\n     CelulaDupla *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        CelulaDupla *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n}"},{"tipo":"file","nome":"Lista Dupla Encadeada Remover Primeiro","arq":"ListaDuplaEncadeadaRemoverPrimeiro.c","path":"LIsta/ListaDuplaEncadeada/ListaDuplaEncadeadaRemoverPrimeiro.c","ext":"c","kind":"codigo","tamanho":1664,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct CelulaDupla\n{\n    int elemento;\n    struct CelulaDupla *prox, *ant;\n} CelulaDupla;\n\nCelulaDupla *novaCelula(int elemento)\n{\n    CelulaDupla *nova = (CelulaDupla *)malloc(sizeof(CelulaDupla));\n    nova->elemento = elemento;\n    nova->prox = nova->ant = NULL;\n    return nova;\n}\n\nvoid removerInicio(CelulaDupla **primeiro,CelulaDupla **ultimo){\n    if((*primeiro)==(*ultimo)){\n       printf(\"erro\");\n       return;\n    }\n    CelulaDupla *tmp = (*primeiro);\n    (*primeiro) = (*primeiro)->prox ;\n    if(tmp == (*ultimo)){\n    (*ultimo) = (*primeiro);\n    }\n    int elemento  = (*primeiro)->elemento;\n    tmp->prox = (*primeiro)->ant = NULL;\n    tmp->ant = NULL;\n    free(tmp);\n    tmp = NULL;\n\n}   \n\nint main()\n{\n    int valor;\n    int cont = 0;\n    CelulaDupla *primeiro = NULL;\n    CelulaDupla *ultimo = NULL;\n    while (scanf(\"%d\", &valor) == 1)\n    {\n        cont++;\n        CelulaDupla *nova = novaCelula(valor);\n        if (primeiro == NULL)\n        {\n            primeiro = nova;\n            ultimo = nova;\n        }\n        else\n        {\n            ultimo->prox = nova;\n            nova->ant = ultimo;\n            ultimo = nova;\n        }\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);\n\n    removerInicio(&primeiro,&ultimo);\n\n\n     CelulaDupla *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual
