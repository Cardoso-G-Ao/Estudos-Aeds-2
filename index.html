    while(scanf(\"%d\",&valor) == 1){\n    cont++;\n    CelulaDupla *nova = novaCelula(valor);\n    if(primeiro == NULL){\n        primeiro = nova;\n        ultimo =nova;\n    }else{\n        ultimo->prox = nova;\n        nova->ant = ultimo; \n        ultimo = nova;\n    }\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);\n\n    inserir(&primeiro,&ultimo);\n\n    CelulaDupla *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        CelulaDupla *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n\n}\n   "},{"tipo":"file","nome":"Fila Remover D","arq":"FilaRemoverD.c","path":"Fila/FIlaDuplamenteEncadeada/FilaRemoverD.c","ext":"c","kind":"codigo","tamanho":1406,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct CelulaDupla\n{\n    int elemento;\n    struct CelulaDupla *prox;\n    struct CelulaDupla *ant;\n} CelulaDupla;\n\nCelulaDupla *novaCelula(int elemento)\n{\n    CelulaDupla *nova = (CelulaDupla *)malloc(sizeof(CelulaDupla));\n    nova->elemento = elemento;\n    nova->prox = nova->ant = NULL;\n    return nova;\n}\n\nvoid remover(CelulaDupla **primeiro,CelulaDupla **ultimo , int *cont){\n    if((*cont) == 0){\n        printf(\"erro\");\n        return;\n    }\n    (*primeiro) = (*primeiro)->prox;\n    (*primeiro)->ant = NULL;\n}\n\n\nint main()\n{\n    int valor;\n    int cont = 0 ;\n    CelulaDupla *primeiro = NULL;\n    CelulaDupla *ultimo = NULL;\n    while(scanf(\"%d\",&valor) == 1){\n    cont++;\n    CelulaDupla *nova = novaCelula(valor);\n    if(primeiro == NULL){\n        primeiro = nova;\n        ultimo =nova;\n    }else{\n        ultimo->prox = nova;\n        nova->ant = ultimo; \n        ultimo = nova;\n    }\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);\n\n    remover(&primeiro,&ultimo,&cont);\n\n    CelulaDupla *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        CelulaDupla *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n\n}\n   "}]},{"tipo":"dir","nome":"Fila encadeada normal","arq":"FilaEncadeadaNormal","path":"Fila/FilaEncadeadaNormal","children":[{"tipo":"file","nome":"Fila","arq":"fila.c","path":"Fila/FilaEncadeadaNormal/fila.c","ext":"c","kind":"codigo","tamanho":1212,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Celula\n{\n    int elemento;\n    struct Celula *prox;\n} Celula;\n\nCelula *novaCelula(int elemento)\n{\n    Celula *nova = (Celula *)malloc(sizeof(Celula));\n    nova->elemento = elemento;\n    nova->prox = NULL;\n    return nova;\n}\nvoid inserir(Celula **primeiro , Celula **ultimo){\n    int x;\n    scanf(\"%d\",&x);\n    (*ultimo)->prox = novaCelula(x);\n    (*ultimo) = (*ultimo)->prox;\n}\n\n\nint main(){\n    int valor;\n    Celula *primeiro = NULL;\n    Celula *ultimo = NULL;\n    while(scanf(\"%d\",&valor) == 1){\n    Celula *nova = novaCelula(valor);\n\n        if(primeiro == NULL){\n            primeiro = nova;\n            ultimo = nova;\n        }else {\n            ultimo->prox = nova;\n            ultimo = nova;\n        }\n\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);\n\n\n    inserir(&primeiro,&ultimo);\n\n    Celula *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        Celula *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n}"},{"tipo":"file","nome":"Fila Remover","arq":"filaRemover.c","path":"Fila/FilaEncadeadaNormal/filaRemover.c","ext":"c","kind":"codigo","tamanho":1349,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Celula\n{\n    int elemento;\n    struct Celula *prox;\n} Celula;\n\nCelula *novaCelula(int elemento)\n{\n    Celula *nova = (Celula *)malloc(sizeof(Celula));\n    nova->elemento = elemento;\n    nova->prox = NULL;\n    return nova;\n}\nvoid remover(Celula **primeiro , Celula **ultimo){\n    if((*primeiro)==(*ultimo)){\n        printf(\"erro\");\n        return;\n    }\n    Celula *tmp = (*primeiro);\n    (*primeiro) = (*primeiro)->prox;\n    int elemento = (*primeiro)->elemento;\n   tmp->prox = NULL;\n   free(tmp);\n   tmp =NULL;\n}\n\n\nint main(){\n    int valor;\n    Celula *primeiro = NULL;\n    Celula *ultimo = NULL;\n    while(scanf(\"%d\",&valor) == 1){\n    Celula *nova = novaCelula(valor);\n\n        if(primeiro == NULL){\n            primeiro = nova;\n            ultimo = nova;\n        }else {\n            ultimo->prox = nova;\n            ultimo = nova;\n        }\n\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);\n\n\n    remover(&primeiro,&ultimo);\n\n\n    Celula *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        Celula *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n}"}]}]},{"tipo":"dir","nome":"Pilhas","arq":"Pilha","path":"Pilha","children":[{"tipo":"file","nome":"Pilha: inserir (empilhar)","arq":"PilhaInserir.c","path":"Pilha/PilhaInserir.c","ext":"c","kind":"codigo","tamanho":1629,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\n// Entrada esperada (mesmo formato da fila):\n//   1ª linha: números separados por espaço, terminando com uma letra (ex.: 10 20 30 x)\n//   2ª linha: o valor que será empilhado (ex.: 40)\n\ntypedef struct Celula\n{\n    int elemento;\n    struct Celula *prox;\n} Celula;\n\nCelula *novaCelula(int elemento)\n{\n    Celula *nova = (Celula *)malloc(sizeof(Celula));\n    nova->elemento = elemento;\n    nova->prox = NULL;\n    return nova;\n}\n\n// Empilhar: a nova célula entra no TOPO e aponta para o antigo topo\nvoid empilhar(Celula **topo){\n    int x;\n    if(scanf(\"%d\",&x) != 1){   // não conseguiu ler o valor\n        printf(\"erro\\n\");\n        return;\n    }\n    Celula *nova = novaCelula(x);\n    nova->prox = (*topo);      // a nova célula aponta para quem estava no topo\n    (*topo) = nova;            // o topo passa a ser a nova célula\n}\n\n\nint main(){\n    int valor;\n    Celula *topo = NULL;       // a pilha só precisa guardar o topo\n    while(scanf(\"%d\",&valor) == 1){\n        Celula *nova = novaCelula(valor);\n        nova->prox = topo;     // empilha cada número lido\n        topo = nova;\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);   // descarta o resto da linha\n\n\n    empilhar(&topo);\n\n    Celula *atual = topo;      // mostra do topo até a base\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox;\n    }\n    printf(\"\\n\");\n\n    atual = topo;              // libera toda a memória\n    while (atual != NULL) {\n        Celula *proxima = atual->prox;\n        free(atual);\n        atual = proxima;\n    }\n\n    return 0;\n}"},{"tipo":"file","nome":"Pilha: remover (desempilhar)","arq":"PilhaRemover.c","path":"Pilha/PilhaRemover.c","ext":"c","kind":"codigo","tamanho":1632,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\n// Entrada esperada (mesmo formato da fila):\n//   uma linha com números separados por espaço, terminando com uma letra (ex.: 10 20 30 x)\n\ntypedef struct Celula\n{\n    int elemento;\n    struct Celula *prox;\n} Celula;\n\nCelula *novaCelula(int elemento)\n{\n    Celula *nova = (Celula *)malloc(sizeof(Celula));\n    nova->elemento = elemento;\n    nova->prox = NULL;\n    return nova;\n}\n\n// Desempilhar: remove a célula do TOPO (o último que entrou)\nvoid desempilhar(Celula **topo){\n    if((*topo) == NULL){       // pilha vazia: não há o que remover\n        printf(\"erro\\n\");\n        return;\n    }\n    Celula *tmp = (*topo);     // guarda a célula que vai sair\n    (*topo) = (*topo)->prox;   // o topo passa a ser a célula de baixo\n    printf(\"Desempilhado: %d\\n\", tmp->elemento);\n    tmp->prox = NULL;\n    free(tmp);\n    tmp = NULL;\n}\n\n\nint main(){\n    int valor;\n    Celula *topo = NULL;       // a pilha só precisa guardar o topo\n    while(scanf(\"%d\",&valor) == 1){\n        Celula *nova = novaCelula(valor);\n        nova->prox = topo;     // empilha cada número lido\n        topo = nova;\n    }\n    int c;\n    while ((c = getchar()) != '\\n' && c != EOF);   // descarta o resto da linha\n\n\n    desempilhar(&topo);\n\n\n    Celula *atual = topo;      // mostra do topo até a base\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox;\n    }\n    printf(\"\\n\");\n\n    atual = topo;              // libera toda a memória\n    while (atual != NULL) {\n        Celula *proxima = atual->prox;\n        free(atual);\n        atual = proxima;\n    }\n\n    return 0;\n}"}]},{"tipo":"dir","nome":"Células","arq":"CelulaEstrutura","path":"CelulaEstrutura","children":[{"tipo":"file","nome":"Célula","arq":"Celula.c","path":"CelulaEstrutura/Celula.c","ext":"c","kind":"codigo","tamanho":1006,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Celula\n{\n    int elemento;\n    struct Celula *prox;\n} Celula;\n\nCelula *novaCelula(int elemento)\n{\n    Celula *nova = (Celula *)malloc(sizeof(Celula));\n    nova->elemento = elemento;\n    nova->prox = NULL;\n    return nova;\n}\n\nint main()\n{\n    int valor ;\n    int cont = 0;\n    Celula *primeiro = NULL;\n    Celula *ultimo = NULL;\n\n    while(scanf(\"%d\",&valor) == 1){\n        cont++;\n        Celula *nova = novaCelula(valor);\n\n        if(primeiro == NULL){\n            primeiro = nova;\n            ultimo = nova;\n        }else {\n            ultimo->prox = nova;\n            ultimo = nova;\n        }\n    }\n    Celula *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        Celula *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n}\n   "},{"tipo":"file","nome":"Célula com cabeça","arq":"Celulacabeca.c","path":"CelulaEstrutura/Celulacabeca.c","ext":"c","kind":"codigo","tamanho":874,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Celula{\n    int elemento;\n    struct Celula *prox;\n}Celula;\n\nCelula *novaCelula(int elemento)\n{\n    Celula *nova = (Celula *)malloc(sizeof(Celula));\n    nova->elemento = elemento;\n    nova->prox = NULL;\n    return nova;\n}\n\nint main(){\n    Celula *primeiro = novaCelula(0);\n    Celula *ultimo = primeiro;\n    int valor;\n    int cont = 0 ;\n    while(scanf(\"%d\",&valor) == 1){\n    cont++;\n    Celula *nova = novaCelula(valor);\n    ultimo->prox = nova;\n    ultimo = nova;\n    }\n    Celula *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        Celula *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n}"},{"tipo":"file","nome":"Célula dupla","arq":"CelulaDupla.c","path":"CelulaEstrutura/CelulaDupla.c","ext":"c","kind":"codigo","tamanho":1099,"conteudo":"#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct CelulaDupla\n{\n    int elemento;\n    struct CelulaDupla *prox;\n    struct CelulaDupla *ant;\n} CelulaDupla;\n\nCelulaDupla *novaCelula(int elemento)\n{\n    CelulaDupla *nova = (CelulaDupla *)malloc(sizeof(CelulaDupla));\n    nova->elemento = elemento;\n    nova->prox = nova->ant = NULL;\n    return nova;\n}\n\nint main()\n{\n    int valor;\n    int cont = 0 ;\n    CelulaDupla *primeiro = NULL;\n    CelulaDupla *ultimo = NULL;\n    while(scanf(\"%d\",&valor) == 1){\n    cont++;\n    CelulaDupla *nova = novaCelula(valor);\n    if(primeiro == NULL){\n        primeiro = nova;\n        ultimo =nova;\n    }else{\n        ultimo->prox = nova;\n        nova->ant = ultimo; \n        ultimo = nova;\n    }\n    }\n      CelulaDupla *atual = primeiro;\n    while (atual != NULL) {\n        printf(\"%d \", atual->elemento);\n        atual = atual->prox; \n    }\n    printf(\"\\n\");\n\n    atual = primeiro;\n    while (atual != NULL) {\n        CelulaDupla *proxima = atual->prox; \n        free(atual);                   \n        atual = proxima;               \n    }\n\n    return 0;\n\n}\n   "}]},{"tipo":"dir","nome":"Estudos","arq":"Estudos","path":"Estudos","children":[{"tipo":"dir","nome":"Fila circular (estudos)","arq":"FIlaCircularEstudos","path":"Estudos/FIlaCircularEstudos","children":[{"tipo":"file","nome":"Fila circular com espaço de segurança","arq":"fila_circular_com_espa_o_de_seguran_a.html","path":"Estudos/FIlaCircularEstudos/fila_circular_com_espa_o_de_seguran_a.html","ext":"html","kind":"demo","tamanho":9664,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Fila Circular com Espaço de Segurança<\/title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n    <style>\n        body { font-family: 'Inter', sans-serif; }\n    <\/style>\n<\/head>\n<body class=\"bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8\">\n\n    <header class=\"w-full max-w-4xl text-center mb-8\">\n        <h1 class=\"text-3xl sm:text-4xl font-bold text-amber-400 mb-2\">Fila Circular: O Espaço de Segurança<\/h1>\n        <p class=\"text-slate-400 text-sm sm:text-base\">Demonstração visual do uso de uma posição ociosa para diferenciar o estado \"Cheia\" do estado \"Vazia\".<\/p>\n    <\/header>\n\n    <main class=\"w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col gap-6\">\n        \n        <\u0021-- Controls & Input Section -->\n        <div class=\"flex flex-wrap items-center justify-between gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50\">\n            <div class=\"flex items-center gap-3 w-full sm:w-auto\">\n                <input type=\"number\" id=\"valorInput\" placeholder=\"Digite um valor\" class=\"bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500 w-full sm:w-40\">\n                <button onclick=\"enfileirar()\" class=\"bg-amber-600 hover:bg-amber-500 text-white font-medium px-5 py-2 rounded-lg transition-all shadow-md active:scale-95 cursor-pointer\">Enfileirar<\/button>\n            <\/div>\n            <div class=\"flex items-center gap-3 w-full sm:w-auto\">\n                <button onclick=\"desenfileirar()\" class=\"bg-rose-600 hover:bg-rose-500 text-white font-medium px-5 py-2 rounded-lg transition-all shadow-md active:scale-95 cursor-pointer flex-1 sm:flex-none\">Desenfileirar<\/button>\n                <button onclick=\"reiniciarFila()\" class=\"bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium px-4 py-2 rounded-lg transition-all border border-slate-600 cursor-pointer\">Reiniciar<\/button>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Queue Status Panel -->\n        <div class=\"grid grid-cols-2 sm:grid-cols-4 gap-4 text-center\">\n            <div class=\"bg-slate-900/80 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"block text-xs text-slate-400 uppercase font-semibold\">Capacidade Física<\/span>\n                <span id=\"capacidadeTxt\" class=\"text-xl font-bold text-sky-400\">5<\/span>\n            <\/div>\n            <div class=\"bg-slate-900/80 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"block text-xs text-slate-400 uppercase font-semibold\">Espaços Úteis<\/span>\n                <span id=\"uteisTxt\" class=\"text-xl font-bold text-amber-400\">4<\/span>\n            <\/div>\n            <div class=\"bg-slate-900/80 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"block text-xs text-slate-400 uppercase font-semibold\">Ponteiro Frente<\/span>\n                <span id=\"frenteTxt\" class=\"text-xl font-bold text-purple-400\">0<\/span>\n            <\/div>\n            <div class=\"bg-slate-900/80 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"block text-xs text-slate-400 uppercase font-semibold\">Ponteiro Trás<\/span>\n                <span id=\"trasTxt\" class=\"text-xl font-bold text-emerald-400\">0<\/span>\n            <\/div>\n        <\/div>\n\n        <div class=\"flex flex-col items-center justify-center my-6\">\n            <p class=\"text-xs text-slate-400 mb-4 tracking-wider uppercase font-medium\">Vetor Físico (Capacidade 5, onde 1 posição é reservada como espaço vazio):<\/p>\n            <div id=\"gridVetor\" class=\"grid grid-cols-5 gap-3 w-full max-w-xl\">\n                <\u0021-- Injetado dinamicamente via JavaScript -->\n            <\/div>\n        <\/div>\n\n        <\u0021-- Log/Console output area -->\n        <div class=\"bg-slate-900 rounded-xl p-4 border border-slate-700/60\">\n            <span class=\"block text-xs text-slate-400 font-mono mb-2 uppercase tracking-wide\">Log de Ações e Regra de Cheia:<\/span>\n            <div id=\"logArea\" class=\"h-28 overflow-y-auto font-mono text-xs text-slate-300 space-y-1 flex flex-col-reverse scrollbar-thin\">\n                <div class=\"text-slate-500\">Sistema inicializado com espaço de segurança. Fila pronta.<\/div>\n            <\/div>\n        <\/div>\n\n    <\/main>\n\n    <script>\n        const capacidadeFisica = 5; // 4 elementos úteis + 1 espaço de segurança\n        let vetor = new Array(capacidadeFisica).fill(null);\n        let frente = 0;\n        let tras = 0;\n\n        function logMensagem(msg, tipo = 'info') {\n            const logArea = document.getElementById('logArea');\n            const div = document.createElement('div');\n            let cor = 'text-slate-300';\n            if (tipo === 'sucesso') cor = 'text-emerald-400';\n            if (tipo === 'erro') cor = 'text-rose-400';\n            if (tipo === 'aviso') cor = 'text-amber-400';\n            \n            div.className = `${cor}`;\n            div.textContent = `> ${msg}`;\n            logArea.prepend(div);\n        }\n\n        function atualizarUI() {\n            document.getElementById('capacidadeTxt').textContent = capacidadeFisica;\n            document.getElementById('uteisTxt').textContent = capacidadeFisica - 1;\n            document.getElementById('frenteTxt').textContent = frente;\n            document.getElementById('trasTxt').textContent = tras;\n\n            const grid = document.getElementById('gridVetor');\n            grid.innerHTML = '';\n\n            for (let i = 0; i < capacidadeFisica; i++) {\n                const celula = document.createElement('div');\n                celula.className = \"flex flex-col items-center justify-center h-20 rounded-xl border-2 transition-all relative \";\n\n                let badges = '';\n                if (i === frente && i === tras) {\n                    celula.className += \"border-sky-500 bg-sky-950/20\";\n                    badges += '<span class=\"absolute -top-3 text-[10px] bg-sky-600 text-white px-2 py-0.5 rounded-full font-bold shadow\">FRENTE & TRÁS (Vazia)<\/span>';\n                } else {\n                    if (i === frente) {\n                        celula.className += \"border-purple-500 bg-purple-950/20\";\n                        badges += '<span class=\"absolute -top-3 text-[10px] bg-purple-600 text-white px-1.5 py-0.5 rounded-full font-bold shadow\">FRENTE<\/span>';\n                    }\n                    if (i === tras) {\n                        celula.className += \"border-amber-500 bg-amber-950/20\";\n                        badges += '<span class=\"absolute -top-3 text-[10px] bg-amber-600 text-black font-extrabold px-1.5 py-0.5 rounded-full shadow\">TRÁS (Espaço Ocioso)<\/span>';\n                    }\n                }\n\n                if (i !== frente && i !== tras && !(i === frente && i === tras)) {\n                    celula.className += \"border-slate-700 bg-slate-800/40\";\n                }\n\n                const valorHtml = vetor[i] !== null ? `<span class=\"text-lg font-bold text-white\">${vetor[i]}<\/span>` : `<span class=\"text-slate-600 italic text-xs\">vazio/ocioso<\/span>`;\n                \n                celula.innerHTML = `\n                    ${badges}\n                    ${valorHtml}\n                    <span class=\"text-[10px] text-slate-500 mt-1 font-mono\">índice [${i}]<\/span>\n                `;\n                grid.appendChild(celula);\n            }\n        }\n\n        function enfileirar() {\n            const input = document.getElementById('valorInput');\n            const val = parseInt(input.value);\n\n            if (isNaN(val)) {\n                logMensagem(\"Digite um número válido para enfileirar.\", \"erro\");\n                return;\n            }\n\n            // Condição clássica de Fila Cheia com espaço de segurança:\n            // (tras + 1) % capacidadeFisica == frente\n            if ((tras + 1) % capacidadeFisica === frente) {\n                logMensagem(\"Fila Cheia! O ponteiro 'tras' não pode alcançar 'frente' devido ao espaço de segurança.\", \"erro\");\n                return;\n            }\n\n            // Insere na posição de trás\n            vetor[tras] = val;\n            logMensagem(`Elemento ${val} enfileirado na posição [${tras}].`, \"sucesso\");\n            \n            // Avança 'tras' circularmente\n            tras = (tras + 1) % capacidadeFisica;\n\n            input.value = '';\n            input.focus();\n            atualizarUI();\n        }\n\n        function desenfileirar() {\n            // Condição de Fila Vazia: frente == tras\n            if (frente === tras) {\n                logMensagem(\"Erro: A fila está vazia! Não há o que remover.\", \"erro\");\n                return;\n            }\n\n            const removido = vetor[frente];\n            vetor[frente] = null;\n            logMensagem(`Elemento ${removido} desenfileirado da posição [${frente}]. Espaço liberado.`, \"sucesso\");\n\n            // Avança 'frente' circularmente\n            frente = (frente + 1) % capacidadeFisica;\n\n            atualizarUI();\n        }\n\n        function reiniciarFila() {\n            vetor = new Array(capacidadeFisica).fill(null);\n            frente = 0;\n            tras = 0;\n            logMensagem(\"Fila reiniciada para o estado inicial.\", \"aviso\");\n            atualizarUI();\n        }\n\n        // Inicializa a interface no carregamento\n        window.onload = function() {\n            atualizarUI();\n        };\n    <\/script>\n<\/body>\n<\/html>"},{"tipo":"file","nome":"Fila circular: conceitos","arq":"Filacircular.md","path":"Estudos/FIlaCircularEstudos/Filacircular.md","ext":"md","kind":"guia","tamanho":3420,"conteudo":"# Entendendo a Fila Circular com Alocação Dinâmica em C\n\nUma **fila circular** é uma estrutura de dados baseada na política **FIFO** (*First In, First Out* - O primeiro que entra é o primeiro que sai), assim como uma fila tradicional (como a do banco). \n\nA grande sacada da versão **circular** é reaproveitar o espaço: quando o final do vetor ou da estrutura de nós chega ao limite físico, o ponteiro dá a volta e reutiliza as posições iniciais que já foram liberadas pelas remoções.\n\n---\n\n## 1. O Conceito de Circularidade\n\nImagine uma pista de corrida em formato de círculo:\n* O ponteiro de **início** (`frente` ou `primeiro`) aponta para quem está prestes a sair da fila.\n* O ponteiro de **fim** (`tras` ou `ultimo`) aponta para onde o próximo elemento deve entrar.\n* Quando o ponteiro `tras` chega na última posição reservada, em vez de estourar a memória (dar erro de índice), ele \"dá a volta\" e volta para a posição `0` (ou para o início do arranjo/nós), desde que haja espaço livre.\n\n---\n\n## 2. A Demonstração Dinâmica em C (Conceito Passo a Passo)\n\nNa versão dinâmica, podemos implementar isso de duas formas principais:\n1. **Com Array Dinâmico (`malloc` de um vetor de ponteiros ou structs):** Onde o controle de circularidade é feito matematicamente usando o operador resto da divisão (`%`).\n2. **Com Lista Encadeada Circular:** Onde o ponteiro `prox` do último elemento aponta de volta para o primeiro elemento.\n\nVamos focar na abordagem de **Vetor Dinâmico**, que é a forma mais clássica ensinada nas faculdades para filas circulares.\n\n### Passo A: A Estrutura da Fila (`struct`)\nPara gerenciar a fila circular dinamicamente, precisamos encapsular o vetor e os ponteiros de controle dentro de uma estrutura principal:\n* Um ponteiro para os dados (`int *itens` ou vetor alocado dinamicamente).\n* Uma variável para o tamanho máximo (`tamanho`).\n* Inteiros de controle: `frente` (onde remove), `tras` (onde insere) e `tamanhoAtual` (para saber se está cheia ou vazia).\n\n### Passo B: A Inserção (Enfileirar / *Enqueue*)\nQuando você quer inserir um elemento:\n1. **Verifica se a fila está cheia:** Se o número de elementos correntes for igual à capacidade máxima, a fila está lotada.\n2. **Calcula a nova posição de `tras` usando aritmética modular:**\n   Em vez de apenas somar `tras++`, fazemos:\n   $$\\text{tras} = (\\text{tras} + 1) \\pmod{\\text{capacidade}}$$\n   *Isso é o que faz a fila \"dar a volta\"! Se o `tras` estava na última posição (ex: índice 4 de um vetor de tamanho 5), ao somar 1 e aplicar `% 5`, ele vira `0`.*\n3. Insere o valor na posição calculada e incrementa o contador de elementos.\n\n### Passo C: A Remoção (Desenfileirar / *Dequeue*)\nQuando você quer remover um elemento:\n1. **Verifica se a fila está vazia:** Se o contador de elementos for `0`, não há o que remover.\n2. **Guarda o valor** que está na posição `frente`.\n3. **Avança o ponteiro `frente` usando a mesma lógica modular:**\n   $$\\text{frente} = (\\text{frente} + 1) \\pmod{\\text{capacidade}}$$\n4. Decrementa o contador de elementos e retorna o valor removido.\n\n---\n\n## Resumo das Vantagens\n* **Eficiência:** O custo de inserção e remoção é constante ($O(1)$).\n* **Desperdício Zero:** Diferente de uma fila linear simples onde o início vai avançando e o espaço para trás fica ocioso para sempre, na fila circular o espaço é continuamente reciclado."}]},{"tipo":"file","nome":"Imagem","arq":"image.png","path":"Estudos/image.png","ext":"png","kind":"img","tamanho":254008,"uri":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApoAAAGDCAYAAACLPbAxAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAP+lSURBVHhe7J13uBy19fc/kmZ29xb3hhvGFRsb24DpvRfTWxJqgIQQOiQQCKEGAgklkISWhN4CIUDo3VRjwBQbg21s497r7bs7I+n9QzO7c9d7bUNI3pDffp9n7t2ZUTk6OtIcHUlHwlprqaCCCiqooIIKKvg3IqluGGMIggCtNb7v43keQgjCMMQYg+/7CCEACv+TMMZAlGYQBAghCnGS4bXWBEGA7/sopQrPrbWt8iLKp1xeROGttRhjMMYgpSykF8ex1pLP5wvpJOkvfVYOcR5JPkkp1xknhrUWrTVCiLXiGGOw1rYq/7oQl5M2eE9E14Ziw0NWUEEFFVRQQQUVfEuIlb8gCAjDEADP89arZMYwxrSKx3rC/6uIFbCk0pbMz1pbUPRiRSypnCYVyHUhTvPrxPm2EZehVElen7JcDhVFs4IKKqigggoq+I8iVmJixTJWxmIkrXttXXF4pdRaVry28E2Vt2Sc2PpaDkkFObZ6CiEwxqC1Rmu9ThqSilxczv80SpXKctfXQUXRrKCCCiqooIIK/u0oVVZEiTIWBAFBEBQUsVKFxkbTw7EF1FqL53kFxa80fCli5fSbKm9xvNhaWZpfufu4jFJKbDRdH0/Zl9JRypvS9L6rqCiaFVRQQQUVVFDBfxxJRSyVSq ados","arq":"plataforma_interativa_de_aprendizado_em_algoritmos_e_estruturas_de_dados.html","path":"Estudos/plataforma_interativa_de_aprendizado_em_algoritmos_e_estruturas_de_dados.html","ext":"html","kind":"demo","tamanho":56209,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Plataforma Interativa de Aprendizado em Algoritmos e Estruturas de Dados<\/title>\n\n  <\u0021-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n\n  <\u0021-- Chart.js CDN -->\n  <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n\n  <\u0021-- Font & Custom Minimal Styling -->\n  <style>\n    body {\n      background-color: #FAF8F5;\n      color: #1E293B;\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;\n    }\n    \n    .chart-container {\n      position: relative;\n      width: 100%;\n      max-width: 650px;\n      margin-left: auto;\n      margin-right: auto;\n      height: 320px;\n      max-height: 400px;\n    }\n    \n    @media (min-width: 768px) {\n      .chart-container {\n        height: 360px;\n      }\n    }\n\n    .node-box {\n      transition: all 0.3s ease;\n    }\n\n    /* Custom Scrollbar for smooth UX */\n    ::-webkit-scrollbar {\n      width: 6px;\n      height: 6px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #F1F5F9;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #CBD5E1;\n      border-radius: 3px;\n    }\n    ::-webkit-scrollbar-thumb:hover {\n      background: #94A3B8;\n    }\n  <\/style>\n\n  <\u0021-- Chosen Palette: Warm Neutral Academic (Cream #FAF8F5, Slate #1E293B, Blue #2563EB, Emerald #059669) -->\n  <\u0021-- Application Structure Plan: Interactive 5-tab pedagogical dashboard translating the report's conceptual modules (Search, Linear Memory, Sorting/Parallelism, Prompt Engineering) into dynamic visual tools, step-by-step simulators, interactive charts, and prompt generation utilities for maximum educational engagement. -->\n  <\u0021-- Visualization & Content Choices:\n       1. Algorithmic Complexity Curves -> Chart.js Line Chart -> Interactive scaling comparison -> Standard asymptotic comparison.\n       2. Search Simulator -> HTML/CSS Dynamic Grid -> Interactive array step-through -> Demonstrates O(n) vs O(log n) search space reduction.\n       3. Stack/Queue State Machine -> Custom HTML DOM Nodes + Unicode arrows -> Dynamic push/pop/enqueue/dequeue -> Visualizing LIFO/FIFO & memory pointers.\n       4. Speedup / Amdahl's Law -> Chart.js Line Chart + Sliders -> Dynamic curve updating -> Demonstrating parallel scalability limits.\n       5. Adaptive Prompt Generator -> Interactive form controls -> Dynamic prompt composition -> Practical operationalization of Section 4 guidelines.\n  -->\n  <\u0021-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->\n<\/head>\n<body class=\"min-h-screen flex flex-col justify-between antialiased\">\n\n  <\u0021-- TOP HEADER / BRANDING -->\n  <header class=\"bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm\">\n    <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4\">\n      <div class=\"flex items-center gap-3\">\n        <div class=\"w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-sm\">\n          &lt;/&gt;\n        <\/div>\n        <div>\n          <h1 class=\"text-xl font-bold text-slate-900 leading-tight\">Arquitetura Pedagógica & Algoritmos<\/h1>\n          <p class=\"text-xs text-slate-500\">Sistema Interativo de Tutoria e Análise de Estruturas de Dados<\/p>\n        <\/div>\n      <\/div>\n\n      <\u0021-- MAIN NAVIGATION TABS -->\n      <nav class=\"flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl text-xs sm:text-sm font-medium\">\n        <button onclick=\"switchTab('overview')\" id=\"nav-overview\" class=\"tab-btn px-3 py-1.5 rounded-lg bg-white shadow-sm text-blue-700 font-semibold transition\">\n          Visão Geral\n        <\/button>\n        <button onclick=\"switchTab('search')\" id=\"nav-search\" class=\"tab-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition\">\n          Pesquisa\n        <\/button>\n        <button onclick=\"switchTab('linear')\" id=\"nav-linear\" class=\"tab-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition\">\n          Estruturas Lineares\n        <\/button>\n        <button onclick=\"switchTab('sorting')\" id=\"nav-sorting\" class=\"tab-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition\">\n          Ordenação & Paralelismo\n        <\/button>\n        <button onclick=\"switchTab('prompts')\" id=\"nav-prompts\" class=\"tab-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition\">\n          Engenharia de Prompts\n        <\/button>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <\u0021-- MAIN CONTENT CONTAINER -->\n  <main class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full\">\n\n    <\u0021-- SECTION 1: VISÃO GERAL & DASHBOARD DE COMPLEXIDADE -->\n    <section id=\"sec-overview\" class=\"tab-content space-y-6\">\n      <\u0021-- Introductory Paragraph -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <h2 class=\"text-2xl font-bold text-slate-800 mb-2\">Fundamentos de Análise e Métricas de Desempenho<\/h2>\n        <p class=\"text-slate-600 text-sm leading-relaxed\">\n          Esta seção apresenta o panorama geral da eficiência algorítmica, fornecendo o arcabouço teórico necessário para mensurar e comparar o tempo de execução e a escalabilidade espacial de rotinas computacionais em Notação Assintótica $O$ (Big-O). Utilize os seletores interativos para explorar como diferentes classes de complexidade reagem ao crescimento da entrada de dados ($N$).\n        <\/p>\n      <\/div>\n\n      <\u0021-- Overview Grid Stats -->\n      <div class=\"grid grid-cols-1 md:grid-cols-4 gap-4\">\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <span class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">Excelente<\/span>\n          <div class=\"mt-2\">\n            <span class=\"text-2xl font-bold text-emerald-600\">O(1) & O(log n)<\/span>\n            <p class=\"text-xs text-slate-500 mt-1\">Acesso direto / Pesquisa Binária e Árvores Equilibradas.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <span class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">Aceitável / Linear<\/span>\n          <div class=\"mt-2\">\n            <span class=\"text-2xl font-bold text-blue-600\">O(n)<\/span>\n            <p class=\"text-xs text-slate-500 mt-1\">Varredura Sequencial e Travessia em Listas Encadeadas.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <span class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">Eficiente para Ordenação<\/span>\n          <div class=\"mt-2\">\n            <span class=\"text-2xl font-bold text-indigo-600\">O(n log n)<\/span>\n            <p class=\"text-xs text-slate-500 mt-1\">Merge Sort, Quick Sort (médio) e Heap Sort.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <span class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\">Quadrático / Ineficiente<\/span>\n          <div class=\"mt-2\">\n            <span class=\"text-2xl font-bold text-amber-600\">O(n²)<\/span>\n            <p class=\"text-xs text-slate-500 mt-1\">Bubble Sort, Selection Sort e Insertion Sort.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\u0021-- Interactive Chart Section -->\n      <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n        <div class=\"lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <div>\n            <div class=\"flex justify-between items-center mb-4\">\n              <h3 class=\"text-lg font-bold text-slate-800\">Comparador de Curvas de Complexidade Assintótica<\/h3>\n              <span class=\"text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium\">Gráfico Interativo<\/span>\n            <\/div>\n            <p class=\"text-xs text-slate-500 mb-4\">\n              Ajuste o valor máximo de elementos ($N$) para visualizar a divergência drástica do número de operações necessárias entre algoritmos de diferentes classes.\n            <\/p>\n          <\/div>\n          <div class=\"chart-container\">\n            <canvas id=\"chartComplexity\"><\/canvas>\n          <\/div>\n          <div class=\"mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500\">\n            <span>Controle de Entrada:<\/span>\n            <div class=\"flex items-center gap-3\">\n              <label for=\"rangeN\" class=\"font-medium text-slate-700\">Tamanho N: <span id=\"valN\" class=\"font-bold text-blue-600\">32<\/span><\/label>\n              <input type=\"range\" id=\"rangeN\" min=\"8\" max=\"100\" value=\"32\" step=\"4\" class=\"w-32 accent-blue-600\" oninput=\"updateComplexityChart(this.value)\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <div>\n            <h3 class=\"text-lg font-bold text-slate-800 mb-3\">Síntese dos Módulos Educacionais<\/h3>\n            <p class=\"text-xs text-slate-600 leading-relaxed mb-4\">\n              Este sistema organiza o conhecimento do relatório em 3 pilares fundamentais para treinamento computacional e tutoria adaptativa:\n            <\/p>\n            <ul class=\"space-y-3 text-xs text-slate-700\">\n              <li class=\"flex items-start gap-2\">\n                <span class=\"text-blue-600 font-bold\">1.<\/span>\n                <span><strong>Pesquisa de Dados:<\/strong> Contraste entre busca linear irrestrita $O(n)$ e busca binária ordenada $O(\\log n)$.<\/span>\n              <\/li>\n              <li class=\"flex items-start gap-2\">\n                <span class=\"text-blue-600 font-bold\">2.<\/span>\n                <span><strong>Estruturas Lineares:<\/strong> Alocação dinâmica na Heap, indireção via ponteiros, e pilhas/filas em tempo $O(1)$.<\/span>\n              <\/li>\n              <li class=\"flex items-start gap-2\">\n                <span class=\"text-blue-600 font-bold\">3.<\/span>\n                <span><strong>Ordenação & Paralelismo:<\/strong> Métodos sequenciais, redes de comparação e métricas de Speedup e Eficiência.<\/span>\n              <\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"mt-6 bg-slate-50 p-4 rounded-xl border border-slate-200\">\n            <span class=\"text-xs font-bold text-slate-700 block mb-1\">Dica de Navegação<\/span>\n            <p class=\"text-xs text-slate-500\">\n              Utilize o menu superior para alternar entre os simuladores práticos de busca, estados de memória de pilhas e filas, calculadoras de paralelismo e o gerador de prompts pedagógicos.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n\n    <\u0021-- SECTION 2: METODOS DE PESQUISA -->\n    <section id=\"sec-search\" class=\"tab-content hidden space-y-6\">\n      <\u0021-- Introductory Paragraph -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <h2 class=\"text-2xl font-bold text-slate-800 mb-2\">Métodos de Pesquisa: Sequencial vs. Binária<\/h2>\n        <p class=\"text-slate-600 text-sm leading-relaxed\">\n          A recuperação de dados é uma das operações operacionais mais elementares da computação. Enquanto a pesquisa sequencial varre a coleção elemento a elemento sem exigências prévias, a pesquisa binária aproveita a ordenação dos dados para dividir o espaço de busca pela metade a cada passo, alcançando eficiência logarítmica. Interaja com o simulador abaixo para visualizar o processo passo a passo.\n        <\/p>\n      <\/div>\n\n      <\u0021-- Comparative Table from Report -->\n      <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n        <div class=\"p-5 border-b border-slate-100 flex justify-between items-center\">\n          <h3 class=\"font-bold text-slate-800\">Tabela Comparativa de Algoritmos de Pesquisa<\/h3>\n          <span class=\"text-xs text-slate-400\">Fonte: Módulo 1 do Relatório<\/span>\n        <\/div>\n        <div class=\"overflow-x-auto\">\n          <table class=\"w-full text-left text-xs sm:text-sm text-slate-600\">\n            <thead class=\"bg-slate-50 text-slate-700 font-semibold border-b border-slate-200\">\n              <tr>\n                <th class=\"p-3 sm:p-4\">Parâmetro de Comparação<\/th>\n                <th class=\"p-3 sm:p-4\">Pesquisa Sequencial<\/th>\n                <th class=\"p-3 sm:p-4\">Pesquisa Binária<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody class=\"divide-y divide-slate-100\">\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Exigência de Ordenação<\/td>\n                <td class=\"p-3 sm:p-4\">Não requer ordenação prévia<\/td>\n                <td class=\"p-3 sm:p-4 text-blue-700 font-medium\">Exige dados estritamente ordenados<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Estrutura de Suporte<\/td>\n                <td class=\"p-3 sm:p-4\">Arranjos e Listas Encadeadas<\/td>\n                <td class=\"p-3 sm:p-4\">Arranjos de Acesso Aleatório / Direto<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Melhor Caso<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(1) (Primeiro elemento)<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(1) (Elemento central)<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Caso Médio<\/td>\n                <td class=\"p-3 sm:p-4 text-amber-600 font-semibold\">O(n) [(n+1)/2 comparações]<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(log n)<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Pior Caso<\/td>\n                <td class=\"p-3 sm:p-4 text-red-600 font-semibold\">O(n)<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(log n)<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Complexidade Espacial Auxiliar<\/td>\n                <td class=\"p-3 sm:p-4\">O(1)<\/td>\n                <td class=\"p-3 sm:p-4\">O(1) Iterativo / O(log n) Recursivo<\/td>\n              <\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n      <\u0021-- Interactive Search Step Simulator -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4\">\n        <div class=\"flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-100\">\n          <div>\n            <h3 class=\"text-lg font-bold text-slate-800\">Simulador de Execução em Tempo Real<\/h3>\n            <p class=\"text-xs text-slate-500\">Escolha um número e compare os passos tomados pelos algoritmos em uma lista ordenada de 16 elementos.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-3\">\n            <label for=\"targetInput\" class=\"text-xs font-semibold text-slate-700\">Chave de Busca (1 a 99):<\/label>\n            <input type=\"number\" id=\"targetInput\" value=\"73\" min=\"1\" max=\"99\" class=\"w-20 px-3 py-1.5 border border-slate-300 rounded-lg text-sm font-bold text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500\">\n            <button onclick=\"runSearchSimulation()\" class=\"px-4 py-1.5 bg-blue-600 text-white font-medium text-xs rounded-lg hover:bg-blue-700 transition shadow-sm\">\n              Simular Busca\n            <\/button>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Array Visualization Display -->\n        <div>\n          <span class=\"text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2\">Vetor Ordenado de Entrada<\/span>\n          <div id=\"arrayDisplay\" class=\"grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-16 gap-2\">\n            <\u0021-- Dynamically Populated Array Cells -->\n          <\/div>\n        <\/div>\n\n        <\u0021-- Simulation Logs comparison -->\n        <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4 pt-4\">\n          <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n            <div class=\"flex justify-between items-center mb-2\">\n              <span class=\"font-bold text-slate-800 text-sm\">Pesquisa Sequencial<\/span>\n              <span id=\"seqSteps\" class=\"text-xs font-semibold px-2 py-0.5 rounded bg-amber-100 text-amber-800\">0 Comparações<\/span>\n            <\/div>\n            <p id=\"seqLog\" class=\"text-xs text-slate-600 min-h-[60px] leading-relaxed\">\n              Aguardando simulação... Clique em 'Simular Busca' para testar.\n            <\/p>\n          <\/div>\n\n          <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n            <div class=\"flex justify-between items-center mb-2\">\n              <span class=\"font-bold text-slate-800 text-sm\">Pesquisa Binária<\/span>\n              <span id=\"binSteps\" class=\"text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800\">0 Comparações<\/span>\n            <\/div>\n            <p id=\"binLog\" class=\"text-xs text-slate-600 min-h-[60px] leading-relaxed\">\n              Aguardando simulação... Clique em 'Simular Busca' para testar.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n\n    <\u0021-- SECTION 3: ESTRUTURAS DE DADOS LINEARES -->\n    <section id=\"sec-linear\" class=\"tab-content hidden space-y-6\">\n      <\u0021-- Introductory Paragraph -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <h2 class=\"text-2xl font-bold text-slate-800 mb-2\">Estruturas de Dados Lineares e Memória Dinâmica<\/h2>\n        <p class=\"text-slate-600 text-sm leading-relaxed\">\n          O gerenciamento dinâmico na Heap via ponteiros possibilita a criação de coleções flexíveis que expandem e contraem em tempo de execução, superando a rigidez dos arranjos estáticos. Esta seção analisa o funcionamento das disciplinas de acesso LIFO (Pilha) e FIFO (Fila), detalhando o controle por células autorreferenciáveis e prevenindo falhas críticas como vazamentos de memória e acessos inválidos (*segmentation fault*).\n        <\/p>\n      <\/div>\n\n      <\u0021-- Linear Comparison Table -->\n      <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n        <div class=\"p-5 border-b border-slate-100\">\n          <h3 class=\"font-bold text-slate-800\">Propriedades Estruturais: Pilhas, Filas e Arranjos<\/h3>\n        <\/div>\n        <div class=\"overflow-x-auto\">\n          <table class=\"w-full text-left text-xs sm:text-sm text-slate-600\">\n            <thead class=\"bg-slate-50 text-slate-700 font-semibold border-b border-slate-200\">\n              <tr>\n                <th class=\"p-3 sm:p-4\">Propriedade<\/th>\n                <th class=\"p-3 sm:p-4\">Pilha Encadeada<\/th>\n                <th class=\"p-3 sm:p-4\">Fila Encadeada<\/th>\n                <th class=\"p-3 sm:p-4\">Arranjo Estático<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody class=\"divide-y divide-slate-100\">\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Disciplina de Acesso<\/td>\n                <td class=\"p-3 sm:p-4 text-blue-700 font-semibold\">LIFO (Last-In, First-Out)<\/td>\n                <td class=\"p-3 sm:p-4 text-indigo-700 font-semibold\">FIFO (First-In, First-Out)<\/td>\n                <td class=\"p-3 sm:p-4\">Acesso Direto via Índice [i]<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Inserção<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(1) no Topo<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(1) no Fim (Tail)<\/td>\n                <td class=\"p-3 sm:p-4\">O(1) no final (se houver vaga)<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Remoção<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(1) no Topo<\/td>\n                <td class=\"p-3 sm:p-4 text-emerald-600 font-semibold\">O(1) no Início (Head)<\/td>\n                <td class=\"p-3 sm:p-4 text-red-600\">O(n) (Requer deslocamentos)<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Dimensionamento<\/td>\n                <td class=\"p-3 sm:p-4\">Dinâmico na Heap<\/td>\n                <td class=\"p-3 sm:p-4\">Dinâmico na Heap<\/td>\n                <td class=\"p-3 sm:p-4\">Estático no tempo de compilação<\/td>\n              <\/tr>\n              <tr>\n                <td class=\"p-3 sm:p-4 font-medium text-slate-800\">Sobrecarga (Overhead)<\/td>\n                <td class=\"p-3 sm:p-4\">Ponteiro por elemento<\/td>\n                <td class=\"p-3 sm:p-4\">Ponteiro por elemento<\/td>\n                <td class=\"p-3 sm:p-4 font-semibold text-emerald-600\">Sem ponteiros adicionais<\/td>\n              <\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n      <\u0021-- Interactive Dynamic Memory Simulator (Stack & Queue) -->\n      <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n        \n        <\u0021-- PILHA INTERATIVA (STACK) -->\n        <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <div>\n            <div class=\"flex justify-between items-center mb-3\">\n              <h3 class=\"font-bold text-slate-800 text-lg\">Pilha Encadeada (LIFO)<\/h3>\n              <span class=\"text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded-full\">Controle: Topo<\/span>\n            <\/div>\n            <p class=\"text-xs text-slate-500 mb-4\">\n              As operações de PUSH e POP atuam estritamente sobre o ponteiro do Topo, garantindo tempo constante $O(1)$.\n            <\/p>\n\n            <div class=\"flex gap-2 mb-4\">\n              <input type=\"text\" id=\"stackInput\" placeholder=\"Valor (ex: A, 42)\" class=\"px-3 py-1.5 border border-slate-300 rounded-lg text-xs w-full focus:outline-none focus:ring-2 focus:ring-blue-500\">\n              <button onclick=\"pushStack()\" class=\"px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700 transition\">PUSH<\/button>\n              <button onclick=\"popStack()\" class=\"px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300 transition\">POP<\/button>\n            <\/div>\n\n            <\u0021-- Visual Memory Container -->\n            <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200 min-h-[220px] flex flex-col items-center justify-end gap-2\" id=\"stackVisual\">\n              <\u0021-- Stack nodes rendered dynamically -->\n            <\/div>\n          <\/div>\n          <p id=\"stackStatus\" class=\"text-xs text-slate-500 mt-3 text-center italic\">Pilha Vazia (Topo = NULL)<\/p>\n        <\/div>\n\n        <\u0021-- FILA INTERATIVA (QUEUE) -->\n        <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <div>\n            <div class=\"flex justify-between items-center mb-3\">\n              <h3 class=\"font-bold text-slate-800 text-lg\">Fila Encadeada (FIFO)<\/h3>\n              <span class=\"text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full\">Duplo Ponteiro: Início & Fim<\/span>\n            <\/div>\n            <p class=\"text-xs text-slate-500 mb-4\">\n              Enfileirar adiciona ao Fim (*Tail*), enquanto desenfileirar remove do Início (*Head*), mantendo eficiência $O(1)$.\n            <\/p>\n\n            <div class=\"flex gap-2 mb-4\">\n              <input type=\"text\" id=\"queueInput\" placeholder=\"Valor (ex: Job1, 99)\" class=\"px-3 py-1.5 border border-slate-300 rounded-lg text-xs w-full focus:outline-none focus:ring-2 focus:ring-indigo-500\">\n              <button onclick=\"enqueueQueue()\" class=\"px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold hover:bg-indigo-700 transition\">ENQUEUE<\/button>\n              <button onclick=\"dequeueQueue()\" class=\"px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300 transition\">DEQUEUE<\/button>\n            <\/div>\n\n            <\u0021-- Visual Memory Container -->\n            <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200 min-h-[220px] flex items-center justify-start gap-2 overflow-x-auto\" id=\"queueVisual\">\n              <\u0021-- Queue nodes rendered dynamically -->\n            <\/div>\n          <\/div>\n          <p id=\"queueStatus\" class=\"text-xs text-slate-500 mt-3 text-center italic\">Fila Vazia (Início = NULL, Fim = NULL)<\/p>\n        <\/div>\n\n      <\/div>\n    <\/section>\n\n\n    <\u0021-- SECTION 4: ALGORITMOS DE ORDENAÇÃO E PARALELISMO -->\n    <section id=\"sec-sorting\" class=\"tab-content hidden space-y-6\">\n      <\u0021-- Introductory Paragraph -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <h2 class=\"text-2xl font-bold text-slate-800 mb-2\">Algoritmos de Ordenação Sequenciais e Paralelos<\/h2>\n        <p class=\"text-slate-600 text-sm leading-relaxed\">\n          A ordenação organiza elementos conforme uma relação de ordem total. Enquanto métodos quadráticos simples ($O(n^2)$) atendem a pequenos volumes, algoritmos logarítmicos ($O(n \\log n)$) baseados em Divisão e Conquista dominam cenários complexos. Para supercomputação e dados massivos, estratégias paralelas exploram múltiplos núcleos, com ganho limitado pelo gargalo de sincronização expresso pela **Lei de Amdahl**.\n        <\/p>\n      <\/div>\n\n      <\u0021-- Sorting Algorithms Grid Matrix -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <div class=\"flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 pb-3 border-b border-slate-100\">\n          <h3 class=\"text-lg font-bold text-slate-800\">Catálogo de Algoritmos e Estratégias<\/h3>\n          <div class=\"flex gap-2\">\n            <button onclick=\"filterSorting('all')\" class=\"sort-filter-btn px-2.5 py-1 text-xs rounded bg-blue-600 text-white font-medium\">Todos<\/button>\n            <button onclick=\"filterSorting('n2')\" class=\"sort-filter-btn px-2.5 py-1 text-xs rounded bg-slate-100 text-slate-600 hover:bg-slate-200\">O(n²)<\/button>\n            <button onclick=\"filterSorting('nlogn')\" class=\"sort-filter-btn px-2.5 py-1 text-xs rounded bg-slate-100 text-slate-600 hover:bg-slate-200\">O(n log n)<\/button>\n            <button onclick=\"filterSorting('parallel')\" class=\"sort-filter-btn px-2.5 py-1 text-xs rounded bg-slate-100 text-slate-600 hover:bg-slate-200\">Paralelo<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4\" id=\"sortingMatrix\">\n          <\u0021-- Card Bubble Sort -->\n          <div class=\"sort-card n2 bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between\">\n            <div>\n              <div class=\"flex justify-between items-center mb-2\">\n                <span class=\"font-bold text-slate-800 text-sm\">Bubble Sort<\/span>\n                <span class=\"text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-semibold\">O(n²)<\/span>\n              <\/div>\n              <p class=\"text-xs text-slate-600 leading-relaxed\">Trocas diretas entre vizinhos. Ineficiente para grandes listas. Estável.<\/p>\n            <\/div>\n            <span class=\"text-[10px] text-slate-400 mt-3 block\">Paralelização: Odd-Even Transposition<\/span>\n          <\/div>\n\n          <\u0021-- Card Insertion Sort -->\n          <div class=\"sort-card n2 bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between\">\n            <div>\n              <div class=\"flex justify-between items-center mb-2\">\n                <span class=\"font-bold text-slate-800 text-sm\">Insertion Sort<\/span>\n                <span class=\"text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-semibold\">O(n²)<\/span>\n              <\/div>\n              <p class=\"text-xs text-slate-600 leading-relaxed\">Inserção direta. Desempenho linear O(n) excelente em coleções quase ordenadas.<\/p>\n            <\/div>\n            <span class=\"text-[10px] text-slate-400 mt-3 block\">Paralelização: Blocos / Pipelines<\/span>\n          <\/div>\n\n          <\u0021-- Card Merge Sort -->\n          <div class=\"sort-card nlogn bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between\">\n            <div>\n              <div class=\"flex justify-between items-center mb-2\">\n                <span class=\"font-bold text-slate-800 text-sm\">Merge Sort<\/span>\n                <span class=\"text-xs px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold\">O(n log n)<\/span>\n              <\/div>\n              <p class=\"text-xs text-slate-600 leading-relaxed\">Divisão e Conquista. Intercalação estável que garante tempo assintótico perfeito em todos os cenários.<\/p>\n            <\/div>\n            <span class=\"text-[10px] text-slate-400 mt-3 block\">Memória Auxiliar: O(n)<\/span>\n          <\/div>\n\n          <\u0021-- Card Quick Sort -->\n          <div class=\"sort-card nlogn bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between\">\n            <div>\n              <div class=\"flex justify-between items-center mb-2\">\n                <span class=\"font-bold text-slate-800 text-sm\">Quick Sort<\/span>\n                <span class=\"text-xs px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold\">O(n log n)<\/span>\n              <\/div>\n              <p class=\"text-xs text-slate-600 leading-relaxed\">Particionamento em torno de pivô. Desempenho prático sequencial superior. In-place.<\/p>\n            <\/div>\n            <span class=\"text-[10px] text-slate-400 mt-3 block\">Pior caso: O(n²) se pivô inadequado<\/span>\n          <\/div>\n\n          <\u0021-- Card Bitonic Sort -->\n          <div class=\"sort-card parallel bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between\">\n            <div>\n              <div class=\"flex justify-between items-center mb-2\">\n                <span class=\"font-bold text-slate-800 text-sm\">Bitonic Sort<\/span>\n                <span class=\"text-xs px-2 py-0.5 rounded bg-indigo-100 text-indigo-800 font-semibold\">Redes Paralelas<\/span>\n              <\/div>\n              <p class=\"text-xs text-slate-600 leading-relaxed\">Construído para redes de comparação e paralelismo massivo em GPUs e arquiteturas multicore.<\/p>\n            <\/div>\n            <span class=\"text-[10px] text-slate-400 mt-3 block\">Complexidade: O(n log² n)<\/span>\n          <\/div>\n\n          <\u0021-- Card Sample Sort -->\n          <div class=\"sort-card parallel bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between\">\n            <div>\n              <div class=\"flex justify-between items-center mb-2\">\n                <span class=\"font-bold text-slate-800 text-sm\">Sample Sort<\/span>\n                <span class=\"text-xs px-2 py-0.5 rounded bg-indigo-100 text-indigo-800 font-semibold\">Distribuído<\/span>\n              <\/div>\n              <p class=\"text-xs text-slate-600 leading-relaxed\">Amostragem para balanceamento de carga e distribuição de dados entre nós de rede independentes.<\/p>\n            <\/div>\n            <span class=\"text-[10px] text-slate-400 mt-3 block\">Foco: Memória Distribuída<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <\u0021-- Amdahl's Law Interactive Calculator & Chart -->\n      <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n        <div class=\"lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <div>\n            <div class=\"flex justify-between items-center mb-3\">\n              <h3 class=\"text-lg font-bold text-slate-800\">Simulador da Lei de Amdahl (Speedup Limit)<\/h3>\n              <span class=\"text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full\">Análise Paralela<\/span>\n            <\/div>\n            <p class=\"text-xs text-slate-500 mb-4\">\n              A fórmula $S_p = \\frac{1}{(1-P) + \\frac{P}{p}}$ demonstra como a fração estritamente sequencial $(1-P)$ limita o aceleração máxima, mesmo com número infinito de processadores.\n            <\/p>\n          <\/div>\n\n          <div class=\"chart-container\">\n            <canvas id=\"chartAmdahl\"><\/canvas>\n          <\/div>\n\n          <div class=\"mt-4 pt-4 border-t border-slate-100 space-y-3 text-xs\">\n            <div class=\"flex items-center justify-between\">\n              <label for=\"rangeP\" class=\"font-semibold text-slate-700\">Fração Paralelizável (P): <span id=\"valP\" class=\"text-indigo-600 font-bold\">90%<\/span><\/label>\n              <input type=\"range\" id=\"rangeP\" min=\"50\" max=\"99\" value=\"90\" step=\"1\" class=\"w-40 accent-indigo-600\" oninput=\"updateAmdahlChart(this.value)\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Amdahl Stats Summary Box -->\n        <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n          <div>\n            <h3 class=\"font-bold text-slate-800 text-lg mb-3\">Métricas de Desempenho<\/h3>\n            \n            <div class=\"space-y-4\">\n              <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n                <span class=\"text-xs text-slate-500 block uppercase font-semibold\">Speedup Máximo Teórico (p → ∞)<\/span>\n                <span id=\"maxSpeedup\" class=\"text-3xl font-bold text-indigo-600 mt-1 block\">10.0x<\/span>\n                <span class=\"text-[11px] text-slate-400 mt-1 block\">Limitado pelos 10% de código sequencial.<\/span>\n              <\/div>\n\n              <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200\">\n                <span class=\"text-xs text-slate-500 block uppercase font-semibold\">Eficiência com 16 Processadores<\/span>\n                <span id=\"efficiency16\" class=\"text-2xl font-bold text-emerald-600 mt-1 block\">41.2%<\/span>\n                <span class=\"text-[11px] text-slate-400 mt-1 block\">Perda por gargalo de sincronização e comunicação.<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"mt-6 p-3 bg-amber-50 border border-amber-200 rounded-xl\">\n            <span class=\"text-xs font-bold text-amber-800 block mb-1\">Gargalos no Processamento Paralelo<\/span>\n            <p class=\"text-[11px] text-amber-700 leading-relaxed\">\n              Além do limite teórico de Amdahl, o ganho real de velocidade é atenuado pela sobrecarga de comunicação entre threads e contenção de barramento de memória.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n\n    <\u0021-- SECTION 5: ENGENHARIA DE PROMPTS E TUTORIA ADAPTATIVA -->\n    <section id=\"sec-prompts\" class=\"tab-content hidden space-y-6\">\n      <\u0021-- Introductory Paragraph -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n        <h2 class=\"text-2xl font-bold text-slate-800 mb-2\">Engenharia de Prompts para Tutoria Adaptativa<\/h2>\n        <p class=\"text-slate-600 text-sm leading-relaxed\">\n          Para operacionalizar o conteúdo pedagógico deste relatório em sistemas de inteligência artificial interativos, é necessário estruturar prompts parametrizados com papéis instrucionais, delimitações contextuais e mecanismos de diagnósticos de erros. Utilize a ferramenta abaixo para gerar prompts adaptativos prontos para simulações de tutoria.\n        <\/p>\n      <\/div>\n\n      <\u0021-- Prompt Components Grid Reference -->\n      <div class=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm\">\n          <span class=\"text-xs font-bold text-blue-600 uppercase tracking-wider block mb-1\">1. Papel & Contexto<\/span>\n          <h3 class=\"font-bold text-slate-800 text-sm mb-2\">Definição Instrucional<\/h3>\n          <p class=\"text-xs text-slate-600\">Atua como professor doutor em Ciência da Computação focado em análise rigorosa de algoritmos e estruturas de dados.<\/p>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm\">\n          <span class=\"text-xs font-bold text-indigo-600 uppercase tracking-wider block mb-1\">2. Desafio Ativo<\/span>\n          <h3 class=\"font-bold text-slate-800 text-sm mb-2\">Engajamento Continuado<\/h3>\n          <p class=\"text-xs text-slate-600\">Apresenta estados práticos da memória ou vetores e solicita ao estudante a execução manual da próxima etapa.<\/p>\n        <\/div>\n\n        <div class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm\">\n          <span class=\"text-xs font-bold text-emerald-600 uppercase tracking-wider block mb-1\">3. Diagnóstico Adaptativo<\/span>\n          <h3 class=\"font-bold text-slate-800 text-sm mb-2\">Tratamento de Equívocos<\/h3>\n          <p class=\"text-xs text-slate-600\">Identifica perda de ponteiros, nós órfãos, acessos inválidos em listas encadeadas e suposições errôneas sobre a Lei de Amdahl.<\/p>\n        <\/div>\n      <\/div>\n\n      <\u0021-- Interactive Prompt Builder Tool -->\n      <div class=\"bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4\">\n        <h3 class=\"text-lg font-bold text-slate-800 pb-2 border-b border-slate-100\">Gerador Modular de Prompts de Tutoria<\/h3>\n\n        <div class=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n          <div>\n            <label for=\"promptModule\" class=\"block text-xs font-bold text-slate-700 mb-1\">Módulo Temático:<\/label>\n            <select id=\"promptModule\" class=\"w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500\" onchange=\"generatePrompt()\">\n              <option value=\"search\">Pesquisa Sequencial vs Binária<\/option>\n              <option value=\"linear\">Estruturas Lineares & Ponteiros<\/option>\n              <option value=\"sorting\">Ordenação & Paralelismo (Amdahl)<\/option>\n            <\/select>\n          <\/div>\n\n          <div>\n            <label for=\"promptLevel\" class=\"block text-xs font-bold text-slate-700 mb-1\">Nível do Estudante:<\/label>\n            <select id=\"promptLevel\" class=\"w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500\" onchange=\"generatePrompt()\">\n              <option value=\"iniciante\">Iniciante (Conceitual & Visual)<\/option>\n              <option value=\"intermediario\">Intermediário (Análise de Código & Ponteiros)<\/option>\n              <option value=\"avancado\">Avançado (Complexidade Assintótica & Paralelismo)<\/option>\n            <\/select>\n          <\/div>\n\n          <div>\n            <label for=\"promptStyle\" class=\"block text-xs font-bold text-slate-700 mb-1\">Estilo de Interação:<\/label>\n            <select id=\"promptStyle\" class=\"w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500\" onchange=\"generatePrompt()\">\n              <option value=\"socratico\">Diálogo Socrático (Perguntas Guiadas)<\/option>\n              <option value=\"desafio\">Desafio Prático com Código/Estado<\/option>\n              <option value=\"diagnostico\">Análise e Correção de Bugs<\/option>\n            <\/select>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Generated Output Box -->\n        <div class=\"pt-2\">\n          <div class=\"flex justify-between items-center mb-1\">\n            <span class=\"text-xs font-bold text-slate-500 uppercase tracking-wider\">Prompt Estruturado Resultante<\/span>\n            <button onclick=\"copyPromptText()\" class=\"text-xs text-blue-600 font-bold hover:underline flex items-center gap-1\">\n              <span>Copiar Prompt<\/span>\n            <\/button>\n          <\/div>\n          <textarea id=\"promptOutput\" readonly class=\"w-full h-56 p-4 bg-slate-900 text-slate-100 font-mono text-xs rounded-xl border border-slate-800 leading-relaxed focus:outline-none resize-none\"><\/textarea>\n        <\/div>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <\u0021-- FOOTER -->\n  <footer class=\"bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500\">\n    <div class=\"max-w-7xl mx-auto px-4\">\n      <p>Plataforma Pedagógica Baseada no Relatório de Estruturas de Dados e Algoritmos © 2026<\/p>\n      <p class=\"mt-1 text-slate-400\">Desenvolvido com Tailwind CSS, Chart.js e HTML5 Canvas. Isento de SVG e Mermaid JS.<\/p>\n    <\/div>\n  <\/footer>\n\n\n  <\u0021-- JAVASCRIPT CORE LOGIC -->\n  <script>\n    // Global Navigation State\n    function switchTab(tabId) {\n      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));\n      document.querySelectorAll('.tab-btn').forEach(btn => {\n        btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-700', 'font-semibold');\n        btn.classList.add('text-slate-600');\n      });\n\n      document.getElementById('sec-' + tabId).classList.remove('hidden');\n      const activeBtn = document.getElementById('nav-' + tabId);\n      activeBtn.classList.add('bg-white', 'shadow-sm', 'text-blue-700', 'font-semibold');\n      activeBtn.classList.remove('text-slate-600');\n\n      // Trigger chart re-render/resize on tab switch if needed\n      if (tabId === 'overview' && chartComplexity) {\n        chartComplexity.resize();\n      } else if (tabId === 'sorting' && chartAmdahl) {\n        chartAmdahl.resize();\n      }\n    }\n\n    // --- CHART 1: COMPLEXITY CURVES ---\n    let chartComplexity;\n    function initComplexityChart() {\n      const ctx = document.getElementById('chartComplexity').getContext('2d');\n      const nVal = 32;\n      const labels = Array.from({length: nVal}, (_, i) => i + 1);\n\n      chartComplexity = new Chart(ctx, {\n        type: 'line',\n        data: {\n          labels: labels,\n          datasets: [\n            {\n              label: 'O(1) - Constante',\n              data: labels.map(() => 1),\n              borderColor: '#10B981',\n              borderWidth: 2,\n              fill: false,\n              pointRadius: 0\n            },\n            {\n              label: 'O(log n) - Logarítmico',\n              data: labels.map(n => Math.log2(n)),\n              borderColor: '#3B82F6',\n              borderWidth: 2,\n              fill: false,\n              pointRadius: 0\n            },\n            {\n              label: 'O(n) - Linear',\n              data: labels.map(n => n),\n              borderColor: '#6366F1',\n              borderWidth: 2,\n              fill: false,\n              pointRadius: 0\n            },\n            {\n              label: 'O(n log n) - Quasilinear',\n              data: labels.map(n => n * Math.log2(n)),\n              borderColor: '#8B5CF6',\n              borderWidth: 2,\n              fill: false,\n              pointRadius: 0\n            },\n            {\n              label: 'O(n²) - Quadrático',\n              data: labels.map(n => n * n),\n              borderColor: '#F59E0B',\n              borderWidth: 2,\n              fill: false,\n              pointRadius: 0\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: {\n              position: 'top',\n              labels: {\n                boxWidth: 12,\n                font: { size: 11 }\n              }\n            },\n            tooltip: {\n              callbacks: {\n                title: (items) => 'N = ' + items[0].label,\n                label: (item) => `${item.dataset.label}: ${Math.round(item.raw)} ops`\n              }\n            }\n          },\n          scales: {\n            x: {\n              title: { display: true, text: 'Tamanho da Entrada (N)', font: { size: 11 } }\n            },\n            y: {\n              title: { display: true, text: 'Número de Operações', font: { size: 11 } },\n              max: 300,\n              beginAtZero: true\n            }\n          }\n        }\n      });\n    }\n\n    function updateComplexityChart(val) {\n      document.getElementById('valN').innerText = val;\n      const nVal = parseInt(val);\n      const labels = Array.from({length: nVal}, (_, i) => i + 1);\n      \n      chartComplexity.data.labels = labels;\n      chartComplexity.data.datasets[0].data = labels.map(() => 1);\n      chartComplexity.data.datasets[1].data = labels.map(n => Math.log2(n));\n      chartComplexity.data.datasets[2].data = labels.map(n => n);\n      chartComplexity.data.datasets[3].data = labels.map(n => n * Math.log2(n));\n      chartComplexity.data.datasets[4].data = labels.map(n => n * n);\n      \n      chartComplexity.options.scales.y.max = nVal > 50 ? 1000 : 300;\n      chartComplexity.update();\n    }\n\n\n    // --- SEARCH SIMULATION LOGIC ---\n    const sortedArray = [5, 12, 18, 23, 29, 34, 41, 47, 53, 60, 68, 73, 81, 88, 92, 97];\n\n    function renderArrayDisplay(activeIdx = -1, low = -1, high = -1) {\n      const container = document.getElementById('arrayDisplay');\n      container.innerHTML = '';\n\n      sortedArray.forEach((val, idx) => {\n        const cell = document.createElement('div');\n        cell.className = `p-2 text-center rounded-lg border text-xs font-bold transition-all ${\n          idx === activeIdx ? 'bg-emerald-500 text-white border-emerald-600 scale-105 shadow' :\n          (idx >= low && idx <= high) ? 'bg-blue-50 text-blue-800 border-blue-300' :\n          'bg-slate-50 text-slate-700 border-slate-200'\n        }`;\n        cell.innerHTML = `<div>${val}<\/div><div class=\"text-[9px] font-normal text-slate-400 mt-0.5\">[${idx}]<\/div>`;\n        container.appendChild(cell);\n      });\n    }\n\n    function runSearchSimulation() {\n      const target = parseInt(document.getElementById('targetInput').value);\n      if (isNaN(target)) return;\n\n      // Sequential Search\n      let seqCompares = 0;\n      let seqFound = false;\n      for (let i = 0; i < sortedArray.length; i++) {\n        seqCompares++;\n        if (sortedArray[i] === target) {\n          seqFound = true;\n          break;\n        }\n      }\n\n      document.getElementById('seqSteps').innerText = `${seqCompares} Comparação(ões)`;\n      document.getElementById('seqLog').innerText = seqFound \n        ? `Chave ${target} encontrada no índice ${sortedArray.indexOf(target)} após percorrer ${seqCompares} elemento(s) linearmente.`\n        : `Chave ${target} não encontrada após varrer todos os ${seqCompares} elementos. Pior caso O(n).`;\n\n      // Binary Search\n      let binCompares = 0;\n      let low = 0;\n      let high = sortedArray.length - 1;\n      let binFound = false;\n      let midIndex = -1;\n\n      while (low <= high) {\n        binCompares++;\n        midIndex = Math.floor((low + high) / 2);\n        if (sortedArray[midIndex] === target) {\n          binFound = true;\n          break;\n        } else if (sortedArray[midIndex] < target) {\n          low = midIndex + 1;\n        } else {\n          high = midIndex - 1;\n        }\n      }\n\n      document.getElementById('binSteps').innerText = `${binCompares} Comparação(ões)`;\n      document.getElementById('binLog').innerText = binFound\n        ? `Chave ${target} encontrada no índice central [${midIndex}] em apenas ${binCompares} divisão(ões) logarítmica(s).`\n        : `Chave ${target} não encontrada no intervalo após ${binCompares} reduções logarítmicas O(log n).`;\n\n      renderArrayDisplay(binFound ? midIndex : -1, low, high);\n    }\n\n\n    // --- LINEAR DATA STRUCTURES STATE MACHINE ---\n    let stackData = ['A', 'B', 'C'];\n    let queueData = ['Job1', 'Job2'];\n\n    function renderStack() {\n      const container = document.getElementById('stackVisual');\n      container.innerHTML = '';\n      if (stackData.length === 0) {\n        document.getElementById('stackStatus').innerText = 'Pilha Vazia (Topo = NULL)';\n        return;\n      }\n\n      document.getElementById('stackStatus').innerText = `Topo da Pilha → '${stackData[stackData.length - 1]}' | Total: ${stackData.length} elementos`;\n\n      for (let i = stackData.length - 1; i >= 0; i--) {\n        const node = document.createElement('div');\n        node.className = `w-48 py-2 px-4 rounded-lg text-center text-xs font-bold border ${\n          i === stackData.length - 1 \n            ? 'bg-blue-600 text-white border-blue-700 shadow-sm' \n            : 'bg-white text-slate-700 border-slate-200'\n        }`;\n        node.innerHTML = `${stackData[i]} ${i === stackData.length - 1 ? '<span class=\"text-[10px] font-normal block text-blue-200\">← TOPO<\/span>' : ''}`;\n        container.appendChild(node);\n      }\n    }\n\n    function pushStack() {\n      const val = document.getElementById('stackInput').value.trim() || `Elem ${stackData.length + 1}`;\n      stackData.push(val);\n      document.getElementById('stackInput').value = '';\n      renderStack();\n    }\n\n    function popStack() {\n      if (stackData.length > 0) {\n        stackData.pop();\n        renderStack();\n      }\n    }\n\n    function renderQueue() {\n      const container = document.getElementById('queueVisual');\n      container.innerHTML = '';\n      if (queueData.length === 0) {\n        document.getElementById('queueStatus').innerText = 'Fila Vazia (Início = NULL, Fim = NULL)';\n        return;\n      }\n\n      document.getElementById('queueStatus').innerText = `Início (Head) → '${queueData[0]}' | Fim (Tail) → '${queueData[queueData.length - 1]}'`;\n\n      queueData.forEach((val, idx) => {\n        const node = document.createElement('div');\n        node.className = `min-w-[90px] py-3 px-3 rounded-lg text-center text-xs font-bold border flex-shrink-0 ${\n          idx === 0 \n            ? 'bg-indigo-600 text-white border-indigo-700' \n            : idx === queueData.length - 1 \n            ? 'bg-indigo-100 text-indigo-900 border-indigo-300' \n            : 'bg-white text-slate-700 border-slate-200'\n        }`;\n        \n        let label = '';\n        if (idx === 0) label = '<span class=\"text-[9px] font-normal block text-ind
