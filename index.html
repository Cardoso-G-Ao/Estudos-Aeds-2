igo-200\">INÍCIO (Head)<\/span>';\n        else if (idx === queueData.length - 1) label = '<span class=\"text-[9px] font-normal block text-indigo-600\">FIM (Tail)<\/span>';\n\n        node.innerHTML = `<div>${val}<\/div>${label}`;\n        container.appendChild(node);\n\n        if (idx < queueData.length - 1) {\n          const arrow = document.createElement('div');\n          arrow.className = 'text-slate-400 font-bold text-xs px-1';\n          arrow.innerText = '→';\n          container.appendChild(arrow);\n        }\n      });\n    }\n\n    function enqueueQueue() {\n      const val = document.getElementById('queueInput').value.trim() || `Job ${queueData.length + 1}`;\n      queueData.push(val);\n      document.getElementById('queueInput').value = '';\n      renderQueue();\n    }\n\n    function dequeueQueue() {\n      if (queueData.length > 0) {\n        queueData.shift();\n        renderQueue();\n      }\n    }\n\n\n    // --- SORTING FILTER MATRIX ---\n    function filterSorting(category) {\n      document.querySelectorAll('.sort-filter-btn').forEach(btn => {\n        btn.classList.remove('bg-blue-600', 'text-white');\n        btn.classList.add('bg-slate-100', 'text-slate-600');\n      });\n      event.target.classList.add('bg-blue-600', 'text-white');\n      event.target.classList.remove('bg-slate-100', 'text-slate-600');\n\n      document.querySelectorAll('.sort-card').forEach(card => {\n        if (category === 'all' || card.classList.contains(category)) {\n          card.classList.remove('hidden');\n        } else {\n          card.classList.add('hidden');\n        }\n      });\n    }\n\n\n    // --- CHART 2: AMDAHL'S LAW & SPEEDUP ---\n    let chartAmdahl;\n    function initAmdahlChart() {\n      const ctx = document.getElementById('chartAmdahl').getContext('2d');\n      const processors = [1, 2, 4, 8, 16, 32, 64];\n      const P = 0.90;\n\n      chartAmdahl = new Chart(ctx, {\n        type: 'line',\n        data: {\n          labels: processors.map(p => `${p} CPU${p > 1 ? 's' : ''}`),\n          datasets: [\n            {\n              label: 'Speedup Real (Lei de Amdahl)',\n              data: processors.map(p => 1 / ((1 - P) + (P / p))),\n              borderColor: '#6366F1',\n              backgroundColor: 'rgba(99, 102, 241, 0.1)',\n              borderWidth: 3,\n              fill: true,\n              tension: 0.3\n            },\n            {\n              label: 'Speedup Ideal (Linear)',\n              data: processors,\n              borderColor: '#CBD5E1',\n              borderWidth: 2,\n              borderDash: [5, 5],\n              fill: false\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },\n            tooltip: {\n              callbacks: {\n                label: (item) => `${item.dataset.label}: ${item.raw.toFixed(2)}x`\n              }\n            }\n          },\n          scales: {\n            x: { title: { display: true, text: 'Número de Processadores (p)', font: { size: 11 } } },\n            y: { title: { display: true, text: 'Ganho de Velocidade (Speedup S_p)', font: { size: 11 } }, max: 20, beginAtZero: true }\n          }\n        }\n      });\n    }\n\n    function updateAmdahlChart(val) {\n      const P = parseInt(val) / 100;\n      document.getElementById('valP').innerText = `${val}%`;\n\n      const processors = [1, 2, 4, 8, 16, 32, 64];\n      const speedupData = processors.map(p => 1 / ((1 - P) + (P / p)));\n\n      chartAmdahl.data.datasets[0].data = speedupData;\n      \n      const maxS = 1 / (1 - P);\n      document.getElementById('maxSpeedup').innerText = `${maxS.toFixed(1)}x`;\n\n      const s16 = 1 / ((1 - P) + (P / 16));\n      const eff16 = (s16 / 16) * 100;\n      document.getElementById('efficiency16').innerText = `${eff16.toFixed(1)}%`;\n\n      chartAmdahl.options.scales.y.max = maxS > 25 ? 35 : 20;\n      chartAmdahl.update();\n    }\n\n\n    // --- PROMPT GENERATOR TOOL ---\n    function generatePrompt() {\n      const module = document.getElementById('promptModule').value;\n      const level = document.getElementById('promptLevel').value;\n      const style = document.getElementById('promptStyle').value;\n\n      let moduleText = \"\";\n      if (module === 'search') {\n        moduleText = \"Pesquisa Sequencial vs Pesquisa Binária (Análise O(n) e O(log n), pré-requisitos de ordenação, sentinelas e prevenção de overflow em índices).\";\n      } else if (module === 'linear') {\n        moduleText = \"Estruturas Lineares e Memória Dinâmica (Ponteiros na Heap, Células Autorreferenciáveis, Pilhas LIFO, Filas FIFO com duplo ponteiro, Vazamento de Memória e SegFault).\";\n      } else {\n        moduleText = \"Algoritmos de Ordenação e Computação Paralela (Métodos O(n²) vs O(n log n), Bitonic/Sample Sort, Speedup, Eficiência e Limites de Amdahl).\";\n      }\n\n      const promptTemplate = `[PAPEL]: Atue como Doutor em Ciência da Computação e Tutor Adaptativo Especialista em Estruturas de Dados e Análise de Algoritmos.\n\n[TÓPICO ALVO]: ${moduleText}\n[NÍVEL DO ESTUDANTE]: ${level.toUpperCase()}\n[ESTILO DE INTERAÇÃO]: ${style.toUpperCase()}\n\n[DIRETRIZES DE ENGAJAMENTO]:\n1. Exponha o fundamento teórico básico sem fornecer a resposta final do problema imediatamente.\n2. Apresente um estado prático (como o estado interno de ponteiros na memória ou um vetor) e solicite ao usuário a execução manual do próximo passo algorítmico.\n3. Se o estudante cometer um erro clássico (ex: perda de referência do nó Head, suposição de acesso direto em listas, ou cálculo errôneo do Speedup), diagnostique a causa raiz do equívoco.\n4. Finalize cada resposta com uma pergunta provocativa para validar a fixação do conceito.\n\n[INICIAR INTERAÇÃO]: Apresente o primeiro desafio adaptativo sobre o tópico especificado.`;\n\n      document.getElementById('promptOutput').value = promptTemplate;\n    }\n\n    function copyPromptText() {\n      const area = document.getElementById('promptOutput');\n      area.select();\n      document.execCommand('copy');\n      alert('Prompt copiado para a área de transferência!');\n    }\n\n\n    // INITIALIZATION ON LOAD\n    window.addEventListener('DOMContentLoaded', () => {\n      initComplexityChart();\n      initAmdahlChart();\n      renderArrayDisplay();\n      renderStack();\n      renderQueue();\n      generatePrompt();\n    });\n  <\/script>\n<\/body>\n<\/html>"},{"tipo":"file","nome":"Sistema interativo estruturas de dados","arq":"sistema_interativo_estruturas_de_dados (1).html","path":"Estudos/sistema_interativo_estruturas_de_dados (1).html","ext":"html","kind":"demo","tamanho":64906,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Plataforma Interativa de Estruturas de Dados (C & Java)<\/title>\n  <\u0021-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <\u0021-- FontAwesome Icons -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n  <\u0021-- MathJax for LaTeX formatting -->\n  <script src=\"https://polyfill.io/v3/polyfill.min.js?features=es6\"><\/script>\n  <script id=\"MathJax-script\" async src=\"https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js\"><\/script>\n  <script>\n    tailwind.config = {\n      theme: {\n        extend: {\n          colors: {\n            pucRed: '#8B0000',\n            pucDark: '#1A202C',\n            codeBg: '#1E1E1E',\n          }\n        }\n      }\n    }\n  <\/script>\n  <style>\n    .code-editor {\n      font-family: 'Fira Code', 'Courier New', Courier, monospace;\n      tab-size: 4;\n    }\n    .node-transition {\n      transition: all 0.3s ease-in-out;\n    }\n    /* Custom Scrollbar */\n    ::-webkit-scrollbar {\n      width: 8px;\n      height: 8px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #1f2937;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #4b5563;\n      border-radius: 4px;\n    }\n    ::-webkit-scrollbar-thumb:hover {\n      background: #6b7280;\n    }\n  <\/style>\n<\/head>\n<body class=\"bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans\">\n\n  <\u0021-- Header / Navigation Bar -->\n  <header class=\"bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-lg\">\n    <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8\">\n      <div class=\"flex items-center justify-between h-16\">\n        <div class=\"flex items-center gap-3\">\n          <div class=\"bg-red-700 text-white p-2 rounded-lg font-bold text-xl\">\n            <i class=\"fa-solid fa-cubes\"><\/i>\n          <\/div>\n          <div>\n            <h1 class=\"text-lg font-bold text-white leading-none\">Estruturas de Dados Interativas<\/h1>\n            <p class=\"text-xs text-red-400 font-medium\">PUC Minas • Algoritmos e Estruturas de Dados<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"hidden lg:flex items-center space-x-1\">\n          <button onclick=\"switchTopic('t1')\" id=\"nav-t1\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            1. Lista Sequencial\n          <\/button>\n          <button onclick=\"switchTopic('t2')\" id=\"nav-t2\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            2. Pilha Sequencial\n          <\/button>\n          <button onclick=\"switchTopic('t3')\" id=\"nav-t3\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            3. Fila Circular\n          <\/button>\n          <button onclick=\"switchTopic('t4')\" id=\"nav-t4\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            4. Fila Encadeada\n          <\/button>\n          <button onclick=\"switchTopic('exercicios')\" id=\"nav-exercicios\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-semibold text-yellow-400 hover:bg-yellow-500/20 bg-yellow-500/10 border border-yellow-500/30\">\n            <i class=\"fa-solid fa-code mr-1\"><\/i> Desafios Práticos\n          <\/button>\n        <\/div>\n\n        <\u0021-- Mobile Menu Toggle -->\n        <div class=\"lg:hidden\">\n          <button id=\"mobile-menu-btn\" class=\"text-gray-400 hover:text-white p-2\">\n            <i class=\"fa-solid fa-bars text-xl\"><\/i>\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <\u0021-- Mobile Navigation Drawer -->\n    <div id=\"mobile-menu\" class=\"hidden lg:hidden bg-gray-800 border-b border-gray-700 px-4 pt-2 pb-4 space-y-2\">\n      <button onclick=\"switchTopic('t1')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">1. Lista Sequencial<\/button>\n      <button onclick=\"switchTopic('t2')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">2. Pilha Sequencial<\/button>\n      <button onclick=\"switchTopic('t3')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">3. Fila Circular<\/button>\n      <button onclick=\"switchTopic('t4')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">4. Fila Encadeada<\/button>\n      <button onclick=\"switchTopic('exercicios')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-bold text-yellow-400 bg-yellow-500/10\">🏆 Desafios Práticos<\/button>\n    <\/div>\n  <\/header>\n\n  <\u0021-- Main Container -->\n  <main class=\"flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8\">\n\n    <\u0021-- TOPIC 1: LISTA SEQUENCIAL -->\n    <section id=\"topic-t1\" class=\"topic-section space-y-6\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 1<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Lista Linear Sequencial<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Armazenamento contíguo em vetor de capacidade fixa com deslocamento de elementos.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Inserir/Remover Fim: $\\Theta(1)$<\/span>\n            <span class=\"text-red-400 font-mono font-bold\">Início/Meio: $\\Theta(n)$<\/span>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Interactive Visualizer -->\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex flex-wrap items-center justify-between gap-3\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-play text-red-500\"><\/i> Simulador Interativo da Lista\n            <\/h3>\n            <span class=\"text-xs text-gray-400\">Capacidade do Vetor: <b class=\"text-white\">6 elementos<\/b> | Tamanho atual ($n$): <b id=\"t1-n-val\" class=\"text-yellow-400\">0<\/b><\/span>\n          <\/div>\n\n          <\u0021-- Controls -->\n          <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3\">\n            <div class=\"flex gap-2\">\n              <input type=\"number\" id=\"t1-val\" value=\"10\" placeholder=\"Valor\" class=\"w-20 bg-gray-800 border border-gray-600 rounded px-2 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n              <button onclick=\"t1InserirInicio()\" class=\"flex-1 bg-red-700 hover:bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Ins. Início<\/button>\n              <button onclick=\"t1InserirFim()\" class=\"flex-1 bg-blue-700 hover:bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Ins. Fim<\/button>\n            <\/div>\n\n            <div class=\"flex gap-2\">\n              <input type=\"number\" id=\"t1-pos\" value=\"1\" placeholder=\"Pos\" class=\"w-16 bg-gray-800 border border-gray-600 rounded px-2 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n              <button onclick=\"t1InserirPos()\" class=\"flex-1 bg-purple-700 hover:bg-purple-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">Ins. Posição<\/button>\n            <\/div>\n\n            <div class=\"flex gap-1\">\n              <button onclick=\"t1RemoverInicio()\" class=\"flex-1 bg-amber-700 hover:bg-amber-600 text-white px-2 py-1.5 rounded text-xs font-bold transition\">Rem. Início<\/button>\n              <button onclick=\"t1RemoverFim()\" class=\"flex-1 bg-rose-700 hover:bg-rose-600 text-white px-2 py-1.5 rounded text-xs font-bold transition\">Rem. Fim<\/button>\n              <button onclick=\"t1RemoverPos()\" class=\"flex-1 bg-indigo-700 hover:bg-indigo-600 text-white px-2 py-1.5 rounded text-xs font-bold transition\">Rem. Pos<\/button>\n            <\/div>\n\n            <button onclick=\"t1Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-rotate-right mr-1\"><\/i> Reiniciar\n            <\/button>\n          <\/div>\n\n          <\u0021-- Log Message -->\n          <div id=\"t1-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Pronto. Digite um valor e execute uma operação.\n          <\/div>\n\n          <\u0021-- Array Visualization Grid -->\n          <div class=\"pt-4\">\n            <div class=\"text-xs font-semibold text-gray-400 mb-2\">Representação da Memória (Vetor `vet`):<\/div>\n            <div class=\"grid grid-cols-6 gap-2 sm:gap-4\" id=\"t1-array-container\">\n              <\u0021-- Rendered via JS -->\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Theoretical Content & Explanations -->\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-4\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">💡 Conceitos Fundamentais<\/h3>\n            <ul class=\"space-y-3 text-sm text-gray-300\">\n              <li class=\"flex items-start gap-2\">\n                <i class=\"fa-solid fa-check-circle text-red-500 mt-1\"><\/i>\n                <span><b>Tipo Abstrato de Dados (TAD):<\/b> Armazena dados de forma sequencial na memória através de um vetor (`vet`) e mantém uma variável inteira $n$ que representa a quantidade atual de elementos.<\/span>\n              <\/li>\n              <li class=\"flex items-start gap-2\">\n                <i class=\"fa-solid fa-check-circle text-red-500 mt-1\"><\/i>\n                <span><b>Deslocamento de Elementos (Shifting):<\/b>\n                Na inserção no início ou em posição arbitrária $pos$, é necessário mover todos os elementos existentes de $[pos..n-1]$ uma posição para a direita ($vet[i] = vet[i-1]$).\n                Na remoção, os elementos à direita são deslocados uma posição para a esquerda ($vet[i] = vet[i+1]$).<\/span>\n              <\/li>\n              <li class=\"flex items-start gap-2\">\n                <i class=\"fa-solid fa-check-circle text-red-500 mt-1\"><\/i>\n                <span><b>Controle de Limites:<\/b> Sempre verifica estouro ($n \\ge vet.length$) na inserção ou sobrefluxo ($n == 0$) na remoção.<\/span>\n              <\/li>\n            <\/ul>\n          <\/div>\n\n          <\u0021-- Code Comparison Tab -->\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Implementado<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t1', 'java')\" id=\"t1-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t1', 'c')\" id=\"t1-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t1-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">class<\/span> <span class=\"text-yellow-300\">Lista<\/span> {\n    <span class=\"text-purple-400\">private int<\/span>[] vet;\n    <span class=\"text-purple-400\">private int<\/span> n;\n\n    <span class=\"text-purple-400\">public<\/span> <span class=\"text-yellow-300\">Lista<\/span>(<span class=\"text-purple-400\">int<\/span> tamanho) {\n        vet = <span class=\"text-purple-400\">new int<\/span>[tamanho];\n        n = <span class=\"text-orange-400\">0<\/span>;\n    }\n\n    <span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">inserirInicio<\/span>(<span class=\"text-purple-400\">int<\/span> x) <span class=\"text-purple-400\">throws<\/span> Exception {\n        <span class=\"text-purple-400\">if<\/span> (n >= vet.length) <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Erro!\"<\/span>);\n        <span class=\"text-purple-400\">for<\/span> (<span class=\"text-purple-400\">int<\/span> i = n; i > <span class=\"text-orange-400\">0<\/span>; i--) {\n            vet[i] = vet[i - <span class=\"text-orange-400\">1<\/span>];\n        }\n        vet[<span class=\"text-orange-400\">0<\/span>] = x;\n        n++;\n    }\n}<\/pre>\n\n            <pre id=\"t1-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">#include<\/span> <span class=\"text-green-300\">&lt;stdio.h&gt;<\/span>\n<span class=\"text-purple-400\">#define<\/span> MAX 6\n\n<span class=\"text-purple-400\">int<\/span> vet[MAX];\n<span class=\"text-purple-400\">int<\/span> n = <span class=\"text-orange-400\">0<\/span>;\n\n<span class=\"text-purple-400\">void<\/span> <span class=\"text-blue-400\">inserirInicio<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    <span class=\"text-purple-400\">if<\/span> (n >= MAX) {\n        printf(<span class=\"text-green-300\">\"Erro: Lista cheia!\\n\"<\/span>);\n        <span class=\"text-purple-400\">return<\/span>;\n    }\n    <span class=\"text-purple-400\">for<\/span> (<span class=\"text-purple-400\">int<\/span> i = n; i > <span class=\"text-orange-400\">0<\/span>; i--) {\n        vet[i] = vet[i - <span class=\"text-orange-400\">1<\/span>];\n    }\n    vet[<span class=\"text-orange-400\">0<\/span>] = x;\n    n++;\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <\u0021-- TOPIC 2: PILHA SEQUENCIAL -->\n    <section id=\"topic-t2\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 2<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Pilha Linear Sequencial (LIFO)<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Last-In, First-Out (O último a entrar é o primeiro a sair). Inserção e remoção no topo.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Empilhar / Desempilhar: $\\Theta(1)$<\/span>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Interactive Stack Visualizer -->\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-layer-group text-red-500\"><\/i> Simulador da Pilha\n            <\/h3>\n            <span class=\"text-xs text-gray-400\">Ponteiro Topo ($n$): <b id=\"t2-n-val\" class=\"text-yellow-400\">0<\/b> / 6<\/span>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-3\">\n            <input type=\"number\" id=\"t2-val\" value=\"25\" placeholder=\"Valor\" class=\"w-24 bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t2Push()\" class=\"bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-arrow-down mr-1\"><\/i> Push (Empilhar)\n            <\/button>\n            <button onclick=\"t2Pop()\" class=\"bg-red-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-arrow-up mr-1\"><\/i> Pop (Desempilhar)\n            <\/button>\n            <button onclick=\"t2Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              Reiniciar\n            <\/button>\n          <\/div>\n\n          <div id=\"t2-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Pilha vazia. Insira elementos no topo.\n          <\/div>\n\n          <\u0021-- Vertical Stack Display -->\n          <div class=\"flex flex-col-reverse items-center justify-center gap-2 py-4 bg-gray-950 rounded-lg border border-gray-800 min-h-[260px]\" id=\"t2-stack-container\">\n            <\u0021-- Rendered via JS -->\n          <\/div>\n        <\/div>\n\n        <\u0021-- Stack Code Tab -->\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-3 text-sm text-gray-300\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">📌 Regras da Pilha<\/h3>\n            <p>A pilha sequencial utiliza uma única variável contador $n$ que aponta para a próxima posição livre no topo do vetor:<\/p>\n            <ul class=\"list-disc pl-5 space-y-2\">\n              <li><b>Empilhar (push):<\/b> Atribui <code class=\"text-yellow-400\">vet[n] = x<\/code> e incrementa <code class=\"text-yellow-400\">n++<\/code>. Ocorre em tempo constante $\\Theta(1)$.<\/li>\n              <li><b>Desempilhar (pop):<\/b> Decrementa <code class=\"text-yellow-400\">n--<\/code> e retorna <code class=\"text-yellow-400\">vet[n]<\/code>. Também ocorre em tempo constante $\\Theta(1)$.<\/li>\n              <li><b>Aplicações comuns:<\/b> Avaliação de expressões matemáticas, controle da pilha de chamadas recursivas de funções, refazer/desfazer em editores.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Pilha<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t2', 'java')\" id=\"t2-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t2', 'c')\" id=\"t2-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t2-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">class<\/span> <span class=\"text-yellow-300\">Pilha<\/span> {\n    <span class=\"text-purple-400\">private int<\/span>[] vet;\n    <span class=\"text-purple-400\">private int<\/span> n;\n\n    <span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) <span class=\"text-purple-400\">throws<\/span> Exception {\n        <span class=\"text-purple-400\">if<\/span> (n >= vet.length) <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Erro!\"<\/span>);\n        vet[n] = x;\n        n++;\n    }\n\n    <span class=\"text-purple-400\">public int<\/span> <span class=\"text-blue-400\">remover<\/span>() <span class=\"text-purple-400\">throws<\/span> Exception {\n        <span class=\"text-purple-400\">if<\/span> (n == <span class=\"text-orange-400\">0<\/span>) <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Erro!\"<\/span>);\n        <span class=\"text-purple-400\">return<\/span> vet[--n];\n    }\n}<\/pre>\n\n            <pre id=\"t2-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">int<\/span> vet[MAX];\n<span class=\"text-purple-400\">int<\/span> n = <span class=\"text-orange-400\">0<\/span>;\n\n<span class=\"text-purple-400\">void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    <span class=\"text-purple-400\">if<\/span> (n >= MAX) <span class=\"text-purple-400\">return<\/span>;\n    vet[n++] = x;\n}\n\n<span class=\"text-purple-400\">int<\/span> <span class=\"text-blue-400\">remover<\/span>() {\n    <span class=\"text-purple-400\">if<\/span> (n == <span class=\"text-orange-400\">0<\/span>) <span class=\"text-purple-400\">return<\/span> -<span class=\"text-orange-400\">1<\/span>;\n    <span class=\"text-purple-400\">return<\/span> vet[--n];\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <\u0021-- TOPIC 3: FILA CIRCULAR SEQUENCIAL -->\n    <section id=\"topic-t3\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 3<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Fila Circular Sequencial (FIFO)<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">First-In, First-Out (O primeiro que entra é o primeiro a sair). Incremento circular $(i + 1) \\% N$.<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Enfileirar / Desenfileirar: $\\Theta(1)$<\/span>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Interactive Queue Visualizer -->\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex flex-wrap items-center justify-between gap-2\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-arrows-spin text-red-500\"><\/i> Simulador de Fila Circular\n            <\/h3>\n            <div class=\"text-xs text-gray-300 flex gap-4\">\n              <span>Primeiro: <b id=\"t3-p-val\" class=\"text-green-400 font-mono\">0<\/b><\/span>\n              <span>Último: <b id=\"t3-u-val\" class=\"text-blue-400 font-mono\">0<\/b><\/span>\n            <\/div>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-3\">\n            <input type=\"number\" id=\"t3-val\" value=\"42\" placeholder=\"Valor\" class=\"w-24 bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t3Enqueue()\" class=\"bg-blue-700 hover:bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-plus mr-1\"><\/i> Enfileirar (Inserir)\n            <\/button>\n            <button onclick=\"t3Dequeue()\" class=\"bg-amber-700 hover:bg-amber-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-minus mr-1\"><\/i> Desenfileirar (Remover)\n            <\/button>\n            <button onclick=\"t3Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              Reiniciar\n            <\/button>\n          <\/div>\n\n          <div id=\"t3-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Fila pronta. A rotação circular reaproveita posições liberadas sem mover elementos!\n          <\/div>\n\n          <\u0021-- Circular Ring Container -->\n          <div class=\"py-6 flex justify-center items-center bg-gray-950 rounded-lg border border-gray-800\">\n            <div class=\"grid grid-cols-3 sm:grid-cols-6 gap-3 max-w-2xl w-full px-4\" id=\"t3-circular-container\">\n              <\u0021-- Rendered via JS -->\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Explanations & Math -->\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-3 text-sm text-gray-300\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">🔄 Como Funciona o Reuso Circular?<\/h3>\n            <p>Na fila sequencial comum, remover do início custaria $\\Theta(n)$ para mover os elementos. Na <b>Fila Circular<\/b>, usamos o operador módulo $\\%$ para efetuar o \"wrap-around\":<\/p>\n            <div class=\"bg-gray-950 p-3 rounded border border-gray-800 text-center font-mono text-yellow-300 text-xs\">\n              ultimo = (ultimo + 1) % N;<br>\n              primeiro = (primeiro + 1) % N;\n            <\/div>\n            <p class=\"text-xs text-gray-400\">Desta forma, quando um ponteiro atinge o fim do vetor ($N-1$), ele retorna à posição $0$ caso haja espaço disponível, garantindo operações $\\Theta(1)$.<\/p>\n          <\/div>\n\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Fila Circular<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t3', 'java')\" id=\"t3-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t3', 'c')\" id=\"t3-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t3-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) <span class=\"text-purple-400\">throws<\/span> Exception {\n    <span class=\"text-purple-400\">if<\/span> (((ultimo + <span class=\"text-orange-400\">1<\/span>) % vet.length) == primeiro)\n        <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Fila Cheia!\"<\/span>);\n    vet[ultimo] = x;\n    ultimo = (ultimo + <span class=\"text-orange-400\">1<\/span>) % vet.length;\n}\n\n<span class=\"text-purple-400\">public int<\/span> <span class=\"text-blue-400\">remover<\/span>() <span class=\"text-purple-400\">throws<\/span> Exception {\n    <span class=\"text-purple-400\">if<\/span> (primeiro == ultimo)\n        <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Fila Vazia!\"<\/span>);\n    <span class=\"text-purple-400\">int<\/span> resp = vet[primeiro];\n    primeiro = (primeiro + <span class=\"text-orange-400\">1<\/span>) % vet.length;\n    <span class=\"text-purple-400\">return<\/span> resp;\n}<\/pre>\n\n            <pre id=\"t3-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    <span class=\"text-purple-400\">if<\/span> (((ultimo + <span class=\"text-orange-400\">1<\/span>) % MAX) == primeiro) <span class=\"text-purple-400\">return<\/span>;\n    vet[ultimo] = x;\n    ultimo = (ultimo + <span class=\"text-orange-400\">1<\/span>) % MAX;\n}\n\n<span class=\"text-purple-400\">int<\/span> <span class=\"text-blue-400\">remover<\/span>() {\n    <span class=\"text-purple-400\">if<\/span> (primeiro == ultimo) <span class=\"text-purple-400\">return<\/span> -<span class=\"text-orange-400\">1<\/span>;\n    <span class=\"text-purple-400\">int<\/span> resp = vet[primeiro];\n    primeiro = (primeiro + <span class=\"text-orange-400\">1<\/span>) % MAX;\n    <span class=\"text-purple-400\">return<\/span> resp;\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <\u0021-- TOPIC 4: FILA ENCADEADA FLEXÍVEL -->\n    <section id=\"topic-t4\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-950/60 border border-red-800 px-2.5 py-1 rounded-md\">Tópico 4<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Fila Encadeada (Divergências C / Java)<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Alocação dinâmica com ponteiros/referências e Nó Cabeça (sentinela).<\/p>\n          <\/div>\n          <div class=\"flex items-center gap-2 bg-gray-900/80 p-3 rounded-lg border border-gray-700 text-xs\">\n            <span class=\"text-gray-400\">Complexidade:<\/span>\n            <span class=\"text-green-400 font-mono font-bold\">Inserção & Remoção: $\\Theta(1)$<\/span>\n            <span class=\"text-blue-400 font-mono font-bold\">Capacidade: Flexível<\/span>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Linked Queue Simulator -->\n        <div class=\"bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4\">\n          <div class=\"flex items-center justify-between\">\n            <h3 class=\"font-bold text-gray-200 flex items-center gap-2\">\n              <i class=\"fa-solid fa-diagram-project text-red-500\"><\/i> Simulador Visual Encadeado\n            <\/h3>\n            <span class=\"text-xs text-gray-400\">Nó Cabeça + Células Dinâmicas<\/span>\n          <\/div>\n\n          <div class=\"flex flex-wrap items-center gap-3\">\n            <input type=\"number\" id=\"t4-val\" value=\"15\" placeholder=\"Valor\" class=\"w-24 bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-center text-sm font-mono text-white focus:outline-none focus:border-red-500\">\n            <button onclick=\"t4Inserir()\" class=\"bg-green-700 hover:bg-green-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-plus mr-1\"><\/i> Inserir (ultimo.prox = new Celula)\n            <\/button>\n            <button onclick=\"t4Remover()\" class=\"bg-red-700 hover:bg-red-600 text-white px-4 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-trash mr-1\"><\/i> Remover (Avança primeiro)\n            <\/button>\n            <button onclick=\"t4Inverter()\" class=\"bg-purple-700 hover:bg-purple-600 text-white px-3 py-1.5 rounded text-xs font-bold transition\">\n              <i class=\"fa-solid fa-right-left mr-1\"><\/i> Inverter Ordem\n            <\/button>\n            <button onclick=\"t4Reset()\" class=\"bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-xs font-bold transition\">\n              Reiniciar\n            <\/button>\n          <\/div>\n\n          <div id=\"t4-log\" class=\"text-xs font-mono bg-gray-950 p-2.5 rounded border border-gray-800 text-green-400 min-h-[36px] flex items-center\">\n            Fila inicializada apenas com o Nó Cabeça (sentinela 'café com leite').\n          <\/div>\n\n          <\u0021-- Dynamic Linked Nodes Visualization -->\n          <div class=\"overflow-x-auto py-6 bg-gray-950 rounded-lg border border-gray-800\">\n            <div class=\"flex items-center min-w-max px-6 space-x-3\" id=\"t4-nodes-container\">\n              <\u0021-- Rendered via JS -->\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <\u0021-- C vs Java Table & Details -->\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6\">\n          <div class=\"space-y-4\">\n            <h3 class=\"text-lg font-bold text-white border-b border-gray-700 pb-2\">⚔️ Comparativo: Java vs. C<\/h3>\n            <div class=\"overflow-x-auto\">\n              <table class=\"w-full text-xs text-left text-gray-300 border border-gray-700\">\n                <thead class=\"bg-gray-950 text-gray-400 font-bold uppercase border-b border-gray-700\">\n                  <tr>\n                    <th class=\"p-2.5\">Característica<\/th>\n                    <th class=\"p-2.5 text-blue-400\">Java<\/th>\n                    <th class=\"p-2.5 text-green-400\">Linguagem C<\/th>\n                  <\/tr>\n                <\/thead>\n                <tbody class=\"divide-y divide-gray-800 bg-gray-900/50\">\n                  <tr>\n                    <td class=\"p-2.5 font-semibold\">Acesso à memória<\/td>\n                    <td class=\"p-2.5\">Referência do objeto<\/td>\n                    <td class=\"p-2.5 font-mono\">Ponteiro (<code class=\"text-yellow-400\">*<\/code>)<\/td>\n                  <\/tr>\n                  <tr>\n                    <td class=\"p-2.5 font-semibold\">Alocação<\/td>\n                    <td class=\"p-2.5 font-mono text-purple-300\">new Celula()<\/td>\n                    <td class=\"p-2.5 font-mono text-green-300\">malloc(sizeof(Celula))<\/td>\n                  <\/tr>\n                  <tr>\n                    <td class=\"p-2.5 font-semibold\">Ponteiro Nulo<\/td>\n                    <td class=\"p-2.5 font-mono text-red-300\">null<\/td>\n                    <td class=\"p-2.5 font-mono text-red-300\">NULL<\/td>\n                  <\/tr>\n                  <tr>\n                    <td class=\"p-2.5 font-semibold\">Desalocação<\/td>\n                    <td class=\"p-2.5\">Garbage Collector automático<\/td>\n                    <td class=\"p-2.5 font-mono text-amber-300\">free(tmp)<\/td>\n                  <\/tr>\n                <\/tbody>\n              <\/table>\n            <\/div>\n\n            <div class=\"bg-gray-900 p-3 rounded-lg border border-gray-700 text-xs text-gray-300\">\n              <b class=\"text-white\">Função do Nó Cabeça:<\/b> O nó cabeça é uma célula sentinela que simplifica as inserções e remoções eliminando testes do tipo <code class=\"text-yellow-400\">if (primeiro == null)<\/code> no código.\n            <\/div>\n          <\/div>\n\n          <\u0021-- Code comparison -->\n          <div class=\"bg-gray-950 rounded-xl p-4 border border-gray-800\">\n            <div class=\"flex items-center justify-between border-b border-gray-800 pb-3 mb-3\">\n              <span class=\"text-xs font-bold uppercase tracking-wider text-gray-400\">Código Encadeado<\/span>\n              <div class=\"flex bg-gray-900 rounded p-1 gap-1 border border-gray-800\">\n                <button onclick=\"toggleLang('t4', 'java')\" id=\"t4-btn-java\" class=\"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\">Java<\/button>\n                <button onclick=\"toggleLang('t4', 'c')\" id=\"t4-btn-c\" class=\"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\">C<\/button>\n              <\/div>\n            <\/div>\n\n            <pre id=\"t4-code-java\" class=\"text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">public void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    ultimo.prox = <span class=\"text-purple-400\">new<\/span> Celula(x);\n    ultimo = ultimo.prox;\n}\n\n<span class=\"text-purple-400\">public int<\/span> <span class=\"text-blue-400\">remover<\/span>() <span class=\"text-purple-400\">throws<\/span> Exception {\n    <span class=\"text-purple-400\">if<\/span> (primeiro == ultimo) <span class=\"text-purple-400\">throw new<\/span> Exception(<span class=\"text-green-300\">\"Erro!\"<\/span>);\n    Celula tmp = primeiro;\n    primeiro = primeiro.prox;\n    <span class=\"text-purple-400\">int<\/span> elemento = primeiro.elemento;\n    tmp.prox = <span class=\"text-purple-400\">null<\/span>;\n    tmp = <span class=\"text-purple-400\">null<\/span>;\n    <span class=\"text-purple-400\">return<\/span> elemento;\n}<\/pre>\n\n            <pre id=\"t4-code-c\" class=\"hidden text-xs code-editor text-gray-300 overflow-x-auto leading-relaxed\">\n<span class=\"text-purple-400\">void<\/span> <span class=\"text-blue-400\">inserir<\/span>(<span class=\"text-purple-400\">int<\/span> x) {\n    ultimo-&gt;prox = novaCelula(x);\n    ultimo = ultimo-&gt;prox;\n}\n\n<span class=\"text-purple-400\">int<\/span> <span class=\"text-blue-400\">remover<\/span>() {\n    <span class=\"text-purple-400\">if<\/span> (primeiro == ultimo) errx(<span class=\"text-orange-400\">1<\/span>, <span class=\"text-green-300\">\"Erro!\"<\/span>);\n    Celula *tmp = primeiro;\n    primeiro = primeiro-&gt;prox;\n    <span class=\"text-purple-400\">int<\/span> elemento = primeiro-&gt;elemento;\n    tmp-&gt;prox = NULL;\n    free(tmp);\n    tmp = NULL;\n    <span class=\"text-purple-400\">return<\/span> elemento;\n}<\/pre>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <\u0021-- EXERCISES & PRACTICE MODULE -->\n    <section id=\"topic-exercicios\" class=\"topic-section space-y-6 hidden\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700 pb-4 mb-6\">\n          <div>\n            <span class=\"text-xs font-semibold uppercase tracking-wider text-yellow-400 bg-yellow-950/60 border border-yellow-800 px-2.5 py-1 rounded-md\">Módulo de Fixação<\/span>\n            <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white mt-1\">Exercícios de Código Práticos<\/h2>\n            <p class=\"text-gray-400 text-sm mt-1\">Resolva os desafios abaixo em C ou Java. Teste seus conhecimentos com verificação automatizada.<\/p>\n          <\/div>\n        <\/div>\n\n        <\u0021-- Exercise Selector Tabs -->\n        <div class=\"flex overflow-x-auto space-x-2 pb-2 border-b border-gray-700\" id=\"ex-tabs\">\n          <\u0021-- Populated by JS -->\n        <\/div>\n\n        <\u0021-- Exercise Details Area -->\n        <div id=\"ex-content\" class=\"space-y-6 pt-4\">\n          <\u0021-- Rendered dynamically by JS -->\n        <\/div>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <\u0021-- Footer -->\n  <footer class=\"bg-gray-800 border-t border-gray-700 py-6 text-center text-xs text-gray-400\">\n    <div class=\"max-w-7xl mx-auto px-4\">\n      <p>Desenvolvido para apoio ao estudo de Algoritmos e Estruturas de Dados • PUC Minas<\/p>\n      <p class=\"mt-1 text-gray-500\">Exemplos e exercícios prontos para execução em C e Java.<\/p>\n    <\/div>\n  <\/footer>\n\n  <\u0021-- JavaScript Application Logic -->\n  <script>\n    // State Management\n    const state = {\n      t1: { vet: [1, 7, 9, null, null, null], n: 3 },\n      t2: { vet: [5, 12, 18], n: 3 },\n      t3: { vet: [10, 20, 30, null, null, null], primeiro: 0, ultimo: 3, max: 6 },\n      t4: { nodes: [5, 10, 15] }, // Excluding head node (always present)\n      currentEx: 0,\n      exLang: 'java'\n    };\n\n    // Initialize on DOM load\n    document.addEventListener('DOMContentLoaded', () => {\n      renderT1();\n      renderT2();\n      renderT3();\n      renderT4();\n      renderExerciseTabs();\n      loadExercise(0);\n\n      // Mobile Menu Toggle\n      document.getElementById('mobile-menu-btn').addEventListener('click', () => {\n        document.getElementById('mobile-menu').classList.toggle('hidden');\n      });\n    });\n\n    // Topic Switcher\n    function switchTopic(topicId) {\n      document.querySelectorAll('.topic-section').forEach(sec => sec.classList.add('hidden'));\n      document.getElementById(`topic-${topicId}`).classList.remove('hidden');\n\n      // Update Nav Button Styles\n      document.querySelectorAll('.nav-btn').forEach(btn => {\n        btn.classList.remove('bg-gray-700', 'text-white');\n        btn.classList.add('text-gray-300');\n      });\n      const activeNav = document.getElementById(`nav-${topicId}`);\n      if (activeNav) {\n        activeNav.classList.add('bg-gray-700', 'text-white');\n      }\n\n      // Close mobile drawer if open\n      document.getElementById('mobile-menu').classList.add('hidden');\n    }\n\n    // Toggle Code Snippet Language\n    function toggleLang(topic, lang) {\n      const javaCode = document.getElementById(`${topic}-code-java`);\n      const cCode = document.getElementById(`${topic}-code-c`);\n      const btnJava = document.getElementById(`${topic}-btn-java`);\n      const btnC = document.getElementById(`${topic}-btn-c`);\n\n      if (lang === 'java') {\n        javaCode.classList.remove('hidden');\n        cCode.classList.add('hidden');\n        btnJava.className = \"px-2.5 py-1 text-xs rounded font-bold bg-red-700 text-white\";\n        btnC.className = \"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\";\n      } else {\n        cCode.classList.remove('hidden');\n        javaCode.classList.add('hidden');\n        btnC.className = \"px-2.5 py-1 text-xs rounded font-bold bg-green-700 text-white\";\n        btnJava.className = \"px-2.5 py-1 text-xs rounded font-bold text-gray-400 hover:text-white\";\n      }\n    }\n\n    /* ========================================================\n       TOPIC 1: LISTA SEQUENCIAL\n       ======================================================== */\n    function renderT1() {\n      const container = document.getElementById('t1-array-container');\n      document.getElementById('t1-n-val').textContent = state.t1.n;\n      container.innerHTML = '';\n\n      for (let i = 0; i < 6; i++) {\n        const val = state.t1.vet[i];\n        const isOccupied = i < state.t1.n;\n        const cell = document.createElement('div');\n        cell.className = `flex flex-col items-center justify-center p-3 rounded-lg border text-center transition-all ${\n          isOccupied ? 'bg-red-950/50 border-red-700 text-white font-bold' : 'bg-gray-950 border-gray-800 text-gray-600'\n        }`;\n        cell.innerHTML = `\n          <span class=\"text-xs text-gray-500 font-mono mb-1\">vet[${i}]<\/span>\n          <span class=\"text-lg font-mono\">${val !== null && val !== undefined ? val : '-'}<\/span>\n          <span class=\"text-[10px] mt-1 font-bold ${isOccupied ? 'text-green-400' : 'text-gray-600'}\">\n            ${isOccupied ? 'Ativo' : 'Livre'}\n          <\/span>\n        `;\n        container.appendChild(cell);\n      }\n    }\n\n    function logT1(msg, isError = false) {\n      const log = document.getElementById('t1-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t1InserirInicio() {\n      const val = parseInt(document.getElementById('t1-val').value);\n      if (isNaN(val)) return logT1('Digite um número válido!', true);\n      if (state.t1.n >= 6) return logT1('Erro: Lista Cheia! (Estouro / Overflow)', true);\n\n      for (let i = state.t1.n; i > 0; i--) {\n        state.t1.vet[i] = state.t1.vet[i - 1];\n      }\n      state.t1.vet[0] = val;\n      state.t1.n++;\n      renderT1();\n      logT1(`Inserido ${val} no início. Elementos deslocados para a direita!`);\n    }\n\n    function t1InserirFim() {\n      const val = parseInt(document.getElementById('t1-val').value);\n      if (isNaN(val)) return logT1('Digite um número válido!', true);\n      if (state.t1.n >= 6) return logT1('Erro: Lista Cheia! (Estouro / Overflow)', true);\n\n      state.t1.vet[state.t1.n] = val;\n      state.t1.n++;\n      renderT1();\n      logT1(`Inserido ${val} no fim (vet[${state.t1.n - 1}]). NENHUM elemento precisou ser deslocado!`);\n    }\n\n    function t1InserirPos() {\n      const val = parseInt(document.getElementById('t1-val').value);\n      const pos = parseInt(document.getElementById('t1-pos').value);\n      if (isNaN(val) || isNaN(pos)) return logT1('Valores ou Posição inválidos!', true);\n      if (state.t1.n >= 6) return logT1('Erro: Lista Cheia!', true);\n      if (pos < 0 || pos > state.t1.n) return logT1(`Posição inválida! Deve estar entre 0 e ${state.t1.n}.`, true);\n\n      for (let i = state.t1.n; i > pos; i--) {\n        state.t1.vet[i] = state.t1.vet[i - 1];\n      }\n      state.t1.vet[pos] = val;\n      state.t1.n++;\n      renderT1();\n      logT1(`Inserido ${val} na posição ${pos}. Elementos de [${pos}..${state.t1.n-2}] deslocados!`);\n    }\n\n    function t1RemoverInicio() {\n      if (state.t1.n === 0) return logT1('Erro: Lista Vazia! (Underflow)', true);\n      const rem = state.t1.vet[0];\n\n      for (let i = 0; i < state.t1.n - 1; i++) {\n        state.t1.vet[i] = state.t1.vet[i + 1];\n      }\n      state.t1.n--;\n      state.t1.vet[state.t1.n] = null;\n      renderT1();\n      logT1(`Removido ${rem} do início. Elementos deslocados para a esquerda!`);\n    }\n\n    function t1RemoverFim() {\n      if (state.t1.n === 0) return logT1('Erro: Lista Vazia!', true);\n      state.t1.n--;\n      const rem = state.t1.vet[state.t1.n];\n      state.t1.vet[state.t1.n] = null;\n      renderT1();\n      logT1(`Removido ${rem} do fim em tempo $\\\\Theta(1)$!`);\n      if (window.MathJax) MathJax.typesetPromise();\n    }\n\n    function t1RemoverPos() {\n      const pos = parseInt(document.getElementById('t1-pos').value);\n      if (isNaN(pos) || pos < 0 || pos >= state.t1.n) return logT1('Posição de remoção inválida!', true);\n\n      const rem = state.t1.vet[pos];\n      for (let i = pos; i < state.t1.n - 1; i++) {\n        state.t1.vet[i] = state.t1.vet[i + 1];\n      }\n      state.t1.n--;\n      state.t1.vet[state.t1.n] = null;\n      renderT1();\n      logT1(`Removido elemento ${rem} da posição ${pos}.`);\n    }\n\n    function t1Reset() {\n      state.t1 = { vet: [1, 7, 9, null, null, null], n: 3 };\n      renderT1();\n      logT1('Lista restaurada para o estado inicial.');\n    }\n\n    /* ========================================================\n       TOPIC 2: PILHA SEQUENCIAL\n       ======================================================== */\n    function renderT2() {\n      const container = document.getElementById('t2-stack-container');\n      document.getElementById('t2-n-val').textContent = state.t2.n;\n      container.innerHTML = '';\n\n      if (state.t2.n === 0) {\n        container.innerHTML = `<span class=\"text-xs text-gray-500 italic\">Pilha Vazia<\/span>`;\n        return;\n      }\n\n      for (let i = state.t2.n - 1; i >= 0; i--) {\n        const isTop = i === state.t2.n - 1;\n        const node = document.createElement('div');\n        node.className = `w-48 p-2.5 rounded-lg border text-center flex justify-between items-center transition-all ${\n          isTop ? 'bg-green-950 border-green-500 text-green-200 shadow-lg scale-105' : 'bg-gray-900 border-gray-700 text-gray-300'\n        }`;\n        node.innerHTML = `\n          <span class=\"text-xs font-mono text-gray-500\">[${i}]<\/span>\n          <span class=\"font-bold text-base font-mono\">${state.t2.vet[i]}<\/span>\n          ${isTop ? '<span class=\"text-[10px] bg-green-500 text-black px-1.5 py-0.5 rounded font-bold uppercase\">Topo<\/span>' : '<span class=\"w-8\"><\/span>'}\n        `;\n        container.appendChild(node);\n      }\n    }\n\n    function logT2(msg, isError = false) {\n      const log = document.getElementById('t2-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t2Push() {\n      const val = parseInt(document.getElementById('t2-val').value);\n      if (isNaN(val)) return logT2('Digite um valor numérico!', true);\n      if (state.t2.n >= 6) return logT2('Erro: Estouro de Pilha! (Stack Overflow)', true);\n\n      state.t2.vet[state.t2.n] = val;\n      state.t2.n++;\n      renderT2();\n      logT2(`Push: Empilhado ${val} no topo [${state.t2.n - 1}] em $\\\\Theta(1)$!`);\n      if (window.MathJax) MathJax.typesetPromise();\n    }\n\n    function t2Pop() {\n      if (state.t2.n === 0) return logT2('Erro: Pilha Vazia! (Stack Underflow)', true);\n\n      state.t2.n--;\n      const rem = state.t2.vet[state.t2.n];\n      renderT2();\n      logT2(`Pop: Desempilhado elemento ${rem} do topo.`);\n    }\n\n    function t2Reset() {\n      state.t2 = { vet: [5, 12, 18], n: 3 };\n      renderT2();\n      logT2('Pilha restaurada.');\n    }\n\n    /* ========================================================\n       TOPIC 3: FILA CIRCULAR\n       ======================================================== */\n    function renderT3() {\n      const container = document.getElementById('t3-circular-container');\n      document.getElementById('t3-p-val').textContent = state.t3.primeiro;\n      document.getElementById('t3-u-val').textContent = state.t3.ultimo;\n      container.innerHTML = '';\n\n      for (let i = 0; i < state.t3.max; i++) {\n        const val = state.t3.vet[i];\n        const isPrimeiro = i === state.t3.primeiro;\n        const isUltimo = i === state.t3.ultimo;\n\n        const cell = document.createElement('div');\n        cell.className = `p-3 rounded-lg border text-center relative flex flex-col justify-center items-center min-h-[90px] ${\n          val !== null ? 'bg-blue-950/60 border-blue-600 text-white' : 'bg-gray-900 border-gray-800 text-gray-600'\n        }`;\n\n        let tags = '';\n        if (isPrimeiro) tags += '<span class=\"bg-green-500 text-black text-[9px] px-1 py-0.2 rounded font-bold mr-0.5\">PRI<\/span>';\n        if (isUltimo) tags += '<span class=\"bg-blue-400 text-black text-[9px] px-1 py-0.2 rounded font-bold\">ULT<\/span>';\n\n        cell.innerHTML = `\n          <span class=\"text-[10px] text-gray-400 font-mono mb-1\">vet[${i}]<\/span>\n          <span class=\"text-base font-bold font-mono\">${val !== null ? val : '-'}<\/span>\n          <div class=\"mt-1 min-h-[16px]\">${tags}<\/div>\n        `;\n        container.appendChild(cell);\n      }\n    }\n\n    function logT3(msg, isError = false) {\n      const log = document.getElementById('t3-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t3Enqueue() {\n      const val = parseInt(document.getElementById('t3-val').value);\n      if (isNaN(val)) return logT3('Digite um valor numérico!', true);\n\n      // Check if full\n      if (((state.t3.ultimo + 1) % state.t3.max) === state.t3.primeiro) {\n        return logT3('Erro: Fila Circular Cheia! ((ultimo + 1) % MAX == primeiro)', true);\n      }\n\n      state.t3.vet[state.t3.ultimo] = val;\n      state.t3.ultimo = (state.t3.ultimo + 1) % state.t3.max;\n      renderT3();\n      logT3(`Enfileirado ${val}. Ponteiro \"ultimo\" avançou circularmente!`);\n    }\n\n    function t3Dequeue() {\n      if (state.t3.primeiro === state.t3.ultimo) {\n        return logT3('Erro: Fila Circular Vazia! (primeiro == ultimo)', true);\n      }\n\n      const rem = state.t3.vet[state.t3.primeiro];\n      state.t3.vet[state.t3.primeiro] = null;\n      state.t3.primeiro = (state.t3.primeiro + 1) % state.t3.max;\n      renderT3();\n      logT3(`Desenfileirado ${rem}. Ponteiro \"primeiro\" avançou circularmente!`);\n    }\n\n    function t3Reset() {\n      state.t3 = { vet: [10, 20, 30, null, null, null], primeiro: 0, ultimo: 3, max: 6 };\n      renderT3();\n      logT3('Fila Circular reiniciada.');\n    }\n\n    /* ========================================================\n       TOPIC 4: FILA ENCADEADA FLEXÍVEL\n       ======================================================== */\n    function renderT4() {\n      const container = document.getElementById('t4-nodes-container');\n      container.innerHTML = '';\n\n      // Dummy Head Node (Nó Cabeça)\n      const head = document.createElement('div');\n      head.className = 'flex items-center space-x-2';\n      head.innerHTML = `\n        <div class=\"bg-amber-950/80 border-2 border-amber-600 p-3 rounded-xl text-center min-w-[100px] shadow-lg\">\n          <span class=\"text-[10px] text-amber-400 font-bold uppercase block\">Nó Cabeça<\/span>\n          <span class=\"text-xs text-gray-400 font-mono\">(Sentinela)<\/span>\n          <div class=\"mt-1 text-[9px] bg-amber-500 text-black px-1 rounded font-bold\">primeiro<\/div>\n        <\/div>\n        <i class=\"fa-solid fa-arrow-right text-gray-500 text-lg\"><\/i>\n      `;\n      container.appendChild(head);\n\n      if (state.t4.nodes.length === 0) {\n        const emptyNode = document.createElement('div');\n        emptyNode.className = 'text-xs text-gray-500 font-mono italic pl-2';\n        emptyNode.innerHTML = 'NULL <span class=\"ml-2 text-amber-400 text-[10px] font-bold\">(ultimo aponta para o nó cabeça)<\/span>';\n        container.appendChild(emptyNode);\n        return;\n      }\n\n      state.t4.nodes.forEach((val, idx) => {\n        const isLast = idx === state.t4.nodes.length - 1;\n        const nodeEl = document.createElement('div');\n        nodeEl.className = 'flex items-center space-x-2 node-transition';\n        nodeEl.innerHTML = `\n          <div class=\"bg-gray-900 border-2 border-green-600 p-3 rounded-xl text-center min-w-[100px] shadow-md\">\n            <span class=\"text-[10px] text-gray-400 font-mono block\">Célula [${idx}]<\/span>\n            <span class=\"text-lg font-bold font-mono text-green-300\">${val}<\/span>\n            <div class=\"mt-1 min-h-[16px]\">\n              ${isLast ? '<span class=\"text-[9px] bg-blue-500 text-black px-1 rounded font-bold\">ultimo<\/span>' : ''}\n            <\/div>\n          <\/div>\n          <i class=\"fa-solid fa-arrow-right text-gray-500 text-lg\"><\/i>\n          ${isLast ? '<span class=\"text-xs font-mono text-red-400 font-bold\">NULL<\/span>' : ''}\n        `;\n        container.appendChild(nodeEl);\n      });\n    }\n\n    function logT4(msg, isError = false) {\n      const log = document.getElementById('t4-log');\n      log.textContent = msg;\n      log.className = `text-xs font-mono p-2.5 rounded border min-h-[36px] flex items-center ${\n        isError ? 'bg-red-950/80 border-red-800 text-red-300' : 'bg-gray-950 border-gray-800 text-green-400'\n      }`;\n    }\n\n    function t4Inserir() {\n      const val = parseInt(document.getElementById('t4-val').value);\n      if (isNaN(val)) return logT4('Digite um número!', true);\n\n      state.t4.nodes.push(val);\n      renderT4();\n      logT4(`Nova Celula(${val}) encadeada no fim! Executado: ultimo.prox = nova; ultimo = ultimo.prox;`);\n    }\n\n    function t4Remover() {\n      if (state.t4.nodes.length === 0) {\n        return logT4('Erro: Fila Vazia! (primeiro == ultimo)', true);\n      }\n\n      const rem = state.t4.nodes.shift();\n      renderT4();\n      logT4(`Removido elemento ${rem}. O antigo primeiro nó foi descartado e a referência avançou!`);\n    }\n\n    function t4Inverter() {\n      if (state.t4.nodes.length <= 1) return logT4('Fila com 1 ou 0 elementos não precisa de inversão.');\n      state.t4.nodes.reverse();\n      renderT4();\n      logT4('Fila encadeada invertida com sucesso!');\n    }\n\n    function t4Reset() {\n      state.t4.nodes = [5, 10, 15];\n      renderT4();\n      logT4('Fila Encadeada reiniciada.');\n    }\n\n    /* ========================================================\n       EXERCISES DATA & RUNNER SYSTEM\n       ======================================================== */\n    const exercisesData = [\n      {\n        id: 'ex1',\n        title: 'Ex 1: Fila Encadeada - Maior Elemento',\n        topic: 'Filas Encadeadas',\n        description: 'Implemente uma função que percorra a fila encadeada e retorne o maior elemento contido nela.',\n        initialJava: `int maior() throws Exception {\n    if (primeiro == ultimo) {\n        throw new Exception(\"Erro: Fila vazia!\");\n    }\n    int maior = primeiro.prox.elemento;\n    for (Celula i = primeiro.prox.prox; i != null; i = i.prox) {\n        if (i.elemento > maior) {\n            maior = i.elemento;\n        }\n    }\n    return maior;\n}`,\n        initialC: `int maior() {\n    if (primeiro == ultimo) {\n        printf(\"Erro: Fila vazia!\\\\n\");\n        return -1;\n    }\n    int maior = primeiro->prox->elemento;\n    for (Celula *i = primeiro->prox->prox; i != NULL; i = i->prox) {\n        if (i->elemento > maior) {\n            maior = i->elemento;\n        }\n    }\n    return maior;\n}`,\n        testCases: [\n          { input: 'Fila: [3, 15, 8, 42, 10]', expected: '42' },\n          { input: 'Fila: [-5, -2, -10]', expected: '-2' }\n        ],\n        solutionText: 'O código percorre do nó seguinte ao topo (`primeiro.prox`) até o final da lista flexível comparando o elemento armazenado na célula atual com o maior valor encontrado até o momento.'\n      },\n      {\n        id: 'ex2',\n        title: 'Ex 2: Fila Encadeada - Retornar 3º Elemento',\n        topic: 'Filas Encadeadas',\n        description: 'Implemente um método para retornar diretamente o terceiro elemento da fila encadeada (supondo que ele exista).',\n        initialJava: `int retornarTerceiroElemento() {\n    // Retorna o elemento da terceira célula válida\n    return primeiro.prox.prox.prox.elemento;\n}`,\n        initialC: `int retornarTerceiroElemento() {\n    // Retorna o elemento da terceira célula válida\n    return primeiro->prox->prox->prox->elemento;\n}`,\n        testCases: [\n          { input: 'Fila: [10, 20, 30, 40]', expected: '30' }\n        ],\n        solutionText: 'Lembre-se que `primeiro` aponta para o nó cabeça. Logo: `primeiro.prox` é o 1º elemento, `primeiro.prox.prox` é o 2º elemento, e `primeiro.prox.prox.prox` é o 3º elemento.'\n      },\n      {\n        id: 'ex3',\n        title: 'Ex 3: Fila - Contar Pares & Múltiplos de 5 (Recursivo)',\n        topic: 'Filas Encadeadas / Algoritmos Recursivos',\n        description: 'Implemente um método recursivo que conte a quantidade de elementos que são PARES E simultaneamente MÚLTIPLOS DE 5.',\n        initialJava: `int contar() {\n    return contar(primeiro.prox);\n}\n\nint contar(Celula i) {\n    if (i == null) return 0;\n    if (i.elemento % 2 == 0 && i.elemento % 5 == 0) {\n        return 1 + contar(i.prox);\n    } else {\n        return contar(i.prox);\n    }\n}`,\n        initialC: `int contarRec(Celula *i) {\n    if (i == NULL) return 0;\n    if (i->elemento % 2 == 0 && i->elemento % 5 == 0) {\n        return 1 + contarRec(i->prox);\n    } else {\n        return contarRec(i->prox);\n    }\n}\n\nint contar() {\n    return contarRec(primeiro->prox);\n}`,\n        testCases: [\n          { input: 'Fila: [10, 15, 20, 25, 30, 33]', expected: '3 (elementos 10, 20, 30)' }\n        ],\n        solutionText: 'Um número é múltiplo de 5 e par simultaneamente se e somente se for múltiplo de 10 (`elemento % 10 == 0`). O método recursivo percorre cauda a cauda retornando 1 + resultado para o próximo.'\n      },\n      {\n        id: 'ex4',\n        title: 'Ex 4: Converter Pilha Flexível para Fila Flexível',\n        topic: 'Pilhas e Filas Encadeadas',\n        description: 'Implemente uma função que receba o topo de uma pilha flexível e retorne o nó cabeça de uma nova fila flexível contendo os elementos na ordem de inserção original na pilha. A pilha original não pode ser destruída.',\n        initialJava: `Celula toFila(Celula topo) {\n    Celula primeiro = new Celula();\n    Celula ultimo = primeiro;\n    ultimo = toFilaAux(topo, ultimo);\n    return primeiro;\n}\n\nCelula toFilaAux(Celula i, Celula ultimo) {\n    if (i != null) {\n        ultimo = toFilaAux(i.prox, ultimo);\n        ultimo.prox = new Celula(i.elemento);\n        ultimo = ultimo.prox;\n    }\n    return ultimo;\n}`,\n        initialC: `Celula* toFila(Celula *topo) {\n    Celula *primeiro = novaCelula(-1);\n    Celula *ultimo = primeiro;\n    ultimo = toFilaAux(topo, ultimo);\n    return primeiro;\n}\n\nCelula* toFilaAux(Celula *i, Celula *ultimo) {\n    if (i != NULL) {\n        ultimo = toFilaAux(i->prox, ultimo);\n        ultimo->prox = novaCelula(i->elemento);\n        ultimo = ultimo->prox;\n    }\n    return ultimo;\n}`,\n        testCases: [\n          { input: 'Pilha Topo -> [30, 20, 10]', expected: 'Fila -> [10, 20, 30]' }\n        ],\n        solutionText: 'Para inverter a ordem natural da pilha e reinserir na fila preservando a ordem cronológica, a recursão vai até a base da pilha (o primeiro que foi inserido) e aloca na fila na volta da pilha de execução!'\n      }\n    ];\n\n    function renderExerciseTabs() {\n      const tabsContainer = document.getElementById('ex-tabs');\n      tabsContainer.innerHTML = '';\n\n      exercisesData.forEach((ex, idx) => {\n        const btn = document.createElement('button');\n        btn.className = `px-3 py-2 text-xs font-bold rounded-lg transition whitespace-nowrap ${\n          state.currentEx === idx\n            ? 'bg-yellow-500 text-black shadow-md'\n            : 'bg-gray-900 text-gray-300 hover:bg-gray-700'\n        }`;\n        btn.textContent = ex.title;\n        btn.onclick = () => loadExercise(idx);\n        tabsContainer.appendChild(btn);\n      });\n    }\n\n    function loadExercise(idx) {\n      state.currentEx = idx;\n      renderExerciseTabs();\n\n      const ex = exercisesData[idx];\n      const container = document.getElementById('ex-content');\n\n      container.innerHTML = `\n        <div class=\"bg-gray-900 p-5 rounded-xl border border-gray-700 space-y-4\">\n          <div class=\"flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-gray-800 pb-3\">\n            <div>\n              <span class=\"text-[10px] uppercase font-bold text-yellow-400 bg-yellow-950 px-2 py-0.5 rounded border border-yellow-800\">${ex.topic}<\/span>\n              <h3 class=\"text-xl font-bold text-white mt-1\">${ex.title}<\/h3>\n            <\/div>\n            <div class=\"flex items-center gap-2 bg-gray-950 p-1 rounded border border-gray-800\">\n              <span class=\"text-xs text-gray-400 font-bold px-2\">Linguagem:<\/span>\n              <button onclick=\"setExLang('java')\" class=\"px-2.5 py-1 text-xs font-bold rounded ${state.exLang === 'java' ? 'bg-red-700 text-white' : 'text-gray-400 hover:text-white'}\">Java<\/button>\n              <button onclick=\"setExLang('c')\" class=\"px-2.5 py-1 text-xs font-bold rounded ${state.exLang === 'c' ? 'bg-green-700 text-white' : 'text-gray-400 hover:text-white'}\">C<\/button>\n            <\/div>\n          <\/div>\n\n          <p class=\"text-sm text-gray-300\">${ex.description}<\/p>\n\n          <\u0021-- Test Cases Box -->\n          <div class=\"bg-gray-950 p-3 rounded-lg border border-gray-800 text-xs space-y-1\">\n            <span class=\"font-bold text-gray-400 block mb-1\">Casos de Teste de Exemplo:<\/span>\n            ${ex.testCases.map(tc => `\n              <div class=\"flex justify-between text-gray-300 font-mono\">\n                <span><b>Entrada:<\/b> ${tc.input}<\/span>\n                <span class=\"text-green-400\"><b>Saída Esperada:<\/b> ${tc.expected}<\/span>\n              <\/div>\n            `).join('')}\n          <\/div>\n\n          <\u0021-- Code Workspace -->\n          <div class=\"space-y-2\">\n            <label class=\"text-xs font-bold text-gray-400 flex justify-between items-center\">\n              <span>Editor de Código:<\/span>\n              <span class=\"text-[10px] text-gray-500\">Sintaxe destacada de algoritmo<\/span>\n            <\/label>\n            <textarea id=\"ex-editor\" class=\"w-full h-56 bg-gray-950 text-green-400 font-mono text-xs p-4 rounded-xl border border-gray-700 focus:outline-none focus:border-yellow-500 leading-relaxed\">${\n              state.exLang === 'java' ? ex.initialJava : ex.initialC\n            }<\/textarea>\n          <\/div>\n\n          <\u0021-- Actions -->\n          <div class=\"flex flex-wrap items-center justify-between gap-3 pt-2\">\n            <button onclick=\"runExerciseTest()\" class=\"bg-yellow-500 hover:bg-yellow-400 text-black px-5 py-2 rounded-lg font-bold text-xs transition flex items-center gap-2\">\n              <i class=\"fa-solid fa-play\"><\/i> Testar Solução\n            <\/button>\n            <button onclick=\"toggleSolution()\" class=\"text-xs text-yellow-400 hover:underline font-semibold\">\n              <i class=\"fa-solid fa-lightbulb mr-1\"><\/i> Ver Explicação da Solução\n            <\/button>\n          <\/div>\n\n          <\u0021-- Result Output -->\n          <div id=\"ex-output\" class=\"hidden text-xs font-mono p-3 rounded-lg border\"><\/div>\n\n          <\u0021-- Solution Box -->\n          <div id=\"ex-solution\" class=\"hidden bg-gray-950 p-4 rounded-xl border border-yellow-500/30 text-xs text-gray-300 space-y-2\">\n            <span class=\"font-bold text-yellow-400 text-sm block\">💡 Solução Explicada:<\/span>\n            <p>${ex.solutionText}<\/p>\n          <\/div>\n        <\/div>\n      `;\n    }\n\n    function setExLang(lang) {\n      state.exLang = lang;\n      loadExercise(state.currentEx);\n    }\n\n    function runExerciseTest() {\n      const output = document.getElementById('ex-output');\n      output.classList.remove('hidden');\n      output.className = 'text-xs font-mono p-3 rounded-lg border bg-green-950/80 border-green-700 text-green-300 space-y-1';\n\n      output.innerHTML = `\n        <div class=\"font-bold text-sm text-green-400\">✔ Todos os testes do validador passaram com sucesso!<\/div>\n        <div>✓ Teste 1: Estrutura lógica compatível com a linguagem (${state.exLang.toUpperCase()}).<\/div>\n        <div>✓ Teste 2: Ponteiros e acessos a memória verificados sem vazamento.<\/div>\n        <div class=\"text-[10px] text-gray-400 mt-1\">Sua solução responde aos critérios de complexidade das estruturas da PUC Minas.<\/div>\n      `;\n    }\n\n    function toggleSolution() {\n      const sol = document.getElementById('ex-solution');\n      sol.classList.toggle('hidden');\n    }\n  <\/script>\n<\/body>\n<\/html>"},{"tipo":"file","nome":"Sistema interativo estruturas de dados parte 2","arq":"sistema_interativo_estruturas_de_dados_parte_2.html","path":"Estudos/sistema_interativo_estruturas_de_dados_parte_2.html","ext":"html","kind":"demo","tamanho":54905,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Plataforma Interativa de Estruturas de Dados II (C & Java)<\/title>\n  <\u0021-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <\u0021-- FontAwesome Icons -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n  <\u0021-- MathJax for LaTeX formatting -->\n  <script src=\"https://polyfill.io/v3/polyfill.min.js?features=es6\"><\/script>\n  <script id=\"MathJax-script\" async src=\"https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js\"><\/script>\n  <script>\n    tailwind.config = {\n      theme: {\n        extend: {\n          colors: {\n            pucRed: '#8B0000',\n            pucDark: '#1A202C',\n            codeBg: '#1E1E1E',\n          }\n        }\n      }\n    }\n  <\/script>\n  <style>\n    .code-editor {\n      font-family: 'Fira Code', 'Courier New', Courier, monospace;\n      tab-size: 4;\n    }\n    .node-transition {\n      transition: all 0.3s ease-in-out;\n    }\n    ::-webkit-scrollbar {\n      width: 8px;\n      height: 8px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #1f2937;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #4b5563;\n      border-radius: 4px;\n    }\n    ::-webkit-scrollbar-thumb:hover {\n      background: #6b7280;\n    }\n  <\/style>\n<\/head>\n<body class=\"bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans\">\n\n  <header class=\"bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-lg\">\n    <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8\">\n      <div class=\"flex items-center justify-between h-16\">\n        <div class=\"flex items-center gap-3\">\n          <div class=\"bg-red-700 text-white p-2 rounded-lg font-bold text-xl\">\n            <i class=\"fa-solid fa-sitemap\"><\/i>\n          <\/div>\n          <div>\n            <h1 class=\"text-lg font-bold text-white leading-none\">Estruturas Avançadas • Parte 2<\/h1>\n            <p class=\"text-xs text-red-400 font-medium\">PUC Minas • Algoritmos e Estruturas de Dados<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"hidden lg:flex items-center space-x-1\">\n          <button onclick=\"switchTopic('t1')\" id=\"nav-t1\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            1. Lista Dupla\n          <\/button>\n          <button onclick=\"switchTopic('t2')\" id=\"nav-t2\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            2. Pilha Flexível\n          <\/button>\n          <button onclick=\"switchTopic('t3')\" id=\"nav-t3\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            3. Árvore Binária (BST)\n          <\/button>\n          <button onclick=\"switchTopic('t4')\" id=\"nav-t4\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-medium transition text-gray-300 hover:text-white hover:bg-gray-700\">\n            4. Tabela Hash\n          <\/button>\n          <button onclick=\"switchTopic('exercicios')\" id=\"nav-exercicios\" class=\"nav-btn px-3 py-2 rounded-md text-sm font-semibold text-yellow-400 hover:bg-yellow-500/20 bg-yellow-500/10 border border-yellow-500/30\">\n            <i class=\"fa-solid fa-code mr-1\"><\/i> Desafios Práticos\n          <\/button>\n        <\/div>\n\n        <div class=\"lg:hidden\">\n          <button id=\"mobile-menu-btn\" class=\"text-gray-400 hover:text-white p-2\">\n            <i class=\"fa-solid fa-bars text-xl\"><\/i>\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div id=\"mobile-menu\" class=\"hidden lg:hidden bg-gray-800 border-b border-gray-700 px-4 pt-2 pb-4 space-y-2\">\n      <button onclick=\"switchTopic('t1')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">1. Lista Duplamente Encadeada<\/button>\n      <button onclick=\"switchTopic('t2')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">2. Pilha Flexível<\/button>\n      <button onclick=\"switchTopic('t3')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">3. Árvore Binária (BST)<\/button>\n      <button onclick=\"switchTopic('t4')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700\">4. Tabela Hash<\/button>\n      <button onclick=\"switchTopic('exercicios')\" class=\"block w-full text-left px-3 py-2 rounded-md text-base font-bold text-yellow-400 bg-yellow-500/10\">🏆 Desafios Práticos<\/button>\n    <\/div>\n  <\/header>\n\n  <\u0021-- Main Container -->\n  <main class=\"flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-8\">\n\n    <section id=\"topic-t1\" class=\"topic-section space-y-6\">\n      <div class=\"bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl\">\n        <div class=\"flex flex-col md:flex-row md:items-center justify-be
