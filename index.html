<style>
/* ==========================================================================
   1. TOKENS (cores, tipografia, medidas)
   ========================================================================== */
:root{
  color-scheme:light;
  --bg:#eef2f5; --panel:#ffffff; --panel-2:#f6f9fb;
  --ink:#14232e; --ink-2:#3b4f5c; --mute:#667c89;
  --line:#d3dee5; --line-2:#e6edf1;
  --acc:#0f7c8a; --acc-ink:#ffffff; --acc-soft:#dcf0f2;
  --k-guia:#0f7c8a; --k-demo:#b97d00; --k-codigo:#6552d0; --k-img:#2e8b57; --k-outro:#667c89;
  --code-bg:#f5f8fa;
  --tk-kw:#6552d0; --tk-ty:#0f7c8a; --tk-str:#b2551d; --tk-num:#a4437b; --tk-com:#7b8e99; --tk-fn:#1f6fb5; --tk-meta:#8a6d00;
  --r:12px; --side:310px; --top:58px;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e171d; --panel:#152229; --panel-2:#1a2a32;
    --ink:#e5eef2; --ink-2:#b7c8d1; --mute:#8aa0ac;
    --line:#28404b; --line-2:#203540;
    --acc:#45c1d0; --acc-ink:#05242a; --acc-soft:#173a42;
    --k-guia:#45c1d0; --k-demo:#f0b429; --k-codigo:#9d8cff; --k-img:#5cc08a; --k-outro:#8aa0ac;
    --code-bg:#101c22;
    --tk-kw:#b4a7ff; --tk-ty:#5fd0de; --tk-str:#f0a070; --tk-num:#f08fc0; --tk-com:#7d94a0; --tk-fn:#7cb8f0; --tk-meta:#e6c35c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e171d; --panel:#152229; --panel-2:#1a2a32;
  --ink:#e5eef2; --ink-2:#b7c8d1; --mute:#8aa0ac;
  --line:#28404b; --line-2:#203540;
  --acc:#45c1d0; --acc-ink:#05242a; --acc-soft:#173a42;
  --k-guia:#45c1d0; --k-demo:#f0b429; --k-codigo:#9d8cff; --k-img:#5cc08a; --k-outro:#8aa0ac;
  --code-bg:#101c22;
  --tk-kw:#b4a7ff; --tk-ty:#5fd0de; --tk-str:#f0a070; --tk-num:#f08fc0; --tk-com:#7d94a0; --tk-fn:#7cb8f0; --tk-meta:#e6c35c;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ==========================================================================
   3. BARRA SUPERIOR
   ========================================================================== */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:600 13px var(--mono)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;font-weight:600;font-size:.85rem}
.btn:hover{border-color:var(--acc)}
.btn.icon{width:36px;height:36px;padding:0;justify-content:center}
.menu{display:none}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}

/* ==========================================================================
   4. ESTRUTURA (barra lateral + conteúdo)
   ========================================================================== */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);align-items:start}
.side{position:sticky;top:var(--top);height:calc(100dvh - var(--top));overflow:auto;padding:14px 10px 28px;border-right:1px solid var(--line);background:var(--panel)}
main{padding:22px clamp(16px,3vw,40px) 60px;min-width:0}
.scrim{display:none}

/* ==========================================================================
   5. ÁRVORE DE PASTAS
   ========================================================================== */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:8px;border-left:1px solid var(--line-2);display:none}
.tree li.open>ul{display:block}
.row{display:flex;align-items:center;gap:6px;min-height:32px;border-radius:8px}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--acc-soft);color:var(--ink)}
.tog{width:24px;height:24px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--mute);border-radius:6px}
.tog .ic{transition:transform .15s}
li.open>.row .tog .ic{transform:rotate(90deg)}
.name,.file,.home{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:.92rem}
.name{flex:1;padding:4px 8px 4px 2px}
.home{padding:4px 8px;font-weight:700}
.file{padding:4px 8px 4px 30px;font-weight:500;font-size:.88rem;color:var(--ink-2)}
.name span,.file span,.home span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name .ic{color:var(--acc)}
.file .ic{color:var(--k-outro)}
.file.k-guia .ic{color:var(--k-guia)}
.file.k-demo .ic{color:var(--k-demo)}
.file.k-codigo .ic{color:var(--k-codigo)}
.file.k-img .ic{color:var(--k-img)}
.none{padding:10px;color:var(--mute);font-size:.9rem}

/* ==========================================================================
   6. CABEÇALHO DA PÁGINA E MIGALHAS
   ========================================================================== */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;color:var(--mute);font-size:.85rem}
.crumbs a:hover{color:var(--acc);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink-2);font-weight:600}
.sep{opacity:.5}
.head h1{margin:0 0 6px;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.15;letter-spacing:-.02em;font-weight:800}
.head .sub{margin:0 0 8px;max-width:62ch;color:var(--ink-2)}
.tally{margin:0;color:var(--mute);font-size:.9rem}
h2.sec{margin:28px 0 12px;font-size:1.05rem;font-weight:700}

/* ==========================================================================
   7. CARDS DE PASTAS
   ========================================================================== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:8px;font-size:1.02rem}
.card-top .ic{color:var(--acc)}
.path{font:.76rem var(--mono);color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--line-2);border-radius:99px;background:var(--panel-2);color:var(--ink-2);font-size:.78rem;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--k-outro)}
.pill.k-guia i{background:var(--k-guia)}
.pill.k-demo i{background:var(--k-demo)}
.pill.k-codigo i{background:var(--k-codigo)}
.pill.k-img i{background:var(--k-img)}

/* ==========================================================================
   8. ABAS, CHIPS E VISUALIZADOR
   ========================================================================== */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:24px;border-bottom:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:8px;margin-bottom:-1px;padding:9px 14px;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;color:var(--ink-2);font-weight:700;font-size:.92rem}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.tab .ic{color:var(--k-outro)}
.tab.k-guia .ic{color:var(--k-guia)}
.tab.k-demo .ic{color:var(--k-demo)}
.tab.k-codigo .ic{color:var(--k-codigo)}
.tab.k-img .ic{color:var(--k-img)}
.tab small{color:var(--mute);font-weight:600}
.viewer{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.chip{padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink-2);font-size:.85rem;font-weight:600}
.chip:hover{border-color:var(--acc)}
.chip[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.vbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:.82rem}
.vpath{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);color:var(--ink-2)}
.vinfo{white-space:nowrap;color:var(--mute)}
.vact{display:flex;gap:8px;margin-left:auto}
.vbody{min-height:200px}
.empty{padding:28px;color:var(--mute)}

/* ---- código ---- */
.code{display:grid;grid-template-columns:auto minmax(0,1fr);max-height:calc(100dvh - 300px);min-height:200px;overflow:auto;background:var(--code-bg)}
.code pre{margin:0;font:13.5px/1.65 var(--mono)}
.ln{position:sticky;left:0;padding:14px 12px 14px 16px;border-right:1px solid var(--line-2);background:var(--code-bg);color:var(--mute);text-align:right;user-select:none}
.src{padding:14px 18px;tab-size:4}
.src code{padding:0;background:none;font:inherit}
.hljs-keyword,.hljs-literal{color:var(--tk-kw);font-weight:600}
.hljs-type,.hljs-built_in{color:var(--tk-ty)}
.hljs-string{color:var(--tk-str)}
.hljs-number{color:var(--tk-num)}
.hljs-comment{color:var(--tk-com);font-style:italic}
.hljs-title,.hljs-function .hljs-title{color:var(--tk-fn)}
.hljs-meta,.hljs-meta .hljs-keyword{color:var(--tk-meta)}
.hljs-meta .hljs-string{color:var(--tk-str)}

/* ---- guia (markdown) ---- */
.prose{max-width:900px;padding:8px clamp(18px,3vw,40px) 32px;overflow-wrap:break-word}
.prose h1{margin:1.2em 0 .5em;font-size:1.9rem;line-height:1.2;letter-spacing:-.02em}
.prose h2{margin:2em 0 .6em;padding-top:.5em;border-top:1px solid var(--line-2);font-size:1.35rem}
.prose h3{margin:1.6em 0 .4em;font-size:1.1rem}
.prose p,.prose li{max-width:75ch}
.prose ul,.prose ol{padding-left:1.4em}
.prose li{margin:.25em 0}
.prose blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--acc);border-radius:0 8px 8px 0;background:var(--acc-soft)}
.prose blockquote p{margin:.3em 0}
.prose hr{margin:2em 0;border:0;border-top:1px solid var(--line)}
.prose code{padding:.1em .38em;border:1px solid var(--line-2);border-radius:5px;background:var(--code-bg);font:.88em var(--mono)}
.prose pre{padding:14px 16px;overflow:auto;border:1px solid var(--line-2);border-radius:10px;background:var(--code-bg);font:13.5px/1.6 var(--mono)}
.prose pre code{padding:0;border:0;background:none;font:inherit}
.table-wrap{margin:1em 0;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prose table{width:100%;border-collapse:collapse;font-size:.92rem}
.prose th,.prose td{padding:8px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.prose th{background:var(--panel-2);font-weight:700;white-space:nowrap}
.prose tr:last-child td{border-bottom:0}

/* ---- demonstração e imagem ---- */
.frame{display:block;width:100%;height:calc(100dvh - 250px);min-height:560px;border:0;background:#fff}
.imgwrap{padding:18px;text-align:center}
.imgwrap img{max-width:100%;height:auto;border:1px solid var(--line-2);border-radius:8px}

/* ==========================================================================
   9. RESPONSIVO
   ========================================================================== */
@media (max-width:900px){
  .menu{display:inline-flex}
  .brand span{display:none}
  .search{width:auto;flex:1}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:var(--top);bottom:0;left:0;z-index:40;width:min(86vw,340px);height:auto;transform:translateX(-102%);transition:transform .2s;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:var(--top) 0 0 0;z-index:35;background:rgba(0,0,0,.4)}
  .code{max-height:none}
  .frame{height:75dvh;min-height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="dados" type="application/json">{"tipo":"dir","nome":"Estudos de AEDS 2","arq":"Estudos-Aeds-2-main","path":"","children":[{"tipo":"dir","nome":"Ordenações","arq":"Ordenacoes","path":"Ordenacoes","children":[{"tipo":"dir","nome":"Insertion Sort","arq":"Insercao","path":"Ordenacoes/Insercao","children":[{"tipo":"file","nome":"Demonstração: Insertion Sort","arq":"demonstra_o_do_insertion_sort.html","path":"Ordenacoes/Insercao/demonstra_o_do_insertion_sort.html","ext":"html","kind":"demo","tamanho":19959,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Demonstração Interativa - Insertion Sort<\/title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');\n\n        body {\n            font-family: 'Inter', sans-serif;\n            background-color: #0f172a;\n            color: #f8fafc;\n        }\n\n        .code-font {\n            font-family: 'JetBrains Mono', monospace;\n        }\n\n        .bar-container {\n            display: flex;\n            align-items: flex-end;\n            justify-content: center;\n            height: 300px;\n            gap: 4px;\n            padding: 20px;\n            background-color: #1e293b;\n            border-radius: 0.75rem;\n            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);\n        }\n\n        .array-bar {\n            width: 30px;\n            background-color: #3b82f6; /* Blue default */\n            border-radius: 4px 4px 0 0;\n            transition: height 0.3s ease, background-color 0.3s ease, transform 0.3s ease;\n            display: flex;\n            justify-content: center;\n            align-items: flex-start;\n            padding-top: 5px;\n            font-size: 0.75rem;\n            font-weight: 600;\n            color: transparent; /* Hide text initially or if too small */\n        }\n        \n        .array-bar.show-value {\n             color: white;\n        }\n\n        /* Status Colors */\n        .bar-sorted { background-color: #10b981; } /* Emerald green */\n        .bar-comparing { background-color: #f59e0b; transform: scale(1.05); } /* Amber */\n        .bar-inserting { background-color: #ef4444; transform: translateY(-10px); } /* Red */\n        \n        /* Highlight specific lines of code */\n        .code-line {\n            padding: 2px 8px;\n            border-radius: 4px;\n            transition: background-color 0.2s ease;\n        }\n        .code-line.active {\n            background-color: #334155;\n            border-left: 4px solid #3b82f6;\n        }\n\n        /* Custom Scrollbar for code area */\n        ::-webkit-scrollbar {\n            width: 8px;\n            height: 8px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #1e293b; \n        }\n        ::-webkit-scrollbar-thumb {\n            background: #475569; \n            border-radius: 4px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #64748b; \n        }\n    <\/style>\n<\/head>\n<body class=\"min-h-screen flex flex-col p-4 md:p-8\">\n\n    <div class=\"max-w-6xl mx-auto w-full flex-grow flex flex-col gap-6\">\n        \n        <\u0021-- Header -->\n        <header class=\"text-center md:text-left\">\n            <h1 class=\"text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2\">\n                Insertion Sort\n            <\/h1>\n            <p class=\"text-slate-400 text-sm md:text-base max-w-2xl\">\n                O Insertion Sort constrói o array final ordenado um item de cada vez. É muito menos eficiente em listas grandes do que algoritmos mais avançados, como quicksort, heapsort ou merge sort, mas oferece vantagens como implementação simples e eficiência em pequenos conjuntos de dados.\n            <\/p>\n        <\/header>\n\n        <\u0021-- Controls Area -->\n        <div class=\"bg-slate-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4 border border-slate-700\">\n            <div class=\"flex items-center gap-4 w-full md:w-auto\">\n                <button id=\"generateBtn\" class=\"px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors font-medium text-sm flex-1 md:flex-none\">\n                    Gerar Novo Array\n                <\/button>\n                <div class=\"flex items-center gap-2\">\n                    <label for=\"speedSlider\" class=\"text-sm text-slate-300 whitespace-nowrap\">Velocidade:<\/label>\n                    <input type=\"range\" id=\"speedSlider\" min=\"10\" max=\"1000\" value=\"300\" dir=\"rtl\" class=\"w-24 md:w-32 accent-blue-500\">\n                <\/div>\n            <\/div>\n            \n            <div class=\"flex items-center gap-4 w-full md:w-auto\">\n                 <button id=\"sortBtn\" class=\"px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors font-bold text-sm shadow-lg shadow-blue-500/20 w-full md:w-auto\">\n                    Iniciar Ordenação\n                <\/button>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Main Content Grid -->\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow\">\n            \n            <\u0021-- Left Side: Visualizer & Info -->\n            <div class=\"flex flex-col gap-4\">\n                <div class=\"bg-slate-800 rounded-xl p-1 border border-slate-700 relative\">\n                    <div id=\"arrayContainer\" class=\"bar-container relative\">\n                        <\u0021-- Bars will be injected here -->\n                    <\/div>\n                    \n                    <\u0021-- Legend -->\n                    <div class=\"absolute bottom-2 left-0 right-0 flex justify-center gap-4 text-xs font-medium bg-slate-900/80 p-2 mx-4 rounded-lg backdrop-blur-sm\">\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-blue-500\"><\/div>Não Ordenado<\/div>\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-amber-500\"><\/div>Comparando<\/div>\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-emerald-500\"><\/div>Ordenado<\/div>\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-red-500\"><\/div>Inserindo (Chave)<\/div>\n                    <\/div>\n                <\/div>\n\n                <div class=\"bg-slate-800 rounded-xl p-4 border border-slate-700 text-sm text-slate-300\">\n                    <h3 class=\"text-white font-semibold mb-2\">Status da Execução<\/h3>\n                    <div id=\"statusText\" class=\"min-h-[3rem] font-mono text-emerald-400 bg-slate-900 p-2 rounded-lg border border-slate-700\">\n                        Aguardando início...\n                    <\/div>\n                <\/div>\n            <\/div>\n\n            <\u0021-- Right Side: C Code -->\n            <div class=\"bg-[#1e1e1e] rounded-xl overflow-hidden border border-slate-700 flex flex-col\">\n                <div class=\"bg-slate-800/50 px-4 py-2 border-b border-slate-700 flex justify-between items-center\">\n                    <span class=\"text-sm font-medium text-slate-300\">Código em C<\/span>\n                    <span class=\"text-xs px-2 py-1 bg-slate-700 rounded text-slate-300\">insertion_sort.c<\/span>\n                <\/div>\n                <div class=\"p-4 overflow-auto flex-grow code-font text-sm text-slate-300 leading-relaxed\" id=\"codeContainer\">\n<\u0021-- Important: Formatting matters here for alignment -->\n<pre><code class=\"language-c\">\n<div id=\"line-0\" class=\"code-line\">void insertionSort(int arr[], int n) {<\/div>\n<div id=\"line-1\" class=\"code-line\">    int i, key, j;<\/div>\n<div id=\"line-2\" class=\"code-line\">    for (i = 1; i &lt; n; i++) {<\/div>\n<div id=\"line-3\" class=\"code-line text-blue-300\">        key = arr[i];<\/div>\n<div id=\"line-4\" class=\"code-line text-blue-300\">        j = i - 1;<\/div>\n<div id=\"line-5\" class=\"code-line\"><\/div>\n<div id=\"line-6\" class=\"code-line text-slate-400\">        /* Move os elementos do arr[0..i-1], que são<\/div>\n<div id=\"line-7\" class=\"code-line text-slate-400\">           maiores que a chave, para uma posição à<\/div>\n<div id=\"line-8\" class=\"code-line text-slate-400\">           frente de sua posição atual */<\/div>\n<div id=\"line-9\" class=\"code-line\">        while (j &gt;= 0 && arr[j] &gt; key) {<\/div>\n<div id=\"line-10\" class=\"code-line text-amber-300\">            arr[j + 1] = arr[j];<\/div>\n<div id=\"line-11\" class=\"code-line text-amber-300\">            j = j - 1;<\/div>\n<div id=\"line-12\" class=\"code-line\">        }<\/div>\n<div id=\"line-13\" class=\"code-line text-red-400\">        arr[j + 1] = key;<\/div>\n<div id=\"line-14\" class=\"code-line\">    }<\/div>\n<div id=\"line-15\" class=\"code-line\">}<\/div>\n<\/code><\/pre>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n        const arrayContainer = document.getElementById('arrayContainer');\n        const generateBtn = document.getElementById('generateBtn');\n        const sortBtn = document.getElementById('sortBtn');\n        const speedSlider = document.getElementById('speedSlider');\n        const statusText = document.getElementById('statusText');\n        \n        let array = [];\n        const ARRAY_SIZE = 20; // Fixed size for better visual representation\n        const MAX_VALUE = 100;\n        let delay = 300; // ms\n        let isSorting = false;\n        let abortController = null;\n\n        // Initialize\n        function init() {\n            generateArray();\n            updateDelay();\n            \n            generateBtn.addEventListener('click', () => {\n                if(!isSorting) generateArray();\n            });\n            \n            speedSlider.addEventListener('input', updateDelay);\n            \n            sortBtn.addEventListener('click', () => {\n                if (!isSorting) {\n                    insertionSort();\n                } else {\n                    // Optional: Implement Stop functionality by aborting\n                    if(abortController) abortController.abort();\n                    resetUI();\n                }\n            });\n        }\n\n        function updateDelay() {\n            // Reverse logic: smaller slider value = larger delay (slower)\n            // But we set dir=\"rtl\" on input so value 1000 is left, 10 is right\n            delay = parseInt(speedSlider.value);\n        }\n\n        function generateArray() {\n            array = [];\n            arrayContainer.innerHTML = '';\n            clearCodeHighlights();\n            statusText.innerHTML = \"Array gerado aleatoriamente. Aguardando início...\";\n            statusText.className = \"min-h-[3rem] font-mono text-slate-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n\n            for (let i = 0; i < ARRAY_SIZE; i++) {\n                // Generate random number between 10 and MAX_VALUE\n                const value = Math.floor(Math.random() * (MAX_VALUE - 10 + 1)) + 10;\n                array.push(value);\n                \n                const bar = document.createElement('div');\n                bar.classList.add('array-bar', 'show-value');\n                // Calculate height percentage based on MAX_VALUE (leaving some top margin)\n                const heightPercent = (value / MAX_VALUE) * 90;\n                bar.style.height = `${heightPercent}%`;\n                bar.innerText = value;\n                \n                arrayContainer.appendChild(bar);\n            }\n        }\n\n        // Helper for async delays\n        function sleep(ms, signal) {\n            return new Promise((resolve, reject) => {\n                const timeoutId = setTimeout(resolve, ms);\n                if (signal) {\n                    signal.addEventListener('abort', () => {\n                        clearTimeout(timeoutId);\n                        reject(new Error('Aborted'));\n                    });\n                }\n            });\n        }\n\n        function highlightLine(lineIndex) {\n            clearCodeHighlights();\n            const line = document.getElementById(`line-${lineIndex}`);\n            if (line) {\n                line.classList.add('active');\n                // Auto-scroll logic if needed\n                const container = document.getElementById('codeContainer');\n                const offsetTop = line.offsetTop;\n                if (offsetTop > container.scrollTop + container.clientHeight - 50 || offsetTop < container.scrollTop) {\n                    container.scrollTo({ top: offsetTop - 50, behavior: 'smooth' });\n                }\n            }\n        }\n\n        function clearCodeHighlights() {\n            const lines = document.querySelectorAll('.code-line');\n            lines.forEach(line => line.classList.remove('active'));\n        }\n\n        function updateStatus(message, type = 'info') {\n            statusText.innerHTML = message;\n            if (type === 'success') {\n                statusText.className = \"min-h-[3rem] font-mono text-emerald-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            } else if (type === 'highlight') {\n                statusText.className = \"min-h-[3rem] font-mono text-amber-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            } else {\n                statusText.className = \"min-h-[3rem] font-mono text-slate-300 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            }\n        }\n\n        function setUIState(sorting) {\n            isSorting = sorting;\n            generateBtn.disabled = sorting;\n            generateBtn.classList.toggle('opacity-50', sorting);\n            generateBtn.classList.toggle('cursor-not-allowed', sorting);\n            \n            if (sorting) {\n                sortBtn.innerText = \"Parar\";\n                sortBtn.classList.replace('bg-blue-600', 'bg-red-600');\n                sortBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');\n                sortBtn.classList.replace('shadow-blue-500/20', 'shadow-red-500/20');\n            } else {\n                sortBtn.innerText = \"Iniciar Ordenação\";\n                sortBtn.classList.replace('bg-red-600', 'bg-blue-600');\n                sortBtn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');\n                sortBtn.classList.replace('shadow-red-500/20', 'shadow-blue-500/20');\n            }\n        }\n\n        function resetUI() {\n            setUIState(false);\n            clearCodeHighlights();\n            updateStatus(\"Ordenação interrompida.\", 'highlight');\n            // Remove special classes from all bars\n            const bars = document.querySelectorAll('.array-bar');\n            bars.forEach(bar => {\n                bar.classList.remove('bar-comparing', 'bar-inserting', 'bar-sorted');\n            });\n        }\n\n        async function insertionSort() {\n            abortController = new AbortController();\n            const signal = abortController.signal;\n            setUIState(true);\n            const bars = document.querySelectorAll('.array-bar');\n            \n            // Assume first element is trivially sorted\n            bars[0].classList.add('bar-sorted');\n\n            try {\n                highlightLine(1); // int i, key, j;\n                await sleep(delay, signal);\n\n                // for (i = 1; i < n; i++)\n                for (let i = 1; i < array.length; i++) {\n                    highlightLine(2); \n                    updateStatus(`Iniciando iteração <span class=\"text-blue-400\">i = ${i}<\/span>.`);\n                    await sleep(delay, signal);\n\n                    // key = arr[i];\n                    highlightLine(3);\n                    let key = array[i];\n                    let keyHeight = bars[i].style.height;\n                    let keyText = bars[i].innerText;\n                    \n                    // Visually pull out the key\n                    bars[i].classList.add('bar-inserting');\n                    updateStatus(`Selecionando <span class=\"text-red-400\">chave = ${key}<\/span> no índice ${i}.`);\n                    await sleep(delay * 1.5, signal);\n\n                    // j = i - 1;\n                    highlightLine(4);\n                    let j = i - 1;\n                    await sleep(delay, signal);\n\n                    // while (j >= 0 && arr[j] > key)\n                    while (j >= 0) {\n                        highlightLine(9);\n                        bars[j].classList.add('bar-comparing');\n                        updateStatus(`Comparando arr[${j}] (<span class=\"text-amber-400\">${array[j]}<\/span>) com chave (<span class=\"text-red-400\">${key}<\/span>).`);\n                        await sleep(delay, signal);\n                        \n                        if (array[j] > key) {\n                            // arr[j + 1] = arr[j];\n                            highlightLine(10);\n                            updateStatus(`arr[${j}] > chave. Movendo <span class=\"text-amber-400\">${array[j]}<\/span> para a direita (índice ${j+1}).`);\n                            \n                            // Visual swap representation (shifting right)\n                            array[j + 1] = array[j];\n                            bars[j + 1].style.height = bars[j].style.height;\n                            bars[j + 1].innerText = bars[j].innerText;\n                            // Ensure the moved bar looks 'sorted' if it was part of the sorted portion\n                            bars[j + 1].classList.add('bar-sorted');\n                            bars[j + 1].classList.remove('bar-inserting'); \n                            \n                            // Temporarily make the current j look empty or represent the key's target\n                            bars[j].style.height = keyHeight;\n                            bars[j].innerText = \"\";\n                            bars[j].classList.add('bar-inserting');\n                            bars[j].classList.remove('bar-sorted');\n\n                            await sleep(delay, signal);\n                            \n                            // j = j - 1;\n                            highlightLine(11);\n                            bars[j + 1].classList.remove('bar-comparing'); // Remove compare from the one we just shifted\n                            if(j+1 !== i) bars[j+1].classList.add('bar-sorted'); // keep sorted color\n                            \n                            j = j - 1;\n                            await sleep(delay, signal);\n                        } else {\n                            bars[j].classList.remove('bar-comparing');\n                            bars[j].classList.add('bar-sorted'); // Ensure it stays green\n                            updateStatus(`arr[${j}] <= chave. Encontrada posição de inserção.`, 'highlight');\n                            await sleep(delay, signal);\n                            break;\n                        }\n                    }\n\n                    // arr[j + 1] = key;\n                    highlightLine(13);\n                    updateStatus(`Inserindo chave <span class=\"text-red-400\">${key}<\/span> no índice ${j + 1}.`);\n                    array[j + 1] = key;\n                    \n                    // Cleanup visual classes and set final height\n                    bars[j + 1].style.height = keyHeight;\n                    bars[j + 1].innerText = keyText;\n                    \n                    // Mark everything up to i as sorted\n                    for(let k = 0; k <= i; k++){\n                        bars[k].classList.remove('bar-inserting', 'bar-comparing');\n                        bars[k].classList.add('bar-sorted');\n                    }\n\n                    await sleep(delay * 1.5, signal);\n                }\n\n                // Finish\n                highlightLine(15);\n                updateStatus(\"Ordenação concluída com sucesso!\", 'success');\n                setUIState(false);\n                \n                // Final flourish animation\n                for(let i=0; i<bars.length; i++){\n                    bars[i].classList.remove('bar-sorted');\n                    void bars[i].offsetWidth; // trigger reflow\n                    bars[i].classList.add('bar-sorted');\n                    await sleep(30, signal); // quick sweep\n                }\n\n            } catch (err) {\n                if (err.message === 'Aborted') {\n                    console.log('Sorting aborted by user.');\n                } else {\n                    console.error(err);\n                }\n            }\n        }\n\n        // Initialize on load\n        window.onload = init;\n    <\/script>\n<\/body>\n<\/html>"},{"tipo":"file","nome":"Guia completo: Insertion Sort","arq":"guia_completo_insertion_sort.md","path":"Ordenacoes/Insercao/guia_completo_insertion_sort.md","ext":"md","kind":"guia","tamanho":4994,"conteudo":"# Guia Completo: Algoritmo Insertion Sort (Ordenação por Inserção)\n\nO **Insertion Sort** (ou Ordenação por Inserção) é um algoritmo de ordenação simples e intuitivo. Ele constrói o array final ordenado um elemento de cada vez, da mesma forma que você ordenaria as cartas de baralho em sua mão.\n\nEmbora não seja o algoritmo mais eficiente para lidar com grandes volumes de dados (comparado a algoritmos avançados como Quick Sort ou Merge Sort), ele possui propriedades únicas que o tornam a melhor escolha em cenários específicos.\n\n---\n\n## 🃏 Como Funciona? (A Analogia do Baralho)\n\nImagine que você está jogando cartas. As cartas estão na mesa e você as pega uma a uma com a mão esquerda:\n1. Você pega a primeira carta. Sua mão está ordenada (só tem uma carta).\n2. Você pega a segunda carta e a compara com a primeira. Se for menor, coloca à esquerda; se for maior, à direita.\n3. Para cada nova carta que você pega, você varre as cartas que já estão na sua mão (da direita para a esquerda) e insere a nova carta na posição correta.\n\nO algoritmo em programação faz exatamente isso: ele divide virtualmente o array em uma parte \"ordenada\" e uma parte \"não ordenada\". A cada iteração, ele pega o primeiro elemento da parte não ordenada (a **chave**) e o insere na posição correta dentro da parte ordenada.\n\n---\n\n## ⚙️ Características Mais Importantes\n\nAqui estão as propriedades técnicas que definem o Insertion Sort e determinam quando ele deve ser usado:\n\n### 1. Complexidade de Tempo (Velocidade)\n*   **Melhor Caso:** $\\mathcal{O}(n)$\n    *   Ocorre quando o array *já está ordenado*. O algoritmo faz apenas uma comparação por elemento e não precisa mover nada.\n*   **Pior Caso:** $\\mathcal{O}(n^2)$\n    *   Ocorre quando o array está em ordem *inversa*. Para cada elemento inserido, ele precisa ser comparado e movido passando por todos os elementos já ordenados.\n*   **Caso Médio:** $\\mathcal{O}(n^2)$\n    *   Em uma lista aleatória, ele terá um desempenho quadrático.\n\n### 2. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(1)$\n    *   É um algoritmo **in-place** (in-loco). Isso significa que ele não precisa de arrays auxiliares ou memória extra proporcional ao tamanho da lista para fazer a ordenação. Ele apenas usa uma variável temporária para a \"chave\".\n\n### 3. Estabilidade\n*   **É Estável?** Sim.\n    *   Um algoritmo estável preserva a ordem relativa de elementos que possuem valores iguais. Se houver dois números \"5\", o \"5\" que apareceu primeiro na lista original continuará vindo antes do segundo \"5\" na lista ordenada. O Insertion Sort garante isso porque só move um elemento se ele for estritamente maior (não maior ou igual) que a chave.\n\n### 4. Adaptabilidade\n*   **É Adaptável?** Sim.\n    *   Seu desempenho melhora significativamente se a estrutura de dados já estiver parcial ou quase totalmente ordenada.\n\n### 5. Algoritmo *Online*\n*   **É Online?** Sim.\n    *   Ele pode ordenar uma lista à medida que recebe os dados. Se você receber um novo número \"ao vivo\", o Insertion Sort pode inseri-lo facilmente na posição correta sem precisar reavaliar toda a lista novamente.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Simplicidade:** O código é curto e muito fácil de implementar e entender.\n*   **Eficiência em pequenos dados:** Para arrays muito pequenos (geralmente menos de 10 a 20 elementos), o Insertion Sort é frequentemente mais rápido que o Quick Sort ou Merge Sort devido à ausência de overhead recursivo.\n*   **Baixo consumo de memória:** Não requer alocação extra de memória.\n*   **Excelente para dados quase ordenados:** Tempo de execução se aproxima de $\\mathcal{O}(n)$.\n\n**Desvantagens:**\n*   **Ineficiência em larga escala:** O tempo de execução cresce drasticamente em arrays grandes ($\\mathcal{O}(n^2)$). Dobrar o tamanho da lista quadruplica o tempo de execução.\n\n---\n\n## 💻 Exemplo Clássico em C\n\n```c\nvoid insertionSort(int arr[], int n) {\n    int i, key, j;\n    // O loop começa do segundo elemento (índice 1)\n    for (i = 1; i < n; i++) {\n        key = arr[i]; // A \"carta\" atual que queremos inserir\n        j = i - 1;\n\n        // Move os elementos maiores que a chave uma posição para frente\n        while (j >= 0 && arr[j] > key) {\n            arr[j + 1] = arr[j];\n            j = j - 1;\n        }\n        // Insere a chave na posição correta\n        arr[j + 1] = key;\n    }\n}\n```\n\n## 🎯 Quando devo usar o Insertion Sort?\n\nNa prática, desenvolvedores de bibliotecas padrão (como o `sort()` no C++, Java ou Python) utilizam algoritmos híbridos, como o **Timsort** ou **IntroSort**. Nesses algoritmos, a estratégia geral divide a lista grande em pedaços bem pequenos. **Quando esses pedaços ficam pequenos o suficiente (ex: 16 ou 32 elementos), o algoritmo muda automaticamente para o Insertion Sort** para finalizar o trabalho, aproveitando sua eficiência extrema em pequenas escalas."},{"tipo":"file","nome":"Insertion Sort","arq":"insercao.c","path":"Ordenacoes/Insercao/insercao.c","ext":"c","kind":"codigo","tamanho":269,"conteudo":"void insertionSort(int arr[], int n) {\n    int i, key, j;\n    for (i = 1; i < n; i++) {\n        key = arr[i];\n        j = i - 1;\n        while (j >= 0 && arr[j] > key) {\n            arr[j + 1] = arr[j];\n            j = j - 1;\n        }\n        arr[j + 1] = key;\n    }\n}"}]},{"tipo":"dir","nome":"Selection Sort","arq":"Selecao","path":"Ordenacoes/Selecao","children":[{"tipo":"file","nome":"Demonstração: Selection Sort","arq":"demonstra_o_do_selection_sort (1).html","path":"Ordenacoes/Selecao/demonstra_o_do_selection_sort (1).html","ext":"html","kind":"demo","tamanho":20621,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Demonstração Interativa - Selection Sort (C)<\/title>\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <style>\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');\n\n        body {\n            font-family: 'Inter', sans-serif;\n            background-color: #0f172a;\n            color: #f8fafc;\n        }\n\n        .code-font {\n            font-family: 'JetBrains Mono', monospace;\n        }\n\n        .bar-container {\n            display: flex;\n            align-items: flex-end;\n            justify-content: center;\n            height: 300px;\n            gap: 4px;\n            padding: 20px;\n            background-color: #1e293b;\n            border-radius: 0.75rem;\n            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);\n        }\n\n        .array-bar {\n            width: 30px;\n            background-color: #3b82f6; /* Blue default */\n            border-radius: 4px 4px 0 0;\n            transition: height 0.3s ease, background-color 0.3s ease, transform 0.3s ease;\n            display: flex;\n            justify-content: center;\n            align-items: flex-start;\n            padding-top: 5px;\n            font-size: 0.75rem;\n            font-weight: 600;\n            color: transparent; \n        }\n        \n        .array-bar.show-value {\n             color: white;\n        }\n\n        /* Status Colors */\n        .bar-sorted { background-color: #10b981; } /* Emerald green */\n        .bar-comparing { background-color: #f59e0b; transform: scale(1.05); } /* Amber */\n        .bar-min { background-color: #a855f7; transform: translateY(-5px); box-shadow: 0 0 10px #a855f7; } /* Purple for current minimum */\n        .bar-swapping { background-color: #ef4444; } /* Red for the elements being swapped */\n        \n        /* Highlight specific lines of code */\n        .code-line {\n            padding: 2px 8px;\n            border-radius: 4px;\n            transition: background-color 0.2s ease;\n        }\n        .code-line.active {\n            background-color: #334155;\n            border-left: 4px solid #3b82f6;\n        }\n\n        /* Custom Scrollbar for code area */\n        ::-webkit-scrollbar {\n            width: 8px;\n            height: 8px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #1e293b; \n        }\n        ::-webkit-scrollbar-thumb {\n            background: #475569; \n            border-radius: 4px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #64748b; \n        }\n    <\/style>\n<\/head>\n<body class=\"min-h-screen flex flex-col p-4 md:p-8\">\n\n    <div class=\"max-w-6xl mx-auto w-full flex-grow flex flex-col gap-6\">\n        \n        <\u0021-- Header -->\n        <header class=\"text-center md:text-left\">\n            <h1 class=\"text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400 mb-2\">\n                Selection Sort (Em C)\n            <\/h1>\n            <p class=\"text-slate-400 text-sm md:text-base max-w-2xl\">\n                O Selection Sort divide a lista em uma parte ordenada e outra não ordenada. Ele continuamente procura pelo menor elemento da parte não ordenada e o \"seleciona\" para trocá-lo com o primeiro elemento disponível, garantindo o mínimo de trocas na memória.\n            <\/p>\n        <\/header>\n\n        <\u0021-- Controls Area -->\n        <div class=\"bg-slate-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4 border border-slate-700\">\n            <div class=\"flex items-center gap-4 w-full md:w-auto\">\n                <button id=\"generateBtn\" class=\"px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors font-medium text-sm flex-1 md:flex-none\">\n                    Gerar Novo Array\n                <\/button>\n                <div class=\"flex items-center gap-2\">\n                    <label for=\"speedSlider\" class=\"text-sm text-slate-300 whitespace-nowrap\">Velocidade:<\/label>\n                    <input type=\"range\" id=\"speedSlider\" min=\"10\" max=\"1000\" value=\"300\" dir=\"rtl\" class=\"w-24 md:w-32 accent-purple-500\">\n                <\/div>\n            <\/div>\n            \n            <div class=\"flex items-center gap-4 w-full md:w-auto\">\n                 <button id=\"sortBtn\" class=\"px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition-colors font-bold text-sm shadow-lg shadow-purple-500/20 w-full md:w-auto\">\n                    Iniciar Ordenação\n                <\/button>\n            <\/div>\n        <\/div>\n\n        <\u0021-- Main Content Grid -->\n        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow\">\n            \n            <\u0021-- Left Side: Visualizer & Info -->\n            <div class=\"flex flex-col gap-4\">\n                <div class=\"bg-slate-800 rounded-xl p-1 border border-slate-700 relative overflow-hidden\">\n                    <div id=\"arrayContainer\" class=\"bar-container relative\">\n                        <\u0021-- Bars will be injected here -->\n                    <\/div>\n                    \n                    <\u0021-- Legend -->\n                    <div class=\"absolute bottom-2 left-0 right-0 flex flex-wrap justify-center gap-3 text-xs font-medium bg-slate-900/80 p-2 mx-4 rounded-lg backdrop-blur-sm z-10\">\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-blue-500\"><\/div>Não Ordenado<\/div>\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-amber-500\"><\/div>Comparando<\/div>\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-purple-500\"><\/div>Menor Atual (min_idx)<\/div>\n                        <div class=\"flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-emerald-500\"><\/div>Ordenado<\/div>\n                    <\/div>\n                <\/div>\n\n                <div class=\"bg-slate-800 rounded-xl p-4 border border-slate-700 text-sm text-slate-300\">\n                    <h3 class=\"text-white font-semibold mb-2\">Status da Execução<\/h3>\n                    <div id=\"statusText\" class=\"min-h-[3rem] font-mono text-emerald-400 bg-slate-900 p-2 rounded-lg border border-slate-700\">\n                        Aguardando início...\n                    <\/div>\n                <\/div>\n            <\u0021-- Right Side: C Code -->\n            <div class=\"bg-[#1e1e1e] rounded-xl overflow-hidden border border-slate-700 flex flex-col\">\n                <div class=\"bg-slate-800/50 px-4 py-2 border-b border-slate-700 flex justify-between items-center\">\n                    <span class=\"text-sm font-medium text-slate-300\">Código em C<\/span>\n                    <span class=\"text-xs px-2 py-1 bg-slate-700 rounded text-slate-300\">selection_sort.c<\/span>\n                <\/div>\n                <div class=\"p-4 overflow-auto flex-grow code-font text-sm text-slate-300 leading-relaxed\" id=\"codeContainer\">\n<pre><code class=\"language-c\">\n<div id=\"line-0\" class=\"code-line text-slate-400\">#include &lt;stdio.h&gt;<\/div>\n<div id=\"line-1\" class=\"code-line\"><\/div>\n<div id=\"line-2\" class=\"code-line\"><span class=\"text-pink-400\">void<\/span> <span class=\"text-blue-300\">selectionSort<\/span>(<span class=\"text-pink-400\">int<\/span> arr[], <span class=\"text-pink-400\">int<\/span> n) {<\/div>\n<div id=\"line-3\" class=\"code-line\">    <span class=\"text-pink-400\">int<\/span> i, j, min_idx, temp;<\/div>\n<div id=\"line-4\" class=\"code-line\">    <span class=\"text-pink-400\">for<\/span> (i = <span class=\"text-amber-300\">0<\/span>; i &lt; n - <span class=\"text-amber-300\">1<\/span>; i++) {<\/div>\n<div id=\"line-5\" class=\"code-line\">        <span class=\"text-slate-400\">// Assume que o primeiro não ordenado é o menor<\/span><\/div>\n<div id=\"line-6\" class=\"code-line\">        min_idx = i;<\/div>\n<div id=\"line-7\" class=\"code-line\">        <\/div>\n<div id=\"line-8\" class=\"code-line\">        <span class=\"text-pink-400\">for<\/span> (j = i + <span class=\"text-amber-300\">1<\/span>; j &lt; n; j++) {<\/div>\n<div id=\"line-9\" class=\"code-line\">            <span class=\"text-pink-400\">if<\/span> (arr[j] &lt; arr[min_idx]) {<\/div>\n<div id=\"line-10\" class=\"code-line\">                min_idx = j;<\/div>\n<div id=\"line-11\" class=\"code-line\">            }<\/div>\n<div id=\"line-12\" class=\"code-line\">        }<\/div>\n<div id=\"line-13\" class=\"code-line\">        <\/div>\n<div id=\"line-14\" class=\"code-line\">        <span class=\"text-slate-400\">// Se o menor não for o da posição atual, troca<\/span><\/div>\n<div id=\"line-15\" class=\"code-line\">        <span class=\"text-pink-400\">if<\/span> (min_idx != i) {<\/div>\n<div id=\"line-16\" class=\"code-line\">            temp = arr[i];<\/div>\n<div id=\"line-17\" class=\"code-line\">            arr[i] = arr[min_idx];<\/div>\n<div id=\"line-18\" class=\"code-line\">            arr[min_idx] = temp;<\/div>\n<div id=\"line-19\" class=\"code-line\">        }<\/div>\n<div id=\"line-20\" class=\"code-line\">    }<\/div>\n<div id=\"line-21\" class=\"code-line\">}<\/div>\n<\/code><\/pre>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <script>\n        const arrayContainer = document.getElementById('arrayContainer');\n        const generateBtn = document.getElementById('generateBtn');\n        const sortBtn = document.getElementById('sortBtn');\n        const speedSlider = document.getElementById('speedSlider');\n        const statusText = document.getElementById('statusText');\n        \n        let array = [];\n        const ARRAY_SIZE = 15; // Slightly fewer elements for clarity in Selection Sort\n        const MAX_VALUE = 100;\n        let delay = 300; // ms\n        let isSorting = false;\n        let abortController = null;\n\n        // Initialize Application\n        function init() {\n            generateArray();\n            updateDelay();\n            \n            generateBtn.addEventListener('click', () => {\n                if(!isSorting) generateArray();\n            });\n            \n            speedSlider.addEventListener('input', updateDelay);\n            \n            sortBtn.addEventListener('click', () => {\n                if (!isSorting) {\n                    selectionSort();\n                } else {\n                    if(abortController) abortController.abort();\n                    resetUI();\n                }\n            });\n        }\n\n        function updateDelay() {\n            delay = parseInt(speedSlider.value);\n        }\n\n        function generateArray() {\n            array = [];\n            arrayContainer.innerHTML = '';\n            clearCodeHighlights();\n            statusText.innerHTML = \"Array gerado aleatoriamente. Aguardando início...\";\n            statusText.className = \"min-h-[3rem] font-mono text-slate-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n\n            for (let i = 0; i < ARRAY_SIZE; i++) {\n                const value = Math.floor(Math.random() * (MAX_VALUE - 10 + 1)) + 10;\n                array.push(value);\n                \n                const bar = document.createElement('div');\n                bar.classList.add('array-bar', 'show-value');\n                const heightPercent = (value / MAX_VALUE) * 90;\n                bar.style.height = `${heightPercent}%`;\n                bar.innerText = value;\n                \n                arrayContainer.appendChild(bar);\n            }\n        }\n\n        // Helper for async delays handling aborts\n        function sleep(ms, signal) {\n            return new Promise((resolve, reject) => {\n                const timeoutId = setTimeout(resolve, ms);\n                if (signal) {\n                    signal.addEventListener('abort', () => {\n                        clearTimeout(timeoutId);\n                        reject(new Error('Aborted'));\n                    });\n                }\n            });\n        }\n\n        function highlightLine(lineIndex) {\n            clearCodeHighlights();\n            const line = document.getElementById(`line-${lineIndex}`);\n            if (line) {\n                line.classList.add('active');\n                const container = document.getElementById('codeContainer');\n                const offsetTop = line.offsetTop;\n                if (offsetTop > container.scrollTop + container.clientHeight - 50 || offsetTop < container.scrollTop) {\n                    container.scrollTo({ top: offsetTop - 50, behavior: 'smooth' });\n                }\n            }\n        }\n\n        function clearCodeHighlights() {\n            const lines = document.querySelectorAll('.code-line');\n            lines.forEach(line => line.classList.remove('active'));\n        }\n\n        function updateStatus(message, type = 'info') {\n            statusText.innerHTML = message;\n            if (type === 'success') {\n                statusText.className = \"min-h-[3rem] font-mono text-emerald-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            } else if (type === 'highlight') {\n                statusText.className = \"min-h-[3rem] font-mono text-amber-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            } else if (type === 'purple') {\n                statusText.className = \"min-h-[3rem] font-mono text-purple-400 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            } else {\n                statusText.className = \"min-h-[3rem] font-mono text-slate-300 bg-slate-900 p-2 rounded-lg border border-slate-700\";\n            }\n        }\n\n        function setUIState(sorting) {\n            isSorting = sorting;\n            generateBtn.disabled = sorting;\n            generateBtn.classList.toggle('opacity-50', sorting);\n            generateBtn.classList.toggle('cursor-not-allowed', sorting);\n            \n            if (sorting) {\n                sortBtn.innerText = \"Parar\";\n                sortBtn.classList.replace('bg-purple-600', 'bg-red-600');\n                sortBtn.classList.replace('hover:bg-purple-500', 'hover:bg-red-500');\n                sortBtn.classList.replace('shadow-purple-500/20', 'shadow-red-500/20');\n            } else {\n                sortBtn.innerText = \"Iniciar Ordenação\";\n                sortBtn.classList.replace('bg-red-600', 'bg-purple-600');\n                sortBtn.classList.replace('hover:bg-red-500', 'hover:bg-purple-500');\n                sortBtn.classList.replace('shadow-red-500/20', 'shadow-purple-500/20');\n            }\n        }\n\n        function resetUI() {\n            setUIState(false);\n            clearCodeHighlights();\n            updateStatus(\"Ordenação interrompida.\", 'highlight');\n            const bars = document.querySelectorAll('.array-bar');\n            bars.forEach(bar => {\n                bar.classList.remove('bar-comparing', 'bar-min', 'bar-sorted', 'bar-swapping');\n            });\n        }\n\n        async function selectionSort() {\n            abortController = new AbortController();\n            const signal = abortController.signal;\n            setUIState(true);\n            const bars = document.querySelectorAll('.array-bar');\n            const n = array.length;\n\n            try {\n                // for (int i = 0; i < n - 1; i++)\n                for (let i = 0; i < n - 1; i++) {\n                    highlightLine(4);\n                    updateStatus(`Iniciando busca do menor a partir do índice <span class=\"text-blue-400\">i = ${i}<\/span>.`);\n                    await sleep(delay, signal);\n\n                    // int min_idx = i;\n                    highlightLine(6);\n                    let min_idx = i;\n                    bars[min_idx].classList.add('bar-min');\n                    updateStatus(`Menor provisório é arr[${min_idx}] = <span class=\"text-purple-400\">${array[min_idx]}<\/span>.`, 'purple');\n                    await sleep(delay, signal);\n\n                    // for (int j = i + 1; j < n; j++)\n                    for (let j = i + 1; j < n; j++) {\n                        highlightLine(8);\n                        bars[j].classList.add('bar-comparing');\n                        updateStatus(`Comparando: menor provisório (<span class=\"text-purple-400\">${array[min_idx]}<\/span>) com arr[${j}] (<span class=\"text-amber-400\">${array[j]}<\/span>).`);\n                        await sleep(delay, signal);\n\n                        // if (arr[j] < arr[min_idx])\n                        highlightLine(9);\n                        await sleep(delay / 2, signal);\n\n                        if (array[j] < array[min_idx]) {\n                            // min_idx = j;\n                            highlightLine(10);\n                            updateStatus(`Novo menor encontrado: <span class=\"text-purple-400\">${array[j]}<\/span> no índice ${j}!`, 'purple');\n                            \n                            // Visual change\n                            bars[min_idx].classList.remove('bar-min');\n                            if(min_idx !== i) {\n                                // If it wasn't the very first item, reset its color\n                                bars[min_idx].classList.remove('bar-comparing');\n                            }\n                            \n                            min_idx = j;\n                            bars[min_idx].classList.remove('bar-comparing');\n                            bars[min_idx].classList.add('bar-min');\n                            \n                            await sleep(delay, signal);\n                        } else {\n                            // Reset color of j if not chosen\n                            bars[j].classList.remove('bar-comparing');\n                        }\n                    }\n\n                    // if (min_idx != i)\n                    highlightLine(15);\n                    await sleep(delay / 2, signal);\n\n                    if (min_idx !== i) {\n                        // temp = arr[i];\n                        highlightLine(16);\n                        updateStatus(`Trocando menor valor (<span class=\"text-purple-400\">${array[min_idx]}<\/span>) com início não ordenado (<span class=\"text-slate-200\">${array[i]}<\/span>).`, 'highlight');\n                        \n                        // Add swapping colors\n                        bars[i].classList.add('bar-swapping');\n                        bars[min_idx].classList.add('bar-swapping');\n                        await sleep(delay, signal);\n\n                        // Data Swap\n                        let temp = array[i];\n                        array[i] = array[min_idx];\n                        array[min_idx] = temp;\n\n                        // Visual Height and Text Swap\n                        let tempHeight = bars[i].style.height;\n                        let tempText = bars[i].innerText;\n                        \n                        bars[i].style.height = bars[min_idx].style.height;\n                        bars[i].innerText = bars[min_idx].innerText;\n                        \n                        bars[min_idx].style.height = tempHeight;\n                        bars[min_idx].innerText = tempText;\n\n                        await sleep(delay, signal);\n                        \n                        // Remove swap colors\n                        bars[i].classList.remove('bar-swapping');\n                        bars[min_idx].classList.remove('bar-swapping', 'bar-min');\n                    } else {\n                        updateStatus(`Menor elemento já está na posição correta. Nenhuma troca necessária.`);\n                        bars[min_idx].classList.remove('bar-min');\n                        await sleep(delay, signal);\n                    }\n\n                    // Element at index i is now sorted!\n                    bars[i].classList.add('bar-sorted');\n                }\n\n                // The last element is automatically sorted\n                bars[n - 1].classList.add('bar-sorted');\n\n                highlightLine(21);\n                updateStatus(\"Ordenação Selection Sort concluída com sucesso!\", 'success');\n                setUIState(false);\n                \n                // Final flourish animation\n                for(let i=0; i<bars.length; i++){\n                    bars[i].classList.remove('bar-sorted');\n                    void bars[i].offsetWidth; // trigger reflow\n                    bars[i].classList.add('bar-sorted');\n                    await sleep(30, signal);\n                }\n\n            } catch (err) {\n                if (err.message === 'Aborted') {\n                    console.log('Sorting aborted by user.');\n                } else {\n                    console.error(err);\n                }\n            }\n        }\n\n        // Initialize on window load\n        window.onload = init;\n    <\/script>\n<\/body>\n<\/html>"},{"tipo":"file","nome":"Guia completo: Selection Sort","arq":"guia_completo_selection_sort (2).md","path":"Ordenacoes/Selecao/guia_completo_selection_sort (2).md","ext":"md","kind":"guia","tamanho":8410,"conteudo":"# Guia Completo: Algoritmo Selection Sort (Ordenação por Seleção)\n\nO **Selection Sort** (ou Ordenação por Seleção) é um algoritmo de ordenação simples e fácil de entender. Ele ordena o array repetindo um processo bem direto: **encontrar o menor elemento da parte não ordenada e colocá-lo na posição correta**, uma posição de cada vez.\n\nEmbora não seja eficiente para grandes volumes de dados, ele tem uma propriedade muito particular: realiza **pouquíssimas trocas**, o que o torna interessante em cenários onde escrever na memória é caro.\n\n---\n\n## 🏆 Como Funciona? (A Analogia da Fila por Altura)\n\nImagine que você precisa organizar uma fila de pessoas da mais baixa para a mais alta:\n1. Você olha a fila inteira e procura a pessoa **mais baixa**.\n2. Você troca essa pessoa com quem está na primeira posição.\n3. Agora a primeira posição está definitiva. Você ignora ela e repete o processo com o restante da fila: procura a mais baixa entre as que sobraram e a coloca na segunda posição.\n4. Repete até a fila inteira estar organizada.\n\nO algoritmo divide virtualmente o array em uma parte **ordenada** (à esquerda) e uma parte **não ordenada** (à direita). A cada iteração, ele **seleciona o menor elemento** da parte não ordenada e o **troca** com o primeiro elemento dessa parte. Assim, a parte ordenada cresce uma posição por vez, e cada elemento colocado ali já está em sua posição final.\n\n### Exemplo passo a passo\n\nArray inicial: `[64, 25, 12, 22, 11]`\n\n| Passo | Parte não ordenada | Menor encontrado | Array após a troca |\n|---|---|---|---|\n| 1 | `[64, 25, 12, 22, 11]` | 11 | `[11, 25, 12, 22, 64]` |\n| 2 | `[25, 12, 22, 64]` | 12 | `[11, 12, 25, 22, 64]` |\n| 3 | `[25, 22, 64]` | 22 | `[11, 12, 22, 25, 64]` |\n| 4 | `[25, 64]` | 25 | `[11, 12, 22, 25, 64]` (já estava no lugar) |\n\nResultado final: `[11, 12, 22, 25, 64]`\n\n---\n\n## ⚙️ Características Mais Importantes\n\nAqui estão as propriedades técnicas que definem o Selection Sort e determinam quando ele deve ser usado:\n\n### 1. Complexidade de Tempo (Velocidade)\n*   **Melhor Caso:** $\\mathcal{O}(n^2)$\n    *   Mesmo que o array *já esteja ordenado*, o algoritmo **não tem como saber disso**. Ele sempre varre toda a parte não ordenada para ter certeza de que encontrou o menor elemento.\n*   **Pior Caso:** $\\mathcal{O}(n^2)$\n    *   Em qualquer ordem, o número de comparações é o mesmo.\n*   **Caso Médio:** $\\mathcal{O}(n^2)$\n    *   Em uma lista aleatória, o desempenho também é quadrático.\n\n> **Detalhe importante:** o número de comparações é sempre exatamente $\\frac{n(n-1)}{2}$, independentemente da disposição dos dados. Essa é uma diferença fundamental em relação ao Insertion Sort, que tem melhor caso $\\mathcal{O}(n)$.\n\n### 2. Número de Trocas (Escritas na Memória)\n*   **Trocas:** no máximo $n - 1$, ou seja, $\\mathcal{O}(n)$.\n    *   Esta é a **grande característica** do Selection Sort. Cada elemento é movido no máximo uma vez, diretamente para sua posição final. Algoritmos como Insertion Sort e Bubble Sort podem fazer $\\mathcal{O}(n^2)$ movimentações no pior caso.\n\n### 3. Complexidade de Espaço (Memória)\n*   **Espaço:** $\\mathcal{O}(1)$\n    *   É um algoritmo **in-place** (in-loco). Não precisa de arrays auxiliares, apenas de algumas variáveis temporárias (o índice do menor elemento e uma variável para a troca).\n\n### 4. Estabilidade\n*   **É Estável?** Não (na implementação clássica).\n    *   Um algoritmo estável preserva a ordem relativa de elementos com valores iguais. O Selection Sort pode quebrar essa ordem porque a troca \"salta\" por cima de outros elementos.\n    *   **Exemplo:** considere `[4a, 4b, 2]`, onde `4a` e `4b` têm o mesmo valor. O menor é o `2`, que é trocado com `4a`, resultando em `[2, 4b, 4a]`. Agora o `4b` aparece antes do `4a`, ou seja, a ordem original foi perdida.\n    *   É possível torná-lo estável, mas isso exige deslocar elementos em vez de trocar (como o Insertion Sort faz), o que elimina sua vantagem de poucas escritas.\n\n### 5. Adaptabilidade\n*   **É Adaptável?** Não.\n    *   Seu desempenho **não melhora** se os dados já estiverem total ou parcialmente ordenados. Ele sempre executa o mesmo número de comparações.\n\n### 6. Algoritmo *Online*\n*   **É Online?** Não.\n    *   Ele precisa ter todos os dados disponíveis desde o início para procurar o menor elemento. Se um novo número chegar depois, é preciso reexecutar a seleção.\n\n---\n\n## 📊 Selection Sort vs. Insertion Sort\n\n| Característica | Selection Sort | Insertion Sort |\n|---|---|---|\n| Melhor caso | $\\mathcal{O}(n^2)$ | **$\\mathcal{O}(n)$** |\n| Pior caso | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ |\n| Número de trocas/escritas | **$\\mathcal{O}(n)$** | $\\mathcal{O}(n^2)$ |\n| Estável | Não | **Sim** |\n| Adaptável | Não | **Sim** |\n| Online | Não | **Sim** |\n| In-place | Sim | Sim |\n\nEm resumo: o Insertion Sort costuma ser melhor na maioria das situações, mas o Selection Sort vence quando o que importa é **minimizar escritas**.\n\n---\n\n## ✅ Vantagens e ❌ Desvantagens\n\n**Vantagens:**\n*   **Simplicidade:** O código é curto e muito fácil de implementar e entender.\n*   **Poucas trocas:** Faz no máximo $n - 1$ trocas, o que é ótimo quando escrever é muito mais caro do que comparar (por exemplo, em memórias flash/EEPROM com ciclos de escrita limitados).\n*   **Baixo consumo de memória:** Não requer alocação extra ($\\mathcal{O}(1)$).\n*   **Desempenho previsível:** O tempo de execução é praticamente o mesmo para qualquer entrada, sem surpresas de pior caso.\n\n**Desvantagens:**\n*   **Ineficiência em larga escala:** O tempo cresce de forma quadrática. Dobrar o tamanho da lista quadruplica o tempo de execução.\n*   **Não aproveita dados ordenados:** Mesmo um array já ordenado custa $\\mathcal{O}(n^2)$ comparações.\n*   **Não é estável:** Pode alterar a ordem relativa de elementos iguais.\n*   **Não é online:** Precisa de todos os dados desde o início.\n\n---\n\n## 💻 Exemplo Clássico em C\n\n```c\nvoid selectionSort(int arr[], int n) {\n    int i, j, minIdx, temp;\n\n    // Move a fronteira da parte não ordenada, uma posição por vez\n    for (i = 0; i < n - 1; i++) {\n        minIdx = i; // Assume que o primeiro elemento da parte não ordenada é o menor\n\n        // Procura o verdadeiro menor elemento no restante do array\n        for (j = i + 1; j < n; j++) {\n            if (arr[j] < arr[minIdx]) {\n                minIdx = j;\n            }\n        }\n\n        // Troca o menor encontrado com o elemento da posição i\n        if (minIdx != i) {\n            temp = arr[i];\n            arr[i] = arr[minIdx];\n            arr[minIdx] = temp;\n        }\n    }\n}\n```\n\n**Pontos de atenção no código:**\n*   O loop externo vai até `n - 2`, pois quando restar apenas um elemento, ele já estará na posição correta.\n*   O `if (minIdx != i)` evita uma troca desnecessária quando o elemento já está no lugar certo.\n*   A troca só acontece **uma vez por iteração do loop externo**, e é isso que mantém o total de trocas em $\\mathcal{O}(n)$.\n\n---\n\n## 🎯 Quando devo usar o Selection Sort?\n\nO Selection Sort raramente é a primeira escolha, mas faz sentido em situações específicas:\n\n*   **Escrita é muito cara:** em memórias como flash ou EEPROM, onde cada escrita desgasta o dispositivo, minimizar trocas é uma vantagem real.\n*   **Arrays pequenos:** para poucos elementos, a simplicidade do código pesa mais que a eficiência.\n*   **Ambientes com memória muito limitada:** por ser in-place com $\\mathcal{O}(1)$ de espaço extra.\n*   **Fins didáticos:** é um dos algoritmos mais claros para ensinar a ideia de ordenação por comparação e a análise de complexidade.\n\nJá em bibliotecas padrão (como o `sort()` do C++, Java ou Python), o Selection Sort **não é utilizado**. Os algoritmos híbridos, como **Timsort** e **IntroSort**, preferem o Insertion Sort para pedaços pequenos, justamente por ele ser adaptável e estável.\n\n---\n\n## 📝 Resumo Rápido\n\n*   **Ideia central:** a cada passo, selecione o menor elemento restante e coloque-o na posição correta.\n*   **Tempo:** $\\mathcal{O}(n^2)$ em todos os casos.\n*   **Espaço:** $\\mathcal{O}(1)$, in-place.\n*   **Trocas:** no máximo $n - 1$.\n*   **Estável:** não. **Adaptável:** não. **Online:** não.\n*   **Destaque:** minimiza o número de escritas na memória.\n"},{"tipo":"file","nome":"Selection Sort","arq":"selecao.c","path":"Ordenacoes/Selecao/selecao.c","ext":"c","kind":"codigo","tamanho":604,"conteudo":"#include <stdio.h>\nvoid selectionSort(int arr[], int n) {\n    int i, j, min_idx, temp;\n    // Move a fronteira do subarray não ordenado um por um\n    for (i = 0; i < n - 1; i++) {\n        // Encontra o menor elemento no array não ordenado\n        min_idx = i;\n        for (j = i + 1; j < n; j++) {\n            if (arr[j] < arr[min_idx]) {\n                min_idx = j;\n            }\n        }\n        // Troca o menor elemento encontrado com o primeiro elemento\n        if (min_idx != i) {\n            temp = arr[i];\n            arr[i] = arr[min_idx];\n            arr[min_idx] = temp;\n        }\n    }\n}\n"}]},{"tipo":"dir","nome":"Counting Sort","arq":"Counting","path":"Ordenacoes/Counting","children":[{"tipo":"file","nome":"Counting Sort","arq":"countingsort.c","path":"Ordenacoes/Counting/countingsort.c","ext":"c","kind":"codigo","tamanho":857,"conteudo":"#include <stdlib.h>\n\nvoid countingSort(int arr[], int n) {\n    int i, max = arr[0];\n\n    // Descobre o maior valor para definir o tamanho do array de contagem\n    for (i = 1; i < n; i++)\n        if (arr[i] > max) max = arr[i];\n\n    int *count  = calloc(max + 1, sizeof(int)); // zerado\n    int *output = malloc(n * sizeof(int));\n\n    // Fase 1: conta quantas vezes cada valor aparece\n    for (i = 0; i < n; i++)\n        count[arr[i]]++;\n\n    // Fase 2: soma acumulada (count[v] = quantos elementos são <= v)\n    for (i = 1; i <= max; i++)\n        count[i] += count[i - 1];\n\n    // Fase 3: posiciona de trás para frente (garante a estabilidade)\n    for (i = n - 1; i >= 0; i--) {\n        output[--count[arr[i]]] = arr[i];\n    }\n\n    // Copia o resultado de volta\n    for (i = 0; i < n; i++)\n        arr[i] = output[i];\n\n    free(count);\n    free(output);\n}"},{"tipo":"file","nome":"Demonstração: Counting Sort","arq":"Demo_ Counting Sort.html","path":"Ordenacoes/Counting/Demo_ Counting Sort.html","ext":"html","kind":"demo","tamanho":7598,"conteudo":"<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Demo: Counting Sort<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#eef3f5;--panel:#fff;--ink:#14232e;--mute:#5d707c;--line:#cfdbe1;--acc:#0f7c8a;--hot:#e0a100;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}}\n:root[data-theme=\"dark\"]{--bg:#0f1a20;--panel:#172831;--ink:#e6eef2;--mute:#8fa5b1;--line:#2a3f4b;--acc:#43c0cf;--hot:#f0b81f;--ok:#5cc08a}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:20px 16px 40px}\nh1{font-size:1.6rem;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}\nh3{font-size:.85rem;font-weight:600;color:var(--mute);margin:18px 0 8px}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\nbutton,input{font:inherit;color:inherit}\nbutton{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}\nbutton:hover{border-color:var(--acc)}\n.tabs button[aria-selected=\"true\"]{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .tabs button[aria-selected=\"true\"]{color:#06222a}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n#desc{margin:0 0 14px;max-width:70ch}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}\n.ctl label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);flex:1;min-width:220px}\ninput[type=text]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}\n.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 16px 18px;margin-top:10px}\n.row,.cols{display:flex;flex-wrap:wrap;gap:6px}\n.cols{gap:8px;align-items:flex-start}\n.w{display:flex;flex-direction:column;align-items:center;gap:2px}\n.i{font-size:.7rem;color:var(--mute)}\n.c{min-width:44px;height:44px;padding:0 8px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-weight:800;font-variant-numeric:tabular-nums;transition:background .25s,border-color .25s}\n.c.hot{background:var(--hot);border-color:var(--hot);color:#14232e}\n.c.on{background:var(--acc);border-color:var(--acc);color:#fff}\n:root:not([data-theme=\"light\"]) .c.on{color:#06222a}\n.c.ok{background:var(--ok);border-color:var(--ok);color:#fff}\n.dg{border-bottom:3px solid var(--acc)}\n.z{opacity:.35}\n.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}\n.ch{font-size:.8rem;font-weight:600;color:var(--mute)}\n.stack{min-height:52px;width:100%;box-sizing:border-box;border:1.5px dashed var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}\n#msg{min-height:3em;margin:14px 0 4px;font-weight:600}\n#pos{font-size:.85rem;color:var(--mute)}\n.spd{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);margin-top:6px}\n@media (prefers-reduced-motion:reduce){.c{transition:none}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Counting Sort: demonstração interativa<\/h1>\n<p id=\"desc\"><\/p>\n<div class=\"ctl\">\n  <label>Números (separados por vírgula)<input type=\"text\" id=\"inp\"><\/label>\n  <button id=\"apply\">Aplicar<\/button>\n  <button id=\"rnd\">Sortear<\/button>\n<\/div>\n<div class=\"ctl\">\n  <button id=\"prev\">Voltar<\/button>\n  <button id=\"next\">Próximo passo<\/button>\n  <button id=\"play\">Reproduzir<\/button>\n  <span id=\"pos\"><\/span>\n<\/div>\n<div class=\"spd\"><label for=\"spd\">Velocidade<\/label><input type=\"range\" id=\"spd\" min=\"200\" max=\"1500\" step=\"50\" value=\"1000\"><\/div>\n<div class=\"stage\" id=\"stage\"><\/div>\n<div id=\"msg\" aria-live=\"polite\"><\/div>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nconst cell=(t,i,k,h)=>({t:t===null?'':t,i:i===undefined?'':i,k:k||'',h});\nconst row=(label,cells)=>({type:'row',label,cells});\n\nfunction counting(a){\n  const F=[],n=a.length,M=Math.max(...a),c=Array(M+1).fill(0),o=Array(n).fill(null);\n  const S=(msg,ai=-1,ci=-1,oi=-1,done)=>F.push({msg,blocks:[\n    row('Entrada',a.map((t,i)=>cell(t,i,i==ai?'hot':''))),\n    row('Contagem (posição = valor)',c.map((t,i)=>cell(t,i,i==ci?'on':''))),\n    row('Saída',o.map((t,i)=>cell(t,i,done?'ok':i==oi?'on':'')))]});\n  S('Primeiro, contamos quantas vezes cada valor aparece.');\n  a.forEach((v,i)=>{c[v]++;S(`Lê ${v}: soma 1 na posição ${v} da contagem.`,i,v)});\n  S('Agora acumulamos: cada posição passa a indicar onde termina o bloco daquele valor.');\n  for(let v=1;v<=M;v++){c[v]+=c[v-1];S(`contagem[${v}] = contagem[${v}] + contagem[${v-1}] = ${c[v]}`,-1,v)}\n  for(let i=n-1;i>=0;i--){const v=a[i];c[v]--;o[c[v]]=v;S(`Lê ${v} (de trás para frente, para manter a estabilidade): contagem[${v}] vira ${c[v]} e grava ${v} na saída[${c[v]}].`,i,v,c[v])}\n  S('Pronto! A saída está ordenada.',-1,-1,-1,true);\n  return F;\n}\n\nconst A={\n  counting:{name:'Counting Sort',fn:counting,max:15,val:'4, 2, 2, 8, 3, 3, 1',d:'Conta quantas vezes cada valor aparece e usa as contagens para achar a posição final de cada elemento. Tempo O(n + k), onde k é o maior valor.'}\n};\nlet cur='counting',F=[],idx=0,timer=null;\n\nconst cellH=c=>`<div class=\"w\"><div class=\"c ${c.k}\">${c.h!==undefined?c.h:c.t}<\/div>${c.i!==''?`<span class=\"i\">${c.i}<\/span>`:''}<\/div>`;\nfunction draw(f){\n  $('stage').innerHTML=f.blocks.map(b=>b.type==='row'\n    ?`<h3>${b.label}<\/h3><div class=\"row\">${b.cells.map(cellH).join('')}<\/div>`\n    :`<h3>${b.label}<\/h3><div class=\"cols\">${b.cols.map(c=>`<div class=\"col\"><span class=\"ch\">${c.h}<\/span><div class=\"stack\">${c.cells.map(cellH).join('')}<\/div><\/div>`).join('')}<\/div>`).join('');\n  $('msg').textContent=f.msg;\n  $('pos').textContent=`Passo ${idx+1} de ${F.length}`;\n  $('prev').disabled=idx===0;$('next').disabled=idx===F.length-1;\n}\nfunction go(n){idx=Math.max(0,Math.min(F.length-1,n));draw(F[idx])}\nfunction stop(){clearInterval(timer);timer=null;$('play').textContent='Reproduzir'}\nfunction start(){clearInterval(timer);$('play').textContent='Pausar';timer=s
